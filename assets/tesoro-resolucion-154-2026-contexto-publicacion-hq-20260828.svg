<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402" role="img" aria-labelledby="title desc" text-rendering="optimizeLegibility" shape-rendering="geometricPrecision">
<title id="title">Tesoro de Canarias · Acceso a información pública</title>
<desc id="desc">Resumen vectorial de alta resolución de la notificación de 28 de agosto de 2026 sobre la materialización del acceso reconocido por la Resolución 154/2026.</desc>
<rect width="1122" height="1402" fill="#fff"/>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#16344f" flood-opacity=".10"/></filter></defs>
<style>
.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#102a43}.title{font-size:40px;font-weight:800;fill:#073b79}.subtitle{font-size:18px;fill:#334d66}.status{font-size:20px;font-weight:800;fill:#fff;letter-spacing:.5px}.org{font-size:17px;font-weight:800}.dept{font-size:13px;font-weight:650}.subject{font-size:15.2px;font-weight:800}.body{font-size:13.8px;font-weight:500}.small{font-size:11.8px}.panel-label{font-size:11.5px;font-weight:800;letter-spacing:1.2px;fill:#0b4b93}.call{font-size:17.5px;font-weight:570}.num{font-size:27px;font-weight:800;fill:#fff}.foot{font-size:14px;font-weight:600}.source{font-size:14px;font-weight:700;fill:#073b79}
</style><text x="50" y="59" class="t title" textLength="1022" lengthAdjust="spacingAndGlyphs">Tesoro de Canarias · Acceso a información pública</text><text x="51" y="102" class="t subtitle" textLength="1020" lengthAdjust="spacingAndGlyphs">Notificación de 28 de agosto de 2026 sobre la materialización del acceso reconocido por la Resolución n.º 154/2026</text><rect x="50" y="125" width="1022" height="56" rx="10" fill="#073b79" stroke="#073b79" stroke-width="0"/><path d="M79 139 L89.8 134.5 L100.6 139 V151.6 C100.6 161.5 89.8 166.45 89.8 166.45 C89.8 166.45 79 161.5 79 151.6 Z" fill="none" stroke="#fff" stroke-width="1.35"/><path d="M84.85 150.7 l3.6 3.6 l6.75 -8.1" fill="none" stroke="#fff" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/><text x="138" y="162" class="t status">ACCESO RECONOCIDO  ·  EJECUCIÓN INICIADA  ·  PRODUCCIÓN PARCIAL EN CURSO</text><rect x="50" y="200" width="605" height="530" rx="14" fill="#ffffff" stroke="#c7d3dd" stroke-width="1.5" filter="url(#shadow)"/><path d="M77 226 L90.2 220.5 L103.4 226 V241.4 C103.4 253.5 90.2 259.55 90.2 259.55 C90.2 259.55 77 253.5 77 241.4 Z" fill="none" stroke="#073b79" stroke-width="1.65"/><path d="M84.15 240.3 l4.4 4.4 l8.25 -9.9" fill="none" stroke="#073b79" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="246" class="t org">Gobierno</text><text x="116" y="266" class="t org">de Canarias</text><text x="236" y="232" class="t dept">Consejería de Hacienda y</text><text x="236" y="248" class="t dept">Relaciones con la Unión Europea</text><text x="236" y="269" class="t dept">Dirección General del</text><text x="236" y="285" class="t dept">Tesoro y Política Financiera</text><text x="578" y="250" class="t dept" text-anchor="end">Gil Marer</text><rect x="491" y="258" width="88" height="9" rx="2" fill="#111"/><text x="75" y="307" class="t panel-label">EXTRACTO 1 · RECONOCIMIENTO Y MATERIALIZACIÓN</text><text x="75" y="337" class="t subject"><tspan x="75" dy="0">ASUNTO: Materialización del acceso a la información pública reconocido</tspan><tspan x="75" dy="19">mediante Resolución n.º 154/2026, de 16 de junio</tspan></text><text x="75" y="398" class="t body"><tspan x="75" dy="0">La Resolución n.º 154/2026 concedió el acceso parcial a la información</tspan><tspan x="75" dy="18">solicitada, previa disociación de los datos en los términos del artículo</tspan><tspan x="75" dy="18">15.4 de la Ley 19/2013.</tspan></text><text x="75" y="478" class="t body"><tspan x="75" dy="0">Habiendo transcurrido el plazo sin que conste la formalización de recurso</tspan><tspan x="75" dy="18">contencioso-administrativo que impida la materialización del acceso</tspan><tspan x="75" dy="18">reconocido, procede dar cumplimiento a la resolución.</tspan></text><text x="75" y="560" class="t body"><tspan x="75" dy="0">La información se pone a disposición por vía electrónica a través del</tspan><tspan x="75" dy="18">sistema «Colabora». El enlace de acceso tendrá una vigencia de tres meses</tspan><tspan x="75" dy="18">desde su creación.</tspan></text><text x="75" y="632" class="t body"><tspan x="75" dy="0">La comunicación remite además a la información general sobre deuda pública</tspan><tspan x="75" dy="18">apta para materializar dotaciones de la Reserva para Inversiones en</tspan><tspan x="75" dy="18">Canarias (RIC).</tspan></text><line x1="75" y1="683" x2="630" y2="683" stroke="#c7d3dd"/><text x="75" y="700" class="t small">Firma electrónica: María Teresa Bosch Llinares · Directora General</text><text x="75" y="718" class="t small">28/08/2026 · 09:21:01 · Verificación en la sede del Gobierno de Canarias</text><rect x="50" y="748" width="605" height="472" rx="14" fill="#ffffff" stroke="#c7d3dd" stroke-width="1.5" filter="url(#shadow)"/><path d="M77 773 L87.08 768.8 L97.16 773 V784.76 C97.16 794 87.08 798.62 87.08 798.62 C87.08 798.62 77 794 77 784.76 Z" fill="none" stroke="#073b79" stroke-width="1.26"/><path d="M82.46 783.92 l3.36 3.36 l6.3 -7.56" fill="none" stroke="#073b79" stroke-width="1.26" stroke-linecap="round" stroke-linejoin="round"/><text x="111" y="789" class="t org">Gobierno de Canarias</text><text x="330" y="780" class="t dept">Dirección General del</text><text x="330" y="796" class="t dept">Tesoro y Política Financiera</text><text x="75" y="830" class="t panel-label">EXTRACTO 2 · ENTREGA, CONTINUIDAD Y LÍMITE</text><text x="75" y="861" class="t body"><tspan x="75" dy="0">La Cuenta General de la Comunidad Autónoma se publica anualmente en la web</tspan><tspan x="75" dy="18">del Gobierno de Canarias.</tspan></text><text x="75" y="921" class="t body"><tspan x="75" dy="0">Se da traslado de la documentación relativa a los procedimientos de</tspan><tspan x="75" dy="18">contratación comprendidos en la solicitud, una vez realizadas las</tspan><tspan x="75" dy="18">actuaciones necesarias de disociación.</tspan></text><text x="75" y="1000" class="t body"><tspan x="75" dy="0">La imposibilidad material de completar toda la documentación de</tspan><tspan x="75" dy="18">endeudamiento en este momento no supone una modificación ni una limitación</tspan><tspan x="75" dy="18">adicional del acceso reconocido.</tspan></text><text x="75" y="1080" class="t body"><tspan x="75" dy="0">Se ponen a disposición los expedientes de endeudamiento de 2022 a 2025,</tspan><tspan x="75" dy="18">ambos inclusive.</tspan></text><text x="75" y="1135" class="t body"><tspan x="75" dy="0">La documentación restante de ejercicios posteriores se entregará</tspan><tspan x="75" dy="18">sucesivamente y esa entrega no implica una nueva valoración del derecho de</tspan><tspan x="75" dy="18">acceso ya reconocido.</tspan></text><line x1="75" y1="1181" x2="630" y2="1181" stroke="#c7d3dd"/><text x="75" y="1202" class="t small">Documento oficial recibido · extractos editoriales para lectura pública</text><rect x="680" y="200" width="392" height="196" rx="16" fill="#f5f9ff" stroke="#bfd5ef" stroke-width="1.5"/><circle cx="715" cy="238" r="24" fill="#073b79"/><text x="715" y="247" class="t num" text-anchor="middle">1</text><text x="754" y="250" class="t call"><tspan x="754" dy="0">La Resolución 154/2026</tspan><tspan x="754" dy="23">reconoció un acceso</tspan><tspan x="754" dy="23">parcial a la</tspan><tspan x="754" dy="23">información</tspan><tspan x="754" dy="23">solicitada.</tspan></text><path d="M996 267 h24.42 l8.58 8.58 v35.64 h-33 z" fill="none" stroke="#0b4b93" stroke-width="1.98" stroke-linejoin="round"/><path d="M1020.42 267 v8.58 h8.58" fill="none" stroke="#0b4b93" stroke-width="1.98"/><line x1="1002.6" y1="283.5" x2="1021.08" y2="283.5" stroke="#0b4b93" stroke-width="1.65"/><line x1="1002.6" y1="291.42" x2="1021.08" y2="291.42" stroke="#0b4b93" stroke-width="1.65"/><line x1="1002.6" y1="299.34" x2="1021.08" y2="299.34" stroke="#0b4b93" stroke-width="1.65"/><circle cx="1034" cy="318" r="13" fill="#fff" stroke="#0b4b93" stroke-width="3"/><path d="M1027.76 318 l4.55 4.94 l9.36 -10.66" fill="none" stroke="#0b4b93" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="680" y="410" width="392" height="196" rx="16" fill="#f5f9ff" stroke="#bfd5ef" stroke-width="1.5"/><circle cx="715" cy="448" r="24" fill="#073b79"/><text x="715" y="457" class="t num" text-anchor="middle">2</text><text x="754" y="460" class="t call"><tspan x="754" dy="0">La notificación de</tspan><tspan x="754" dy="23">28/08/2026 comunica</tspan><tspan x="754" dy="23">que, sin recurso que</tspan><tspan x="754" dy="23">lo impida, procede</tspan><tspan x="754" dy="23">materializar el</tspan><tspan x="754" dy="23">acceso.</tspan></text><rect x="993" y="490" width="58" height="55" rx="5" fill="none" stroke="#0b4b93" stroke-width="3"/><line x1="993" y1="507" x2="1051" y2="507" stroke="#0b4b93" stroke-width="3"/><line x1="1007" y1="482" x2="1007" y2="497" stroke="#0b4b93" stroke-width="4" stroke-linecap="round"/><line x1="1037" y1="482" x2="1037" y2="497" stroke="#0b4b93" stroke-width="4" stroke-linecap="round"/><circle cx="1034" cy="540" r="13" fill="#fff" stroke="#0b4b93" stroke-width="3"/><path d="M1027.76 540 l4.55 4.94 l9.36 -10.66" fill="none" stroke="#0b4b93" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="680" y="620" width="392" height="196" rx="16" fill="#f5f9ff" stroke="#bfd5ef" stroke-width="1.5"/><circle cx="715" cy="658" r="24" fill="#073b79"/><text x="715" y="667" class="t num" text-anchor="middle">3</text><text x="754" y="670" class="t call"><tspan x="754" dy="0">Se entregan documentos</tspan><tspan x="754" dy="23">de contratación y</tspan><tspan x="754" dy="23">expedientes de</tspan><tspan x="754" dy="23">endeudamiento de 2022</tspan><tspan x="754" dy="23">a 2025.</tspan></text><path d="M1003 692 h22.94 l8.06 8.06 v33.48 h-31 z" fill="none" stroke="#0b4b93" stroke-width="1.86" stroke-linejoin="round"/><path d="M1025.94 692 v8.06 h8.06" fill="none" stroke="#0b4b93" stroke-width="1.86"/><line x1="1009.2" y1="707.5" x2="1026.56" y2="707.5" stroke="#0b4b93" stroke-width="1.55"/><line x1="1009.2" y1="714.94" x2="1026.56" y2="714.94" stroke="#0b4b93" stroke-width="1.55"/><line x1="1009.2" y1="722.38" x2="1026.56" y2="722.38" stroke="#0b4b93" stroke-width="1.55"/><path d="M992 702 h22.94 l8.06 8.06 v33.48 h-31 z" fill="none" stroke="#0b4b93" stroke-width="1.86" stroke-linejoin="round"/><path d="M1014.94 702 v8.06 h8.06" fill="none" stroke="#0b4b93" stroke-width="1.86"/><line x1="998.2" y1="717.5" x2="1015.56" y2="717.5" stroke="#0b4b93" stroke-width="1.55"/><line x1="998.2" y1="724.94" x2="1015.56" y2="724.94" stroke="#0b4b93" stroke-width="1.55"/><line x1="998.2" y1="732.38" x2="1015.56" y2="732.38" stroke="#0b4b93" stroke-width="1.55"/><rect x="680" y="830" width="392" height="196" rx="16" fill="#f5f9ff" stroke="#bfd5ef" stroke-width="1.5"/><circle cx="715" cy="868" r="24" fill="#073b79"/><text x="715" y="877" class="t num" text-anchor="middle">4</text><text x="754" y="880" class="t call"><tspan x="754" dy="0">La entrega posterior</tspan><tspan x="754" dy="23">será sucesiva, sin</tspan><tspan x="754" dy="23">nueva limitación ni</tspan><tspan x="754" dy="23">nueva valoración del</tspan><tspan x="754" dy="23">derecho ya reconocido.</tspan></text><path d="M990 927 h25 l8 9 h39 v48 h-72 z" fill="none" stroke="#0b4b93" stroke-width="3" stroke-linejoin="round"/><circle cx="1034" cy="970" r="14" fill="#fff" stroke="#0b4b93" stroke-width="3"/><path d="M1027.28 970 l4.9 5.32 l10.08 -11.48" fill="none" stroke="#0b4b93" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="1240" width="1022" height="70" rx="10" fill="#f7fbff" stroke="#bfd5ef" stroke-width="1.5"/><circle cx="80" cy="1275" r="19" fill="#fff" stroke="#0b4b93" stroke-width="3"/><text x="80" y="1283" class="t source" text-anchor="middle">i</text><text x="115" y="1270" class="t foot">La imagen reproduce y resume extractos del documento oficial recibido.</text><text x="115" y="1294" class="t foot">Los datos personales y cualquier acceso sensible han sido protegidos para su publicación.</text><line x1="50" y1="1330" x2="1072" y2="1330" stroke="#c7d3dd"/><path d="M53 1343 L60.2 1340 L67.4 1343 V1351.4 C67.4 1358 60.2 1361.3 60.2 1361.3 C60.2 1361.3 53 1358 53 1351.4 Z" fill="none" stroke="#073b79" stroke-width=".9"/><path d="M56.9 1350.8 l2.4 2.4 l4.5 -5.4" fill="none" stroke="#073b79" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="1366" class="t source">Fuente: Dirección General del Tesoro y Política Financiera · Gobierno de Canarias · Verificación electrónica en el documento original</text></svg>