<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1640" viewBox="0 0 1080 1640" role="img" aria-labelledby="title desc"><title id="title">¿Qué se examinó antes de anunciar la destrucción?</title><desc id="desc">Documentary infographic; questions and evidence states, not a finding of wrongdoing.</desc><rect width="1080" height="1640" fill="#f1f5f7"/><rect width="1080" height="300" fill="#132b3a"/>
<text x="56" y="48" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#d4e5ed">POR DERECHO  /  CAJASIETE  /  LECTURA DOCUMENTAL</text>
<text x="56" y="115" font-family="DejaVu Sans,Arial,sans-serif" font-size="55" font-weight="700" fill="#ffffff">¿Qué se examinó antes de</text>
<text x="56" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="55" font-weight="700" fill="#ffffff">anunciar la destrucción?</text>
<text x="56" y="270" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#f3c35c">GARANTÍAS · RECEPCIÓN · DECISIÓN</text>
<rect x="56" y="332" width="968" height="270" rx="20" fill="#ffffff" stroke="#d8e1e7" stroke-width="2"/>
<a href="/por-derecho/es/registros-institucionales/#communication-PD-SP-EVT-0169">
<text x="84" y="374" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#825d0b">10 DIC 2025  ·  PD-SP-EVT-0169</text>
</a>
<text x="84" y="430" font-family="DejaVu Sans,Arial,sans-serif" font-size="42" font-weight="700" fill="#152d3b">Independencia asegurada</text>
<text x="84" y="482" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">El banco afirmó independencia,</text>
<text x="84" y="526" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">confidencialidad e inhibición o reasignación</text>
<text x="84" y="570" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">ante potenciales conflictos.</text>
<rect x="56" y="626" width="968" height="270" rx="20" fill="#ffffff" stroke="#d8e1e7" stroke-width="2"/>
<a href="/por-derecho/es/registros-institucionales/#communication-PD-SP-EVT-0179">
<text x="84" y="668" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#825d0b">9 ABR 2026  ·  PD-SP-EVT-0179</text>
</a>
<text x="84" y="724" font-family="DejaVu Sans,Arial,sans-serif" font-size="42" font-weight="700" fill="#152d3b">Comunicación recibida</text>
<text x="84" y="776" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">El canal acusó recibo. El acuse no demuestra</text>
<text x="84" y="820" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">admisión ni examen sustantivo.</text>
<rect x="56" y="920" width="968" height="270" rx="20" fill="#ffffff" stroke="#d8e1e7" stroke-width="2"/>
<a href="/por-derecho/es/registros-institucionales/#communication-PD-SP-EVT-0170">
<text x="84" y="962" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#825d0b">28 ABR 2026  ·  PD-SP-EVT-0170</text>
</a>
<text x="84" y="1018" font-family="DejaVu Sans,Arial,sans-serif" font-size="42" font-weight="700" fill="#152d3b">Inadmisión comunicada</text>
<text x="84" y="1070" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">Se anunció la destrucción de la información</text>
<text x="84" y="1114" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">«en cumplimiento de la normativa aplicable».</text>
<rect x="56" y="1220" width="968" height="300" rx="20" fill="#fff3d5" stroke="#d4a33e" stroke-width="2"/>
<text x="84" y="1275" font-family="DejaVu Sans,Arial,sans-serif" font-size="39" font-weight="700" fill="#152d3b">¿Qué se comprobó, quién decidió y qué</text>
<text x="84" y="1324" font-family="DejaVu Sans,Arial,sans-serif" font-size="39" font-weight="700" fill="#152d3b">trazabilidad se conserva?</text>
<text x="84" y="1430" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="400" fill="#152d3b">Destrucción anunciada, no acreditada. Legalidad y</text>
<text x="84" y="1469" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="400" fill="#152d3b">alcance pendientes de verificación.</text>
<text x="56" y="1576" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#415666">PD-DMA-0005  ·  PD-CAJASIETE-BOARD-VISUALS-20260905</text>
<text x="56" y="1613" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#415666">Fuentes y límites en el dossier · No acredita culpabilidad</text>
</svg>
