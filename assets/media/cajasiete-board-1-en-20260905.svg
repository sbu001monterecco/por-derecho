<text x="84" y="962" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#825d0b">28 APR 2026  ·  PD-SP-EVT-0170</text>
</a>
<text x="84" y="1018" font-family="DejaVu Sans,Arial,sans-serif" font-size="42" font-weight="700" fill="#152d3b">Inadmission communicated</text>
<text x="84" y="1070" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">Destruction of the information was announced,</text>
<text x="84" y="1114" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">subject to the applicable rules.</text>
<rect x="56" y="1220" width="968" height="300" rx="20" fill="#fff3d5" stroke="#d4a33e" stroke-width="2"/>
<text x="84" y="1275" font-family="DejaVu Sans,Arial,sans-serif" font-size="39" font-weight="700" fill="#152d3b">What was checked, who decided, and what</text>
<text x="84" y="1324" font-family="DejaVu Sans,Arial,sans-serif" font-size="39" font-weight="700" fill="#152d3b">audit trail remains?</text>
<text x="84" y="1430" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="400" fill="#152d3b">Destruction announced, not established. Lawfulness</text>
<text x="84" y="1469" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="400" fill="#152d3b">and scope remain to be verified.</text>
<text x="56" y="1576" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#415666">PD-DMA-0008  ·  PD-CAJASIETE-BOARD-VISUALS-20260905</text>
