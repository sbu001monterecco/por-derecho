<text x="56" y="48" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#d4e5ed">POR DERECHO  /  CAJASIETE  /  DOCUMENTARY REVIEW</text>
<text x="56" y="115" font-family="DejaVu Sans,Arial,sans-serif" font-size="55" font-weight="700" fill="#ffffff">What was examined before</text>
<text x="56" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="55" font-weight="700" fill="#ffffff">destruction was announced?</text>
<text x="56" y="270" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#f3c35c">ASSURANCES · RECEIPT · DECISION</text>
<rect x="56" y="332" width="968" height="270" rx="20" fill="#ffffff" stroke="#d8e1e7" stroke-width="2"/>
<a href="/por-derecho/en/institutional-records/#communication-PD-SP-EVT-0169">
<text x="84" y="374" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#825d0b">10 DEC 2025  ·  PD-SP-EVT-0169</text>
</a>
<text x="84" y="430" font-family="DejaVu Sans,Arial,sans-serif" font-size="42" font-weight="700" fill="#152d3b">Independence assured</text>
<text x="84" y="482" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">The bank stated independence, confidentiality</text>
<text x="84" y="526" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">and recusal or reassignment for potential</text>
<text x="84" y="570" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">conflicts.</text>
<rect x="56" y="626" width="968" height="270" rx="20" fill="#ffffff" stroke="#d8e1e7" stroke-width="2"/>
<a href="/por-derecho/en/institutional-records/#communication-PD-SP-EVT-0179">
<text x="84" y="668" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#825d0b">9 APR 2026  ·  PD-SP-EVT-0179</text>
</a>
<text x="84" y="724" font-family="DejaVu Sans,Arial,sans-serif" font-size="42" font-weight="700" fill="#152d3b">Communication received</text>
<text x="84" y="776" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">The channel acknowledged receipt. Receipt</text>
<text x="84" y="820" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">does not establish admission or substantive</text>
<text x="84" y="864" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">examination.</text>
<rect x="56" y="920" width="968" height="270" rx="20" fill="#ffffff" stroke="#d8e1e7" stroke-width="2"/>
