<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1640" viewBox="0 0 1080 1640" role="img" aria-labelledby="title desc"><title id="title">Protect reputation with a verifiable response</title><desc id="desc">Documentary infographic; questions and evidence states, not a finding of wrongdoing.</desc><rect width="1080" height="1640" fill="#f1f5f7"/><rect width="1080" height="300" fill="#132b3a"/>
<text x="56" y="48" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#d4e5ed">POR DERECHO  /  CAJASIETE  /  DOCUMENTARY REVIEW</text>
<text x="56" y="115" font-family="DejaVu Sans,Arial,sans-serif" font-size="55" font-weight="700" fill="#ffffff">Protect reputation with a</text>
<text x="56" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="55" font-weight="700" fill="#ffffff">verifiable response</text>
<text x="56" y="270" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#f3c35c">GOVERNING BODY · COMPLIANCE · RISK</text>
<rect x="56" y="332" width="968" height="230" rx="20" fill="#ffffff" stroke="#d8e1e7" stroke-width="2"/>
<text x="84" y="381" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#825d0b">INDEPENDENCE</text>
<text x="84" y="441" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#152d3b">What conflict screening and reassignment</text>
<text x="84" y="488" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#152d3b">safeguards were applied?</text>
<rect x="56" y="582" width="968" height="230" rx="20" fill="#ffffff" stroke="#d8e1e7" stroke-width="2"/>
<text x="84" y="631" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#825d0b">EXAMINATION</text>
<text x="84" y="691" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#152d3b">What was reviewed and what supported each</text>
<text x="84" y="738" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#152d3b">inadmission ground?</text>
<rect x="56" y="832" width="968" height="230" rx="20" fill="#ffffff" stroke="#d8e1e7" stroke-width="2"/>
<text x="84" y="881" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#825d0b">BANK EXPOSURE</text>
<text x="84" y="941" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#152d3b">Were title, financing and relevant</text>
<text x="84" y="988" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#152d3b">relationships independently assessed?</text>
<rect x="56" y="1082" width="968" height="230" rx="20" fill="#ffffff" stroke="#d8e1e7" stroke-width="2"/>
<text x="84" y="1131" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#825d0b">TRACEABILITY</text>
<text x="84" y="1191" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#152d3b">What lawful record remains of receipt,</text>
<text x="84" y="1238" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#152d3b">review, decision, transfer, anonymisation</text>
<text x="84" y="1285" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#152d3b">or deletion?</text>
<rect x="56" y="1360" width="968" height="162" rx="20" fill="#fff3d5" stroke="#d4a33e" stroke-width="2"/>
<text x="84" y="1412" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#152d3b">Independent assessment · reasoned response ·</text>
<text x="84" y="1452" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#152d3b">lawful preservation · correction where warranted.</text>
<text x="56" y="1576" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#415666">PD-DMA-0010  ·  PD-CAJASIETE-BOARD-VISUALS-20260905</text>
<text x="56" y="1613" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#415666">Sources and limits in the dossier · Not a finding of guilt</text>
</svg>
