<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">GC-CIV-003 — intervención del AC, representación de LPB y desistimiento</title>
<desc id="desc">Infografía criminal-first source-safe: Auto 19 diciembre 2017, intervención documentada del administrador concursal 25 enero 2018, conformidad CAM 25 febrero, Decreto 139/2018 de 5 marzo y tesis investigativa de Gil Marer.</desc>
<rect width="1200" height="1200" fill="#f6f2e9"/>
<rect x="24" y="24" width="1152" height="1152" rx="18" fill="#fffdf8" stroke="#20252a" stroke-width="2"/>
<text x="600" y="105" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="900" fill="#111820">GC-CIV-003</text>
<line x1="310" y1="130" x2="890" y2="130" stroke="#9b1c1c" stroke-width="5"/>
<text x="600" y="184" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" fill="#111820">INTERVENCIÓN EN LA VOZ PROCESAL DE LPB → DESISTIMIENTO</text>
<text x="600" y="222" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-style="italic" fill="#4b5359">Tesis criminal-first de Gil Marer · documental · no es una condena</text>

<rect x="55" y="270" width="665" height="760" rx="14" fill="#ffffff" stroke="#27323a" stroke-width="2"/>
<rect x="55" y="270" width="665" height="58" rx="14" fill="#14273b"/>
<text x="82" y="308" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#ffffff">REGISTRO PRIMARIO CONTROLADO</text>
<line x1="132" y1="370" x2="132" y2="875" stroke="#8d1919" stroke-width="4"/>

<circle cx="132" cy="395" r="10" fill="#a21616"/><text x="170" y="389" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#9b1c1c">19 DIC 2017</text>
<text x="170" y="423" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#161c21">Auto admite DP 1041/2017.</text>
<text x="170" y="450" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#374049">LPB obtiene la vía para exigir a CAM la escritura</text>
<text x="170" y="476" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#374049">de cesión, precio, fecha de pago y costes.</text>

<circle cx="132" cy="545" r="10" fill="#a21616"/><text x="170" y="539" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#9b1c1c">25 ENE 2018</text>
<text x="170" y="573" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#161c21">AC/liquidador interviene en la representación de LPB.</text>
<text x="170" y="601" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#374049">Solicita venia; comunica terminación de la relación</text>
<text x="170" y="627" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#374049">profesional existente; instruye que no haya nuevos</text>
<text x="170" y="653" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#374049">escritos sin su consentimiento expreso.</text>

<circle cx="132" cy="720" r="10" fill="#a21616"/><text x="170" y="714" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#9b1c1c">25 FEB 2018</text>
<text x="170" y="748" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#161c21">El Decreto posterior registra escrito CAM 1222/18:</text>
<text x="170" y="776" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#374049">no oposición / conformidad con el desistimiento.</text>

<circle cx="132" cy="842" r="10" fill="#a21616"/><text x="170" y="836" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#9b1c1c">5 MAR 2018</text>
<text x="170" y="870" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#161c21">Decreto 000139/2018.</text>
<text x="170" y="898" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#374049">Registra desistimiento de LPB; sobreseimiento art. 20.3 LEC;</text>
<text x="170" y="924" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#374049">suspende vista 25-Abr; revisión posible en cinco días.</text>
<text x="82" y="982" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#4d555b">DP 1041/2017 · NIG 3501642120170028407 · cierre final aún SOURCE_GAP</text>

<rect x="752" y="270" width="393" height="760" rx="14" fill="#fff9f6" stroke="#8d1919" stroke-width="2"/>
<rect x="752" y="270" width="393" height="58" rx="14" fill="#941818"/>
<text x="778" y="308" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#ffffff">POR QUÉ IMPORTA</text>

<text x="785" y="380" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="800" fill="#161c21">1 · ACTO AUTÓNOMO</text>
<text x="785" y="415" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#374049">Gil Marer sostiene que debe investigarse</text>
<text x="785" y="441" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#374049">penalmente la intervención del AC y su</text>
<text x="785" y="467" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#374049">relación con el posterior desistimiento.</text>

<text x="785" y="530" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="800" fill="#161c21">2 · EFECTO A EXPLICAR</text>
<text x="785" y="565" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#374049">La vía judicial destinada a obtener de CAM</text>
<text x="785" y="591" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#374049">los términos económicos terminó mediante</text>
<text x="785" y="617" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#374049">desistimiento de LPB con conformidad CAM.</text>

<text x="785" y="680" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="800" fill="#161c21">3 · PATRÓN UNITARIO A PROBAR</text>
<text x="785" y="715" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#374049">Gil lo conecta, como hipótesis, con una</text>
<text x="785" y="741" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#374049">secuencia antes/durante/después del concurso</text>
<text x="785" y="767" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#374049">y posible beneficio al perímetro privado.</text>

<rect x="780" y="815" width="337" height="158" rx="12" fill="#fff0eb" stroke="#9d1b1b" stroke-width="3"/>
<text x="948" y="855" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#8b1717">NO PROBADO TODAVÍA</text>
<text x="800" y="890" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#333b40">• autor material del desistimiento</text>
<text x="800" y="918" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#333b40">• poder exacto · dolo · concierto</text>
<text x="800" y="946" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#333b40">• instrucciones/beneficio personal privado</text>

<rect x="55" y="1060" width="1090" height="78" rx="10" fill="#171d22"/>
<text x="600" y="1092" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#ffffff">GIL MARER: INVESTIGAR COMO ACTO AUTÓNOMO + DENTRO DE LA SECUENCIA UNITARIA</text>
<text x="600" y="1123" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#e1e6e8">Fuente-led · actor por actor · sin convertir hipótesis en condena</text>
</svg>