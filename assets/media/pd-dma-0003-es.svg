10" fill="#d6d2bd"/><text x="860" y="534" font-size="21" text-anchor="middle" class="h white"><tspan x="860" dy="0">VISIBILIDAD</tspan></text><text x="860" y="558" font-size="14" text-anchor="middle" class="b yellow"><tspan x="860" dy="0">MEDIOS</tspan></text><rect x="22" y="604" width="956" height="190" rx="12" class="yellow"/><text x="500" y="657" font-size="43" text-anchor="middle" class="h dark"><tspan x="500" dy="0">+100 M€ = VENTAS HOTELERAS BAJO GESTIÓN</tspan></text><text x="500" y="710" font-size="27" text-anchor="middle" class="h red"><tspan x="500" dy="0">44 M€ (2024) · ~50 M€ (2025) · 60 M€* (2026)</tspan><tspan x="500" dy="34">= FACTURACIÓN PROPIA COMUNICADA DE LA GESTORA</tspan></text><text x="500" y="777" font-size="18" text-anchor="middle" class="b dark"><tspan x="500" dy="0">* previsión · NO SE SUMAN MECÁNICAMENTE</tspan></text><text x="500" y="850" font-size="30" text-anchor="middle" class="h white"><tspan x="500" dy="0">¿QUÉ PODER COMERCIAL Y REPUTACIONAL PROYECTA EL CONJUNTO?</tspan></text><rect x="70" y="886" width="240" height="38" rx="19" fill="#f2f0e8" stroke="#f2b705" stroke-width="2"/><text x="190" y="912" font-size="16" text-anchor="middle" class="b dark"><tspan x="190" dy="0">PROPIEDAD</tspan></text><rect x="380" y="886" width="240" height="38" rx="19" fill="#f2f0e8" stroke="#f2b705" stroke-width="2"/><text x="500" y="912" font-size="16" text-anchor="middle" class="b dark"><tspan x="500" dy="0">GESTIÓN</tspan></text><rect x="690" y="886" width="240" height="38" rx="19" fill="#f2f0e8" stroke="#f2b705" stroke-width="2"/><text x="810" y="912" font-size="16" text-anchor="middle" class="b dark"><tspan x="810" dy="0">MARCA</tspan></text><rect x="70" y="942" width="240" height="38" rx="19" fill="#f2f0e8" stroke="#f2b705" stroke-width="2"/><text x="190" y="968" font-size="16" text-anchor="middle" class="b dark"><tspan x="190" dy="0">CAPITAL</tspan></text><rect x="380" y="942" width="240" height="38" rx="19" fill="#f2f0e8" stroke="#f2b705" stroke-width="2"/><text x="500" y="968" font-size="16" text-anchor="middle" class="b dark"><tspan x="500" dy="0">MANDATO</tspan></text><rect x="690" y="942" width="240" height="38" rx="19" fill="#f2f0e8" stroke="#f2b705" stroke-width="2"/><text x="810" y="968" font-size="16" text-anchor="middle" class="b dark"><tspan x="810" dy="0">COBERTURA</tspan></text><rect x="22" y="1000" width="956" height="160" rx="12" fill="#6f1712" stroke="#cf3528" stroke-width="3"/><text x="500" y="1038" font-size="31" text-anchor="middle" class="h white"><tspan x="500" dy="0">PREGUNTAS, NO CONCLUSIONES</tspan></text><circle cx="55" cy="1071" r="13" class="red"/><text x="55" y="1076" font-size="13" text-anchor="middle" class="b white"><tspan x="55" dy="0">1</tspan></text><text x="79" y="1077" font-size="17" text-anchor="start" class="r white"><tspan x="79" dy="0">¿Qué activos son propios?</tspan></text><circle cx="520" cy="1071" r="13" class="red"/><text x="520" y="1076" font-size="13" text-anchor="middle" class="b white"><tspan x="520" dy="0">2</tspan></text><text x="544" y="1077" font-size="17" text-anchor="start" class="r white"><tspan x="544" dy="0">¿Qué hoteles sólo se gestionan?</tspan></text><circle cx="55" cy="1114" r="13" class="red"/><text x="55" y="1119" font-size="13" text-anchor="middle" class="b white"><tspan x="55" dy="0">3</tspan></text><text x="79" y="1120" font-size="17" text-anchor="start" class="r white"><tspan x="79" dy="0">¿Qué aporta cada marca o mandato?</tspan></text><circle cx="520" cy="1114" r="13" class="red"/><text x="520" y="1119" font-size="13" text-anchor="middle" class="b white"><tspan x="520" dy="0">4</tspan></text><text x="544" y="1120" font-size="17" text-anchor="start" class="r white"><tspan x="544" dy="0">¿Quién aporta capital y quién obtiene el beneficio fiscal?</tspan></text><rect x="18" y="1174" width="964" height="58" rx="9" class="panel"/><text x="62" y="1208" font-size="31" text-anchor="middle" class="h yellow"><tspan x="62" dy="0">!</tspan></text><text x="96" y="1197" font-size="14" text-anchor="start" class="r white"><tspan x="96" dy="0">Representación satírica y caricaturesca, deliberadamente ficticia.</tspan><tspan x="96" dy="17">No es publicidad real ni una comunicación de las entidades representadas.</tspan></text><text x="944" y="1219" font-size="12" text-anchor="end" class="b muted"><tspan x="944" dy="0">PD-DMA-0003^</tspan></text>
