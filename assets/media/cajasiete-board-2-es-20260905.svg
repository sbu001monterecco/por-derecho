<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1740" viewBox="0 0 1080 1740" role="img" aria-labelledby="title desc"><title id="title">Mismo complejo hotelero. Derechos distintos.</title><desc id="desc">Documentary infographic; questions and evidence states, not a finding of wrongdoing.</desc><rect width="1080" height="1740" fill="#f1f5f7"/><rect width="1080" height="300" fill="#132b3a"/>
<text x="56" y="48" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#d4e5ed">POR DERECHO  /  CAJASIETE  /  LECTURA DOCUMENTAL</text>
<text x="56" y="115" font-family="DejaVu Sans,Arial,sans-serif" font-size="55" font-weight="700" fill="#ffffff">Mismo complejo hotelero.</text>
<text x="56" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="55" font-weight="700" fill="#ffffff">Derechos distintos.</text>
<text x="56" y="270" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#f3c35c">¿QUÉ SE ACEPTÓ COMO GARANTÍA?</text>
<rect x="56" y="328" width="968" height="272" rx="20" fill="#ffffff" stroke="#d8e1e7" stroke-width="2"/>
<text x="84" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#825d0b">1  RESULTADO Y EXPLOTACIÓN</text>
<text x="84" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">Hotel, ingresos y derechos de terceros:</text>
<text x="84" y="475" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">identificar cada derecho; no tratar todo el</text>
<text x="84" y="519" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">complejo como un único patrimonio.</text>
<rect x="56" y="622" width="968" height="272" rx="20" fill="#ffffff" stroke="#d8e1e7" stroke-width="2"/>
<text x="84" y="665" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#825d0b">2  GARANTÍA Y TÍTULO</text>
<text x="84" y="725" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">Cargas hipotecarias reseñadas → fincas</text>
<text x="84" y="769" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">concretas → títulos y segregación CAMSA/HNT.</text>
<text x="84" y="813" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">Prestatario, desembolso y valoración siguen</text>
<text x="84" y="857" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">abiertos.</text>
<rect x="56" y="916" width="968" height="272" rx="20" fill="#ffffff" stroke="#d8e1e7" stroke-width="2"/>
<text x="84" y="959" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#825d0b">3  AUTORIDAD Y CONTROL PREVIOS</text>
<text x="84" y="1019" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">Contrastar los documentos y decisiones que</text>
<text x="84" y="1063" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">hicieron posible ese resultado. La hipótesis</text>
<text x="84" y="1107" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">criminal de Gil Marer requiere prueba actor</text>
<text x="84" y="1151" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">por actor.</text>
<rect x="56" y="1220" width="968" height="282" rx="20" fill="#e5eff6" stroke="#7492a5" stroke-width="2"/>
<text x="84" y="1270" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="700" fill="#152d3b">ORION: RELACIÓN SEPARADA</text>
<text x="84" y="1322" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">Cajasiete ↔ Orion ↔ Grupo Patrimonial Acosta</text>
<text x="84" y="1366" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">Matos. Coaccionariado descrito; no es una</text>
<text x="84" y="1410" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">transmisión del hotel a Orion ni prueba de</text>
<text x="84" y="1454" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">coordinación.</text>
<text x="56" y="1557" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#152d3b">Hipoteca ≠ principal desembolsado. Aviso</text>
<text x="56" y="1597" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#152d3b">posterior ≠ conocimiento anterior. Proximidad ≠</text>
<text x="56" y="1637" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#152d3b">responsabilidad.</text>
<text x="56" y="1676" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#415666">PD-DMA-0006  ·  PD-CAJASIETE-BOARD-VISUALS-20260905</text>
<text x="56" y="1713" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#415666">Fuentes y límites en el dossier · No acredita culpabilidad</text>
</svg>
