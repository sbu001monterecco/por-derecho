<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1740" viewBox="0 0 1080 1740" role="img" aria-labelledby="title desc"><title id="title">One hotel complex. Distinct rights.</title><desc id="desc">Documentary infographic; questions and evidence states, not a finding of wrongdoing.</desc><rect width="1080" height="1740" fill="#f1f5f7"/><rect width="1080" height="300" fill="#132b3a"/>
<text x="56" y="48" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#d4e5ed">POR DERECHO  /  CAJASIETE  /  DOCUMENTARY REVIEW</text>
<text x="56" y="115" font-family="DejaVu Sans,Arial,sans-serif" font-size="55" font-weight="700" fill="#ffffff">One hotel complex. Distinct</text>
<text x="56" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="55" font-weight="700" fill="#ffffff">rights.</text>
<text x="56" y="270" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#f3c35c">WHAT WAS ACCEPTED AS SECURITY?</text>
<rect x="56" y="328" width="968" height="272" rx="20" fill="#ffffff" stroke="#d8e1e7" stroke-width="2"/>
<text x="84" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#825d0b">1  OUTCOME AND OPERATION</text>
<text x="84" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">Hotel, income and third-party rights:</text>
<text x="84" y="475" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">identify each right; do not treat the entire</text>
<text x="84" y="519" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">complex as one estate.</text>
<rect x="56" y="622" width="968" height="272" rx="20" fill="#ffffff" stroke="#d8e1e7" stroke-width="2"/>
<text x="84" y="665" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#825d0b">2  SECURITY AND TITLE</text>
<text x="84" y="725" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">Reported mortgage charges → exact properties</text>
<text x="84" y="769" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">→ titles and CAMSA/HNT segregation. Borrower,</text>
<text x="84" y="813" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">advances and valuation remain open.</text>
<rect x="56" y="916" width="968" height="272" rx="20" fill="#ffffff" stroke="#d8e1e7" stroke-width="2"/>
<text x="84" y="959" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#825d0b">3  EARLIER AUTHORITY AND CONTROL</text>
<text x="84" y="1019" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">Test the documents and decisions that enabled</text>
<text x="84" y="1063" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">the outcome. Gil Marer&#x27;s criminal allegation</text>
<text x="84" y="1107" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">requires actor-specific evidence.</text>
<rect x="56" y="1220" width="968" height="282" rx="20" fill="#e5eff6" stroke="#7492a5" stroke-width="2"/>
<text x="84" y="1270" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="700" fill="#152d3b">ORION: A SEPARATE RELATIONSHIP</text>
<text x="84" y="1322" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">Cajasiete ↔ Orion ↔ Grupo Patrimonial Acosta</text>
<text x="84" y="1366" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">Matos. Reported co-shareholding; not a</text>
<text x="84" y="1410" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">transfer of the hotel into Orion or proof of</text>
<text x="84" y="1454" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="400" fill="#152d3b">coordination.</text>
<text x="56" y="1557" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#152d3b">Mortgage ≠ cash advanced. Later notice ≠ earlier</text>
<text x="56" y="1597" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#152d3b">knowledge. Proximity ≠ responsibility.</text>
<text x="56" y="1676" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#415666">PD-DMA-0009  ·  PD-CAJASIETE-BOARD-VISUALS-20260905</text>
<text x="56" y="1713" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#415666">Sources and limits in the dossier · Not a finding of guilt</text>
</svg>
