<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1640" viewBox="0 0 1080 1640" role="img" aria-labelledby="title desc"><title id="title">La reputación se protege con una respuesta verificable</title><desc id="desc">Documentary infographic; questions and evidence states, not a finding of wrongdoing.</desc><rect width="1080" height="1640" fill="#f1f5f7"/><rect width="1080" height="300" fill="#132b3a"/>
<text x="56" y="48" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#d4e5ed">POR DERECHO  /  CAJASIETE  /  LECTURA DOCUMENTAL</text>
<text x="56" y="115" font-family="DejaVu Sans,Arial,sans-serif" font-size="55" font-weight="700" fill="#ffffff">La reputación se protege con</text>
<text x="56" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="55" font-weight="700" fill="#ffffff">una respuesta verificable</text>
<text x="56" y="270" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#f3c35c">CONSEJO · CUMPLIMIENTO · RIESGOS</text>
<rect x="56" y="332" width="968" height="230" rx="20" fill="#ffffff" stroke="#d8e1e7" stroke-width="2"/>
<text x="84" y="381" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#825d0b">INDEPENDENCIA</text>
<text x="84" y="441" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#152d3b">¿Qué controles de conflicto y reasignación</text>
<text x="84" y="488" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#152d3b">se aplicaron?</text>
<rect x="56" y="582" width="968" height="230" rx="20" fill="#ffffff" stroke="#d8e1e7" stroke-width="2"/>
<text x="84" y="631" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#825d0b">EXAMEN</text>
<text x="84" y="691" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#152d3b">¿Qué se revisó y qué sustentó cada motivo</text>
<text x="84" y="738" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#152d3b">de inadmisión?</text>
<rect x="56" y="832" width="968" height="230" rx="20" fill="#ffffff" stroke="#d8e1e7" stroke-width="2"/>
<text x="84" y="881" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#825d0b">EXPOSICIÓN DEL BANCO</text>
<text x="84" y="941" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#152d3b">¿Se examinaron de forma independiente</text>
<text x="84" y="988" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#152d3b">títulos, financiación y relaciones</text>
<text x="84" y="1035" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#152d3b">relevantes?</text>
<rect x="56" y="1082" width="968" height="230" rx="20" fill="#ffffff" stroke="#d8e1e7" stroke-width="2"/>
<text x="84" y="1131" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#825d0b">TRAZABILIDAD</text>
<text x="84" y="1191" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#152d3b">¿Qué registro lícito se conserva de</text>
<text x="84" y="1238" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#152d3b">recepción, revisión, decisión, traslado,</text>
<text x="84" y="1285" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#152d3b">anonimización o borrado?</text>
<rect x="56" y="1360" width="968" height="162" rx="20" fill="#fff3d5" stroke="#d4a33e" stroke-width="2"/>
<text x="84" y="1412" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#152d3b">Evaluación independiente · respuesta motivada ·</text>
<text x="84" y="1452" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#152d3b">preservación lícita · corrección cuando proceda.</text>
<text x="56" y="1576" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#415666">PD-DMA-0007  ·  PD-CAJASIETE-BOARD-VISUALS-20260905</text>
<text x="56" y="1613" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#415666">Fuentes y límites en el dossier · No acredita culpabilidad</text>
</svg>
