<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" role="img" aria-labelledby="title desc">
<title id="title">PD-DMA-0001^ — 12 hoteles, 2.500 habitaciones y +100 M€</title><desc id="desc">Caricatura satírica que diferencia ventas hoteleras bajo gestión de facturación propia de la gestora.</desc>
<style>
  .bg{fill:#070808}.panel{fill:#111313;stroke:#f2b705;stroke-width:3}.panel-red{fill:#161313;stroke:#cf3528;stroke-width:3}
  .yellow{fill:#f2b705}.red{fill:#cf3528}.white{fill:#f2f0e8}.muted{fill:#b7b6ad}.dark{fill:#090a0a}
  .h{font-family:"Arial Narrow","DejaVu Sans Condensed",sans-serif;font-weight:800;letter-spacing:-1px}
  .b{font-family:"Arial Narrow","DejaVu Sans Condensed",sans-serif;font-weight:700}
  .r{font-family:Arial,"DejaVu Sans",sans-serif;font-weight:400}
  .caps{letter-spacing:1px}
  .small{font-size:16px}.tiny{font-size:12px}
</style><rect width="1000" height="1250" class="bg"/>
<defs><pattern id="grain" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#fff" opacity=".09"/><circle cx="10" cy="9" r=".6" fill="#fff" opacity=".05"/></pattern></defs><rect width="1000" height="1250" fill="url(#grain)"/>
<rect width="1000" height="62" fill="#f2b705"/><path d="M-25,0 h20 l-30,62 h-20 z" fill="#080909"/><path d="M13,0 h20 l-30,62 h-20 z" fill="#080909"/><path d="M51,0 h20 l-30,62 h-20 z" fill="#080909"/><path d="M89,0 h20 l-30,62 h-20 z" fill="#080909"/><path d="M910,0 h20 l-30,62 h-20 z" fill="#080909"/><path d="M948,0 h20 l-30,62 h-20 z" fill="#080909"/><path d="M986,0 h20 l-30,62 h-20 z" fill="#080909"/><path d="M1024,0 h20 l-30,62 h-20 z" fill="#080909"/><rect x="80" y="5" width="840" height="52" rx="4" fill="#f2b705"/><text x="500" y="40" font-size="22" text-anchor="middle" class="h dark caps" ><tspan x="500" dy="0">CARICATURA / REPRESENTACIÓN SATÍRICA — NO ES UN ANUNCIO REAL</tspan></text><text x="500" y="88" font-size="20" text-anchor="middle" class="b white" ><tspan x="500" dy="0">Pieza visual de interés público. Preguntas, no conclusiones.</tspan></text><text x="500" y="155" font-size="66" text-anchor="middle" class="h white" ><tspan x="500" dy="0">12 HOTELES · 2.500 HABITACIONES</tspan></text><text x="500" y="220" font-size="61" text-anchor="middle" class="h yellow" ><tspan x="500" dy="0">+100 M€ EN VENTAS HOTELERAS</tspan></text><text x="500" y="258" font-size="20" text-anchor="middle" class="b white" ><tspan x="500" dy="0">Canarian Hospitality afirma que en cinco años alcanzó 12 hoteles,</tspan><tspan x="500" dy="24">aproximadamente 2.500 habitaciones y más de 100 millones de euros</tspan><tspan x="500" dy="24">de ventas hoteleras en 2025.</tspan></text><rect x="22" y="332" width="466" height="283" rx="12" class="panel"/><rect x="22" y="332" width="466" height="52" rx="10" class="yellow"/><text x="255" y="368" font-size="27" text-anchor="middle" class="h dark" ><tspan x="255" dy="0">VOLUMEN HOTELERO BAJO GESTIÓN</tspan></text><text x="255" y="468" font-size="78" text-anchor="middle" class="h yellow" ><tspan x="255" dy="0">+100 M€</tspan></text><text x="255" y="505" font-size="27" text-anchor="middle" class="b yellow" ><tspan x="255" dy="0">en ventas hoteleras (2025)</tspan></text><text x="255" y="540" font-size="16" text-anchor="middle" class="r white" ><tspan x="255" dy="0">Volumen comercial atribuido al conjunto</tspan><tspan x="255" dy="19">de hoteles gestionados.</tspan></text><rect x="60" y="564" width="55" height="38" fill="none" stroke="#f2b705" stroke-width="4"/><rect x="74" y="580" width="8" height="10" fill="#f2b705"/><rect x="96" y="580" width="8" height="10" fill="#f2b705"/><rect x="130" y="575" width="40" height="27" fill="none" stroke="#f2b705" stroke-width="4"/><rect x="144" y="591" width="8" height="10" fill="#f2b705"/><rect x="185" y="568" width="48" height="34" fill="none" stroke="#f2b705" stroke-width="4"/><rect x="199" y="584" width="8" height="10" fill="#f2b705"/><rect x="221" y="584" width="8" height="10" fill="#f2b705"/><rect x="248" y="558" width="60" height="44" fill="none" stroke="#f2b705" stroke-width="4"/><rect x="262" y="574" width="8" height="10" fill="#f2b705"/><rect x="284" y="574" width="8" height="10" fill="#f2b705"/><rect x="327" y="572" width="42" height="30" fill="none" stroke="#f2b705" stroke-width="4"/><rect x="341" y="588" width="8" height="10" fill="#f2b705"/><rect x="382" y="552" width="65" height="50" fill="none" stroke="#f2b705" stroke-width="4"/><rect x="396" y="568" width="8" height="10" fill="#f2b705"/><rect x="418" y="568" width="8" height="10" fill="#f2b705"/><rect x="512" y="332" width="466" height="283" rx="12" class="panel-red"/><rect x="512" y="332" width="466" height="52" rx="10" class="red"/><text x="745" y="368" font-size="26" text-anchor="middle" class="h white" ><tspan x="745" dy="0">FACTURACIÓN PROPIA DE LA GESTORA</tspan></text><text x="568" y="447" font-size="34" text-anchor="start" class="b white" ><tspan x="568" dy="0">2024:</tspan></text><text x="715" y="447" font-size="40" text-anchor="start" class="h red" ><tspan x="715" dy="0">44 M€</tspan></text><text x="568" y="500" font-size="34" text-anchor="start" class="b white" ><tspan x="568" dy="0">2025:</tspan></text><text x="715" y="500" font-size="40" text-anchor="start" class="h red" ><tspan x="715" dy="0">~50 M€</tspan></text><text x="568" y="553" font-size="34" text-anchor="start" class="b white" ><tspan x="568" dy="0">2026:</tspan></text><text x="715" y="553" font-size="40" text-anchor="start" class="h red" ><tspan x="715" dy="0">60 M€*</tspan></text><text x="745" y="577" font-size="13" text-anchor="middle" class="r yellow" ><tspan x="745" dy="0">* previsión</tspan></text><text x="745" y="597" font-size="11" text-anchor="middle" class="r white" ><tspan x="745" dy="0">Cifras de la propia gestora,</tspan><tspan x="745" dy="13">no de todo el perímetro hotelero.</tspan></text><text x="500" y="672" font-size="51" text-anchor="middle" class="h white" ><tspan x="500" dy="0">⚠  NO ES LO MISMO  ⚠</tspan></text><text x="500" y="713" font-size="23" text-anchor="middle" class="b yellow" ><tspan x="500" dy="0">Las ventas hoteleras bajo gestión y la facturación propia de la gestora</tspan><tspan x="500" dy="27">no deben sumarse mecánicamente.</tspan></text><rect x="22" y="742" width="956" height="176" rx="12" class="panel"/><text x="48" y="780" font-size="19" text-anchor="start" class="r white" ><tspan x="48" dy="0">Una misma “plataforma” puede reunir activos,</tspan><tspan x="48" dy="24">gestión, marcas, capital, mandatos y visibilidad</tspan><tspan x="48" dy="24">pública, sin que todo signifique lo mismo.</tspan></text><rect x="410" y="762" width="235" height="38" rx="19" fill="#f2f0e8" stroke="#f2b705" stroke-width="2"/><text x="527.5" y="788" font-size="16" text-anchor="middle" class="b dark" ><tspan x="527.5" dy="0">PROPIEDAD</tspan></text><rect x="715" y="762" width="235" height="38" rx="19" fill="#f2f0e8" stroke="#f2b705" stroke-width="2"/><text x="832.5" y="788" font-size="16" text-anchor="middle" class="b dark" ><tspan x="832.5" dy="0">CAPITAL</tspan></text><rect x="410" y="812" width="235" height="38" rx="19" fill="#f2f0e8" stroke="#f2b705" stroke-width="2"/><text x="527.5" y="838" font-size="16" text-anchor="middle" class="b dark" ><tspan x="527.5" dy="0">GESTIÓN</tspan></text><rect x="715" y="812" width="235" height="38" rx="19" fill="#f2f0e8" stroke="#f2b705" stroke-width="2"/><text x="832.5" y="838" font-size="16" text-anchor="middle" class="b dark" ><tspan x="832.5" dy="0">MANDATO</tspan></text><rect x="410" y="862" width="235" height="38" rx="19" fill="#f2f0e8" stroke="#f2b705" stroke-width="2"/><text x="527.5" y="888" font-size="16" text-anchor="middle" class="b dark" ><tspan x="527.5" dy="0">MARCA</tspan></text><rect x="715" y="862" width="235" height="38" rx="19" fill="#f2f0e8" stroke="#f2b705" stroke-width="2"/><text x="832.5" y="888" font-size="16" text-anchor="middle" class="b dark" ><tspan x="832.5" dy="0">COBERTURA MEDIÁTICA</tspan></text><rect x="22" y="934" width="956" height="226" rx="12" fill="#6f1712" stroke="#cf3528" stroke-width="3"/><rect x="180" y="934" width="798" height="48" class="red"/><text x="580" y="968" font-size="32" text-anchor="middle" class="h white" ><tspan x="580" dy="0">PREGUNTAS, NO CONCLUSIONES</tspan></text><text x="94" y="1070" font-size="112" text-anchor="middle" class="h white" ><tspan x="94" dy="0">?</tspan></text><circle cx="205" cy="1004" r="14" class="red"/><text x="205" y="1009" font-size="14" text-anchor="middle" class="b white" ><tspan x="205" dy="0">1</tspan></text><text x="230" y="1010" font-size="18" text-anchor="start" class="r white" ><tspan x="230" dy="0">¿Qué es propiedad y qué es solo gestión?</tspan></text><circle cx="205" cy="1042" r="14" class="red"/><text x="205" y="1047" font-size="14" text-anchor="middle" class="b white" ><tspan x="205" dy="0">2</tspan></text><text x="230" y="1048" font-size="18" text-anchor="start" class="r white" ><tspan x="230" dy="0">¿Qué activos son propios, asociados, coinvertidos o financiados?</tspan></text><circle cx="205" cy="1080" r="14" class="red"/><text x="205" y="1085" font-size="14" text-anchor="middle" class="b white" ><tspan x="205" dy="0">3</tspan></text><text x="230" y="1086" font-size="18" text-anchor="start" class="r white" ><tspan x="230" dy="0">¿Qué parte es marca, mandato, gestión o capital?</tspan></text><circle cx="205" cy="1118" r="14" class="red"/><text x="205" y="1123" font-size="14" text-anchor="middle" class="b white" ><tspan x="205" dy="0">4</tspan></text><text x="230" y="1124" font-size="18" text-anchor="start" class="r white" ><tspan x="230" dy="0">¿Qué se presenta exactamente cuando se habla de “plataforma”?</tspan></text><rect x="18" y="1174" width="964" height="58" rx="9" class="panel"/><text x="62" y="1208" font-size="31" text-anchor="middle" class="h yellow" ><tspan x="62" dy="0">!</tspan></text><text x="96" y="1197" font-size="14" text-anchor="start" class="r white" ><tspan x="96" dy="0">Representación satírica y caricaturesca, deliberadamente ficticia.</tspan><tspan x="96" dy="17">No es publicidad real ni una comunicación de las entidades representadas.</tspan></text><text x="944" y="1219" font-size="12" text-anchor="end" class="b muted" ><tspan x="944" dy="0">PD-DMA-0001^</tspan></text>
</svg>