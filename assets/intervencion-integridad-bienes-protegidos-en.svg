<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Documented institutional milestone — General Intervention, 24 February 2026</title><desc id="desc">The Commission for Public Integrity and the Fight against Corruption considered a communication and agreed an anonymised referral to Justice concerning assets under judicial or insolvency protection.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1b28"/><stop offset="1" stop-color="#102b3a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter></defs><rect width="1600" height="900" rx="36" fill="url(#bg)"/><rect x="28" y="28" width="1544" height="844" rx="28" fill="none" stroke="#d3a13c" stroke-width="3"/><rect x="42" y="42" width="1516" height="816" rx="24" fill="none" stroke="#d3a13c" stroke-width="1" opacity=".75"/><g fill="#d9aa4a" font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="800" y="92" font-size="32" font-weight="700" letter-spacing="7">DOCUMENTED INSTITUTIONAL MILESTONE</text><line x1="90" x2="360" y1="82" y2="82" stroke="#d3a13c"/><line x1="1240" x2="1510" y1="82" y2="82" stroke="#d3a13c"/></g><g font-family="Georgia,'Times New Roman',serif" text-anchor="middle"><circle cx="175" cy="225" r="72" fill="none" stroke="#d3a13c" stroke-width="4"/><text x="175" y="248" fill="#d9aa4a" font-size="78">1</text><text x="175" y="390" fill="#fff" font-size="132">24</text><text x="175" y="442" fill="#fff" font-size="38" font-weight="700">FEBRUARY</text><text x="175" y="498" fill="#fff" font-size="44" font-weight="700">2026</text><text x="495" y="252" fill="#d3a13c" font-size="88">›</text><circle cx="800" cy="225" r="72" fill="none" stroke="#d3a13c" stroke-width="4"/><text x="800" y="248" fill="#d9aa4a" font-size="78">2</text><text x="800" y="370" fill="#fff" font-size="40" font-weight="700"><tspan x="800">Commission for</tspan><tspan x="800" dy="54">Public Integrity</tspan><tspan x="800" dy="54">and the Fight against</tspan><tspan x="800" dy="54">Corruption</tspan></text><text x="1110" y="252" fill="#d3a13c" font-size="88">›</text><circle cx="1280" cy="225" r="72" fill="none" stroke="#d3a13c" stroke-width="4"/><text x="1280" y="248" fill="#d9aa4a" font-size="78">3</text><text x="1280" y="385" fill="#fff" font-size="40" font-weight="700"><tspan x="1280">assets under</tspan><tspan x="1280" dy="54">judicial or insolvency</tspan><tspan x="1280" dy="54">protection</tspan></text></g><line x1="90" x2="1510" y1="580" y2="580" stroke="#d3a13c" stroke-width="2"/><g fill="#fff" font-family="Georgia,'Times New Roman',serif" font-size="30"><text x="120" y="635"><tspan x="120">The signed General Intervention response records that the Commission considered the communication</tspan><tspan x="120" dy="43">on 24 February 2026 and agreed an anonymised transfer to the Vice-Ministry of Justice, particularly</tspan><tspan x="120" dy="43">concerning the reported possibility of material disposal or removal of assets under judicial or insolvency</tspan><tspan x="120" dy="43">protection without the required authorisations.</tspan></text></g><rect x="90" y="795" width="1420" height="68" rx="10" fill="#0b2232" stroke="#d3a13c" stroke-width="1" opacity=".98"/><text x="120" y="838" fill="#d9aa4a" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Source:</text><text x="230" y="838" fill="#fff" font-family="Georgia,'Times New Roman',serif" font-size="27">signed General Intervention response, 5 March 2026.</text><text x="1490" y="838" fill="#b9c4ca" font-family="Arial,Helvetica,sans-serif" font-size="17" text-anchor="end">Proves consideration and referral, not a merits determination.</text></svg>