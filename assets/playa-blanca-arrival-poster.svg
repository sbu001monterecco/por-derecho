<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Arrival in Playa Blanca</title>
  <desc id="desc">Original Art Deco-inspired illustrative poster showing a shaded commercial street, white hotel architecture, palm trees and the Atlantic beyond.</desc>
  <defs>
