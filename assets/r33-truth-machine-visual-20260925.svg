<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
<title id="t">R33 full forensic method-stack pass</title>
<desc id="d">All 276 statement propositions are processed through a structured forensic method stack. The visualization separates open, rhetorical, narrowing, contradiction and supported states and shows verifiability, control, financial and linguistic review lanes. No automated lie score is produced.</desc>
<rect width="1920" height="1080" fill="#f4f0e8"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<text x="82" y="72" font-size="44" font-weight="800" fill="#102a35">R33 · full forensic method-stack pass</text>
<text x="82" y="112" font-size="20" fill="#52636a">22 pages · 206 blocks · 276 propositions · 482 review records · source-bound, no automatic lie score</text>

<rect x="82" y="145" width="1756" height="92" rx="18" fill="#102a35"/>
<text x="112" y="187" font-size="21" fill="#fff">Method stack</text>
<text x="112" y="218" font-size="17" fill="#c8d9df">ACH · SUE · Verifiability · Wigmore · FATF · FCA controls · PSFA · PEACE · FBI probe cues · NIST/ENFSI validation</text>

