<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">R33 Truth Machine structural and review visualization</title><desc id="d">Twenty-two pages become 206 blocks, 276 statement propositions and 482 review records. All statements were scanned; 179 carry one or more candidate review markers. This is not a truth or guilt score.</desc>
<rect width="1600" height="900" fill="#f4f0e8"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#b7832f"/></marker></defs>
<text x="80" y="72" font-family="system-ui" font-size="40" font-weight="800" fill="#102a35">R33 · Truth Machine / Context Integrity</text><text x="80" y="108" font-family="system-ui" font-size="19" fill="#52636a">Source integrity, structure and review load — not a truth, lie, credibility or guilt score</text><rect x="80" y="155" width="260" height="120" rx="18" fill="#fff" stroke="#c8c0b4"/><text x="108" y="215" font-family="system-ui" font-size="46" font-weight="800" fill="#102a35">22</text><text x="108" y="250" font-family="system-ui" font-size="19" fill="#52636a">pages</text><path d="M350 215H390" stroke="#b7832f" stroke-width="5" marker-end="url(#a)"/><rect x="400" y="155" width="260" height="120" rx="18" fill="#fff" stroke="#c8c0b4"/><text x="428" y="215" font-family="system-ui" font-size="46" font-weight="800" fill="#102a35">206</text><text x="428" y="250" font-family="system-ui" font-size="19" fill="#52636a">text blocks</text><path d="M670 215H710" stroke="#b7832f" stroke-width="5" marker-end="url(#a)"/><rect x="720" y="155" width="260" height="120" rx="18" fill="#fff" stroke="#c8c0b4"/><text x="748" y="215" font-family="system-ui" font-size="46" font-weight="800" fill="#102a35">276</text><text x="748" y="250" font-family="system-ui" font-size="19" fill="#52636a">statement propositions</text><path d="M990 215H1030" stroke="#b7832f" stroke-width="5" marker-end="url(#a)"/><rect x="1040" y="155" width="260" height="120" rx="18" fill="#fff" stroke="#c8c0b4"/><text x="1068" y="215" font-family="system-ui" font-size="46" font-weight="800" fill="#102a35">482</text><text x="1068" y="250" font-family="system-ui" font-size="19" fill="#52636a">review records</text>
<rect x="80" y="325" width="700" height="485" rx="20" fill="#fff" stroke="#c8c0b4"/><text x="115" y="370" font-family="system-ui" font-size="26" font-weight="800" fill="#102a35">Measured run</text><text x="115" y="420" font-family="system-ui" font-size="17" fill="#52636a">Native source identity</text><text x="420" y="420" font-family="system-ui" font-size="24" font-weight="800" fill="#102a35">SHA-256 bound</text><text x="565" y="420" font-family="system-ui" font-size="15" fill="#8b3028">100% source identity</text><text x="115" y="480" font-family="system-ui" font-size="17" fill="#52636a">Pages represented</text><text x="420" y="480" font-family="system-ui" font-size="24" font-weight="800" fill="#102a35">22 / 22</text><text x="565" y="480" font-family="system-ui" font-size="15" fill="#8b3028">100% page coverage</text><text x="115" y="540" font-family="system-ui" font-size="17" fill="#52636a">Preserved anchors</text><text x="420" y="540" font-family="system-ui" font-size="24" font-weight="800" fill="#102a35">482 / 482</text><text x="565" y="540" font-family="system-ui" font-size="15" fill="#8b3028">100% anchor carry-forward</text><text x="115" y="600" font-family="system-ui" font-size="17" fill="#52636a">Statements scanned</text><text x="420" y="600" font-family="system-ui" font-size="24" font-weight="800" fill="#102a35">276 / 276</text><text x="565" y="600" font-family="system-ui" font-size="15" fill="#8b3028">100% scan coverage</text><text x="115" y="660" font-family="system-ui" font-size="17" fill="#52636a">Candidate review load</text><text x="420" y="660" font-family="system-ui" font-size="24" font-weight="800" fill="#102a35">179 / 276</text><text x="565" y="660" font-family="system-ui" font-size="15" fill="#8b3028">64.9% need ≥1 check</text><text x="115" y="720" font-family="system-ui" font-size="17" fill="#52636a">Source-complete signoffs</text><text x="420" y="720" font-family="system-ui" font-size="24" font-weight="800" fill="#102a35">0 / 482</text><text x="565" y="720" font-family="system-ui" font-size="15" fill="#8b3028">No automatic merits promotion</text><text x="115" y="795" font-family="system-ui" font-size="14" fill="#52636a">Candidate load is triage workload, not error/falsity rate.</text>
<rect x="820" y="325" width="700" height="485" rx="20" fill="#fff" stroke="#c8c0b4"/><text x="855" y="370" font-family="system-ui" font-size="26" font-weight="800" fill="#102a35">Most frequent candidate checks</text><text x="855" y="403" font-family="system-ui" font-size="15" fill="#52636a">Overlapping markers; one proposition can trigger several checks.</text><text x="865" y="505" font-family="system-ui" font-size="16" fill="#243a43">CI-001 · Exact quote/context comparison</text><rect x="1215" y="488" width="250" height="17" rx="8" fill="#e6e0d7"/><rect x="1215" y="488" width="250" height="17" rx="8" fill="#315c7b"/><text x="1480" y="502" font-family="system-ui" font-size="14" fill="#52636a">57</text><text x="865" y="539" font-family="system-ui" font-size="16" fill="#243a43">CI-025 · Actor/capacity separation</text><rect x="1215" y="522" width="250" height="17" rx="8" fill="#e6e0d7"/><rect x="1215" y="522" width="246" height="17" rx="8" fill="#315c7b"/><text x="1480" y="536" font-family="system-ui" font-size="14" fill="#52636a">56</text><text x="865" y="573" font-family="system-ui" font-size="16" fill="#243a43">CI-012 · Quantifier/generalisation</text><rect x="1215" y="556" width="250" height="17" rx="8" fill="#e6e0d7"/><rect x="1215" y="556" width="246" height="17" rx="8" fill="#315c7b"/><text x="1480" y="570" font-family="system-ui" font-size="14" fill="#52636a">56</text><text x="865" y="607" font-family="system-ui" font-size="16" fill="#243a43">CI-016 · Causation bridge</text><rect x="1215" y="590" width="250" height="17" rx="8" fill="#e6e0d7"/><rect x="1215" y="590" width="180" height="17" rx="8" fill="#315c7b"/><text x="1480" y="604" font-family="system-ui" font-size="14" fill="#52636a">41</text><text x="865" y="641" font-family="system-ui" font-size="16" fill="#243a43">CI-007 · Recontextualisation/context restoration</text><rect x="1215" y="624" width="250" height="17" rx="8" fill="#e6e0d7"/><rect x="1215" y="624" width="118" height="17" rx="8" fill="#315c7b"/><text x="1480" y="638" font-family="system-ui" font-size="14" fill="#52636a">27</text><text x="865" y="675" font-family="system-ui" font-size="16" fill="#243a43">CI-014 · Knowledge timing</text><rect x="1215" y="658" width="250" height="17" rx="8" fill="#e6e0d7"/><rect x="1215" y="658" width="66" height="17" rx="8" fill="#315c7b"/><text x="1480" y="672" font-family="system-ui" font-size="14" fill="#52636a">15</text><text x="865" y="709" font-family="system-ui" font-size="16" fill="#243a43">CI-034 · Numeric precision</text><rect x="1215" y="692" width="250" height="17" rx="8" fill="#e6e0d7"/><rect x="1215" y="692" width="57" height="17" rx="8" fill="#315c7b"/><text x="1480" y="706" font-family="system-ui" font-size="14" fill="#52636a">13</text><text x="865" y="743" font-family="system-ui" font-size="16" fill="#243a43">CI-019 · Character attack vs proposition</text><rect x="1215" y="726" width="250" height="17" rx="8" fill="#e6e0d7"/><rect x="1215" y="726" width="18" height="17" rx="8" fill="#315c7b"/><text x="1480" y="740" font-family="system-ui" font-size="14" fill="#52636a">4</text><text x="865" y="777" font-family="system-ui" font-size="16" fill="#243a43">CI-021 · Procedural/finality state</text><rect x="1215" y="760" width="250" height="17" rx="8" fill="#e6e0d7"/><rect x="1215" y="760" width="9" height="17" rx="8" fill="#315c7b"/><text x="1480" y="774" font-family="system-ui" font-size="14" fill="#52636a">2</text>
<rect x="80" y="835" width="1440" height="38" rx="12" fill="#102a35"/><text x="100" y="860" font-family="system-ui" font-size="15" fill="#fff">Recursive loop: exact words → use event → restored context → contrary/lawful alternative → dependency review → changed / unchanged decision.</text></svg>