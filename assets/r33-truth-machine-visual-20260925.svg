<rect x="82" y="960" width="1756" height="70" rx="16" fill="#102a35"/>
<text x="112" y="992" font-size="18" fill="#fff">Recursive rule: proposition → ACH/SUE/VA → Wigmore graph → control/money rails → contrary evidence → source review → changed/no-change → reopen dependencies.</text>
<text x="112" y="1019" font-size="15" fill="#c8d9df">Language cues identify where to look; they do not prove deception. Probabilities/LRs are prohibited unless the method and reference data are validated.</text>
</g></svg>