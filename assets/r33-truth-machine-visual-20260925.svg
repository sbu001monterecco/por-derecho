<title id="title">R33 Truth Machine — dynamic source-bound forensic review</title>
<desc id="desc">R33 has 22 pages, 206 text blocks, 276 statement propositions and 482 review records. 276 of 276 statements were scanned, 179 triggered one or more candidate review checks, and zero were automatically promoted to merits findings.</desc>
