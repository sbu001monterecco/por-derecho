<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">Cuatrecasas visual bridge atlas — English</title><desc id="desc">Four illustrative reconstruction panels: overall mandate architecture, Step 4 Matkator execution perimeter, mandate to ETJ execution, and RIC/CNMV warning continuity.</desc><defs><style>.k{font:700 14px Arial,sans-serif;letter-spacing:1.3px;fill:#80621d}.t{font:700 25px Arial,sans-serif;fill:#13252d}.n{font:700 14.2px Arial,sans-serif;fill:#173d42}.s{font:400 10.2px Arial,sans-serif;fill:#556164}.num{font:700 12px Arial,sans-serif;fill:#fff}.f{font:400 10.5px Arial,sans-serif;fill:#667174}.box{fill:#fff;stroke:#cfd7d5}.arrow{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1200" height="1200" fill="#eef2f0"/>
<g><rect x="12" y="12" width="576" height="576" rx="28" fill="#fbfaf6" stroke="#d8dddd" stroke-width="2"/><rect x="12" y="12" width="576" height="12" rx="6" fill="#b98b2e"/><text x="42" y="56" class="k">VISUAL A · OVERALL ARCHITECTURE</text><text x="42" y="92" class="t">How the Cuatrecasas pages connect</text>
