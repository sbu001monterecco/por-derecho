<g><rect x="42" y="484" width="516" height="55" rx="16" class="box"/><circle cx="68" cy="511.5" r="14" fill="#173d42"/><text x="68" y="515.5" class="num" text-anchor="middle">6</text><text x="94" y="504" class="n">Open mandate-coherence question</text><text x="94" y="527" class="s">Fee entitlement does not itself answer coherence.</text></g><text x="42" y="566" class="f">Reserved right to cede ≠ completed cession. Alleged mandate inversion remains</text><text x="42" y="580" class="f">an analytical/legal question, not an adjudicated fact.</text></g>
