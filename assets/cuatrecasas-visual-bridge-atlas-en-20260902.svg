<g><rect x="42" y="484" width="516" height="55" rx="16" class="box"/><circle cx="68" cy="511.5" r="14" fill="#173d42"/><text x="68" y="515.5" class="num" text-anchor="middle">6</text><text x="94" y="504" class="n">Later incentives / FEDER / funding</text><text x="94" y="527" class="s">2021 knowledge cannot include later non-existent records.</text></g><text x="42" y="566" class="f">Continuity is chronological/contextual. Later public-funding evidence must not</text><text x="42" y="580" class="f">be backdated into the 2021 knowledge state.</text></g></svg>