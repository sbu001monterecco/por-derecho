<g><rect x="42" y="476" width="516" height="59" rx="16" class="box"/><circle cx="68" cy="505.5" r="14" fill="#173d42"/><text x="68" y="509.5" class="num" text-anchor="middle">6</text><text x="94" y="498" class="n">RIC / CNMV → later funding</text><text x="94" y="522" class="s">2021 notice continuity; later evidence stays firewalled.</text></g><text x="42" y="566" class="f">Illustrative navigation only. Sources control; fact, inference, allegation and</text><text x="42" y="580" class="f">open question stay separate.</text></g>
