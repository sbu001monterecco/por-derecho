<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc"><title id="title">Project Horizon indicative redevelopment architecture</title><desc id="desc">Abstract programme diagram for an active holiday community, deliberately not the exact private site plan.</desc><rect width="1500" height="900" fill="#f7efe2"/><text x="90" y="90" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="900" letter-spacing="10" fill="#082a3a">REDEVELOPMENT ARCHITECTURE</text><text x="93" y="135" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" letter-spacing="6" fill="#d5a641">REUSE · REPOSITION · REBUILD</text><g transform="translate(105 215)"><rect width="1290" height="550" rx="32" fill="#fffaf1" stroke="#082a3a" stroke-width="7"/><path d="M140 100 C250 35 450 40 555 110 C650 175 830 175 940 100 C1045 28 1165 55 1210 140 L1165 430 C1050 500 920 480 830 430 C720 370 560 385 445 455 C315 535 170 480 95 390Z" fill="#d8dfc4"/><path d="M375 170 C520 110 710 140 805 225 C890 300 1020 292 1100 260 L1070 390 C960 420 865 402 770 345 C660 280 520 300 410 360Z" fill="#4eb3bf" stroke="#fffaf1" stroke-width="11"/><g fill="#fff7e8" stroke="#082a3a" stroke-width="5"><rect x="80" y="80" width="265" height="145" rx="12"/><rect x="940" y="60" width="260" height="155" rx="12"/><rect x="70" y="330" width="300" height="135" rx="12"/><rect x="935" y="350" width="270" height="125" rx="12"/></g><g fill="#d97855" stroke="#082a3a" stroke-width="5"><circle cx="620" cy="145" r="62"/><circle cx="760" cy="135" r="48"/></g><g fill="#607a58" stroke="#082a3a" stroke-width="4"><circle cx="510" cy="455" r="65"/><circle cx="650" cy="468" r="55"/><circle cx="785" cy="458" r="62"/></g><path d="M520 120 H840" stroke="#d5a641" stroke-width="17" stroke-linecap="round"/><g font-family="Arial,Helvetica,sans-serif" fill="#082a3a" font-weight="900"><text x="112" y="130" font-size="18" letter-spacing="3">ACCOMMODATION</text><text x="972" y="112" font-size="18" letter-spacing="3">ACCOMMODATION</text><text x="107" y="383" font-size="18" letter-spacing="3">FOOD · DAILY LIFE</text><text x="980" y="402" font-size="18" letter-spacing="3">BACK OF HOUSE</text><text x="607" y="151" font-size="15" fill="#fffaf1">CLUB</text><text x="727" y="141" font-size="13" fill="#fffaf1">WELLNESS</text><text x="528" y="462" font-size="15">SPORT</text><text x="694" y="474" font-size="13">GARDENS</text><text x="446" y="270" font-size="18" letter-spacing="4" fill="#fffaf1">POOLS · SHADE · WATER · SOCIAL TERRACES</text></g></g><g font-family="Arial,Helvetica,sans-serif"><text x="750" y="820" text-anchor="middle" font-size="18" font-weight="900" letter-spacing="5" fill="#082a3a">ACCOMMODATION → COMMUNITY HEART → POOLS &amp; GARDENS → SPORT &amp; WELLNESS → FOOD &amp; SERVICES</text><text x="750" y="855" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="4" fill="#5e7076">INDICATIVE PROGRAMME ONLY · NOT AN EXACT SITE PLAN · FINAL MASSING SUBJECT TO DILIGENCE AND APPROVALS</text></g></svg>