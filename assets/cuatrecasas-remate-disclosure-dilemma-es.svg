<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">El dilema de transparencia sobre la cesión del remate</title>
  <desc id="desc">Visual documental que separa Aweswell como antigua cliente y entidad facturada, Matkator como deudora cambiaria y judicial y parte ejecutada, y un posible cesionario del remate todavía no identificado.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f252c"/>
      <stop offset="0.62" stop-color="#173e44"/>
      <stop offset="1" stop-color="#72551c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#071419" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#f3d17a"/>
    </marker>
  </defs>

  <rect width="1200" height="1200" rx="32" fill="url(#bg)"/>
  <circle cx="1095" cy="115" r="170" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
  <circle cx="1095" cy="115" r="115" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <text x="70" y="78" fill="#f3d17a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="2.2">CUATRECASAS · ANTIGUA CLIENTE → EJECUCIÓN → POSIBLE TERCERO</text>
  <text x="70" y="133" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700">EL DILEMA DE LA CESIÓN DEL REMATE</text>
  <text x="70" y="178" fill="#dce9e8" font-family="Arial, Helvetica, sans-serif" font-size="23">Aweswell fue la cliente documentada. Matkator no era la deudora de las</text>
  <text x="70" y="210" fill="#dce9e8" font-family="Arial, Helvetica, sans-serif" font-size="23">facturas que muestra la tabla de Cuatrecasas de 2019.</text>

  <g>
    <rect x="65" y="262" width="330" height="308" rx="24" fill="#effaf5"/>
    <rect x="435" y="262" width="330" height="308" rx="24" fill="#fff1ef"/>
    <rect x="805" y="262" width="330" height="308" rx="24" fill="#fff8dc"/>
  </g>

  <text x="92" y="303" fill="#1d5c4a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" letter-spacing="1.1">1 · ANTIGUA CLIENTE / FACTURACIÓN</text>
  <text x="92" y="350" fill="#10262d" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700">AWESWELL LIMITED</text>
  <text x="92" y="382" fill="#35545a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">SOCIEDAD UK · INVERSOR EN ESPAÑA</text>
  <text x="92" y="427" fill="#17363d" font-family="Arial, Helvetica, sans-serif" font-size="15">Cuatrecasas: «nuestro cliente, AWESWELL»</text>
  <text x="92" y="461" fill="#17363d" font-family="Arial, Helvetica, sans-serif" font-size="16">Tabla 2019: facturas emitidas atribuidas</text>
  <text x="92" y="490" fill="#17363d" font-family="Arial, Helvetica, sans-serif" font-size="16">a Aweswell / LPB</text>
  <rect x="92" y="514" width="210" height="35" rx="17" fill="#1d5c4a"/>
  <text x="197" y="538" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">NO MATKATOR</text>

  <text x="462" y="303" fill="#9a332e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" letter-spacing="1.1">2 · POSICIÓN CAMBIARIA / JUDICIAL</text>
  <text x="462" y="350" fill="#10262d" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700">MATKATOR, S.L.</text>
  <text x="462" y="382" fill="#7c302c" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800">DEUDORA DE PAGARÉ / JUDICIAL</text>
  <text x="462" y="413" fill="#7c302c" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800">DEUDORA / PARTE EJECUTADA</text>
  <text x="462" y="455" fill="#17363d" font-family="Arial, Helvetica, sans-serif" font-size="16">Cuatro pagarés → Cambiario 1048/2019</text>
  <text x="462" y="487" fill="#17363d" font-family="Arial, Helvetica, sans-serif" font-size="16">Finca 8584 → adjudicación solicitada</text>
  <text x="462" y="519" fill="#17363d" font-family="Arial, Helvetica, sans-serif" font-size="16">77.840 € imputados; 104.677,72 €</text>
  <text x="462" y="548" fill="#17363d" font-family="Arial, Helvetica, sans-serif" font-size="16">afirmados contra otros bienes</text>

  <text x="832" y="303" fill="#80621d" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" letter-spacing="1.1">3 · RESERVA EXPRESA</text>
  <text x="832" y="347" fill="#10262d" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700">TERCERO NO</text>
  <text x="832" y="382" fill="#10262d" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700">IDENTIFICADO</text>
  <text x="832" y="421" fill="#6f561c" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800">POSIBLE CESIONARIO DEL REMATE</text>
  <text x="832" y="460" fill="#17363d" font-family="Arial, Helvetica, sans-serif" font-size="16">10 feb 2026: Cuatrecasas reservó</text>
  <text x="832" y="489" fill="#17363d" font-family="Arial, Helvetica, sans-serif" font-size="16">expresamente la «cesión del remate</text>
  <text x="832" y="518" fill="#17363d" font-family="Arial, Helvetica, sans-serif" font-size="16">a un tercero».</text>
  <text x="832" y="548" fill="#8c2f2c" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800">SIN CESIONARIO / CESIÓN PROBADOS</text>

  <text x="415" y="423" text-anchor="middle" fill="#f3d17a" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800">→</text>
  <text x="785" y="423" text-anchor="middle" fill="#f3d17a" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800">→</text>

  <text x="70" y="637" fill="#f3d17a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" letter-spacing="1.5">TEORÍA DE JUEGOS · CUATRO RESPUESTAS · UNA SALIDA AUDITABLE</text>
  <text x="70" y="672" fill="#dce9e8" font-family="Arial, Helvetica, sans-serif" font-size="20">Es un dilema de producción documental, no una declaración de concierto.</text>

  <g>
    <rect x="65" y="712" width="255" height="224" rx="20" fill="#ffffff" fill-opacity="0.96"/>
    <rect x="340" y="712" width="255" height="224" rx="20" fill="#ffffff" fill-opacity="0.96"/>
    <rect x="615" y="712" width="255" height="224" rx="20" fill="#ffffff" fill-opacity="0.96"/>
    <rect x="890" y="712" width="255" height="224" rx="20" fill="#ffffff" fill-opacity="0.96"/>
  </g>

  <rect x="88" y="735" width="122" height="31" rx="15" fill="#1d5c4a"/>
  <text x="149" y="757" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800">NINGÚN TERCERO</text>
  <text x="88" y="806" fill="#10262d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800">Certificarlo.</text>
  <text x="88" y="842" fill="#35545a" font-family="Arial, Helvetica, sans-serif" font-size="16">Nadie contemplado,</text>
  <text x="88" y="870" fill="#35545a" font-family="Arial, Helvetica, sans-serif" font-size="16">contactado, negociado,</text>
  <text x="88" y="898" fill="#35545a" font-family="Arial, Helvetica, sans-serif" font-size="16">seleccionado o utilizado.</text>

  <rect x="363" y="735" width="164" height="31" rx="15" fill="#315b72"/>
  <text x="445" y="757" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800">TERCERO INDEPENDIENTE</text>
  <text x="363" y="806" fill="#10262d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800">Conciliarlo.</text>
  <text x="363" y="842" fill="#35545a" font-family="Arial, Helvetica, sans-serif" font-size="16">Receptor / titular real, KYC,</text>
  <text x="363" y="870" fill="#35545a" font-family="Arial, Helvetica, sans-serif" font-size="16">conflicto, precio y crédito</text>
  <text x="363" y="898" fill="#35545a" font-family="Arial, Helvetica, sans-serif" font-size="16">íntegro a la deuda.</text>

  <rect x="638" y="735" width="187" height="31" rx="15" fill="#8a6820"/>
  <text x="731" y="757" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800">CLIENTE / CONECTADO</text>
  <text x="638" y="806" fill="#10262d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800">Explicarlo.</text>
  <text x="638" y="842" fill="#35545a" font-family="Arial, Helvetica, sans-serif" font-size="16">Lealtad a antigua cliente,</text>
  <text x="638" y="870" fill="#35545a" font-family="Arial, Helvetica, sans-serif" font-size="16">conflicto propio, secreto,</text>
  <text x="638" y="898" fill="#35545a" font-family="Arial, Helvetica, sans-serif" font-size="16">barreras, KYC y aprobación.</text>

  <rect x="913" y="735" width="190" height="31" rx="15" fill="#8c2f2c"/>
  <text x="1008" y="757" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800">RESERVADO / SIN RESPUESTA</text>
  <text x="913" y="806" fill="#10262d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800">Indexar la razón.</text>
  <text x="913" y="842" fill="#35545a" font-family="Arial, Helvetica, sans-serif" font-size="16">Categoría legal y control</text>
  <text x="913" y="870" fill="#35545a" font-family="Arial, Helvetica, sans-serif" font-size="16">no privilegiado.</text>
  <text x="913" y="898" fill="#8c2f2c" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800">La brecha sigue. Silencio ≠ prueba.</text>

  <rect x="65" y="976" width="1070" height="96" rx="20" fill="#f3d17a"/>
  <text x="600" y="1017" text-anchor="middle" fill="#10262d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900">UNA SALIDA LEGÍTIMA: LEDGER COMPLETO DE SATISFACCIÓN ÚNICA</text>
  <text x="600" y="1051" text-anchor="middle" fill="#17363d" font-family="Arial, Helvetica, sans-serif" font-size="20">factura → WIP → pagaré → reclamación → crédito → cesión → cobro → saldo</text>

  <text x="70" y="1114" fill="#dce9e8" font-family="Arial, Helvetica, sans-serif" font-size="16">Límite: un pagaré autónomo válido aún puede fundar obligación de Matkator. El registro no prueba cesionario, cesión culminada,</text>
  <text x="70" y="1138" fill="#dce9e8" font-family="Arial, Helvetica, sans-serif" font-size="16">concierto, deuda inválida ni doble cobro. Prueba una reserva que exige respuesta documental.</text>
  <text x="70" y="1173" fill="#f3d17a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">POR DERECHO · ABIERTO A CORRECCIÓN DOCUMENTAL · 24 AGOSTO 2026</text>
</svg>
