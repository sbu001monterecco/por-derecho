<title id="title">JSP and Montelanza: separate authority and property trails</title><desc id="desc">Documented appointments are solid. Alleged majority control, the Community-to-CAM title chain, and the connection to JSP's later estate are dashed and unproved. Montelanza's 2015 to 2018 voluntary liquidation precedes JSP's 2021 insolvency. Hotel association does not establish ownership or opening order.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334c64"/></marker><style>text{font-family:Arial,sans-serif;fill:#172b40}.title{font-size:30px;font-weight:bold}.h{font-size:20px;font-weight:bold}.t{font-size:17px}.s{font-size:15px}.box{fill:#fff;stroke:#46657f;stroke-width:2}.gap{fill:#fff8e8;stroke:#98752d;stroke-width:2;stroke-dasharray:8 5}.solid{fill:none;stroke:#334c64;stroke-width:2.5;marker-end:url(#arrow)}.query{fill:none;stroke:#98752d;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow)}</style></defs>
