<rect x="730" y="310" width="550" height="108" rx="12" class="box"/><text x="750" y="341" class="h">Praxis de Reestructuraciones y Concursal S.L.P.</text><text x="750" y="371" class="t">Appointed insolvency administrator, 21 Jul 2021</text><text x="750" y="398" class="s">Natural representative / current appointment to verify</text><path class="solid" d="M1005 264V310"/>
