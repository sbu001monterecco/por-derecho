<rect x="40" y="748" width="1240" height="115" rx="12" class="box"/><text x="60" y="781" class="h">Five Sun hotels: reported historical association, NOT a proved ownership structure</text><text x="60" y="816" class="t">Sun Park · Sun Royal · Sun Beach · Sun Island · Sun Tropical</text><text x="60" y="846" class="s">Sun Park-first remains Patricia's account pending opening records. The 2022 history also reports earlier JSP divestment.</text>
<rect x="40" y="895" width="1240" height="143" rx="12" fill="#e3ebf2"/><text x="60" y="925" class="h">Three essential distinctions</text><text x="60" y="956" class="t">Shareholder ≠ owner of the company's land. Formal appointee ≠ proven shadow controller.</text><text x="60" y="987" class="t">2015–2018 transactions ≠ acts by administrators appointed in 2021. LPB concurso 36/2012 is separate.</text><text x="60" y="1018" class="s">Sources: BORME 2015-205-35 / 2018-201-35 / 2021-205-35; existing title-research leads; Tourinews 6 May 2022.</text>
