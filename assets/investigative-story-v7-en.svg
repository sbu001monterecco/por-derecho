<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2330" viewBox="0 0 1600 2330"><rect x="0" y="0" width="1600" height="2330" rx="0" fill="#F6F4EF" stroke="#F6F4EF" stroke-width="0"/><rect x="0" y="0" width="1600" height="405" rx="0" fill="#11253D" stroke="#11253D" stroke-width="0"/><rect x="0" y="405" width="1600" height="80" rx="0" fill="#DCECEA" stroke="#DCECEA" stroke-width="0"/><text x="76" y="58" fill="#9FD7D3" font-size="22" font-family="DejaVu Sans" font-weight="700"><tspan x="76" dy="0">POR DERECHO / LPB CONCURSO 36/2012 / INVESTIGATIVE READER</tspan></text><text x="72" y="174" fill="#FFFFFF" font-size="94" font-family="DejaVu Sans" font-weight="700"><tspan x="72" dy="0">WHO PAID</tspan></text><text x="72" y="284" fill="#FFFFFF" font-size="82" font-family="DejaVu Sans" font-weight="700"><tspan x="72" dy="0">LPB’S LAWYER?</tspan></text><text x="78" y="365" fill="#DDECEF" font-size="26" font-family="DejaVu Sans" font-weight="400"><tspan x="78" dy="0">Follow the funded exit, the sale, the defender and the payment decision.</tspan></text><text x="76" y="453" fill="#11253D" font-size="22" font-family="DejaVu Sans" font-weight="700"><tspan x="76" dy="0">GIL MARER · SOLE ALERTADOR ON RECORD</tspan></text><rect x="66" y="513" width="1468" height="201" rx="14" fill="#11253D" stroke="#11253D" stroke-width="0"/><rect x="66" y="513" width="13" height="201" rx="0" fill="#AE552C" stroke="#AE552C" stroke-width="0"/><text x="105" y="565" fill="#9FD7D3" font-size="27" font-family="DejaVu Sans" font-weight="700"><tspan x="105" dy="0">THE PROSECUTORIAL QUESTION</tspan></text><text x="105" y="623" fill="#FFFFFF" font-size="34" font-family="DejaVu Sans" font-weight="700"><tspan x="105" dy="0">Who authorised payment to LPB’s lawyer during an adverse contest,</tspan><tspan x="105" dy="41">and did it affect his independence?</tspan></text><path d="M146 760 L146 1884" stroke="#CFDBDD" stroke-width="9"/><rect x="214" y="742" width="1320" height="218" rx="16" fill="#FFFFFF" stroke="#CFDBDD" stroke-width="2"/><rect x="214" y="742" width="9" height="218" rx="0" fill="#176C72" stroke="#176C72" stroke-width="0"/><circle cx="146" cy="808" r="19" fill="#176C72" stroke="#F6F4EF" stroke-width="7"/><text x="256" y="781" fill="#176C72" font-size="21" font-family="DejaVu Sans" font-weight="700"><tspan x="256" dy="0">01 / 2017–18 / EXIT</tspan></text><text x="256" y="833" fill="#11253D" font-size="30" font-family="DejaVu Sans" font-weight="700"><tspan x="256" dy="0">An owner-led hotel exit takes shape</tspan></text><text x="256" y="883" fill="#192D41" font-size="22" font-family="DejaVu Sans" font-weight="400"><tspan x="256" dy="0">ONA operating terms were signed on 6 June. Buyer and finance routes developed;</tspan><tspan x="256" dy="26">court deposit, Community approval and security still needed completion.</tspan></text><rect x="1210" y="771" width="288" height="160" rx="10" fill="#F0F5F4" stroke="#E2EBEA" stroke-width="1"/><text x="1234" y="808" fill="#176C72" font-size="18" font-family="DejaVu Sans" font-weight="700"><tspan x="1234" dy="0">DEVELOPED ROUTE</tspan></text><text x="1234" y="869" fill="#11253D" font-size="27" font-family="DejaVu Sans" font-weight="700"><tspan x="1234" dy="0">CLOSING OPEN</tspan></text><rect x="214" y="981" width="1320" height="218" rx="16" fill="#FFFFFF" stroke="#CFDBDD" stroke-width="2"/><rect x="214" y="981" width="9" height="218" rx="0" fill="#9C4B32" stroke="#9C4B32" stroke-width="0"/><circle cx="146" cy="1047" r="19" fill="#9C4B32" stroke="#F6F4EF" stroke-width="7"/><text x="256" y="1020" fill="#9C4B32" font-size="21" font-family="DejaVu Sans" font-weight="700"><tspan x="256" dy="0">02 / 7 JUN 2018 / CONTROL</tspan></text><text x="256" y="1072" fill="#11253D" font-size="30" font-family="DejaVu Sans" font-weight="700"><tspan x="256" dy="0">The hotel’s practical control is contested</tspan></text><text x="256" y="1122" fill="#192D41" font-size="22" font-family="DejaVu Sans" font-weight="400"><tspan x="256" dy="0">Gil alleges an access and control change impaired possession, diligence and</tspan><tspan x="256" dy="26">finance. Each act and each route’s actual effect need their own proof.</tspan></text><rect x="1210" y="1010" width="288" height="160" rx="10" fill="#F0F5F4" stroke="#E2EBEA" stroke-width="1"/><text x="1234" y="1047" fill="#9C4B32" font-size="18" font-family="DejaVu Sans" font-weight="700"><tspan x="1234" dy="0">GIL’S ALLEGATION</tspan></text><text x="1234" y="1108" fill="#11253D" font-size="27" font-family="DejaVu Sans" font-weight="700"><tspan x="1234" dy="0">EFFECT OPEN</tspan></text><rect x="214" y="1220" width="1320" height="218" rx="16" fill="#FFFFFF" stroke="#CFDBDD" stroke-width="2"/><rect x="214" y="1220" width="9" height="218" rx="0" fill="#176C72" stroke="#176C72" stroke-width="0"/><circle cx="146" cy="1286" r="19" fill="#176C72" stroke="#F6F4EF" stroke-width="7"/><text x="256" y="1259" fill="#176C72" font-size="21" font-family="DejaVu Sans" font-weight="700"><tspan x="256" dy="0">03 / 28 NOV 2018 / SALE</tspan></text><text x="256" y="1311" fill="#11253D" font-size="30" font-family="DejaVu Sans" font-weight="700"><tspan x="256" dy="0">The administrator sells facilities separately</tspan></text><text x="256" y="1361" fill="#192D41" font-size="22" font-family="DejaVu Sans" font-weight="400"><tspan x="256" dy="0">His report records a CAM cheque for disputed LPB assets entering an LPB account</tspan><tspan x="256" dy="26">under his control. The court later refused deed convalidation.</tspan></text><rect x="1210" y="1249" width="288" height="160" rx="10" fill="#F0F5F4" stroke="#E2EBEA" stroke-width="1"/><text x="1234" y="1286" fill="#176C72" font-size="18" font-family="DejaVu Sans" font-weight="700"><tspan x="1234" dy="0">AC REPORTED</tspan></text><text x="1234" y="1347" fill="#11253D" font-size="27" font-family="DejaVu Sans" font-weight="700"><tspan x="1234" dy="0">BUYER FUNDS</tspan></text><rect x="214" y="1459" width="1320" height="218" rx="16" fill="#FFFFFF" stroke="#CFDBDD" stroke-width="2"/><rect x="214" y="1459" width="9" height="218" rx="0" fill="#176C72" stroke="#176C72" stroke-width="0"/><circle cx="146" cy="1525" r="19" fill="#176C72" stroke="#F6F4EF" stroke-width="7"/><text x="256" y="1498" fill="#176C72" font-size="21" font-family="DejaVu Sans" font-weight="700"><tspan x="256" dy="0">04 / JAN–OCT 2019 / COURT</tspan></text><text x="256" y="1550" fill="#11253D" font-size="30" font-family="DejaVu Sans" font-weight="700"><tspan x="256" dy="0">LPB seeks the deed; the court refuses validation</tspan></text><text x="256" y="1600" fill="#192D41" font-size="22" font-family="DejaVu Sans" font-weight="400"><tspan x="256" dy="0">A distinct deed request was filed on 10 January; two appeals were admitted. On</tspan><tspan x="256" dy="26">24 October the court refused convalidation.</tspan></text><rect x="1210" y="1488" width="288" height="160" rx="10" fill="#F0F5F4" stroke="#E2EBEA" stroke-width="1"/><text x="1234" y="1525" fill="#176C72" font-size="18" font-family="DejaVu Sans" font-weight="700"><tspan x="1234" dy="0">FILED + ORDER</tspan></text><text x="1234" y="1586" fill="#11253D" font-size="27" font-family="DejaVu Sans" font-weight="700"><tspan x="1234" dy="0">SEPARATE ACTS</tspan></text><rect x="214" y="1698" width="1320" height="218" rx="16" fill="#FFFFFF" stroke="#CFDBDD" stroke-width="2"/><rect x="214" y="1698" width="9" height="218" rx="0" fill="#56538A" stroke="#56538A" stroke-width="0"/><circle cx="146" cy="1764" r="19" fill="#56538A" stroke="#F6F4EF" stroke-width="7"/><text x="256" y="1737" fill="#56538A" font-size="21" font-family="DejaVu Sans" font-weight="700"><tspan x="256" dy="0">05 / JUL 2020 / FEE</tspan></text><text x="256" y="1789" fill="#11253D" font-size="30" font-family="DejaVu Sans" font-weight="700"><tspan x="256" dy="0">Parrilla appears on the AC’s paid list</tspan></text><text x="256" y="1839" fill="#192D41" font-size="22" font-family="DejaVu Sans" font-weight="400"><tspan x="256" dy="0">The administrator’s 2021 report lists a July 2020 lawyer fee as paid. Gil disputes</tspan><tspan x="256" dy="26">its authority and effect on independent representation.</tspan></text><rect x="1210" y="1727" width="288" height="160" rx="10" fill="#F0F5F4" stroke="#E2EBEA" stroke-width="1"/><text x="1234" y="1764" fill="#56538A" font-size="18" font-family="DejaVu Sans" font-weight="700"><tspan x="1234" dy="0">AC REPORTED</tspan></text><text x="1234" y="1825" fill="#11253D" font-size="27" font-family="DejaVu Sans" font-weight="700"><tspan x="1234" dy="0">COUNSEL FEE</tspan></text><rect x="66" y="1958" width="1468" height="166" rx="13" fill="#FFF0E6" stroke="#E4BBA1" stroke-width="2"/><text x="100" y="2006" fill="#AE552C" font-size="25" font-family="DejaVu Sans" font-weight="700"><tspan x="100" dy="0">THE ISSUE IS CONTROL AND LOYALTY, NOT THE SUM</tspan></text><text x="100" y="2055" fill="#604132" font-size="23" font-family="DejaVu Sans" font-weight="400"><tspan x="100" dy="0">Test who authorised the fee, whether it served LPB, the administrator’s opposing interests, the lawyer’s independence</tspan><tspan x="100" dy="28">and the effect on protective steps. The bank link and earlier incentive remain unproved.</tspan></text><text x="77" y="2165" fill="#526476" font-size="21" font-family="DejaVu Sans" font-weight="400"><tspan x="77" dy="0">Judicial decisions, including the corrective 2019 order, have their own lane. This graphic does not claim that the judge ordered or</tspan><tspan x="77" dy="25">received the fee.</tspan></text><rect x="0" y="2240" width="1600" height="90" rx="0" fill="#11253D" stroke="#11253D" stroke-width="0"/><text x="74" y="2272" fill="#DAE7E7" font-size="18" font-family="DejaVu Sans" font-weight="400"><tspan x="74" dy="0">RECORD · AC liquidation and paid-credit reports; filed request; court order. ALLEGATION · Gil Marer. OPEN · authority, independence, bank trail and effects.</tspan></text></svg>