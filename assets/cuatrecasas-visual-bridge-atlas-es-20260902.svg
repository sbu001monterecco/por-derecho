<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">Atlas visual de puentes Cuatrecasas — español</title><desc id="desc">Cuatro paneles de reconstrucción ilustrativa: arquitectura general del mandato, perímetro del Paso 4 frente a Matkator, mandato a ejecución ETJ y continuidad de avisos RIC/CNMV.</desc><defs><style>.k{font:700 14px Arial,sans-serif;letter-spacing:1.3px;fill:#80621d}.t{font:700 25px Arial,sans-serif;fill:#13252d}.n{font:700 14.2px Arial,sans-serif;fill:#173d42}.s{font:400 10.2px Arial,sans-serif;fill:#556164}.num{font:700 12px Arial,sans-serif;fill:#fff}.f{font:400 10.5px Arial,sans-serif;fill:#667174}.box{fill:#fff;stroke:#cfd7d5}.arrow{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1200" height="1200" fill="#eef2f0"/>
<g><rect x="12" y="12" width="576" height="576" rx="28" fill="#fbfaf6" stroke="#d8dddd" stroke-width="2"/><rect x="12" y="12" width="576" height="12" rx="6" fill="#b98b2e"/><text x="42" y="56" class="k">VISUAL A · ARQUITECTURA GENERAL</text><text x="42" y="92" class="t">Cómo se conectan las páginas de</text><text x="42" y="120" class="t">Cuatrecasas</text>
<g><rect x="42" y="164" width="516" height="55" rx="16" class="box"/><circle cx="68" cy="191.5" r="14" fill="#173d42"/><text x="68" y="195.5" class="num" text-anchor="middle">1</text><text x="94" y="184" class="n">Mandato Aweswell</text><text x="94" y="207" class="s">Gateway documentado del cliente/grupo.</text></g><path d="M290 221 L300 230 L310 221" class="arrow" stroke="#b98b2e"/>
<g><rect x="42" y="228" width="516" height="55" rx="16" class="box"/><circle cx="68" cy="255.5" r="14" fill="#173d42"/><text x="68" y="259.5" class="num" text-anchor="middle">2</text><text x="94" y="248" class="n">Perímetro Sun Park / recuperación hotelera</text><text x="94" y="271" class="s">Mandato amplio de protección, financiación y recuperación.</text></g><path d="M290 285 L300 294 L310 285" class="arrow" stroke="#b98b2e"/>
<g><rect x="42" y="292" width="516" height="55" rx="16" class="box"/><circle cx="68" cy="319.5" r="14" fill="#173d42"/><text x="68" y="323.5" class="num" text-anchor="middle">3</text><text x="94" y="312" class="n">Concurso LPB 36/2012</text><text x="94" y="335" class="s">Un workstream — no todo el mandato.</text></g><path d="M290 349 L300 358 L310 349" class="arrow" stroke="#b98b2e"/>
<g><rect x="42" y="356" width="516" height="55" rx="16" class="box"/><circle cx="68" cy="383.5" r="14" fill="#173d42"/><text x="68" y="387.5" class="num" text-anchor="middle">4</text><text x="94" y="376" class="n">Honorarios / pagarés / Matkator</text><text x="94" y="399" class="s">Los instrumentos de honorarios intersectan otra sociedad.</text></g><path d="M290 413 L300 422 L310 413" class="arrow" stroke="#b98b2e"/>
<g><rect x="42" y="420" width="516" height="55" rx="16" class="box"/><circle cx="68" cy="447.5" r="14" fill="#173d42"/><text x="68" y="451.5" class="num" text-anchor="middle">5</text><text x="94" y="440" class="n">ETJ 163/2020</text><text x="94" y="463" class="s">Matkator ejecutada; finca 8.584 = remate actual.</text></g><path d="M290 477 L300 486 L310 477" class="arrow" stroke="#b98b2e"/>
<g><rect x="42" y="484" width="516" height="55" rx="16" class="box"/><circle cx="68" cy="511.5" r="14" fill="#173d42"/><text x="68" y="515.5" class="num" text-anchor="middle">6</text><text x="94" y="504" class="n">RIC / CNMV → financiación posterior</text><text x="94" y="527" class="s">Aviso 2021; la evidencia posterior queda bajo cortafuegos.</text></g><text x="42" y="566" class="f">Sólo navegación ilustrativa. Mandan las fuentes; hecho, inferencia, alegación</text><text x="42" y="580" class="f">y pregunta abierta siguen separados.</text></g>
<g transform="translate(600,0)"><rect x="12" y="12" width="576" height="576" rx="28" fill="#f7fbf8" stroke="#d8dddd" stroke-width="2"/><rect x="12" y="12" width="576" height="12" rx="6" fill="#1d5c4a"/><text x="42" y="56" class="k">VISUAL B · PERÍMETRO DEL PASO 4</text><text x="42" y="92" class="t">Qué puede — y qué no puede —</text><text x="42" y="120" class="t">alcanzar el Paso 4</text>
<g><rect x="42" y="164" width="516" height="86" rx="16" class="box"/><circle cx="68" cy="207" r="14" fill="#173d42"/><text x="68" y="211" class="num" text-anchor="middle">1</text><text x="94" y="186" class="n">Finca 8.584</text><text x="94" y="236" class="s">Objeto actual controlado de remate/adjudicación ETJ.</text></g><path d="M290 252 L300 261 L310 252" class="arrow" stroke="#1d5c4a"/>
<g><rect x="42" y="259" width="516" height="86" rx="16" class="box"/><circle cx="68" cy="302" r="14" fill="#173d42"/><text x="68" y="306" class="num" text-anchor="middle">2</text><text x="94" y="281" class="n">Finca 8.588</text><text x="94" y="331" class="s">Propiedad histórica; no consta como subasta ETJ actual.</text></g><path d="M290 347 L300 356 L310 347" class="arrow" stroke="#1d5c4a"/>
<g><rect x="42" y="354" width="516" height="86" rx="16" class="box"/><circle cx="68" cy="397" r="14" fill="#173d42"/><text x="68" y="401" class="num" text-anchor="middle">3</text><text x="94" y="376" class="n">Otros activos / derechos de Matkator</text><text x="94" y="426" class="s">Sólo si se prueban existencia/título, saldo y embargabilidad.</text></g><path d="M290 442 L300 451 L310 442" class="arrow" stroke="#1d5c4a"/>
<g><rect x="42" y="449" width="516" height="86" rx="16" class="box"/><circle cx="68" cy="492" r="14" fill="#173d42"/><text x="68" y="496" class="num" text-anchor="middle">4</text><text x="94" y="471" class="n">Cortafuegos corporativo Aweswell</text><text x="94" y="521" class="s">Gateway económico; Aweswell no es la ejecutada.</text></g><text x="42" y="566" class="f">Titularidad histórica ≠ titularidad actual. Potencial sobre el deudor ≠ prueba</text><text x="42" y="580" class="f">de otros activos hoy embargados o subastados.</text></g>
<g transform="translate(0,600)"><rect x="12" y="12" width="576" height="576" rx="28" fill="#fbfaf6" stroke="#d8dddd" stroke-width="2"/><rect x="12" y="12" width="576" height="12" rx="6" fill="#173d42"/><text x="42" y="56" class="k">VISUAL C · MANDATO → ETJ</text><text x="42" y="92" class="t">Del mandato del antiguo cliente a</text><text x="42" y="120" class="t">la ejecución frente a Matkator</text>
<g><rect x="42" y="164" width="516" height="55" rx="16" class="box"/><circle cx="68" cy="191.5" r="14" fill="#173d42"/><text x="68" y="195.5" class="num" text-anchor="middle">1</text><text x="94" y="184" class="n">Relación documentada con el cliente</text><text x="94" y="207" class="s">Registro del mandato Aweswell / grupo británico.</text></g><path d="M290 221 L300 230 L310 221" class="arrow" stroke="#173d42"/>
<g><rect x="42" y="228" width="516" height="55" rx="16" class="box"/><circle cx="68" cy="255.5" r="14" fill="#173d42"/><text x="68" y="259.5" class="num" text-anchor="middle">2</text><text x="94" y="248" class="n">Mandato profesional integrado</text><text x="94" y="271" class="s">Historia de hotel, concurso, financiación y recuperación.</text></g><path d="M290 285 L300 294 L310 285" class="arrow" stroke="#173d42"/>
<g><rect x="42" y="292" width="516" height="55" rx="16" class="box"/><circle cx="68" cy="319.5" r="14" fill="#173d42"/><text x="68" y="323.5" class="num" text-anchor="middle">3</text><text x="94" y="312" class="n">Facturas / WIP / pagarés</text><text x="94" y="335" class="s">Hito de instrumentos de honorarios: 22 nov 2018.</text></g><path d="M290 349 L300 358 L310 349" class="arrow" stroke="#173d42"/>
<g><rect x="42" y="356" width="516" height="55" rx="16" class="box"/><circle cx="68" cy="383.5" r="14" fill="#173d42"/><text x="68" y="387.5" class="num" text-anchor="middle">4</text><text x="94" y="376" class="n">Matkator como ejecutada</text><text x="94" y="399" class="s">Hitos 2019 de activos y propiedad del grupo.</text></g><path d="M290 413 L300 422 L310 413" class="arrow" stroke="#173d42"/>
<g><rect x="42" y="420" width="516" height="55" rx="16" class="box"/><circle cx="68" cy="447.5" r="14" fill="#173d42"/><text x="68" y="451.5" class="num" text-anchor="middle">5</text><text x="94" y="440" class="n">Solicitud de adjudicación 17 oct 2024</text><text x="94" y="463" class="s">Solicitud al 70%; reserva de ceder el remate.</text></g><path d="M290 477 L300 486 L310 477" class="arrow" stroke="#173d42"/>
<g><rect x="42" y="484" width="516" height="55" rx="16" class="box"/><circle cx="68" cy="511.5" r="14" fill="#173d42"/><text x="68" y="515.5" class="num" text-anchor="middle">6</text><text x="94" y="504" class="n">Pregunta abierta de coherencia del mandato</text><text x="94" y="527" class="s">El derecho al cobro no resuelve por sí solo la coherencia.</text></g><text x="42" y="566" class="f">Reserva de ceder ≠ cesión consumada. La inversión del mandato alegada sigue</text><text x="42" y="580" class="f">siendo cuestión analítica/jurídica, no hecho adjudicado.</text></g>
<g transform="translate(600,600)"><rect x="12" y="12" width="576" height="576" rx="28" fill="#fffaf0" stroke="#d8dddd" stroke-width="2"/><rect x="12" y="12" width="576" height="12" rx="6" fill="#80621d"/><text x="42" y="56" class="k">VISUAL D · CONTINUIDAD RIC / CNMV</text><text x="42" y="92" class="t">Continuidad del mandato hacia los</text><text x="42" y="120" class="t">avisos RIC / CNMV</text>
<g><rect x="42" y="164" width="516" height="55" rx="16" class="box"/><circle cx="68" cy="191.5" r="14" fill="#173d42"/><text x="68" y="195.5" class="num" text-anchor="middle">1</text><text x="94" y="184" class="n">Mandato Sun Park preexistente</text><text x="94" y="207" class="s">La relación profesional ya existía.</text></g><path d="M290 221 L300 230 L310 221" class="arrow" stroke="#80621d"/>
<g><rect x="42" y="228" width="516" height="55" rx="16" class="box"/><circle cx="68" cy="255.5" r="14" fill="#173d42"/><text x="68" y="259.5" class="num" text-anchor="middle">2</text><text x="94" y="248" class="n">Aviso directo 8 mar 2021</text><text x="94" y="271" class="s">Investigación CNMV + anexos RICPE/CNMV preservados.</text></g><path d="M290 285 L300 294 L310 285" class="arrow" stroke="#80621d"/>
<g><rect x="42" y="292" width="516" height="55" rx="16" class="box"/><circle cx="68" cy="319.5" r="14" fill="#173d42"/><text x="68" y="323.5" class="num" text-anchor="middle">3</text><text x="94" y="312" class="n">Comunicaciones 17 mar 2021</text><text x="94" y="335" class="s">Hito de nota de voz y mensaje escrito.</text></g><path d="M290 349 L300 358 L310 349" class="arrow" stroke="#80621d"/>
<g><rect x="42" y="356" width="516" height="55" rx="16" class="box"/><circle cx="68" cy="383.5" r="14" fill="#173d42"/><text x="68" y="387.5" class="num" text-anchor="middle">4</text><text x="94" y="376" class="n">Registro RIC / CNMV 2021</text><text x="94" y="399" class="s">Aviso = evidencia de comunicación, no prueba causal.</text></g><path d="M290 413 L300 422 L310 413" class="arrow" stroke="#80621d"/>
<g><rect x="42" y="420" width="516" height="55" rx="16" class="box"/><circle cx="68" cy="447.5" r="14" fill="#173d42"/><text x="68" y="451.5" class="num" text-anchor="middle">5</text><text x="94" y="440" class="n">Escalada 2025 → 6–7 mar 2026</text><text x="94" y="463" class="s">Eventos separados de compliance y re-notificación.</text></g><path d="M290 477 L300 486 L310 477" class="arrow" stroke="#80621d"/>
<g><rect x="42" y="484" width="516" height="55" rx="16" class="box"/><circle cx="68" cy="511.5" r="14" fill="#173d42"/><text x="68" y="515.5" class="num" text-anchor="middle">6</text><text x="94" y="504" class="n">Incentivos / FEDER / fondos posteriores</text><text x="94" y="527" class="s">2021 no puede incluir conocimiento de registros aún inexistentes.</text></g><text x="42" y="566" class="f">Continuidad cronológica/contextual. La evidencia posterior de fondos públicos</text><text x="42" y="580" class="f">no debe retrotraerse al conocimiento de 2021.</text></g></svg>