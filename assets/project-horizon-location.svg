<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc"><title id="title">Project Horizon public geography</title><desc id="desc">Schematic location diagram showing Canary Islands, Tenerife and the municipality of Adeje without an exact site or map pin.</desc><rect width="1500" height="900" fill="#f7efe2"/><path d="M0 665 C270 585 510 650 760 605 C1010 558 1280 615 1500 540 V900 H0Z" fill="#0d536a"/><g fill="#cfb776" stroke="#082a3a" stroke-width="5"><ellipse cx="185" cy="290" rx="62" ry="28" transform="rotate(-18 185 290)"/><ellipse cx="302" cy="337" rx="54" ry="24" transform="rotate(12 302 337)"/><ellipse cx="407" cy="280" rx="33" ry="59" transform="rotate(28 407 280)"/><ellipse cx="496" cy="365" rx="31" ry="56" transform="rotate(14 496 365)"/><ellipse cx="605" cy="309" rx="24" ry="48" transform="rotate(20 605 309)"/><ellipse cx="686" cy="245" rx="19" ry="37" transform="rotate(21 686 245)"/><ellipse cx="763" cy="340" rx="17" ry="31" transform="rotate(8 763 340)"/></g><text x="90" y="150" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="900" letter-spacing="5" fill="#d5a641">CANARY ISLANDS</text><path d="M445 272 C475 208 535 173 617 168 C696 164 760 212 765 296 C772 396 704 474 620 496 C526 520 445 459 427 374 C419 335 425 300 445 272Z" fill="#fffaf1" stroke="#082a3a" stroke-width="8"/><path d="M490 395 C532 428 579 443 623 437 C662 432 697 414 724 386 C702 446 662 478 616 490 C561 504 514 483 478 450Z" fill="#607a58"/><text x="598" y="333" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="51" font-weight="900" letter-spacing="8" fill="#082a3a">TENERIFE</text><text x="603" y="541" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" letter-spacing="4" fill="#607a58">MUNICIPALITY OF ADEJE · PUBLIC CONTEXT ONLY</text><path d="M786 330 H1055" stroke="#d5a641" stroke-width="7"/><path d="M1025 303 L1060 330 L1025 357" fill="none" stroke="#d5a641" stroke-width="7"/><g transform="translate(1100 200)"><rect width="320" height="280" rx="22" fill="#082a3a"/><text x="30" y="65" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" letter-spacing="3" fill="#d5a641">PUBLIC POSITION</text><text x="30" y="112" font-family="Georgia,serif" font-size="31" font-weight="700" fill="#fffaf1">South-West Tenerife</text><text x="30" y="151" font-family="Georgia,serif" font-size="25" fill="#fffaf1">Municipality of Adeje</text><text x="30" y="205" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#dce9e6">Private coastal redevelopment</text><text x="30" y="230" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#dce9e6">opportunity. No map pin, parcel</text><text x="30" y="255" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#dce9e6">boundary or exact location shown.</text></g><path d="M0 665 C360 590 650 660 955 608 C1170 571 1350 582 1500 540" fill="none" stroke="#74b8b4" stroke-width="10" opacity=".6"/><text x="750" y="820" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="900" letter-spacing="8" fill="#fffaf1">ATLANTIC OCEAN</text><text x="750" y="858" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#d6e7e5">SCHEMATIC LOCATION DIAGRAM · NOT TO SCALE</text></svg>