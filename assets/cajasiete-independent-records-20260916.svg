<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Cajasiete · expedientes y verificación independiente</title><desc id="desc">Composición documental con retratos canónicos exactos de José Daniel Acosta Matos, Laura Patricia Acosta Matos y Francisco Mario Matos Matas. Las líneas representan relaciones documentales en fechas distintas y no prueban coordinación ni conducta ilícita.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102b37"/><stop offset="1" stop-color="#22596a"/></linearGradient><clipPath id="p1"><rect x="210" y="250" width="300" height="300" rx="22"/></clipPath><clipPath id="p2"><rect x="650" y="250" width="300" height="300" rx="22"/></clipPath><clipPath id="p3"><rect x="1090" y="250" width="300" height="300" rx="22"/></clipPath></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="80" y="90" fill="#9edbea" font-family="Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="4">POR DERECHO · PROJECT SUN ROCK · 16 SEP 2026</text><text x="80" y="160" fill="#fff" font-family="Arial,sans-serif" font-size="58" font-weight="800">CAJASIETE · EXPEDIENTES Y VERIFICACIÓN</text><text x="80" y="215" fill="#f5d070" font-family="Arial,sans-serif" font-size="34" font-weight="700">SI TODO FUE INDEPENDIENTE, QUE COINCIDAN LOS ARCHIVOS.</text><rect x="190" y="230" width="340" height="390" rx="28" fill="#fff" opacity=".98"/><rect x="630" y="230" width="340" height="390" rx="28" fill="#fff" opacity=".98"/><rect x="1070" y="230" width="340" height="390" rx="28" fill="#fff" opacity=".98"/><image href="https://gitlab.com/por-derecho/por-derecho-setup-or-gitlab-setup/-/raw/ecb22044dfa3c60af57ed23dbb6a5f433f444cdd/assets/actors/jose-daniel-acosta-matos-user-supplied-07sep2026.jpg" x="210" y="250" width="300" height="300" preserveAspectRatio="xMidYMid slice" clip-path="url(#p1)"/><image href="https://gitlab.com/por-derecho/por-derecho-setup-or-gitlab-setup/-/raw/ecb22044dfa3c60af57ed23dbb6a5f433f444cdd/assets/actors/laura-patricia-acosta-matos-user-supplied-07sep2026.jpg" x="650" y="250" width="300" height="300" preserveAspectRatio="xMidYMid slice" clip-path="url(#p2)"/><image href="https://gitlab.com/por-derecho/por-derecho-setup-or-gitlab-setup/-/raw/ecb22044dfa3c60af57ed23dbb6a5f433f444cdd/assets/actors/francisco-mario-matos-matas.jpg" x="1090" y="250" width="300" height="300" preserveAspectRatio="xMidYMid slice" clip-path="url(#p3)"/><text x="360" y="590" text-anchor="middle" fill="#18313b" font-family="Arial,sans-serif" font-size="25" font-weight="700">JOSÉ DANIEL ACOSTA MATOS</text><text x="800" y="590" text-anchor="middle" fill="#18313b" font-family="Arial,sans-serif" font-size="25" font-weight="700">LAURA PATRICIA ACOSTA MATOS</text><text x="1240" y="590" text-anchor="middle" fill="#18313b" font-family="Arial,sans-serif" font-size="25" font-weight="700">FRANCISCO MARIO MATOS MATAS</text><path d="M530 430 H630 M970 430 H1070" stroke="#f5d070" stroke-width="6" stroke-dasharray="14 12"/><rect x="85" y="660" width="1430" height="180" rx="24" fill="#fff" opacity=".97"/><text x="120" y="718" fill="#16313d" font-family="Arial,sans-serif" font-size="28" font-weight="800">9,776 M€  →  25,647 M€  →  hasta 49,793 M€</text><text x="120" y="762" fill="#425f69" font-family="Arial,sans-serif" font-size="22">Fechas, perímetros y metodologías diferentes. No sumar. No equiparar. Conciliar.</text><text x="120" y="808" fill="#8b4e22" font-family="Arial,sans-serif" font-size="21" font-weight="700">PREGUNTA: ¿qué título, valoración, información y controles sostuvieron cada decisión?</text><text x="80" y="895" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">LÍNEAS = RELACIONES DOCUMENTALES EN FECHAS DISTINTAS · NO PRUEBAN COORDINACIÓN, CONOCIMIENTO COMÚN NI CONDUCTA ILÍCITA.</text><text x="80" y="940" fill="#c9dde4" font-family="Arial,sans-serif" font-size="18">Retratos: activos canónicos exactos del repositorio; sólo recorte proporcional y colocación. La composición no es una fotografía de hechos.</text></svg>