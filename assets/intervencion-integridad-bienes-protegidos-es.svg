<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Hito institucional documentado — Intervención General, 24 febrero 2026</title><desc id="desc">La Comisión para Integridad Pública y Lucha contra la Corrupción examinó una comunicación y acordó su traslado anonimizado a Justicia en relación con bienes bajo tutela judicial o concursal.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1b28"/><stop offset="1" stop-color="#102b3a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter></defs><rect width="1600" height="900" rx="36" fill="url(#bg)"/><rect x="28" y="28" width="1544" height="844" rx="28" fill="none" stroke="#d3a13c" stroke-width="3"/><rect x="42" y="42" width="1516" height="816" rx="24" fill="none" stroke="#d3a13c" stroke-width="1" opacity=".75"/><g fill="#d9aa4a" font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="800" y="92" font-size="34" font-weight="700" letter-spacing="8">HITO INSTITUCIONAL DOCUMENTADO</text><line x1="110" x2="420" y1="82" y2="82" stroke="#d3a13c"/><line x1="1180" x2="1490" y1="82" y2="82" stroke="#d3a13c"/></g><g font-family="Georgia,'Times New Roman',serif" text-anchor="middle"><circle cx="175" cy="225" r="72" fill="none" stroke="#d3a13c" stroke-width="4"/><text x="175" y="248" fill="#d9aa4a" font-size="78">1</text><text x="175" y="390" fill="#fff" font-size="132">24</text><text x="175" y="442" fill="#fff" font-size="42" font-weight="700">FEBRERO</text><text x="175" y="498" fill="#fff" font-size="44" font-weight="700">2026</text><text x="495" y="252" fill="#d3a13c" font-size="88">›</text><circle cx="800" cy="225" r="72" fill="none" stroke="#d3a13c" stroke-width="4"/><text x="800" y="248" fill="#d9aa4a" font-size="78">2</text><text x="800" y="385" fill="#fff" font-size="44" font-weight="700"><tspan x="800">Comisión para</tspan><tspan x="800" dy="58">Integridad Pública</tspan><tspan x="800" dy="58">y Lucha contra</tspan><tspan x="800" dy="58">la Corrupción</tspan></text><text x="1110" y="252" fill="#d3a13c" font-size="88">›</text><circle cx="1280" cy="225" r="72" fill="none" stroke="#d3a13c" stroke-width="4"/><text x="1280" y="248" fill="#d9aa4a" font-size="78">3</text><text x="1280" y="390" fill="#fff" font-size="44" font-weight="700"><tspan x="1280">bienes bajo</tspan><tspan x="1280" dy="58">tutela judicial</tspan><tspan x="1280" dy="58">o concursal</tspan></text></g><line x1="90" x2="1510" y1="580" y2="580" stroke="#d3a13c" stroke-width="2"/><g fill="#fff" font-family="Georgia,'Times New Roman',serif" font-size="31"><text x="120" y="635"><tspan x="120">La Intervención General dejó constancia de que la Comisión examinó la comunicación</tspan><tspan x="120" dy="44">el 24/02/2026 y acordó su traslado anonimizado a la Viceconsejería de Justicia, en particular</tspan><tspan x="120" dy="44">por la posibilidad comunicada de disposición material o alzamiento de bienes bajo tutela judicial</tspan><tspan x="120" dy="44">o concursal sin las debidas autorizaciones.</tspan></text></g><rect x="90" y="795" width="1420" height="68" rx="10" fill="#0b2232" stroke="#d3a13c" stroke-width="1" opacity=".98"/><text x="120" y="838" fill="#d9aa4a" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Fuente:</text><text x="235" y="838" fill="#fff" font-family="Georgia,'Times New Roman',serif" font-size="27">respuesta firmada de la Intervención General, 05/03/2026.</text><text x="1490" y="838" fill="#b9c4ca" font-family="Arial,Helvetica,sans-serif" font-size="17" text-anchor="end">Acredita examen y traslado; no una resolución de fondo.</text></svg>