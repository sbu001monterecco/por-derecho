<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2330" viewBox="0 0 1600 2330"><rect x="0" y="0" width="1600" height="2330" rx="0" fill="#F6F4EF" stroke="#F6F4EF" stroke-width="0"/><rect x="0" y="0" width="1600" height="405" rx="0" fill="#11253D" stroke="#11253D" stroke-width="0"/><rect x="0" y="405" width="1600" height="80" rx="0" fill="#DCECEA" stroke="#DCECEA" stroke-width="0"/><text x="76" y="58" fill="#9FD7D3" font-size="22" font-family="DejaVu Sans" font-weight="700"><tspan x="76" dy="0">POR DERECHO / CONCURSO LPB 36/2012 / LECTOR DE INVESTIGACIÓN</tspan></text><text x="72" y="174" fill="#FFFFFF" font-size="94" font-family="DejaVu Sans" font-weight="700"><tspan x="72" dy="0">¿QUIÉN PAGÓ</tspan></text><text x="72" y="284" fill="#FFFFFF" font-size="82" font-family="DejaVu Sans" font-weight="700"><tspan x="72" dy="0">AL LETRADO?</tspan></text><text x="78" y="365" fill="#DDECEF" font-size="26" font-family="DejaVu Sans" font-weight="400"><tspan x="78" dy="0">Siga la salida financiada, la venta, la defensa y la decisión de pago.</tspan></text><text x="76" y="453" fill="#11253D" font-size="22" font-family="DejaVu Sans" font-weight="700"><tspan x="76" dy="0">GIL MARER · ÚNICO ALERTADOR QUE CONSTA EN EL EXPEDIENTE</tspan></text><rect x="66" y="513" width="1468" height="201" rx="14" fill="#11253D" stroke="#11253D" stroke-width="0"/><rect x="66" y="513" width="13" height="201" rx="0" fill="#AE552C" stroke="#AE552C" stroke-width="0"/><text x="105" y="565" fill="#9FD7D3" font-size="27" font-family="DejaVu Sans" font-weight="700"><tspan x="105" dy="0">LA PREGUNTA PENAL Y FISCAL</tspan></text><text x="105" y="623" fill="#FFFFFF" font-size="31" font-family="DejaVu Sans" font-weight="700"><tspan x="105" dy="0">¿Quién autorizó pagar al letrado de LPB en un conflicto adverso y afectó ello</tspan><tspan x="105" dy="37">a su independencia?</tspan></text><path d="M146 760 L146 1884" stroke="#CFDBDD" stroke-width="9"/><rect x="214" y="742" width="1320" height="218" rx="16" fill="#FFFFFF" stroke="#CFDBDD" stroke-width="2"/><rect x="214" y="742" width="9" height="218" rx="0" fill="#176C72" stroke="#176C72" stroke-width="0"/><circle cx="146" cy="808" r="19" fill="#176C72" stroke="#F6F4EF" stroke-width="7"/><text x="256" y="781" fill="#176C72" font-size="21" font-family="DejaVu Sans" font-weight="700"><tspan x="256" dy="0">01 / 2017–18 / SALIDA</tspan></text><text x="256" y="833" fill="#11253D" font-size="28" font-family="DejaVu Sans" font-weight="700"><tspan x="256" dy="0">Toma forma la salida impulsada por los titulares</tspan></text><text x="256" y="883" fill="#192D41" font-size="21" font-family="DejaVu Sans" font-weight="400"><tspan x="256" dy="0">Se firmó el acuerdo operativo con ONA el 6 de junio. Avanzaron vías de compra y</tspan><tspan x="256" dy="25">financiación; depósito judicial, aprobación comunitaria y garantías exigían cierre.</tspan></text><rect x="1210" y="771" width="288" height="160" rx="10" fill="#F0F5F4" stroke="#E2EBEA" stroke-width="1"/><text x="1234" y="808" fill="#176C72" font-size="18" font-family="DejaVu Sans" font-weight="700"><tspan x="1234" dy="0">VÍA DESARROLLADA</tspan></text><text x="1234" y="869" fill="#11253D" font-size="22" font-family="DejaVu Sans" font-weight="700"><tspan x="1234" dy="0">CIERRE ABIERTO</tspan></text><rect x="214" y="981" width="1320" height="218" rx="16" fill="#FFFFFF" stroke="#CFDBDD" stroke-width="2"/><rect x="214" y="981" width="9" height="218" rx="0" fill="#9C4B32" stroke="#9C4B32" stroke-width="0"/><circle cx="146" cy="1047" r="19" fill="#9C4B32" stroke="#F6F4EF" stroke-width="7"/><text x="256" y="1020" fill="#9C4B32" font-size="21" font-family="DejaVu Sans" font-weight="700"><tspan x="256" dy="0">02 / 7 JUN 2018 / CONTROL</tspan></text><text x="256" y="1072" fill="#11253D" font-size="28" font-family="DejaVu Sans" font-weight="700"><tspan x="256" dy="0">Se disputa el control real del hotel</tspan></text><text x="256" y="1122" fill="#192D41" font-size="21" font-family="DejaVu Sans" font-weight="400"><tspan x="256" dy="0">Gil alega que el cambio de acceso y control afectó a posesión, diligencias y</tspan><tspan x="256" dy="25">financiación. Cada acto y el efecto real en cada vía requieren prueba propia.</tspan></text><rect x="1210" y="1010" width="288" height="160" rx="10" fill="#F0F5F4" stroke="#E2EBEA" stroke-width="1"/><text x="1234" y="1047" fill="#9C4B32" font-size="18" font-family="DejaVu Sans" font-weight="700"><tspan x="1234" dy="0">ALEGACIÓN DE GIL</tspan></text><text x="1234" y="1108" fill="#11253D" font-size="22" font-family="DejaVu Sans" font-weight="700"><tspan x="1234" dy="0">EFECTO ABIERTO</tspan></text><rect x="214" y="1220" width="1320" height="218" rx="16" fill="#FFFFFF" stroke="#CFDBDD" stroke-width="2"/><rect x="214" y="1220" width="9" height="218" rx="0" fill="#176C72" stroke="#176C72" stroke-width="0"/><circle cx="146" cy="1286" r="19" fill="#176C72" stroke="#F6F4EF" stroke-width="7"/><text x="256" y="1259" fill="#176C72" font-size="21" font-family="DejaVu Sans" font-weight="700"><tspan x="256" dy="0">03 / 28 NOV 2018 / VENTA</tspan></text><text x="256" y="1311" fill="#11253D" font-size="28" font-family="DejaVu Sans" font-weight="700"><tspan x="256" dy="0">El administrador vende instalaciones por separado</tspan></text><text x="256" y="1361" fill="#192D41" font-size="21" font-family="DejaVu Sans" font-weight="400"><tspan x="256" dy="0">Su informe registra un cheque de CAM por activos de LPB controvertidos, ingresado</tspan><tspan x="256" dy="25">en una cuenta de LPB bajo su control. Después el juzgado denegó convalidar la</tspan><tspan x="256" dy="25">escritura.</tspan></text><rect x="1210" y="1249" width="288" height="160" rx="10" fill="#F0F5F4" stroke="#E2EBEA" stroke-width="1"/><text x="1234" y="1286" fill="#176C72" font-size="18" font-family="DejaVu Sans" font-weight="700"><tspan x="1234" dy="0">INFORME DEL AC</tspan></text><text x="1234" y="1347" fill="#11253D" font-size="27" font-family="DejaVu Sans" font-weight="700"><tspan x="1234" dy="0">FONDOS VENTA</tspan></text><rect x="214" y="1459" width="1320" height="218" rx="16" fill="#FFFFFF" stroke="#CFDBDD" stroke-width="2"/><rect x="214" y="1459" width="9" height="218" rx="0" fill="#176C72" stroke="#176C72" stroke-width="0"/><circle cx="146" cy="1525" r="19" fill="#176C72" stroke="#F6F4EF" stroke-width="7"/><text x="256" y="1498" fill="#176C72" font-size="21" font-family="DejaVu Sans" font-weight="700"><tspan x="256" dy="0">04 / ENE–OCT 2019 / JUZGADO</tspan></text><text x="256" y="1550" fill="#11253D" font-size="28" font-family="DejaVu Sans" font-weight="700"><tspan x="256" dy="0">LPB pide la escritura; el juzgado deniega convalidar</tspan></text><text x="256" y="1600" fill="#192D41" font-size="21" font-family="DejaVu Sans" font-weight="400"><tspan x="256" dy="0">Se presentó una solicitud distinta de escritura el 10 de enero; se admitieron dos</tspan><tspan x="256" dy="25">recursos. El 24 de octubre se denegó la convalidación.</tspan></text><rect x="1210" y="1488" width="288" height="160" rx="10" fill="#F0F5F4" stroke="#E2EBEA" stroke-width="1"/><text x="1234" y="1525" fill="#176C72" font-size="18" font-family="DejaVu Sans" font-weight="700"><tspan x="1234" dy="0">ESCRITO + AUTO</tspan></text><text x="1234" y="1586" fill="#11253D" font-size="22" font-family="DejaVu Sans" font-weight="700"><tspan x="1234" dy="0">ACTOS DISTINTOS</tspan></text><rect x="214" y="1698" width="1320" height="218" rx="16" fill="#FFFFFF" stroke="#CFDBDD" stroke-width="2"/><rect x="214" y="1698" width="9" height="218" rx="0" fill="#56538A" stroke="#56538A" stroke-width="0"/><circle cx="146" cy="1764" r="19" fill="#56538A" stroke="#F6F4EF" stroke-width="7"/><text x="256" y="1737" fill="#56538A" font-size="21" font-family="DejaVu Sans" font-weight="700"><tspan x="256" dy="0">05 / JUL 2020 / HONORARIOS</tspan></text><text x="256" y="1789" fill="#11253D" font-size="28" font-family="DejaVu Sans" font-weight="700"><tspan x="256" dy="0">Parrilla figura en la relación de pagos del AC</tspan></text><text x="256" y="1839" fill="#192D41" font-size="21" font-family="DejaVu Sans" font-weight="400"><tspan x="256" dy="0">El informe de 2021 del administrador consigna como pagados honorarios de julio de</tspan><tspan x="256" dy="25">2020. Gil discute la autorización y el efecto en la defensa independiente.</tspan></text><rect x="1210" y="1727" width="288" height="160" rx="10" fill="#F0F5F4" stroke="#E2EBEA" stroke-width="1"/><text x="1234" y="1764" fill="#56538A" font-size="18" font-family="DejaVu Sans" font-weight="700"><tspan x="1234" dy="0">INFORME DEL AC</tspan></text><text x="1234" y="1825" fill="#11253D" font-size="27" font-family="DejaVu Sans" font-weight="700"><tspan x="1234" dy="0">PAGO LETRADO</tspan></text><rect x="66" y="1958" width="1468" height="166" rx="13" fill="#FFF0E6" stroke="#E4BBA1" stroke-width="2"/><text x="100" y="2006" fill="#AE552C" font-size="25" font-family="DejaVu Sans" font-weight="700"><tspan x="100" dy="0">IMPORTAN EL CONTROL Y LA LEALTAD, NO LA CIFRA</tspan></text><text x="100" y="2055" fill="#604132" font-size="21" font-family="DejaVu Sans" font-weight="400"><tspan x="100" dy="0">Examinar autorización, beneficio para LPB, intereses adversos del AC, independencia letrada y efecto en actos de defensa. La ruta</tspan><tspan x="100" dy="25">bancaria y cualquier incentivo anterior siguen sin probarse.</tspan></text><text x="77" y="2165" fill="#526476" font-size="21" font-family="DejaVu Sans" font-weight="400"><tspan x="77" dy="0">Las resoluciones judiciales, incluido el auto correctivo de 2019, tienen cauce propio. La imagen no afirma que el juez ordenara o</tspan><tspan x="77" dy="25">recibiera los honorarios.</tspan></text><rect x="0" y="2240" width="1600" height="90" rx="0" fill="#11253D" stroke="#11253D" stroke-width="0"/><text x="74" y="2272" fill="#DAE7E7" font-size="18" font-family="DejaVu Sans" font-weight="400"><tspan x="74" dy="0">REGISTRO · informes del AC; escrito presentado; auto judicial. ALEGACIÓN · Gil Marer. ABIERTO · autorización, independencia, bancos y efectos.</tspan></text></svg>