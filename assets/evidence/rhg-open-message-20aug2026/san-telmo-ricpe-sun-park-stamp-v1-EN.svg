<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">San Telmo, RICPE and Sun Park: two professional lives involving the same hotel</title>
<desc id="desc">Source-controlled visual of the insolvency life and investor life, the public statement by Eduardo Sánchez and its evidential limits.</desc>
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#13252d}.title{font-size:50px;font-weight:800}.sub{font-size:24px}.head{font-size:27px;font-weight:800}.body{font-size:21px}.small{font-size:17px}.white{fill:#fff}.muted{fill:#53656d}.arrow{stroke:#c89432;stroke-width:8;fill:none;marker-end:url(#a)}
</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#c89432"/></marker></defs>
<rect width="1600" height="1000" fill="#f4f1ea"/>
<rect x="0" y="0" width="1600" height="150" fill="#13252d"/>
<text x="70" y="70" class="title white">SAN TELMO · RICPE · SUN PARK</text>
<text x="72" y="116" class="sub white">Same hotel · same relevant period · two professional lives in parallel</text>

<rect x="85" y="220" rx="25" width="520" height="470" fill="#fff" stroke="#315c7b" stroke-width="6"/>
<text x="120" y="275" class="head">INSOLVENCY LIFE</text>
<text x="120" y="330" class="body">LPB · Insolvency 36/2012</text>
<text x="120" y="375" class="body">Insolvency Administrator:</text>
<text x="120" y="415" class="body" font-weight="800">Francisco de Borja</text>
<text x="120" y="450" class="body" font-weight="800">Rodríguez-Batllori Laffitte</text>
<text x="120" y="505" class="body">Historical professional perimeter:</text>
<text x="120" y="545" class="body" font-weight="800">San Telmo</text>
<line x1="120" y1="580" x2="570" y2="580" stroke="#ddd"/>
<text x="120" y="625" class="small muted">Estate, LPB assets, liquidation, IA duties,</text>
<text x="120" y="652" class="small muted">insolvency information and judicial protection.</text>

<rect x="995" y="220" rx="25" width="520" height="470" fill="#fff" stroke="#8f2d27" stroke-width="6"/>
<text x="1030" y="275" class="head">INVESTOR LIFE</text>
<text x="1030" y="330" class="body">RIC Private Equity · Acosta Matos</text>
<text x="1030" y="375" class="body">Public participant:</text>
<text x="1030" y="415" class="body" font-weight="800">Eduardo Sánchez · San Telmo partner</text>
<rect x="1030" y="455" rx="16" width="450" height="120" fill="#fff4f2" stroke="#8f2d27" stroke-width="3"/>
<text x="1055" y="500" class="body" font-weight="800">“en esa primera inversión…</text>
<text x="1055" y="535" class="body" font-weight="800">metimos unos cuantos clientes”</text>
<text x="1030" y="620" class="small muted">Public source: 30 November 2021.</text>
<text x="1030" y="650" class="small muted">08:08–08:12 · context 07:57–08:27.</text>

<circle cx="800" cy="455" r="145" fill="#fff8d9" stroke="#c89432" stroke-width="7"/>
<text x="800" y="420" text-anchor="middle" class="head">SUN PARK</text>
<text x="800" y="458" text-anchor="middle" class="body">now MYND Yaiza</text>
<text x="800" y="500" text-anchor="middle" class="small muted">same complex / project</text>
<text x="800" y="530" text-anchor="middle" class="small muted">not one undivided title</text>
<path d="M605 455 C650 455 660 455 655 455" class="arrow"/>
<path d="M945 455 C935 455 930 455 945 455" class="arrow"/>
<line x1="605" y1="455" x2="655" y2="455" stroke="#c89432" stroke-width="8"/>
<line x1="945" y1="455" x2="995" y2="455" stroke="#c89432" stroke-width="8"/>

<rect x="85" y="740" rx="18" width="1430" height="190" fill="#13252d"/>
<text x="120" y="790" class="head white">DOCUMENTARY QUESTION</text>
<text x="120" y="835" class="body white">What controls separated matters, information, access, clients, conflicts and functions between</text>
<text x="120" y="868" class="body white">the hotel's insolvency life and the investor life linked to the same project?</text>
<text x="120" y="910" class="small white">The statement and overlap justify traceability; they do not prove coordination, information transfer, unlawfulness or liability.</text>
</svg>