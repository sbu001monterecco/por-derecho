<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">The inward oasis — Playa Blanca</title>
  <desc id="desc">Original Art Deco-inspired illustrative poster showing a hotel courtyard with pools, terraces, palms, volcanic landscape and Atlantic light.</desc>
  <defs>
