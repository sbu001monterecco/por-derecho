 <rect x="210" y="455" width="150" height="138" rx="14" fill="#b71c1c" fill-opacity=".52" stroke="#ffdbd8" stroke-width="5"/>
 <rect x="222" y="466" width="126" height="48" rx="8" fill="#b71c1c"/><text x="285" y="500" class="label">5</text>
 <rect class="labelbox" x="850" y="455" width="110" height="50"/><text x="905" y="489" class="label">1</text>
 <rect class="labelbox" x="270" y="620" width="110" height="50"/><text x="325" y="654" class="label">4</text>
 <rect class="labelbox" x="820" y="620" width="110" height="50"/><text x="875" y="654" class="label">2</text>
 <rect class="labelbox" x="500" y="505" width="200" height="50"/><text x="600" y="539" class="label">9</text>
 <rect class="labelbox" x="500" y="760" width="200" height="50"/><text x="600" y="794" class="label">3</text>
</g>

<path d="M 350 540 C 250 650, 235 715, 245 748" fill="none" stroke="#fff" stroke-width="8"/>
<path d="M 350 540 C 250 650, 235 715, 245 748" fill="none" stroke="#b71c1c" stroke-width="4" stroke-dasharray="12 8"/>
<rect x="55" y="735" width="390" height="130" rx="14" fill="#a80f0f" stroke="#fff" stroke-width="3"/>
<text x="250" y="780" class="sans white mid" text-anchor="middle" font-weight="800">FINCA 8.584 · BLOQUE 5</text>
<text x="250" y="815" class="serif white small" text-anchor="middle">ubicación física sostenida por la parte cliente</text>
<text x="250" y="847" class="serif white tiny" text-anchor="middle">la conciliación exacta finca↔unidad sigue bajo revisión</text>

<rect x="790" y="712" width="350" height="154" rx="14" fill="#0b1115" fill-opacity=".93" stroke="#d5a342" stroke-width="3"/>
<text x="815" y="754" class="sans white mid" font-weight="800">QUÉ ESTÁ ACTIVO AHORA</text>
<text x="815" y="795" class="serif white small">ETJ 163/2020 · finca 8.584</text>
<text x="815" y="829" class="serif white small">la finca 8.588 figura en la cadena de embargo</text>
<text x="815" y="860" class="serif" fill="#f1cf75" font-size="21">Un remate no agota toda la exposición.</text>

<rect x="0" y="922" width="1200" height="578" fill="url(#panel)"/>
<text x="600" y="982" class="sans white big" text-anchor="middle">PERÍMETROS SEPARADOS, PERO CONECTADOS</text>

<rect x="70" y="1018" width="320" height="150" rx="18" fill="#fff" fill-opacity=".96"/>
<text x="230" y="1066" class="sans red mid" text-anchor="middle" font-weight="800">MATKATOR, S.L.</text>
<text x="230" y="1105" class="serif dark small" text-anchor="middle">activo ejecutado / exposición de derechos</text>
<text x="230" y="1142" class="serif dark tiny" text-anchor="middle">finca 8.584 · finca 8.588 · otros bienes Matkator</text>

<rect x="440" y="1018" width="320" height="150" rx="18" fill="#eef3f2"/>
<text x="600" y="1066" class="sans dark mid" text-anchor="middle" font-weight="800">AWESWELL LIMITED</text>
<text x="600" y="1105" class="serif dark small" text-anchor="middle">antigua cliente · perímetro holding / recuperación</text>
<text x="600" y="1142" class="serif dark tiny" text-anchor="middle">jurídicamente separada de Matkator y LPB</text>

<rect x="810" y="1018" width="320" height="150" rx="18" fill="#fff8e6"/>
<text x="970" y="1066" class="sans dark mid" text-anchor="middle" font-weight="800">HOTEL SUN PARK</text>
<text x="970" y="1105" class="serif dark small" text-anchor="middle">explotación hotelera integrada</text>
<text x="970" y="1142" class="serif dark tiny" text-anchor="middle">accesos · infraestructura común · ingresos · valor operativo</text>

<path d="M390 1095 H440" stroke="#d5a342" stroke-width="7"/><path d="M760 1095 H810" stroke="#d5a342" stroke-width="7"/>

<text x="600" y="1238" class="serif white" font-size="40" text-anchor="middle">La cuestión no es sólo un apartamento.</text>
<text x="600" y="1292" class="serif gold" font-size="40" text-anchor="middle" font-weight="700">Una cadena de ejecución puede afectar a poder negociador, valor,</text>
<text x="600" y="1342" class="serif gold" font-size="40" text-anchor="middle" font-weight="700">recuperación y derechos hoteleros más allá de la finca ejecutada.</text>

<rect x="105" y="1384" width="990" height="74" rx="12" fill="#fff" fill-opacity=".10" stroke="#75888d"/>
<text x="600" y="1415" class="sans white tiny" text-anchor="middle">LÍMITE DE FUENTE · Este visual presenta alegaciones, preguntas basadas en fuentes y contexto procesal documentado.</text>
<text x="600" y="1443" class="sans muted tiny" text-anchor="middle">No acredita responsabilidad penal, cesión consumada, identidad de cesionario ni una correspondencia finca↔apartamento cerrada.</text>
</svg>