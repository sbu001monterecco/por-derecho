<text x="28" y="301" class="serif white small">Execution focused</text><text x="28" y="327" class="serif white small">on finca 8,584</text>
<text x="28" y="383" class="serif white small">Finca 8,588 also appears</text><text x="28" y="409" class="serif white small">in the attachment chain</text>
<text x="28" y="466" class="serif white small">One remate is not</text><text x="28" y="492" class="serif white small">the whole exposure.</text>
<text x="28" y="555" class="serif gold mid" font-style="italic">“Enforcement does not</text><text x="28" y="586" class="serif gold mid" font-style="italic">happen in isolation.”</text>
<text x="24" y="720" class="sans muted tiny" letter-spacing="2">SAME HOTEL · SAME STRUCTURE · BIGGER IMPLICATIONS</text>

