<text x="724" y="28" class="sans darktxt tiny" text-anchor="middle" letter-spacing="1">PROJECT SUN ROCK / POR DERECHO · PUBLIC EXPLANATORY VISUAL</text>
<text x="724" y="76" class="sans darktxt huge" text-anchor="middle">ONE HOTEL. <tspan fill="#a20d0d">ONE EXECUTION.</tspan> A WIDER QUESTION.</text>
<text x="724" y="111" class="serif darktxt mid" text-anchor="middle">How one active enforcement may affect a larger hotel-rights and recovery perimeter</text>

