<rect x="285" y="827" width="240" height="48" rx="10" fill="#fff" stroke="#a20d0d" stroke-width="2"/><text x="405" y="858" class="sans redtxt mid" text-anchor="middle" font-weight="800">Matkator, S.L.</text>
<rect x="604" y="827" width="240" height="48" rx="10" fill="#edf2f1" stroke="#344b53" stroke-width="2"/><text x="724" y="858" class="sans darktxt mid" text-anchor="middle" font-weight="800">Aweswell Limited</text>
<rect x="923" y="827" width="240" height="48" rx="10" fill="#fff8e6" stroke="#b58b2d" stroke-width="2"/><text x="1043" y="858" class="sans darktxt mid" text-anchor="middle" font-weight="800">Sun Park hotel</text>

<rect x="32" y="902" width="1384" height="112" rx="14" fill="#4a0909"/>
<text x="56" y="935" class="sans white mid" font-weight="800">WIDER CONTINUITY QUESTION</text>
<text x="56" y="967" class="serif white small">Other hotel fincas in the former Montelanza / Molina seller-minority perimeter are part of the client-side case theory concerning</text>
<text x="56" y="993" class="serif white small">alleged incomplete/frustrated performance of the 2008 Montelanza → Multimatrix transaction and a later alleged convergence with the Acosta Matos perimeter.</text>
<text x="56" y="1017" class="sans" fill="#f0c765" font-size="15">Attributed causal theory of Gil Marer. Not a judicial finding; seller, finca, obligation, actor, knowledge and effect remain to be proved individually.</text>

<rect x="0" y="1028" width="1448" height="58" fill="#10171b"/>
<text x="724" y="1054" class="serif white mid" text-anchor="middle">The issue is not just one apartment. The issue is whether one enforcement chain can reshape value across an interconnected hotel perimeter.</text>
<text x="724" y="1078" class="sans muted tiny" text-anchor="middle">Source-led explanatory visual · allegations remain allegations · no completed cession, assignee identity or criminal liability is stated as proved.</text>
