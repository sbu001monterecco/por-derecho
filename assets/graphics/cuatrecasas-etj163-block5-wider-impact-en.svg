<line x1="1238" y1="234" x2="1422" y2="234" stroke="#ff2e2e" stroke-width="4"/>
<text x="1240" y="286" class="serif white small">Matkator rights inside</text><text x="1240" y="312" class="serif white small">the same hotel perimeter</text>
<text x="1240" y="364" class="serif white small">Shared hotel structure</text><text x="1240" y="390" class="serif white small">and operating logic</text>
<text x="1240" y="442" class="serif white small">Potential pressure on</text><text x="1240" y="468" class="serif white small">other Matkator assets / rights</text>
<text x="1240" y="520" class="serif white small">Economic consequences can</text><text x="1240" y="546" class="serif white small">spread beyond one unit</text>
<text x="1240" y="610" class="serif gold mid" font-style="italic">“A single enforcement action</text><text x="1240" y="642" class="serif gold mid" font-style="italic">can change the equation for many.”</text>

