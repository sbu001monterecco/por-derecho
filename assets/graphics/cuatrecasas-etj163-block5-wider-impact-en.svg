<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc">
<title id="title">One hotel. One execution. A wider question.</title>
<desc id="desc">Explanatory visual using the real Sun Park hotel photograph. Block 5 is highlighted for the client-side Matkator physical-placement position. It also preserves the client-side continuity theory concerning other hotel fincas in the former Montelanza/Molina seller-minority perimeter, the 2008 Montelanza to Multimatrix transaction, and a later alleged convergence with the Acosta Matos perimeter. These are allegations and open evidential questions, not judicial findings.</desc>
