<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">Indicative Playa Blanca hotel programme section</title>
  <desc id="desc">Conceptual building section showing hotel suites above public-facing commercial space, with parking, loading, plant and services below.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2c7781"/><stop offset="1" stop-color="#edd2a4"/></linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9ae3dc"/><stop offset="1" stop-color="#187f8d"/></linearGradient>
    <pattern id="suite" width="120" height="88" patternUnits="userSpaceOnUse"><rect x="10" y="12" width="70" height="34" rx="2" fill="#174e59"/><rect x="15" y="17" width="60" height="7" fill="#eab969" opacity=".72"/><rect x="10" y="56" width="70" height="8" fill="#bd613c"/></pattern>
    <pattern id="parking" width="150" height="90" patternUnits="userSpaceOnUse"><path d="M20 57 h90 l18 14 h-126Z" fill="#f3dfba" stroke="#173f49" stroke-width="4"/><circle cx="30" cy="73" r="10" fill="#173f49"/><circle cx="105" cy="73" r="10" fill="#173f49"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0a2530" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1500" height="920" fill="#f8f3e9"/>
  <rect x="35" y="35" width="1430" height="850" rx="20" fill="none" stroke="#173f49" stroke-width="4"/>
  <text x="80" y="100" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="900" letter-spacing="6" fill="#173f49">INDICATIVE HOTEL + LOCAL SERVICES PROGRAMME</text>
  <text x="82" y="140" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" letter-spacing="4" fill="#bd613c">DESIGN LOGIC · NOT A PLANNING OR ENGINEERING SECTION</text>

  <g transform="translate(95 190)" filter="url(#shadow)">
    <!-- Sky and central courtyard -->
    <rect width="1310" height="570" rx="14" fill="url(#sky)"/>
    <circle cx="1080" cy="92" r="55" fill="#f3cc79"/>

    <!-- Hotel wings -->
    <path d="M55 86 H500 V342 H55Z" fill="#fff8e9" stroke="#173f49" stroke-width="5"/>
    <path d="M810 86 H1255 V342 H810Z" fill="#fff8e9" stroke="#173f49" stroke-width="5"/>
    <rect x="76" y="108" width="404" height="202" fill="url(#suite)"/>
    <rect x="830" y="108" width="404" height="202" fill="url(#suite)"/>
    <rect x="55" y="310" width="445" height="32" fill="#bd613c"/>
    <rect x="810" y="310" width="445" height="32" fill="#bd613c"/>

    <!-- Courtyard oasis -->
    <path d="M500 342 L810 342 L890 455 L420 455Z" fill="#d3b17c" stroke="#173f49" stroke-width="5"/>
    <ellipse cx="655" cy="403" rx="165" ry="44" fill="url(#pool)" stroke="#fff7e8" stroke-width="8"/>
    <g stroke="#173f49" stroke-width="8"><path d="M470 385 v-85"/><path d="M840 385 v-85"/></g>
    <g fill="#667a59"><path d="M470 300 l-48 14 42 7-36 29 47-10 6 41 13-42 38 24-20-36 47-3-42-18 27-33-39 19-11-40-6 42-39-16 28 29Z"/><path d="M840 300 l-48 14 42 7-36 29 47-10 6 41 13-42 38 24-20-36 47-3-42-18 27-33-39 19-11-40-6 42-39-16 28 29Z"/></g>

    <!-- Commercial ground floor -->
    <rect x="55" y="342" width="1200" height="90" fill="#173f49" stroke="#173f49" stroke-width="5"/>
    <g fill="#f3dfba" font-family="Arial, Helvetica, sans-serif" font-weight="850" letter-spacing="4">
      <text x="92" y="394" font-size="22">HOTEL ARRIVAL</text><text x="365" y="394" font-size="22">MARKET</text><text x="570" y="394" font-size="22">CAFÉS</text><text x="755" y="394" font-size="22">HEALTH</text><text x="945" y="394" font-size="22">LOCAL SERVICES</text>
    </g>
    <g fill="#bd613c"><rect x="330" y="348" width="7" height="78"/><rect x="535" y="348" width="7" height="78"/><rect x="720" y="348" width="7" height="78"/><rect x="910" y="348" width="7" height="78"/></g>

    <!-- Basement 1 -->
    <rect x="55" y="432" width="1200" height="70" fill="#7b6855" stroke="#173f49" stroke-width="5"/>
    <g fill="#fff6e5" font-family="Arial, Helvetica, sans-serif" font-weight="800" letter-spacing="3"><text x="92" y="474" font-size="18">B1 · LOADING · HOTEL SERVICES · RETAIL SUPPORT · PARKING</text></g>

    <!-- Basement 2 -->
    <rect x="55" y="502" width="1200" height="68" fill="#403f3d" stroke="#173f49" stroke-width="5"/>
    <rect x="78" y="512" width="870" height="48" fill="url(#parking)" opacity=".9"/>
    <g fill="#f3dfba" font-family="Arial, Helvetica, sans-serif" font-weight="800" letter-spacing="3"><text x="960" y="544" font-size="17">B2 · PARKING · PLANT · STORAGE</text></g>

    <!-- Level labels -->
    <g font-family="Arial, Helvetica, sans-serif" font-weight="900" fill="#173f49">
      <rect x="15" y="90" width="33" height="216" rx="8" fill="#f3dfba"/><text x="31" y="205" transform="rotate(-90 31 205)" text-anchor="middle" font-size="17" letter-spacing="3">HOTEL SUITES</text>
      <rect x="1262" y="342" width="33" height="88" rx="8" fill="#f3dfba"/><text x="1278" y="386" transform="rotate(-90 1278 386)" text-anchor="middle" font-size="14">PUBLIC EDGE</text>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#173f49">
    <text x="100" y="812" font-size="19" font-weight="850">DESIGN TESTS STILL OPEN:</text>
    <text x="365" y="812" font-size="17" font-weight="700">height · suite count · commercial quantum · parking · servicing · groundwater · infrastructure</text>
    <text x="750" y="855" text-anchor="middle" font-size="15" font-weight="750" letter-spacing="3" fill="#687679">100% HOTEL · NON-RESIDENTIAL · ONE CONTROLLED OPERATION · NO INDIVIDUAL SALE OF SUITES</text>
  </g>
</svg>