<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Ruta procesal de la separación del Administrador Concursal</title>
<desc id="d">Mapa procesal desde la solicitud de separación de 23 de abril de 2025, su desestimación, la apelación viva RPL 3304/2025 y la oposición del Administrador Concursal de septiembre de 2026, con control documental de la página 5. Visual explicativo, no fuente primaria.</desc>

  <style>
    .bg{fill:#0e2835}.paper{fill:#f7f1e5}.ink{fill:#17303b}.cream{fill:#f4ead7}.red{fill:#9e173c}.gold{fill:#c29a53}.teal{fill:#16756f}.muted{fill:#60727a}
    .line{stroke:#c29a53;stroke-width:3}.thin{stroke:#17303b;stroke-width:2;fill:none}.dash{stroke:#60727a;stroke-width:2;stroke-dasharray:7 7;fill:none}
    .title{font-family:Georgia,serif;font-size:56px;font-weight:700;fill:#f7f1e5}.sub{font-family:Georgia,serif;font-size:27px;fill:#f4ead7}
    .h{font-family:Georgia,serif;font-size:31px;font-weight:700}.body{font-family:Arial,sans-serif;font-size:20px}.small{font-family:Arial,sans-serif;font-size:16px}.tiny{font-family:Arial,sans-serif;font-size:13px;letter-spacing:1px}
    .date{font-family:Georgia,serif;font-size:23px;font-weight:700}.label{font-family:Arial,sans-serif;font-size:14px;font-weight:700;letter-spacing:1.2px}
  </style>
