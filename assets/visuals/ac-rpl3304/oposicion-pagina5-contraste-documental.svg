<text x="55" y="890" class="label cream">REGLAS DE LECTURA DE LA PRUEBA DOCUMENTAL</text>
<rect x="50" y="920" width="430" height="95" rx="10" fill="#102d3a" stroke="#c29a53" stroke-width="2"/><circle cx="88" cy="954" r="19" class="teal"/><text x="88" y="960" text-anchor="middle" class="small cream">1</text><text x="125" y="954" class="label cream">Identidad acreditada</text><text x="125" y="984" class="small cream">El letrado citado es Joaquín Ruiz de Infante Abella.</text><rect x="510" y="920" width="430" height="95" rx="10" fill="#102d3a" stroke="#c29a53" stroke-width="2"/><circle cx="548" cy="954" r="19" class="teal"/><text x="548" y="960" text-anchor="middle" class="small cream">2</text><text x="585" y="954" class="label cream">Colaboración documentada</text><text x="585" y="984" class="small cream">Armando Betancor · despachos distintos.</text><rect x="970" y="920" width="430" height="95" rx="10" fill="#102d3a" stroke="#c29a53" stroke-width="2"/><circle cx="1008" cy="954" r="19" class="teal"/><text x="1008" y="960" text-anchor="middle" class="small cream">3</text><text x="1045" y="954" class="label cream">Límite de inferencia</text><text x="1045" y="984" class="small cream">Una renuncia no explica por sí sola a todos los demás letrados.</text>
<text x="1450" y="1035" text-anchor="end" class="tiny gold">No se presenta culpabilidad ni condena · se contrasta alegación, fuente y cronología</text>
