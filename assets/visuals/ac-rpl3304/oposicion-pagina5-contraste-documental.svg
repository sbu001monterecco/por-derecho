<title id="t">Página 5 de la oposición — contraste documental</title>
<desc id="d">Contrasta la cita de la oposición sobre las disculpas de un letrado con la identificación de Joaquín Ruiz de Infante y documentos contemporáneos de colaboración con Armando Betancor. Visual explicativo, no fuente primaria.</desc>

