<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="title desc"><title id="title">Tres procedimientos, preguntas distintas</title><desc id="desc">Una misma fuente puede tener relevancia jurídica distinta en cada procedimiento.</desc><rect width="100%" height="100%" fill="#102d39"/><text x="48" y="46.0" fill="#a9d8ce" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="650">POR DERECHO / 16 NOV 2026 / MAPA DOCUMENTAL NO OFICIAL</text><text x="48" y="100.0" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="750">Tres procedimientos, preguntas distintas</text><text x="48" y="159.0" fill="#d9e9e7" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Una misma fuente puede tener relevancia jurídica distinta en cada procedimiento.</text><rect x="48" y="250" width="446" height="350" rx="16" fill="#f2f7f4"/><rect x="48" y="250" width="446" height="9" rx="4" fill="#47a98c"/><text x="71" y="298.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">ICALPA · DIP 80/2026</text><text x="71" y="352.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Deberes profesionales;</text><text x="71" y="384.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">información previa abierta el 27</text><text x="71" y="415.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">de mayo. Denuncia y prueba de</text><text x="71" y="446.6" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">admisión requeridas el 13 / 16</text><text x="71" y="477.8" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">de noviembre.</text><rect x="528" y="250" width="446" height="350" rx="16" fill="#f2f7f4"/><rect x="528" y="250" width="446" height="9" rx="4" fill="#e0ae59"/><text x="551" y="298.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Penal · DP 1956/2026</text><text x="551" y="352.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Incoación y sobreseimiento</text><text x="551" y="384.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">provisional en un mismo auto. El</text><text x="551" y="415.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">juzgado rechazó una</text><text x="551" y="446.6" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">investigación prospectiva sin</text><text x="551" y="477.8" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">suficiente concreción.</text><rect x="1008" y="250" width="446" height="350" rx="16" fill="#f2f7f4"/><rect x="1008" y="250" width="446" height="9" rx="4" fill="#70acd2"/><text x="1031" y="298.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Civil · RPL 3304/2025</text><text x="1031" y="352.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">5 de noviembre: dos documentos</text><text x="1031" y="384.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">inadmitidos por falta de</text><text x="1031" y="415.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">pertinencia y utilidad. El fondo</text><text x="1031" y="446.6" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">de la separación es distinto.</text><text x="48" y="734.0" fill="#d9e9e7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400">Sin declaración de infracción, concierto o culpabilidad. El artículo incorpora fuentes y límites.</text></svg>