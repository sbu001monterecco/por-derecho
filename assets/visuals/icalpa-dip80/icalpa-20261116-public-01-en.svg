<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="title desc"><title id="title">Three proceedings, distinct questions</title><desc id="desc">The same evidence can have different legal relevance in each proceeding.</desc><rect width="100%" height="100%" fill="#102d39"/><text x="48" y="46.0" fill="#a9d8ce" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="650">POR DERECHO / 16 NOV 2026 / UNOFFICIAL DOCUMENTARY MAP</text><text x="48" y="100.0" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="750">Three proceedings, distinct questions</text><text x="48" y="159.0" fill="#d9e9e7" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">The same evidence can have different legal relevance in each proceeding.</text><rect x="48" y="250" width="446" height="350" rx="16" fill="#f2f7f4"/><rect x="48" y="250" width="446" height="9" rx="4" fill="#47a98c"/><text x="71" y="298.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">ICALPA · DIP 80/2026</text><text x="71" y="352.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Professional duties; preliminary</text><text x="71" y="384.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">inquiries opened 27 May. Request</text><text x="71" y="415.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">for complaint and admission</text><text x="71" y="446.6" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">proof: 13 / 16 November.</text><rect x="528" y="250" width="446" height="350" rx="16" fill="#f2f7f4"/><rect x="528" y="250" width="446" height="9" rx="4" fill="#e0ae59"/><text x="551" y="298.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Criminal · DP 1956/2026</text><text x="551" y="352.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Opened and provisionally</text><text x="551" y="384.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">dismissed in one order. Court</text><text x="551" y="415.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">rejected an insufficiently</text><text x="551" y="446.6" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">concrete prospective</text><text x="551" y="477.8" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">investigation.</text><rect x="1008" y="250" width="446" height="350" rx="16" fill="#f2f7f4"/><rect x="1008" y="250" width="446" height="9" rx="4" fill="#70acd2"/><text x="1031" y="298.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Civil · RPL 3304/2025</text><text x="1031" y="352.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">5 November: two institutional</text><text x="1031" y="384.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">documents excluded as irrelevant</text><text x="1031" y="415.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">and unhelpful. Removal merits</text><text x="1031" y="446.6" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">remain distinct.</text><text x="48" y="734.0" fill="#d9e9e7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400">No finding of misconduct, collusion or guilt. Source summaries and limits accompany the article.</text></svg>