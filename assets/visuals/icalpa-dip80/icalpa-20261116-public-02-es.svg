<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050" role="img" aria-labelledby="title desc"><title id="title">Dependencias institucionales que requieren explicación</title><desc id="desc">Las líneas continuas muestran requerimientos o uso documental. Las discontinuas expresan la pregunta del denunciante, no una cooperación probada.</desc><rect width="100%" height="100%" fill="#102d39"/><text x="48" y="46.0" fill="#a9d8ce" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="650">POR DERECHO / 16 NOV 2026 / MAPA DOCUMENTAL NO OFICIAL</text><text x="48" y="100.0" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="750">Dependencias institucionales que requieren explicación</text><text x="48" y="159.0" fill="#d9e9e7" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Las líneas continuas muestran requerimientos o uso documental. Las discontinuas expresan la pregunta del</text><text x="48" y="190.3" fill="#d9e9e7" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">denunciante, no una cooperación probada.</text><rect x="48" y="250" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="48" y="250" width="446" height="9" rx="4" fill="#47a98c"/><text x="71" y="298.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Apertura ICALPA</text><text x="71" y="352.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Uno de los dos documentos</text><text x="71" y="384.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">institucionales propuestos como</text><text x="71" y="415.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">prueba civil.</text><rect x="528" y="250" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="528" y="250" width="446" height="9" rx="4" fill="#e0ae59"/><text x="551" y="298.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Audiencia · 5 de noviembre</text><text x="551" y="352.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Inadmisión: falta de pertinencia</text><text x="551" y="384.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">y utilidad; también ausencia de</text><text x="551" y="415.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">conclusiones.</text><rect x="1008" y="250" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="1008" y="250" width="446" height="9" rx="4" fill="#70acd2"/><text x="1031" y="298.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">ICALPA · 13 / 16 de</text><text x="1031" y="334.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">noviembre</text><text x="1031" y="389.4" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Requiere denuncia penal original</text><text x="1031" y="420.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">y prueba de admisión a trámite.</text><rect x="48" y="615" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="48" y="615" width="446" height="9" rx="4" fill="#47a98c"/><text x="71" y="663.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Estado de las DP 1956</text><text x="71" y="717.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Incoación y archivo provisional</text><text x="71" y="749.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">documentados; la tramitación</text><text x="71" y="780.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">efectiva requiere prueba.</text><rect x="528" y="615" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="528" y="615" width="446" height="9" rx="4" fill="#e0ae59"/><text x="551" y="663.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Pregunta del denunciante</text><text x="551" y="717.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">¿Qué actos profesionales se han</text><text x="551" y="749.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">examinado conforme a sus fuentes</text><text x="551" y="780.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">propias?</text><rect x="1008" y="615" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="1008" y="615" width="446" height="9" rx="4" fill="#70acd2"/><text x="1031" y="663.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Explicación contraria</text><text x="1031" y="717.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Competencias distintas y</text><text x="1031" y="749.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">suspensión legal pueden explicar</text><text x="1031" y="780.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">la secuencia. No se acredita</text><text x="1031" y="811.6" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">concierto.</text><path d="M501,400 h18" fill="none" stroke="#89b8b1" stroke-width="3"/><path d="M519,400 l-8,-6 v12 z" fill="#89b8b1"/><path d="M751,565 v35" stroke="#e0ae59" stroke-width="3" stroke-dasharray="6 7"/><text x="48" y="1004.0" fill="#d9e9e7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400">Sin declaración de infracción, concierto o culpabilidad. El artículo incorpora fuentes y límites.</text></svg>