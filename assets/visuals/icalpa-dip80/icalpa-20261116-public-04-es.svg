<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050" role="img" aria-labelledby="title desc"><title id="title">Uso de fuentes y archivo fiscal separado</title><desc id="desc">El decreto documenta la utilización de fuentes y rechaza la alegación criminal. No resuelve por sí la conducta profesional del administrador.</desc><rect width="100%" height="100%" fill="#102d39"/><text x="48" y="46.0" fill="#a9d8ce" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="650">POR DERECHO / 16 NOV 2026 / MAPA DOCUMENTAL NO OFICIAL</text><text x="48" y="100.0" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="750">Uso de fuentes y archivo fiscal separado</text><text x="48" y="159.0" fill="#d9e9e7" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">El decreto documenta la utilización de fuentes y rechaza la alegación criminal. No resuelve por sí la conducta</text><text x="48" y="190.3" fill="#d9e9e7" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">profesional del administrador.</text><rect x="48" y="250" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="48" y="250" width="446" height="9" rx="4" fill="#47a98c"/><text x="71" y="298.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Informe del administrador</text><text x="71" y="352.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Fuente utilizada por el fiscal</text><text x="71" y="384.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">según describe el decreto.</text><rect x="528" y="250" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="528" y="250" width="446" height="9" rx="4" fill="#e0ae59"/><text x="551" y="298.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Dictamen fiscal · 12 de</text><text x="551" y="334.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">marzo de 2019</text><text x="551" y="389.4" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">El decreto considera</text><text x="551" y="420.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">objetivamente fundada la</text><text x="551" y="452.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">remisión al informe.</text><rect x="1008" y="250" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="1008" y="250" width="446" height="9" rx="4" fill="#70acd2"/><text x="1031" y="298.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Sentencia 163/2023</text><text x="1031" y="352.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">El decreto cita la acogida</text><text x="1031" y="384.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">parcial y las diferencias en su</text><text x="1031" y="415.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">razonamiento.</text><rect x="48" y="615" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="48" y="615" width="446" height="9" rx="4" fill="#47a98c"/><text x="71" y="663.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Fiscalía DIP 12 · 5 de</text><text x="71" y="699.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">noviembre de 2026</text><text x="71" y="754.4" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Rechazo de la alegación</text><text x="71" y="785.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">criminal; no aprecia prueba</text><text x="71" y="817.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">objetiva de concierto ilícito.</text><rect x="528" y="615" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="528" y="615" width="446" height="9" rx="4" fill="#e0ae59"/><text x="551" y="663.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Oficio al denunciante</text><text x="551" y="717.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Se identifica la posibilidad de</text><text x="551" y="749.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">acudir al órgano judicial. No se</text><text x="551" y="780.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">verifica presentación posterior.</text><rect x="1008" y="615" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="1008" y="615" width="446" height="9" rx="4" fill="#70acd2"/><text x="1031" y="663.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">ICALPA DIP 80</text><text x="1031" y="717.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Cuestiones profesionales</text><text x="1031" y="749.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">propias; todo solapamiento o</text><text x="1031" y="780.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">suspensión necesita fundamento</text><text x="1031" y="811.6" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">específico.</text><path d="M501,400 h18" fill="none" stroke="#89b8b1" stroke-width="3"/><path d="M519,400 l-8,-6 v12 z" fill="#89b8b1"/><path d="M981,400 h18" fill="none" stroke="#89b8b1" stroke-width="3"/><path d="M999,400 l-8,-6 v12 z" fill="#89b8b1"/><text x="48" y="1004.0" fill="#d9e9e7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400">Sin declaración de infracción, concierto o culpabilidad. El artículo incorpora fuentes y límites.</text></svg>