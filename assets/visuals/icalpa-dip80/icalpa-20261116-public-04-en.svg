<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050" role="img" aria-labelledby="title desc"><title id="title">Source reliance and the separate prosecution archive</title><desc id="desc">The decree records source reliance and rejects the criminal allegation. It does not itself decide the administrator’s professional conduct.</desc><rect width="100%" height="100%" fill="#102d39"/><text x="48" y="46.0" fill="#a9d8ce" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="650">POR DERECHO / 16 NOV 2026 / UNOFFICIAL DOCUMENTARY MAP</text><text x="48" y="100.0" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="750">Source reliance and the separate prosecution archive</text><text x="48" y="159.0" fill="#d9e9e7" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">The decree records source reliance and rejects the criminal allegation. It does not itself decide the</text><text x="48" y="190.3" fill="#d9e9e7" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">administrator’s professional conduct.</text><rect x="48" y="250" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="48" y="250" width="446" height="9" rx="4" fill="#47a98c"/><text x="71" y="298.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Administrator’s report</text><text x="71" y="352.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Source relied upon in the</text><text x="71" y="384.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">prosecutor’s position, as</text><text x="71" y="415.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">described in the decree.</text><rect x="528" y="250" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="528" y="250" width="446" height="9" rx="4" fill="#e0ae59"/><text x="551" y="298.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Prosecutor’s opinion · 12</text><text x="551" y="334.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">March 2019</text><text x="551" y="389.4" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">The decree treats reliance on</text><text x="551" y="420.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">the report as objectively</text><text x="551" y="452.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">grounded.</text><rect x="1008" y="250" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="1008" y="250" width="446" height="9" rx="4" fill="#70acd2"/><text x="1031" y="298.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Judgment 163/2023</text><text x="1031" y="352.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Partial adoption and differences</text><text x="1031" y="384.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">are cited in the decree’s</text><text x="1031" y="415.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">reasoning.</text><rect x="48" y="615" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="48" y="615" width="446" height="9" rx="4" fill="#47a98c"/><text x="71" y="663.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Fiscalía DIP 12 · 5</text><text x="71" y="699.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">November 2026</text><text x="71" y="754.4" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Criminal allegation rejected; no</text><text x="71" y="785.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">objective evidence of illicit</text><text x="71" y="817.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">coordination found.</text><rect x="528" y="615" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="528" y="615" width="446" height="9" rx="4" fill="#e0ae59"/><text x="551" y="663.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Notice to complainant</text><text x="551" y="717.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Submission to the competent</text><text x="551" y="749.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">court is identified as possible.</text><text x="551" y="780.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">No later filing is verified.</text><rect x="1008" y="615" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="1008" y="615" width="446" height="9" rx="4" fill="#70acd2"/><text x="1031" y="663.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">ICALPA DIP 80</text><text x="1031" y="717.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Separate professional-conduct</text><text x="1031" y="749.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">questions; any overlap or</text><text x="1031" y="780.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">suspension requires its own</text><text x="1031" y="811.6" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">basis.</text><path d="M501,400 h18" fill="none" stroke="#89b8b1" stroke-width="3"/><path d="M519,400 l-8,-6 v12 z" fill="#89b8b1"/><path d="M981,400 h18" fill="none" stroke="#89b8b1" stroke-width="3"/><path d="M999,400 l-8,-6 v12 z" fill="#89b8b1"/><text x="48" y="1004.0" fill="#d9e9e7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400">No finding of misconduct, collusion or guilt. Source summaries and limits accompany the article.</text></svg>