<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1060" viewBox="0 0 1500 1060" role="img" aria-labelledby="title desc"><title id="title">Attribution and contrary evidence</title><desc id="desc">Each forum requires its own act, source, contrary explanation and next verifiable step.</desc><rect width="100%" height="100%" fill="#102d39"/><text x="48" y="46.0" fill="#a9d8ce" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="650">POR DERECHO / 16 NOV 2026 / UNOFFICIAL DOCUMENTARY MAP</text><text x="48" y="100.0" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="750">Attribution and contrary evidence</text><text x="48" y="159.0" fill="#d9e9e7" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Each forum requires its own act, source, contrary explanation and next verifiable step.</text><rect x="48" y="240" width="225" height="75" rx="5" fill="#32616e"/><text x="63" y="271.0" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="650">Forum / record</text><rect x="278" y="240" width="345" height="75" rx="5" fill="#32616e"/><text x="293" y="271.0" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="650">What is documented</text><rect x="628" y="240" width="405" height="75" rx="5" fill="#32616e"/><text x="643" y="271.0" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="650">Contrary / limit</text><rect x="1038" y="240" width="350" height="75" rx="5" fill="#32616e"/><text x="1053" y="271.0" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="650">Next verification</text><rect x="48" y="320" width="225" height="122" rx="5" fill="#f1f7f4"/><text x="63" y="351.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="650">ICALPA DIP 80</text><rect x="278" y="320" width="345" height="122" rx="5" fill="#f1f7f4"/><text x="293" y="351.0" fill="#163642" font-family="D