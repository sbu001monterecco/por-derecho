<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050" role="img" aria-labelledby="title desc"><title id="title">Where institutional dependencies require explanation</title><desc id="desc">Solid lines show documented requests or evidential use. Dashed lines show the complainant’s proposed accountability question, not proven cooperation.</desc><rect width="100%" height="100%" fill="#102d39"/><text x="48" y="46.0" fill="#a9d8ce" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="650">POR DERECHO / 16 NOV 2026 / UNOFFICIAL DOCUMENTARY MAP</text><text x="48" y="100.0" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="750">Where institutional dependencies require explanation</text><text x="48" y="159.0" fill="#d9e9e7" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Solid lines show documented requests or evidential use. Dashed lines show the complainant’s proposed</text><text x="48" y="190.3" fill="#d9e9e7" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">accountability question, not proven cooperation.</text><rect x="48" y="250" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="48" y="250" width="446" height="9" rx="4" fill="#47a98c"/><text x="71" y="298.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">ICALPA opening record</text><text x="71" y="352.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">One of two institutional</text><text x="71" y="384.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">documents offered as civil</text><text x="71" y="415.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">evidence.</text><rect x="528" y="250" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="528" y="250" width="446" height="9" rx="4" fill="#e0ae59"/><text x="551" y="298.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Provincial Court · 5</text><text x="551" y="334.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">November</text><text x="551" y="389.4" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Documents excluded; lack of</text><text x="551" y="420.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">relevance/usefulness and absence</text><text x="551" y="452.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">of conclusions cited.</text><rect x="1008" y="250" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="1008" y="250" width="446" height="9" rx="4" fill="#70acd2"/><text x="1031" y="298.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">ICALPA · 13 / 16 November</text><text x="1031" y="352.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Requests the original criminal</text><text x="1031" y="384.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">complaint and proof of</text><text x="1031" y="415.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">admission.</text><rect x="48" y="615" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="48" y="615" width="446" height="9" rx="4" fill="#47a98c"/><text x="71" y="663.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">DP 1956 status</text><text x="71" y="717.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Opening and provisional</text><text x="71" y="749.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">dismissal are documented;</text><text x="71" y="780.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">continuing proceedings need</text><text x="71" y="811.6" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">proof.</text><rect x="528" y="615" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="528" y="615" width="446" height="9" rx="4" fill="#e0ae59"/><text x="551" y="663.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Complainant’s question</text><text x="551" y="717.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Which professional acts have</text><text x="551" y="749.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">been examined on their own</text><text x="551" y="780.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">evidence?</text><rect x="1008" y="615" width="446" height="315" rx="16" fill="#f2f7f4"/><rect x="1008" y="615" width="446" height="9" rx="4" fill="#70acd2"/><text x="1031" y="663.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="750">Contrary explanation</text><text x="1031" y="717.7" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Distinct competencies and lawful</text><text x="1031" y="749.0" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">suspension rules may explain</text><text x="1031" y="780.3" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">sequencing. No concert is</text><text x="1031" y="811.6" fill="#163642" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">established.</text><path d="M501,400 h18" fill="none" stroke="#89b8b1" stroke-width="3"/><path d="M519,400 l-8,-6 v12 z" fill="#89b8b1"/><path d="M751,565 v35" stroke="#e0ae59" stroke-width="3" stroke-dasharray="6 7"/><text x="48" y="1004.0" fill="#d9e9e7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400">No finding of misconduct, collusion or guilt. Source summaries and limits accompany the article.</text></svg>