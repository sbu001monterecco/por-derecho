<line x1="70" y1="865" x2="1330" y2="865" stroke="#d1d5db" stroke-width="2"/>
<text x="70" y="892" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#6b7280">Regla visual: enlaces = rutas de análisis. Sólo la fuente primaria establece hechos; proximidad gráfica no prueba concierto, dolo, causalidad o responsabilidad penal.</text>
