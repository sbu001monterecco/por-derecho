<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">GC-CIV-003 — mapa de interoperabilidad multitrack</title>
<desc id="desc">Mapa visual que sitúa GC-CIV-003 en el centro y lo conecta con el administrador concursal, CAM/Acosta Matos, Concurso 36/2012, la tesis criminal-first, la ingeniería inversa unitaria y la cuestión de remedios, distinguiendo conexión documentada de hipótesis contextual.</desc>
<rect width="1400" height="900" fill="#f5f7f6"/>
<text x="70" y="82" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#111827">GC-CIV-003 · INTEROPERABILIDAD MULTITRACK</text>
<text x="70" y="122" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#4b5563">Una misma secuencia, múltiples planos jurídicos · enlaces de navegación no equivalen a prueba de coordinación</text>
