  <path d="M35 160 H175 L210 125 H360" fill="none" stroke="#f3dfba" stroke-width="6"/><path d="M1565 160 H1425 L1390 125 H1240" fill="none" stroke="#f3dfba" stroke-width="6"/>
  <path d="M35 845 H250 L290 885 H470" fill="none" stroke="#f3dfba" stroke-width="6"/><path d="M1565 845 H1350 L1310 885 H1130" fill="none" stroke="#f3dfba" stroke-width="6"/>
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#fff7e8">
