<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Playa Blanca — a new hotel destination</title>
  <desc id="desc">Original Art Deco-inspired illustrative poster showing a white hotel resort, an internal pool garden, the town of Playa Blanca, its harbour and the Atlantic horizon.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f3b4a"/><stop offset=".52" stop-color="#3c8791"/><stop offset="1" stop-color="#e9bc78"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3db1b5"/><stop offset="1" stop-color="#126c78"/></linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#93e4dc"/><stop offset="1" stop-color="#168b98"/></linearGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3d3b39"/><stop offset="1" stop-color="#171c20"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#06191f" flood-opacity=".38"/></filter>
    <pattern id="windows" width="48" height="36" patternUnits="userSpaceOnUse"><rect x="7" y="8" width="26" height="13" rx="2" fill="#174e59"/><rect x="9" y="10" width="22" height="3" fill="#e2b461" opacity=".7"/></pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1275" cy="155" r="92" fill="#f2c66f"/>
  <circle cx="1275" cy="155" r="122" fill="none" stroke="#f4d89a" stroke-width="4" opacity=".55"/>
  <path d="M0 305 C250 270 420 320 635 300 C895 275 1110 300 1600 255 L1600 455 L0 455Z" fill="#f3dfba" opacity=".82"/>
  <path d="M0 350 C280 316 525 355 790 330 C1090 303 1320 330 1600 310 L1600 520 L0 520Z" fill="url(#sea)"/>
  <g opacity=".38" fill="none" stroke="#d8f1eb" stroke-width="5">
