    <text x="800" y="930" font-size="32" font-weight="700" letter-spacing="16" fill="#e8be76">LANZAROTE</text>
    <text x="800" y="965" font-size="16" font-weight="700" letter-spacing="5" fill="#cfe2df">HOTEL &amp; LOCAL SERVICES CONCEPT · ILLUSTRATIVE STUDY</text>
