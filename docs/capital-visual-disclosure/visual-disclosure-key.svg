<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Evidence and illustration must remain distinct</title><desc id="desc">A source photograph, historical drawing, illustrative concept and proposed process each need their own caption and provenance. Colour is supplemented by labels and line patterns.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D595B"/></marker></defs><rect width="1000" height="500" fill="white"/><rect x="24" y="24" width="452" height="165" rx="10" fill="#EDF3F3" stroke="#BBCACC" stroke-width="2"/><text x="44" y="58.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#0D595B">SOURCE IMAGE</text><text x="44" y="90.0" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#173B4D">ACTUAL PHOTOGRAPH</text><text x="44" y="128.0" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#18272E">Identify subject, source and capture-date</text><text x="44" y="158.0" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#18272E">limitations.</text><rect x="520" y="24" width="456" height="165" rx="10" fill="#EDF3F3" stroke="#BBCACC" stroke-width="2"/><text x="540" y="58.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#0D595B">HISTORICAL EVIDENCE</text><text x="540" y="90.0" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#173B4D">HISTORICAL DRAWING</text><text x="540" y="128.0" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#18272E">Keep drawing ID and date; do not imply</text><text x="540" y="158.0" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#18272E">current permission.</text><rect x="24" y="225" width="452" height="165" rx="10" fill="#EDF3F3" stroke="#BBCACC" stroke-width="2" stroke-dasharray="9 6"/><text x="44" y="259.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#0D595B">ILLUSTRATION</text><text x="44" y="291.0" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#173B4D">ILLUSTRATIVE CONCEPT</text><text x="44" y="329.0" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#18272E">Not a completed building, survey or</text><text x="44" y="359.0" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#18272E">approved scheme.</text><rect x="520" y="225" width="456" height="165" rx="10" fill="#EDF3F3" stroke="#BBCACC" stroke-width="2" stroke-dasharray="9 6"/><text x="540" y="259.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#0D595B">PROCESS — NOT STATUS</text><text x="540" y="291.0" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#173B4D">PROPOSED PROCESS</text><text x="540" y="329.0" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#18272E">Explain conditions; do not use fake</text><text x="540" y="359.0" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#18272E">completion badges.</text><line x1="24" y1="425" x2="976" y2="425" stroke="#9D7B42" stroke-width="3"/><text x="24" y="450.0" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#18272E">Keep captions readable; never rely on colour alone. Publication permission is a separate decision.</text></svg>