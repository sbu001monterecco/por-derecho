name: Homepage publication contract

on:
  pull_request:
    paths:
      - 'en/index.html'
      - 'es/index.html'
      - 'en/start/**'
      - 'es/inicio/**'
      - 'en/evidence/**'
      - 'es/evidencia/**'
      - 'ops/publication/HOMEPAGE_PUBLICATION_CONTRACT_20260925.json'
      - 'ci/homepage_publication_contract_20260925.py'
      - '.github/workflows/homepage-publication-contract.yml'
  push:
    branches: [main]
    paths:
      - 'en/index.html'
      - 'es/index.html'
      - 'en/start/**'
      - 'es/inicio/**'
      - 'en/evidence/**'
      - 'es/evidencia/**'
      - 'ops/publication/HOMEPAGE_PUBLICATION_CONTRACT_20260925.json'
      - 'ci/homepage_publication_contract_20260925.py'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ci/homepage_publication_contract_20260925.py
