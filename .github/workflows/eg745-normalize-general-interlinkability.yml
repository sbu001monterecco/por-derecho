name: EG745 normalize general proceedings interlinkability
on:
  push:
    branches:
      - eg745-imminent-filing-interconnectivity-20260918
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Rebuild general proceedings interlinkability
        run: python scripts/build_proceedings_interlinkability_v1.py
      - name: Verify deterministic projection
        run: python scripts/build_proceedings_interlinkability_v1.py --check
      - name: Commit normalized projection
        run: |
          git config user.name "por-derecho-ci"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data/proceedings-interlinkability-v1.json
          if git diff --cached --quiet; then
            echo "Projection already normalized"
          else
            git commit -m "Normalize proceedings interlinkability source grades for EG745"
            git push origin HEAD:eg745-imminent-filing-interconnectivity-20260918
          fi
