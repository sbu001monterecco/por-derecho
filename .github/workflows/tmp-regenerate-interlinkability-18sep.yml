name: Temporary regenerate proceedings interlinkability
on:
  push:
    branches:
      - dip2-projection-builder-normalize-18sep2026
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dip2-projection-builder-normalize-18sep2026
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Regenerate exact builder output
        run: python3 scripts/build_proceedings_interlinkability_v1.py
      - name: Commit generated projection if changed
        shell: bash
        run: |
          if git diff --quiet -- assets/data/proceedings-interlinkability-v1.json; then
            echo "Builder output already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/proceedings-interlinkability-v1.json
          git commit -m "DIP2: regenerate interlinkability with canonical builder"
          git push origin HEAD:dip2-projection-builder-normalize-18sep2026
