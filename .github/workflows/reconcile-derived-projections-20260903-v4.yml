name: Reconcile derived projections 20260903 v4

on:
  push:
    branches:
      - ministerio-fiscal-fulltext-audit-20260903
    paths:
      - '.github/workflows/reconcile-derived-projections-20260903-v4.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ministerio-fiscal-fulltext-audit-20260903
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Reconcile current denominators and browser control count
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_str, old, new):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected stale constant not found in {path_str}: {old}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          smoke = Path('scripts/smoke_fiscalia_proceedings_interconnectivity.mjs')
          smoke_text = smoke.read_text(encoding='utf-8')
          smoke_replacements = {
              "data.coverage.fiscalia_exact_files !== 21 || data.coverage.fiscalia_unresolved_references !== 3": "data.coverage.fiscalia_exact_files !== 23 || data.coverage.fiscalia_unresolved_references !== 3",
              "Fiscalía identity denominator is not 21 + 3": "Fiscalía identity denominator is not 23 + 3",
              "page.locator('[data-mf-files] [data-file]').count() !== 25": "page.locator('[data-mf-files] [data-file]').count() !== 27",
              "expected all + 24 file controls": "expected all + 26 file controls",
          }
          for old, new in smoke_replacements.items():
              if old not in smoke_text:
                  raise SystemExit(f'Expected stale smoke constant not found: {old}')
              smoke_text = smoke_text.replace(old, new, 1)
          smoke.write_text(smoke_text, encoding='utf-8')

          replace_once('scripts/build_proceedings_interlinkability_v1.py', 'EXPECTED_CASE_PRISM_EXACT_COVERED = 43', 'EXPECTED_CASE_PRISM_EXACT_COVERED = 45')
          replace_once('scripts/audit_proceedings_interconnectivity_map.py', 'CURRENT_CASE_PRISM_EXACT_COVERED = 43', 'CURRENT_CASE_PRISM_EXACT_COVERED = 45')
          replace_once('scripts/audit_proceedings_interconnectivity_map.py', 'CURRENT_CASE_PRISM_EXACT_UNCOVERED = 63', 'CURRENT_CASE_PRISM_EXACT_UNCOVERED = 61')

          schema = Path('assets/data/proceedings-interconnectivity-schema-v1.json')
          schema_text = schema.read_text(encoding='utf-8')
          schema_replacements = {
              'shared-proposition membership remains 43 of 106 with 63 explicit no-coordinate gaps': 'shared-proposition membership remains 45 of 106 with 61 explicit no-coordinate gaps',
              '"case_prism_exact_proceeding_covered_denominator": 43': '"case_prism_exact_proceeding_covered_denominator": 45',
              '"case_prism_exact_proceeding_uncovered_denominator": 63': '"case_prism_exact_proceeding_uncovered_denominator": 61',
              '"shared_case_prism_proposition_membership_coverage_status": "GAP_43_OF_106"': '"shared_case_prism_proposition_membership_coverage_status": "GAP_45_OF_106"',
          }
          for old, new in schema_replacements.items():
              if old not in schema_text:
                  raise SystemExit(f'Expected stale schema constant not found: {old}')
              schema_text = schema_text.replace(old, new, 1)
          schema.write_text(schema_text, encoding='utf-8')

      - name: Regenerate proceedings interlinkability projection
        run: python scripts/build_proceedings_interlinkability_v1.py

      - name: Regenerate Community ACTA authority projection
        run: python scripts/build_community_acta_authority_interconnectivity.py

      - name: Reconcile current reintegration transition bytes
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path('publication-manifests/historic-proceedings-authority-reintegration-20260903.json')
          data = json.loads(manifest_path.read_text(encoding='utf-8'))
          denominator = data.get('current_denominator', {})
          if denominator.get('CURRENT_CASE_PRISM_EXACT_COVERED') != 43 or denominator.get('CURRENT_CASE_PRISM_EXACT_UNCOVERED') != 63:
              raise SystemExit('Expected stale 43/63 reintegration denominator not found')
          denominator['CURRENT_CASE_PRISM_EXACT_COVERED'] = 45
          denominator['CURRENT_CASE_PRISM_EXACT_UNCOVERED'] = 61

          tracked = {
              'assets/data/proceedings-interconnectivity-schema-v1.json',
              'assets/data/proceedings-interlinkability-v1.json',
              'scripts/audit_proceedings_interconnectivity_map.py',
              'scripts/build_proceedings_interlinkability_v1.py',
          }
          rows = {row.get('resource'): row for row in data.get('transitions', []) if isinstance(row, dict)}
          missing = sorted(tracked - set(rows))
          if missing:
              raise SystemExit(f'Missing transition rows: {missing}')
          for resource in sorted(tracked):
              path = Path(resource)
              if not path.exists():
                  raise SystemExit(f'Expected transition resource missing: {resource}')
              rows[resource]['candidate_sha256'] = hashlib.sha256(path.read_bytes()).hexdigest()

          manifest_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

      - name: Check proceedings interlinkability projection
        run: python scripts/build_proceedings_interlinkability_v1.py --check

      - name: Audit proceedings interconnectivity map
        run: python scripts/audit_proceedings_interconnectivity_map.py

      - name: Check Community ACTA projection
        run: python scripts/build_community_acta_authority_interconnectivity.py --check

      - name: Validate Community ACTA projection
        run: python scripts/validate_community_acta_authority_interconnectivity.py

      - name: Test Community ACTA projection
        run: python -m unittest -v scripts/test_build_community_acta_authority_interconnectivity.py

      - name: Check Fiscalía projection
        run: python scripts/build_fiscalia_proceedings_interconnectivity.py --check

      - name: Validate Fiscalía projection
        run: python scripts/validate_fiscalia_proceedings_interconnectivity.py

      - name: Test Fiscalía projection
        run: python -m unittest -v scripts/test_build_fiscalia_proceedings_interconnectivity.py

      - name: Parse Fiscalía browser smoke
        run: node --check scripts/smoke_fiscalia_proceedings_interconnectivity.mjs

      - name: Commit reconciled permanent files only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/reconcile-audit-diagnostic.txt || true
          git add assets/data/proceedings-interlinkability-v1.json \
                  assets/data/community-acta-authority-interconnectivity-v1.json \
                  assets/data/proceedings-interconnectivity-schema-v1.json \
                  publication-manifests/historic-proceedings-authority-reintegration-20260903.json \
                  scripts/build_proceedings_interlinkability_v1.py \
                  scripts/audit_proceedings_interconnectivity_map.py \
                  scripts/smoke_fiscalia_proceedings_interconnectivity.mjs
          if git diff --cached --quiet; then
            echo 'No reconciliation changes were produced.'
            exit 1
          fi
          git commit -m 'Reconcile current interconnectivity denominators'
          git push origin HEAD:ministerio-fiscal-fulltext-audit-20260903
