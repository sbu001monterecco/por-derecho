name: Import authorized San Telmo visual assets

on:
  push:
    branches:
      - feature/correct-san-telmo-photo-stamp-20260819
    paths:
      - ".asset-import/trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-authorized-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: feature/correct-san-telmo-photo-stamp-20260819
          fetch-depth: 0

      - name: Stop cleanly when trigger has already been consumed
        id: trigger
        shell: bash
        run: |
          if [[ -f .asset-import/trigger.txt ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode, verify and create portable SVG stamp
        if: steps.trigger.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/actors assets/places assets/composites
          cat .asset-import/eduardo.*.b64 | tr -d '\n\r ' | base64 --decode > assets/actors/eduardo-sanchez-san-telmo.webp
          cat .asset-import/sunpark.*.b64 | tr -d '\n\r ' | base64 --decode > assets/places/sun-park-mynd-yaiza--user-authorized-20260819.jpg

          echo "a46afb994e6fa0fb309d43fff45b72923a75db39680abc01e10a0c13a52af7d6  assets/actors/eduardo-sanchez-san-telmo.webp" | sha256sum --check --strict
          echo "91fb8e8bff10b76296d2abdb27f2733bd6faa99666941d0c22a2d631c369110d  assets/places/sun-park-mynd-yaiza--user-authorized-20260819.jpg" | sha256sum --check --strict
          test -f assets/actors/francisco-de-borja-rodriguez-batllori.jpg

          python - <<'PY'
          from __future__ import annotations
          import base64
          import html
          from pathlib import Path

          root = Path('.')
          eduardo = root / 'assets/actors/eduardo-sanchez-san-telmo.webp'
          sunpark = root / 'assets/places/sun-park-mynd-yaiza--user-authorized-20260819.jpg'
          borja = root / 'assets/actors/francisco-de-borja-rodriguez-batllori.jpg'
          out = root / 'assets/composites/san-telmo-ricpe-sun-park-stamp-v1.svg'

          def data_uri(path: Path, mime: str) -> str:
              return f'data:{mime};base64,' + base64.b64encode(path.read_bytes()).decode('ascii')

          e = data_uri(eduardo, 'image/webp')
          s = data_uri(sunpark, 'image/jpeg')
          b = data_uri(borja, 'image/jpeg')

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2400 1600" role="img" aria-labelledby="title desc">
          <title id="title">San Telmo, RIC Private Equity and Sun Park documentary collision</title>
          <desc id="desc">Eduardo Sánchez on the left, the Sun Park hotel in the centre, and Francisco de Borja Rodríguez-Batllori Laffitte, Insolvency Administrator, on the right. The source-controlled statement says that Eduardo Sánchez stated the firm put clients into the RICPE investment connected to Sun Park. It does not by itself prove coordination, information transfer, unlawfulness or liability.</desc>
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#efe5d4"/></linearGradient>
            <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7e1013"/><stop offset="1" stop-color="#bd2026"/></linearGradient>
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#24090a" flood-opacity=".24"/></filter>
            <clipPath id="clipEduardo"><rect x="62" y="500" width="524" height="390" rx="3"/></clipPath>
            <clipPath id="clipSun"><rect x="860" y="500" width="680" height="390" rx="3"/></clipPath>
            <clipPath id="clipBorja"><rect x="1814" y="500" width="524" height="390" rx="3"/></clipPath>
          </defs>
          <rect width="2400" height="1600" fill="url(#bg)"/>
          <rect width="2400" height="250" fill="#0c1116"/>
          <text x="1200" y="68" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="53" font-weight="900">San Telmo partner Eduardo Sánchez stated that “el despacho”</text>
          <text x="1200" y="132" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="53" font-weight="900">put clients into the RICPE investment connected to Sun Park.</text>
          <text x="1200" y="190" text-anchor="middle" fill="#d7aa52" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="800">El socio de San Telmo Eduardo Sánchez manifestó que «el despacho»</text>
          <text x="1200" y="232" text-anchor="middle" fill="#d7aa52" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="800">metió clientes en la inversión RICPE conectada con Sun Park.</text>
          <rect y="250" width="2400" height="105" fill="url(#red)"/>
          <text x="1200" y="295" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900">ONE HOTEL. ONE SAN TELMO PROFESSIONAL PERIMETER. TWO PARALLEL PROFESSIONAL LIVES.</text>
          <text x="1200" y="337" text-anchor="middle" fill="#f0cf91" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800">UN MISMO HOTEL. UN MISMO PERÍMETRO PROFESIONAL SAN TELMO. DOS VIDAS PROFESIONALES EN PARALELO.</text>

          <g filter="url(#shadow)">
            <rect x="50" y="385" width="548" height="520" rx="14" fill="#fffaf2" stroke="#0c1116" stroke-width="5"/>
            <rect x="50" y="385" width="548" height="115" rx="14" fill="#0c1116"/>
            <rect x="50" y="486" width="548" height="14" fill="#0c1116"/>
            <text x="324" y="430" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="900">EDUARDO SÁNCHEZ</text>
            <text x="324" y="470" text-anchor="middle" fill="#d7aa52" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">SAN TELMO PARTNER / SOCIO DE SAN TELMO</text>
            <image x="62" y="500" width="524" height="390" preserveAspectRatio="xMidYMid slice" clip-path="url(#clipEduardo)" href="{e}" xlink:href="{e}"/>
            <rect x="62" y="500" width="524" height="390" fill="none" stroke="#d7aa52" stroke-width="5"/>
          </g>

          <g filter="url(#shadow)">
            <rect x="848" y="385" width="704" height="520" rx="14" fill="#fffaf2" stroke="#0c1116" stroke-width="5"/>
            <rect x="848" y="385" width="704" height="115" rx="14" fill="#0c1116"/>
            <rect x="848" y="486" width="704" height="14" fill="#0c1116"/>
            <text x="1200" y="430" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="900">SUN PARK / MYND YAIZA</text>
            <text x="1200" y="470" text-anchor="middle" fill="#d7aa52" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">THE SAME HOTEL / EL MISMO HOTEL</text>
            <image x="860" y="500" width="680" height="390" preserveAspectRatio="xMidYMid slice" clip-path="url(#clipSun)" href="{s}" xlink:href="{s}"/>
            <rect x="860" y="500" width="680" height="390" fill="none" stroke="#d7aa52" stroke-width="5"/>
          </g>

          <g filter="url(#shadow)">
            <rect x="1802" y="385" width="548" height="520" rx="14" fill="#fffaf2" stroke="#0c1116" stroke-width="5"/>
            <rect x="1802" y="385" width="548" height="115" rx="14" fill="#0c1116"/>
            <rect x="1802" y="486" width="548" height="14" fill="#0c1116"/>
            <text x="2076" y="417" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="900">FRANCISCO DE BORJA</text>
            <text x="2076" y="449" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="900">RODRÍGUEZ-BATLLORI LAFFITTE</text>
            <text x="2076" y="480" text-anchor="middle" fill="#d7aa52" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">ADMINISTRADOR CONCURSAL / INSOLVENCY ADMINISTRATOR</text>
            <image x="1814" y="500" width="524" height="390" preserveAspectRatio="xMidYMid meet" clip-path="url(#clipBorja)" href="{b}" xlink:href="{b}"/>
            <rect x="1814" y="500" width="524" height="390" fill="none" stroke="#d7aa52" stroke-width="5"/>
          </g>

          <path d="M620 600 H785 V548 L840 645 L785 742 V690 H620 Z" fill="#bd2026"/>
          <text x="718" y="618" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="900">RICPE</text>
          <text x="718" y="654" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">investment /</text>
          <text x="718" y="688" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">inversión RICPE</text>

          <line x1="1575" y1="645" x2="1760" y2="645" stroke="#0c1116" stroke-width="14" stroke-dasharray="22 14"/>
          <path d="M1760 615 L1800 645 L1760 675 Z" fill="#0c1116"/>
          <text x="1680" y="718" text-anchor="middle" fill="#0c1116" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900">CONCURSO 36/2012</text>
          <text x="1680" y="752" text-anchor="middle" fill="#0c1116" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">insolvency / concurso</text>

          <rect x="120" y="930" width="2160" height="190" rx="18" fill="#fff" stroke="#9f1518" stroke-width="6"/>
          <text x="1200" y="1010" text-anchor="middle" fill="#9f1518" font-family="Inter, Arial, sans-serif" font-size="65" font-weight="900">“EL DESPACHO” / “THE FIRM”</text>
          <text x="1200" y="1078" text-anchor="middle" fill="#0c1116" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="800">put clients into the RICPE investment / metió clientes en la inversión RICPE</text>

          <rect y="1130" width="2400" height="170" fill="#0c1116"/>
          <circle cx="120" cy="1215" r="56" fill="none" stroke="#d7aa52" stroke-width="8"/>
          <text x="120" y="1245" text-anchor="middle" fill="#d7aa52" font-family="Inter, Arial, sans-serif" font-size="80" font-weight="900">?</text>
          <text x="210" y="1195" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900">What conflict, file-separation, KYC, access and information controls existed — and where are the records?</text>
          <text x="210" y="1255" fill="#d7aa52" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="800">¿Qué controles de conflicto, separación de expedientes, KYC, acceso e información existían — y dónde están los registros?</text>

          <rect y="1300" width="2400" height="300" fill="#d7aa52"/>
          <rect y="1300" width="2400" height="12" fill="#0c1116"/>
          <text x="105" y="1370" fill="#0c1116" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="900">SOURCE-CONTROLLED DIRECT STATEMENT. This establishes the contemporaneous San Telmo–RICPE–Sun Park connection</text>
          <text x="105" y="1412" fill="#0c1116" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="900">and the need to reconcile the records.</text>
          <text x="105" y="1462" fill="#0c1116" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800">It does not by itself establish Borja–Eduardo coordination, transfer of insolvency information, unlawfulness or liability.</text>
          <text x="105" y="1512" fill="#2d2417" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">MANIFESTACIÓN DIRECTA CONTROLADA POR FUENTES. Acredita la conexión contemporánea San Telmo–RICPE–Sun Park</text>
          <text x="105" y="1550" fill="#2d2417" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">y exige conciliar los registros. No acredita por sí sola coordinación, transmisión de información, ilicitud ni responsabilidad.</text>
          <rect y="1570" width="2400" height="30" fill="#0c1116"/>
          </svg>'''
          out.write_text(svg, encoding='utf-8')
          PY

          test -s assets/composites/san-telmo-ricpe-sun-park-stamp-v1.svg

      - name: Commit imported assets and consume staging data
        if: steps.trigger.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "por-derecho-asset-bot"
          git config user.email "sbu001@monterecco.com"
          git add assets/actors/eduardo-sanchez-san-telmo.webp
          git add assets/places/sun-park-mynd-yaiza--user-authorized-20260819.jpg
          git add assets/composites/san-telmo-ricpe-sun-park-stamp-v1.svg
          git rm -f .asset-import/eduardo.*.b64 .asset-import/sunpark.*.b64 .asset-import/trigger.txt
          git commit -m "Import authorized Eduardo Sánchez and Sun Park assets"
          git push origin HEAD:feature/correct-san-telmo-photo-stamp-20260819
