name: JSP public evidence capture
on:
  push:
    branches: [worker/jsp-2017-dossier-canonical-20260905]
    paths: [.github/workflows/jsp-public-evidence-capture.yml, scripts/prepare_jsp_official_image_objects.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: python3 -m pip install pymupdf pillow
      - name: Capture complete official public notices and source-derived images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jsp-evidence/sources /tmp/jsp-evidence/repository
          git rev-parse HEAD > /tmp/jsp-evidence/source-commit.txt
          python3 - <<'PY'
          import urllib.request, pathlib, hashlib, json, shutil, fitz
          base=pathlib.Path('/tmp/jsp-evidence'); out=base/'sources'
          for pattern in ['assets/data/*jsp*','assets/*jsp*','scripts/*jsp*','archive/JSP*','.github/workflows/*jsp*','ops/*RELEASE*','ops/*PUBLICATION*']:
              for p in pathlib.Path('.').glob(pattern):
                  if p.is_file():
                      dst=base/'repository'/p; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,dst)
          for folder in ['es/jsp-montelanza-concurso-liquidacion','en/jsp-montelanza-insolvency-liquidation']:
              p=pathlib.Path(folder)
              if p.exists(): shutil.copytree(p,base/'repository'/p,dirs_exist_ok=True)
          urls={
            'BORME-C-2017-7368.pdf':'https://www.boe.es/borme/dias/2017/08/10/pdfs/BORME-C-2017-7368.pdf',
            'BORME-C-2017-7368.html':'https://www.boe.es/diario_borme/txt.php?id=BORME-C-2017-7368',
            'BORME-C-2017-6996.pdf':'https://www.boe.es/borme/dias/2017/07/28/pdfs/BORME-C-2017-6996.pdf',
            'BORME-A-2015-205-35.pdf':'https://www.boe.es/borme/dias/2015/10/27/pdfs/BORME-A-2015-205-35.pdf',
            'BORME-A-2018-201-35.pdf':'https://www.boe.es/borme/dias/2018/10/18/pdfs/BORME-A-2018-201-35.pdf',
            'BORME-A-2021-194-38.pdf':'https://www.boe.es/borme/dias/2021/10/07/pdfs/BORME-A-2021-194-38.pdf',
            'BORME-A-2015-230-35.pdf':'https://www.boe.es/borme/dias/2015/12/02/pdfs/BORME-A-2015-230-35.pdf'
          }
          records=[]
          for name,url in urls.items():
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'PorDerecho-SourceReview/1.0'})
                  with urllib.request.urlopen(req,timeout=45) as r: data=r.read(); ct=r.headers.get('Content-Type','')
                  if name.endswith('.pdf') and not data.startswith(b'%PDF-'): raise ValueError('Not PDF bytes')
                  (out/name).write_bytes(data)
                  records.append(dict(file=name,url=url,bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),content_type=ct,status='CAPTURED'))
              except Exception as e: records.append(dict(file=name,url=url,status='FAILED',error=str(e)))
          assert next(r for r in records if r['file']=='BORME-C-2017-7368.pdf')['status']=='CAPTURED'
          pdf=fitz.open(out/'BORME-C-2017-7368.pdf'); page=pdf[0]
          page.get_pixmap(matrix=fitz.Matrix(2,2),alpha=False).save(out/'BORME-C-2017-7368-full-page.png')
          (out/'BORME-C-2017-7368.txt').write_text(page.get_text())
          hits=page.search_for('Quinto:'); assert len(hits)==1
          y=hits[0].y0; clip=fitz.Rect(60,max(0,y-12),page.rect.width-45,min(page.rect.height,y+65))
          page.get_pixmap(matrix=fitz.Matrix(3,3),clip=clip,alpha=False).save(out/'BORME-C-2017-7368-item-five-crop.png')
          (out/'crop-provenance.json').write_text(json.dumps(dict(original='BORME-C-2017-7368.pdf',page=1,clip_points=list(clip),operation='Unannotated pixel render/crop; not a recreated document or certified copy'),indent=2))
          for p in out.glob('*.png'):
              records.append(dict(file=p.name,bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest(),status='DERIVED_FROM_CAPTURED_PDF'))
          (out/'capture-manifest.json').write_text(json.dumps(records,indent=2))
          print(json.dumps(records,indent=2))
          PY
      - name: Prepare lossless evidence image objects without repository writes
        run: python3 scripts/prepare_jsp_official_image_objects.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jsp-compact-official-evidence
          path: |
            /tmp/jsp-evidence
            /tmp/jsp-official-image-objects
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - name: Verify read-only worktree
        run: test -z "$(git status --porcelain)"
