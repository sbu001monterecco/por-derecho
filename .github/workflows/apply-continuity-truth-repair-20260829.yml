name: Apply continuity truth repair 20260829

on:
  push:
    branches:
      - fix/concurso36-continuity-truth-20260829
    paths:
      - scripts/apply_continuity_truth_repair_20260829.py
      - .github/workflows/apply-continuity-truth-repair-20260829.yml

permissions:
  contents: write

concurrency:
  group: apply-continuity-truth-repair-20260829
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/concurso36-continuity-truth-20260829
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Apply assertion-led substitutions
        run: python -B scripts/apply_continuity_truth_repair_20260829.py
      - name: Remove one-shot machinery and commit the result
        run: |
          git rm scripts/apply_continuity_truth_repair_20260829.py
          git rm .github/workflows/apply-continuity-truth-repair-20260829.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Reconcile continuity publication truth and smoke contract"
          git push origin HEAD:fix/concurso36-continuity-truth-20260829
