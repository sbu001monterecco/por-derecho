name: Verify public Pages propagation — optimum reader journey

on:
  push:
    branches: [main]
    paths:
      - 'deployment-probes/optimum-reader-journey-20260818.json'
      - 'scripts/verify_pages_propagation.py'
      - '.github/workflows/verify-pages-propagation-optimum.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-live-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Verify workflow commit descends from the optimum reader-journey merge
        uses: actions/github-script@v7
        env:
          MINIMUM_COMMIT: 6deaba19d8db5c5c5e20f2965ae8ab7deb28d8de
        with:
          script: |
            const minimum = process.env.MINIMUM_COMMIT;
            const basehead = `${minimum}...${context.sha}`;
            const { data } = await github.request('GET /repos/{owner}/{repo}/compare/{basehead}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead,
            });
            const mergeBase = data.merge_base_commit?.sha;
            const validStatus = data.status === 'ahead' || data.status === 'identical';
            if (!validStatus || mergeBase !== minimum) {
              core.setFailed(`Workflow commit ${context.sha} is not a descendant of ${minimum}; status=${data.status}; merge_base=${mergeBase}`);
              return;
            }
            core.info(`Workflow commit ${context.sha} is ${data.ahead_by} commit(s) ahead of ${minimum}; merge base confirmed.`);

      - name: Poll the public GitHub Pages host
        run: |
          python3 scripts/verify_pages_propagation.py \
            --base-url https://sbu001monterecco.github.io/por-derecho/ \
            --attempts 72 \
            --interval 10 \
            --timeout 20 \
            --output artifacts/pages-propagation/verification.json

      - name: Show verification evidence
        if: always()
        run: |
          if [ -f artifacts/pages-propagation/verification.json ]; then
            cat artifacts/pages-propagation/verification.json
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-pages-propagation-evidence
          path: artifacts/pages-propagation/verification.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish verification commit status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              target_url: runUrl,
              description: success
                ? 'Public Pages serves 6deaba19 or a descendant'
                : 'Public Pages propagation was not verified',
              context: 'pages-propagation/optimum-reader-journey',
            });
