name: Audit workspace persistence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/workspace_persistence.py'
      - 'tests/test_workspace_persistence.py'
      - 'schemas/workspace-*.schema.json'
      - 'schemas/chatgpt-export-import-manifest-v1.schema.json'
      - 'docs/WORKSPACE_PERSISTENCE_RUNBOOK.md'
      - 'examples/workspace-checkpoint.example.json'
      - 'data/workspace-register-v1.json'
      - 'ops/AUTOMATIC_WORKSPACE_PERSISTENCE_V1.json'
      - 'archive/handoffs/*workspace-persistence*'
      - '.github/governance/AUTOMATIC_WORKSPACE_PERSISTENCE_ARCHITECTURE_01SEP2026.md'
      - '.github/governance/WORKSPACE_THREAD_CONTINUITY_HANDOFF_STANDARD_01SEP2026.md'
      - '.github/governance/CONCURRENT_WORKSPACE_REGISTRATION_PROTOCOL_01SEP2026.md'
      - 'CURRENT_WORKSPACE_HANDOFF.md'
      - '.gitignore'
      - '.github/workflows/audit-workspace-persistence.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/workspace_persistence.py'
      - 'tests/test_workspace_persistence.py'
      - 'schemas/workspace-*.schema.json'
      - 'schemas/chatgpt-export-import-manifest-v1.schema.json'
      - 'docs/WORKSPACE_PERSISTENCE_RUNBOOK.md'
      - 'examples/workspace-checkpoint.example.json'
      - 'data/workspace-register-v1.json'
      - 'ops/AUTOMATIC_WORKSPACE_PERSISTENCE_V1.json'
      - 'archive/handoffs/*workspace-persistence*'
      - '.github/governance/AUTOMATIC_WORKSPACE_PERSISTENCE_ARCHITECTURE_01SEP2026.md'
      - '.github/governance/WORKSPACE_THREAD_CONTINUITY_HANDOFF_STANDARD_01SEP2026.md'
      - '.github/governance/CONCURRENT_WORKSPACE_REGISTRATION_PROTOCOL_01SEP2026.md'
      - 'CURRENT_WORKSPACE_HANDOFF.md'
      - '.gitignore'
      - '.github/workflows/audit-workspace-persistence.yml'
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: workspace-persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Compile runtime
        run: python -m py_compile scripts/workspace_persistence.py

      - name: Run runtime tests
        run: python -m unittest discover -s tests -p 'test_workspace_persistence.py' -v

      - name: Audit public continuity controls
        run: |
          mkdir -p artifacts/workspace-persistence-audit
          python scripts/workspace_persistence.py validate-repository \
            --output artifacts/workspace-persistence-audit/result.json

      - name: Upload read-only audit result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-persistence-audit-${{ github.run_id }}
          path: artifacts/workspace-persistence-audit/
          if-no-files-found: warn
          retention-days: 30
