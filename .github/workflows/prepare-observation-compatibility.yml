name: Prepare source observation compatibility
on:
  push:
    branches: [worker/observation-compatibility-20260905]
    paths: ['.github/workflows/prepare-observation-compatibility.yml']
permissions:
  contents: read
concurrency:
  group: observation-compatibility-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Execute exact reviewed finite preparation without nested expression expansion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import pathlib,subprocess
          out=pathlib.Path('/tmp/observation-compatibility');out.mkdir(exist_ok=True)
          origin='beb9b03f83b3ae17b5e80c5f28e5ffd03aa0986e'
          text=subprocess.check_output(['git','show',origin+':.github/workflows/prepare-observation-compatibility.yml'],text=True)
          start=text.index("          python3 - <<'PY'\n")
          end=text.index('      - uses: actions/upload-artifact@',start)
          lines=text[start:end].splitlines()
          assert all(not line or line.startswith('          ') for line in lines)
          script='\n'.join(line[10:] if line else '' for line in lines)+'\n'
          (out/'preparation-origin.txt').write_text(origin+'\n')
          result=subprocess.run(['bash','-e'],input=script,text=True)
          raise SystemExit(result.returncode)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: observation-compatibility-${{ github.run_id }}
          path: |
            /tmp/observation-compatibility/
            /tmp/pd-release-acceptance/
            /tmp/ci-control-plane/
          if-no-files-found: error
          retention-days: 14
