name: Prepare release controller repair
on:
  push:
    branches: [worker/release-controller-preparation-20260905]
    paths: ['.pd-stage/**', '.github/workflows/prepare-release-controller.yml']
permissions:
  contents: read
concurrency:
  group: release-controller-preparation
  cancel-in-progress: true
jobs:
  prepare:
    if: github.ref == 'refs/heads/worker/release-controller-preparation-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned browser and actual privacy inspector
        run: |
          command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y poppler-utils)
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Prepare exact current-main candidate; fail on any required check failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,lzma,subprocess,sys,zipfile,difflib,re
          out=Path('/tmp/pd-preparation');out.mkdir(exist_ok=True)
          package=lzma.decompress(b''.join(Path('.pd-stage/part'+str(i)).read_bytes() for i in range(4)))
          (out/'reviewed-package.json').write_bytes(package)
          result=subprocess.run([sys.executable,'.pd-stage/prepare.py'])
          if result.returncode:
              paths=['scripts/check_cnmv_owned_contract.py','scripts/build_cnmv_interim_measures_20260905.py','scripts/pd_release_contract.py','assets/data/cnmv-interim-measures-20260905.json','ops/CNMV_INTERIM_PUBLICATION_AUDIT_20260905.json','en/cnmv-ricpe-verification/index.html','es/cnmv-ricpe-verificacion/index.html','en/cnmv-rsm-external-audit-business-perimeter/index.html']
              with zipfile.ZipFile(out/'focused-failure-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
                  for path in paths:
                      if Path(path).is_file():archive.write(path)
              sys.path.insert(0,str(Path('scripts').resolve()))
              import build_cnmv_interim_measures_20260905 as source
              expected=source.prepared();report=[]
              markers=[(source.START,source.END),(source.HSTART,source.HEND),(source.JSTART,source.JEND)]
              for path in paths:
                  if path not in expected or not path.endswith('.html'):continue
                  actual=Path(path).read_text()
                  for start,end in markers:
                      pattern=re.escape(start)+r'.*?'+re.escape(end)
                      old=re.findall(pattern,expected[path],re.S);new=re.findall(pattern,actual,re.S)
                      if old!=new:
                          diff='\n'.join(difflib.unified_diff('\n'.join(old).replace('><','>\n<').splitlines(),'\n'.join(new).replace('><','>\n<').splitlines(),fromfile='expected/'+path,tofile='actual/'+path,n=3))
                          report.append({'path':path,'marker':start,'expected_count':len(old),'actual_count':len(new),'diff':diff})
              (out/'owned-block-differences.json').write_text(json.dumps(report,indent=2))
              print('OWNED_BLOCK_DIFFERENCES',json.dumps(report))
          raise SystemExit(result.returncode)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-controller-preparation-${{ github.run_id }}
          path: |
            /tmp/pd-preparation/
            /tmp/pd-release-acceptance/
            /tmp/ci-control-plane/
          if-no-files-found: error
          retention-days: 14
