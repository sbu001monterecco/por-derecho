name: Import verified RICPE PNG evidence

on:
  push:
    branches:
      - codex/import-ricpe-pngs-20260827
    paths:
      - .github/workflows/import-ricpe-pngs-20260827.yml

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: codex/import-ricpe-pngs-20260827
          fetch-depth: 0

      - name: Download and verify exact source attachments
        shell: bash
        env:
          SAN_TELMO_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-f034-820a-88a1-ea69cce23eb3/raw?se=2026-08-27T11%3A59%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=d796ced6-beae-5ad1-9b48-939fca4317c1&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-27T08%3A04%3A38Z&ske=2026-08-28T08%3A04%3A38Z&sks=b&skv=2026-02-06&sig=gOuCyKbAKZg%2BTrvmXI8AyNs4bsBSO%2BZp57PyPdkhi1U%3D"
          PWC_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-f1c4-81f4-8f25-c43297a65d72/raw?se=2026-08-27T11%3A59%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=cf8e8a04-cbac-58cf-9228-b700655dfc59&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-27T08%3A43%3A01Z&ske=2026-08-28T08%3A43%3A01Z&sks=b&skv=2026-02-06&sig=zayWYdVzAligeSH1%2BLI8wz6MytTSQBW1Dq32/WO4jdw%3D"
        run: |
          set -euo pipefail
          target="evidence/ricpe-cnmv/2026-08-27"
          mkdir -p "$target"
          curl --fail --location --retry 3 --retry-delay 1 "$SAN_TELMO_URL" --output "$target/san-telmo-ricpe-sun-park-stamp-v1-ES.png"
          curl --fail --location --retry 3 --retry-delay 1 "$PWC_URL" --output "$target/pwc-five-actors-plus-ac-2016-knowledge-checkpoint-ES.png"
          echo "f50790d29a0dc55521e03693b9023d55241212bbb4fd78977187dbe8bf544add  $target/san-telmo-ricpe-sun-park-stamp-v1-ES.png" | sha256sum --check --strict
          echo "6b3dfac14865f8bd9cdaf6eda6b610ff67175a96761f9d5ab7a0819b935643bf  $target/pwc-five-actors-plus-ac-2016-knowledge-checkpoint-ES.png" | sha256sum --check --strict

      - name: Commit exact PNG binaries to the publication branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/ricpe-cnmv/2026-08-27/*.png
          git commit -m "Add exact San Telmo and PwC RICPE evidence PNGs"
          git push origin HEAD:codex/import-ricpe-pngs-20260827
