name: JSP canonical dossier checks
on:
  pull_request:
    paths:
      - 'assets/data/matter-identity*'
      - 'assets/data/jsp-*'
      - 'es/jsp-montelanza-concurso-liquidacion/**'
      - 'en/jsp-montelanza-insolvency-liquidation/**'
      - 'scripts/*jsp*'
      - '.github/workflows/jsp-canonical-dossier-check.yml'
permissions:
  contents: read
jobs:
  jsp-canonical-dossier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Inspect canonical identities without mutating repository
        run: |
          python3 - <<'PY'
          import collections,json,pathlib
          root=pathlib.Path('assets/data')
          master=json.loads((root/'matter-identity-registry-v1.json').read_text())
          records=[r for p in master['parts'] for r in json.loads((root/p['path']).read_text())['records']]
          ids=[r['id'] for r in records]
          assert len(ids)==len(set(ids)), 'Duplicate canonical identity IDs'
          pathlib.Path('jsp-canonical-inventory.json').write_text(json.dumps({'head':'${{ github.event.pull_request.head.sha }}','counts':dict(collections.Counter(r['type'] for r in records)),'records':records},ensure_ascii=False,indent=2)+'\n')
          print('Canonical identity count:',len(records))
          PY
          if test -f scripts/validate_jsp_canonical_dossier.py; then python3 scripts/validate_jsp_canonical_dossier.py; fi
      - name: Package existing public sources for bounded review
        run: |
          python3 - <<'PY'
          import pathlib,tarfile
          patterns=['assets/data/matter-identity*','assets/data/jsp-*','assets/jsp-*','scripts/*identity*','scripts/*jsp*','scripts/validate_publication_integrity.py','scripts/validate_repository_preservation.py','scripts/validate_audience_experience.py','ops/CANONICAL_ENTITY_NAMES.json','ops/CURRENT_UNITARY_STATE.json','ops/REPOSITORY_PRESERVATION_CONTRACT.json','archive/PROCEEDINGS_MASTER_REGISTER.csv','archive/PROCEEDINGS_MASTER_REGISTER_PROTOCOL.md','archive/JSP*.md','es/registro-identidad-materia/index.html','en/matter-identity-registry/index.html','es/jsp-montelanza-concurso-liquidacion/**/*','en/jsp-montelanza-insolvency-liquidation/**/*','es/montelanza-monte-lanza-sl/index.html','en/montelanza-monte-lanza-sl/index.html','jsp-canonical-inventory.json']
          paths={p for pat in patterns for p in pathlib.Path('.').glob(pat) if p.is_file()}
          with tarfile.open('jsp-public-source-review.tar.gz','w:gz') as tf:
              for p in sorted(paths): tf.add(p,arcname=str(p))
          print('Public source files:',len(paths))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jsp-public-source-review
          path: jsp-public-source-review.tar.gz
          retention-days: 7
