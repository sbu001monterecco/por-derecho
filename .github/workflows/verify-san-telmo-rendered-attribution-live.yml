name: Verify San Telmo rendered attribution live

on:
  push:
    branches: [main]
    paths:
      - "assets/site.js"
      - "assets/san-telmo-attribution-correction-20260819.js"
      - "en/san-telmo-ricpe-sun-park/index.html"
      - "es/san-telmo-ricpe-sun-park/index.html"
      - "sitemap-san-telmo.xml"
      - "robots.txt"
      - "scripts/verify_san_telmo_rendered_attribution_live.py"
      - ".github/workflows/verify-san-telmo-rendered-attribution-live.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  public-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Verify corrected public assets, dossier routes and discovery controls
        id: verify
        continue-on-error: true
        run: python scripts/verify_san_telmo_rendered_attribution_live.py

      - name: Publish persistent public-edge commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["SOURCE_SHA"]
          run_id = os.environ["RUN_ID"]
          success = os.environ["VERIFY_OUTCOME"] == "success"
          payload = {
              "state": "success" if success else "failure",
              "target_url": f"https://github.com/{repository}/actions/runs/{run_id}",
              "description": (
                  "San Telmo attribution and dossier verified live"
                  if success
                  else "San Telmo attribution public-edge verification failed"
              ),
              "context": "pages-propagation/san-telmo-attribution",
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/statuses/{sha}",
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "Por-Derecho-San-Telmo-Live-Verification/1.0",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.read().decode("utf-8", "replace"))
          PY

      - name: Fail when public-edge verification did not succeed
        if: steps.verify.outcome != 'success'
        run: exit 1
