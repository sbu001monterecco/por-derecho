name: Reconcile canonical identity count for authority search

on:
  push:
    branches: [authority-search-20260902]
    paths:
      - '.github/workflows/reconcile-canonical-counts-20260902.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: authority-search-20260902
          fetch-depth: 0
          persist-credentials: true
      - name: Reconcile current controls and static pages
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path('.')

          def replace_exact(path: str, old: str, new: str, minimum: int = 1) -> None:
              target = ROOT / path
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: expected at least {minimum} occurrence(s) of {old!r}, found {count}')
              target.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path}: replaced {count} occurrence(s)')

          unitary_path = ROOT / 'ops/CURRENT_UNITARY_STATE.json'
          unitary = json.loads(unitary_path.read_text(encoding='utf-8'))
          identity = unitary['identity_registry']
          identity['control_date'] = '2026-09-02'
          identity['counts']['total'] = 343
          identity['counts']['INSTITUTION'] = 44
          identity['total'] = 343
          identity['INSTITUTION'] = 44
          unitary_path.write_text(json.dumps(unitary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          old_constant = '''CURRENT_CANONICAL_IDENTITY_COUNTS = {
              "total": 342,
              "PERSON": 162,
              "ORGANISATION": 83,
              "STRUCTURE": 11,
              "INSTITUTION": 43,
              "PROCEEDING": 43,
          }'''
          new_constant = '''CURRENT_CANONICAL_IDENTITY_COUNTS = {
              "total": 343,
              "PERSON": 162,
              "ORGANISATION": 83,
              "STRUCTURE": 11,
              "INSTITUTION": 44,
              "PROCEEDING": 43,
          }'''
          replace_exact('scripts/validate_operational_truth.py', old_constant, new_constant)
          replace_exact('scripts/validate_current_reverse_engineered_digest.py', old_constant, new_constant)

          replace_exact(
              'scripts/validate_dp3205_2014_publication.py',
              'assert registry_control_date == "2026-09-01"',
              'assert registry_control_date == "2026-09-02"',
          )
          replace_exact(
              'scripts/validate_dp3205_2014_publication.py',
              '"en": "1 SEPTEMBER 2026"',
              '"en": "2 SEPTEMBER 2026"',
          )
          replace_exact(
              'scripts/validate_dp3205_2014_publication.py',
              '"es": "1 SEPTIEMBRE 2026"',
              '"es": "2 SEPTIEMBRE 2026"',
          )

          es_path = ROOT / 'es/registro-identidad-materia/index.html'
          es = es_path.read_text(encoding='utf-8')
          es_replacements = {
              '342 identidades canónicas': '343 identidades canónicas',
              '43 instituciones y 43 procedimientos': '44 instituciones y 43 procedimientos',
              '"name":"Total","value":342': '"name":"Total","value":343',
              '"name":"Instituciones","value":43': '"name":"Instituciones","value":44',
              'data-static-registry-counts="342-162-83-11-43-43"': 'data-static-registry-counts="343-162-83-11-44-43"',
              '2026-09-01': '2026-09-02',
              '1 SEPTIEMBRE 2026': '2 SEPTIEMBRE 2026',
              '<strong data-registry-stat="TOTAL">341</strong>': '<strong data-registry-stat="TOTAL">343</strong>',
              '<strong data-registry-stat="INSTITUTION">42</strong>': '<strong data-registry-stat="INSTITUTION">44</strong>',
          }
          for old, new in es_replacements.items():
              if old not in es:
                  raise SystemExit(f'ES identity page missing expected marker: {old!r}')
              es = es.replace(old, new)
          for marker in ('343-162-83-11-44-43', '2 SEPTIEMBRE 2026', 'data-registry-stat="TOTAL">343', 'data-registry-stat="INSTITUTION">44'):
              if marker not in es:
                  raise SystemExit(f'ES identity page reconciliation failed: {marker}')
          es_path.write_text(es, encoding='utf-8')

          en_path = ROOT / 'en/matter-identity-registry/index.html'
          en = en_path.read_text(encoding='utf-8')
          en_replacements = {
              '342 canonical identities': '343 canonical identities',
              '43 institutions and 43 proceedings': '44 institutions and 43 proceedings',
              '"name":"Total","value":342': '"name":"Total","value":343',
              '"name":"Institutions","value":43': '"name":"Institutions","value":44',
              'data-static-registry-counts="342-162-83-11-43-43"': 'data-static-registry-counts="343-162-83-11-44-43"',
              '2026-09-01': '2026-09-02',
              '1 SEPTEMBER 2026': '2 SEPTEMBER 2026',
              '<strong data-registry-stat="TOTAL">341</strong>': '<strong data-registry-stat="TOTAL">343</strong>',
              '<strong data-registry-stat="INSTITUTION">42</strong>': '<strong data-registry-stat="INSTITUTION">44</strong>',
          }
          for old, new in en_replacements.items():
              if old not in en:
                  raise SystemExit(f'EN identity page missing expected marker: {old!r}')
              en = en.replace(old, new)
          for marker in ('343-162-83-11-44-43', '2 SEPTEMBER 2026', 'data-registry-stat="TOTAL">343', 'data-registry-stat="INSTITUTION">44'):
              if marker not in en:
                  raise SystemExit(f'EN identity page reconciliation failed: {marker}')
          en_path.write_text(en, encoding='utf-8')
          PY
      - name: Validate reconciled controls
        run: |
          python3 scripts/validate_canonical_home_search.py
          python3 scripts/validate_operational_truth.py
          python3 scripts/validate_current_reverse_engineered_digest.py
          python3 scripts/validate_dp3205_2014_publication.py
      - name: Commit reconciliation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No reconciliation changes required.'
            exit 0
          fi
          git config user.name 'por-derecho-governance-bot'
          git config user.email 'sbu001monterecco@users.noreply.github.com'
          git add ops/CURRENT_UNITARY_STATE.json \
            scripts/validate_operational_truth.py \
            scripts/validate_current_reverse_engineered_digest.py \
            scripts/validate_dp3205_2014_publication.py \
            es/registro-identidad-materia/index.html \
            en/matter-identity-registry/index.html
          git commit -m 'Reconcile canonical identity count to 343'
          git push origin HEAD:authority-search-20260902
