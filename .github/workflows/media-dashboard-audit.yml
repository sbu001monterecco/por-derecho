name: Media dashboard read-only source audit
on:
  push:
    branches: [worker/media-dashboard-plan-20260905]
    paths: [.github/workflows/media-dashboard-audit.yml, publication-manifests/media-desk-20260905.json]
permissions:
  contents: read
concurrency:
  group: media-dashboard-source-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_BASE_SHA: adc8c87585609709caafdd90f03ffbb4a4687d83
      GITHUB_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install validator dependencies
        run: python3 -m pip install beautifulsoup4 PyYAML jsonschema
      - name: Exact-range read-only acceptance
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,os
          out=pathlib.Path('/tmp/media-source-audit');out.mkdir(exist_ok=True)
          base=os.environ['GITHUB_BASE_SHA'];head=os.environ['GITHUB_HEAD_SHA']
          changed=subprocess.check_output(['git','diff','--name-only',base+'...'+head],text=True).splitlines()
          assert changed, 'Reject empty declared release diff'
          commands=[['python3','ops/media-dashboard/build_release.py','--check'],['python3','-m','unittest','discover','-s','ops/media-dashboard','-p','test_*.py','-v'],['python3','scripts/validate_repository_preservation.py'],['python3','scripts/validate_publication_integrity.py'],['python3','scripts/validate_audience_experience.py']]
          results=[]
          for i,cmd in enumerate(commands):
            p=subprocess.run(cmd,capture_output=True,text=True,timeout=240)
            log=f'check-{i+1}.txt';(out/log).write_text(p.stdout+'\n'+p.stderr)
            results.append({'command':cmd,'exit_code':p.returncode,'log':log})
          clean=not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          report={'base':base,'head':head,'changed_file_count':len(changed),'changed_files':changed,'checks':results,'tracked_tree_unchanged':clean,'merged':False,'deployed':False}
          (out/'exact-range-acceptance.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          assert clean, 'Read-only validation mutated tracked content'
          assert all(r['exit_code']==0 for r in results),'One or more exact-range checks failed'
          PY
      - name: Collect public worker source and manifest
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,zipfile,hashlib
          out=pathlib.Path('/tmp/media-source-audit');out.mkdir(exist_ok=True)
          paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          selected=[p for p in paths if p.startswith('ops/media-dashboard/') or p in ['publication-manifests/media-desk-20260905.json','assets/media-desk.css','es/medios-trazabilidad-relato-publico/index.html','en/media-public-narrative-traceability/index.html','assets/data/unitary-route-registry-sync-20260819.json','sitemap-discovery-navigation.xml','.github/workflows/media-dashboard-audit.yml','.github/workflows/media-dashboard-candidate.yml']]
          rows=[]
          with zipfile.ZipFile(out/'public-source-context.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in selected:
              f=pathlib.Path(p);z.write(f,p);rows.append({'path':p,'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()})
          (out/'inventory.json').write_text(json.dumps({'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':paths,'selected':rows,'deployment_verified':False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-source-context
          path: /tmp/media-source-audit/
          retention-days: 14
