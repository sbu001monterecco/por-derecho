name: Prepare DP1901 shame landing on isolated worker
on:
  push:
    branches: [worker/dp1901-shame-landing-20260921]
    paths: [.github/workflows/prepare-dp1901-shame-landing-20260921.yml]
permissions:
  contents: write
concurrency:
  group: prepare-dp1901-shame-landing-20260921
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'sbu001monterecco/por-derecho' && github.ref == 'refs/heads/worker/dp1901-shame-landing-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: worker/dp1901-shame-landing-20260921
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Copy and verify only the authorized public image
        run: |
          python - <<'PY'
          import json, hashlib, urllib.request
          from pathlib import Path
          d=json.loads(Path('assets/data/dp1901-shame-linkedin-20260921.json').read_text())['image']
          url=d['public_transfer_source']
          assert url=='https://cdn.websitepublisher.ai/custom/wid27709/images/dp1901-shame-exits-the-courthouse-ca301b92.png'
          req=urllib.request.Request(url,headers={'User-Agent':'PorDerecho-PublicAsset-Preservation/1.0'})
          with urllib.request.urlopen(req,timeout=45) as r:
              data=r.read(d['bytes']+1)
          assert len(data)==d['bytes'], 'Image byte count differs'
          assert hashlib.sha256(data).hexdigest()==d['sha256'], 'Image fingerprint differs'
          p=Path(d['path']); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)
          print('Exact original PNG copied:',len(data),'bytes',d['sha256'])
          PY
      - name: Build additive landing sections without changing previous dossier text
        run: python scripts/build_dp1901_shame_landing_20260921.py
      - name: Validate satire and publication controls
        run: python scripts/validate_satire_publication_governance.py
      - name: Install bounded rendering dependencies
        run: |
          python -m pip install --quiet pillow beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Verify full text, image and mobile and desktop layout
        run: |
          mkdir -p /tmp/dp1901-landing-review
          python - <<'PY'
          import json, re, subprocess, time
          from pathlib import Path
          from PIL import Image
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright
          root=Path.cwd(); d=json.loads(Path('assets/data/dp1901-shame-linkedin-20260921.json').read_text())
          assert Image.open(d['image']['path']).size==(1055,1491)
          for lang in ('en','es'):
              p=root/lang/'dp-1901-2026/index.html'; soup=BeautifulSoup(p.read_text(),'html.parser')
              section=soup.find(id='shame-has-left-the-building'); assert section
              assert len(soup.select('#shame-has-left-the-building'))==1
              actual=[x.get_text('\n') for x in section.select('article.pd-shame-post > p')]
              assert actual==d['posts'][lang].split('\n\n')[2:], 'Post text altered or missing'
              assert section.find('img')['src']=='../../'+d['image']['path']
              assert len(section.select('.pd-shame-evidence nav a'))==4
          server=subprocess.Popen(['python','-m','http.server','8765','--directory',str(root.parent)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          report=[]
          try:
              time.sleep(1)
              with sync_playwright() as browser:
                  b=browser.chromium.launch()
                  for width in (390,1440):
                      for lang in ('en','es'):
                          page=b.new_page(viewport={'width':width,'height':1100},device_scale_factor=1)
                          page.goto(f'http://127.0.0.1:8765/{root.name}/{lang}/dp-1901-2026/#shame-has-left-the-building',wait_until='networkidle')
                          image=page.locator('#shame-has-left-the-building img'); image.wait_for()
                          assert image.evaluate('(i)=>i.complete && i.naturalWidth===1055 && i.naturalHeight===1491')
                          assert page.locator('#pd-shame-title').is_visible()
                          section=page.locator('#shame-has-left-the-building')
                          assert section.evaluate('(x)=>x.scrollWidth <= x.clientWidth+2'), 'Landing overflows'
                          section.screenshot(path=f'/tmp/dp1901-landing-review/{lang}-{width}.png')
                          report.append({'language':lang,'viewport':width,'image_loaded':True,'complete_post':True,'no_section_overflow':True})
                          page.close()
                  b.close()
          finally:
              server.terminate()
          Path('/tmp/dp1901-landing-review/report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Upload rendered inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: dp1901-shame-landing-review
          path: /tmp/dp1901-landing-review
          retention-days: 14
      - name: Preserve prepared files only on the worker branch
        run: |
          test "$(git branch --show-current)" = 'worker/dp1901-shame-landing-20260921'
          git config user.name 'Por Derecho preparation'
          git config user.email 'noreply@users.noreply.github.com'
          git add assets/visuals/dp1901-shame-20260921/shame-exits-the-courthouse.png assets/social/dp1901-shame-en-20260921.txt assets/social/dp1901-shame-es-20260921.txt en/dp-1901-2026/index.html es/dp-1901-2026/index.html data/satire-publication-compliance-v1.json data/digital-media-asset-register-v1.json archive/DP1901_LINKEDIN_LANDING_EN_ES_20260921.md
          git diff --cached --stat
          git commit -m 'Materialize exact image and complete bilingual DP1901 landing sections'
          git push origin HEAD:refs/heads/worker/dp1901-shame-landing-20260921
