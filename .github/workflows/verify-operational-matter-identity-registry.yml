name: Verify operational matter identity registry

on:
  pull_request:
    paths:
      - 'es/registro-identidad-materia/**'
      - 'en/matter-identity-registry/**'
      - 'assets/matter-identity-registry.css'
      - 'assets/matter-identity-registry.js'
      - 'assets/data/matter-identity-registry-v1*.json'
      - 'assets/data/matter-identity-operational-control-v1.json'
      - 'assets/data/criminal-first-institutional-action-matrix-v1.json'
      - 'assets/data/acosta-matos-functional-convergence-map-v2*.json'
      - 'scripts/validate_operational_identity_registry.py'
      - 'scripts/render_operational_identity_registry.mjs'
      - 'sitemap-matter-identity-operational.xml'
      - 'robots.txt'
      - 'publication-manifests/matter-identity-operational-registry-20260825.json'
      - '.github/workflows/verify-operational-matter-identity-registry.yml'
  push:
    branches: [main]
    paths:
      - 'es/registro-identidad-materia/**'
      - 'en/matter-identity-registry/**'
      - 'assets/matter-identity-registry.css'
      - 'assets/matter-identity-registry.js'
      - 'assets/data/matter-identity-registry-v1*.json'
      - 'assets/data/matter-identity-operational-control-v1.json'
      - 'assets/data/criminal-first-institutional-action-matrix-v1.json'
      - 'assets/data/acosta-matos-functional-convergence-map-v2*.json'
      - 'scripts/validate_operational_identity_registry.py'
      - 'scripts/render_operational_identity_registry.mjs'
      - 'sitemap-matter-identity-operational.xml'
      - 'robots.txt'
      - 'publication-manifests/matter-identity-operational-registry-20260825.json'
      - '.github/workflows/verify-operational-matter-identity-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operational-identity-registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Validate registry, action and graph referential integrity
        run: python3 scripts/validate_operational_identity_registry.py

      - name: Validate JavaScript syntax
        run: |
          node --check assets/matter-identity-registry.js
          node --check scripts/render_operational_identity_registry.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.50.1
          npx playwright install --with-deps chromium

      - name: Serve at the production subpath
        run: |
          mkdir -p /tmp/pd-operational-identity/por-derecho
          cp -a . /tmp/pd-operational-identity/por-derecho/
          cd /tmp/pd-operational-identity
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/pd-operational-identity-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/por-derecho/es/registro-identidad-materia/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pd-operational-identity-http.log
          exit 1

      - name: Render bilingual desktop and mobile workbench
        env:
          PD_ID_BASE_URL: http://127.0.0.1:8000/por-derecho
          PD_ID_SCREENSHOT_DIR: artifacts/operational-identity-registry-20260825
        run: node scripts/render_operational_identity_registry.mjs

      - name: Verify public Pages routes and exact markers
        if: github.event_name != 'pull_request'
        env:
          BASE: https://sbu001monterecco.github.io/por-derecho
        shell: python
        run: |
          import json, os, time, urllib.request

          base = os.environ['BASE'].rstrip('/')
          with open('assets/data/matter-identity-registry-v1.json', encoding='utf-8') as handle:
              expected_total = int(json.load(handle)['counts']['total'])
          checks = [
              ('/es/registro-identidad-materia/', ['PD-SP-IDENTITY-OPS-001', 'Una identidad. Un ID. Una cadena operativa.', 'data-queue-list="p0"']),
              ('/en/matter-identity-registry/', ['PD-SP-IDENTITY-OPS-001', 'One identity. One ID. One operational chain.', 'data-queue-list="p0"']),
              ('/assets/data/matter-identity-operational-control-v1.json', ['PD-SP-ID-ACT-0001', 'PD-SP-ID-ACT-0009', 'PD-SP-O-0008']),
              ('/assets/data/matter-identity-registry-v1.json', ['PD-SP-IDENTITY-REGISTRY-001', f'"total":{expected_total}']),
              ('/assets/matter-identity-registry.js', ['buildOperationalRecords', 'P0_ROUTE_COVERAGE', 'exportRecords']),
              ('/assets/matter-identity-registry.css', ['.id-workbench', '.id-dialog', '.id-action-grid']),
              ('/sitemap-matter-identity-operational.xml', ['registro-identidad-materia', 'matter-identity-registry']),
              ('/robots.txt', ['sitemap-matter-identity-operational.xml']),
          ]

          def fetch(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'por-derecho-operational-identity-verifier/1'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read().decode('utf-8', errors='replace')
                  if response.status != 200:
                      raise RuntimeError(f'HTTP {response.status}')
                  return body

          failures = []
          for route, markers in checks:
              url = base + route
              last = None
              for _ in range(12):
                  try:
                      body = fetch(url)
                      missing = [marker for marker in markers if marker not in body]
                      if not missing:
                          print(f'LIVE VERIFIED {url} :: {len(body)} bytes :: {len(markers)} markers')
                          break
                      last = f'missing markers {missing}'
                  except Exception as exc:
                      last = str(exc)
                  time.sleep(10)
              else:
                  failures.append(f'{url}: {last}')
          if failures:
              raise SystemExit('LIVE VERIFICATION FAILED\n - ' + '\n - '.join(failures))

      - name: Upload screenshots and metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operational-identity-registry-20260825
          path: artifacts/operational-identity-registry-20260825
          if-no-files-found: warn
          retention-days: 14

      - name: Publish verification summary
        if: always()
        run: |
          {
            echo '## Operational matter identity registry verification'
            echo
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- SHA: $GITHUB_SHA"
            echo '- Registry: `PD-SP-IDENTITY-REGISTRY-001`'
            echo '- Operational control: `PD-SP-IDENTITY-OPS-001`'
            echo '- Tracker: Issue #995'
            if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
              echo '- Referential integrity, JavaScript syntax and bilingual desktop/mobile rendering were tested before merge.'
            else
              echo '- Public Spanish/English pages, JSON controls, JavaScript, stylesheet, sitemap and robots discovery were verified by exact markers.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
