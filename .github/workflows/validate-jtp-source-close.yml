name: Validate JTP fee-authority source close

on:
  pull_request:
    paths:
      - 'archive/JTP_FEE_AUTHORITY_PAYMENT_SOURCE_CLOSE_24SEP2026.md'
      - 'assets/data/jtp-fee-authority-source-close-20260924.json'
      - 'en/estate-payment-counsel-independence/index.html'
      - 'es/pago-masa-independencia-defensa/index.html'
      - 'en/counsel-defence-continuity/index.html'
      - 'es/continuidad-defensa-letrados/index.html'
      - 'governance/JTP_PAYMENT_FUNDED_EXIT_HOSTILE_READER_RED_TEAM_24SEP2026.md'
      - 'scripts/validate_jtp_source_close.py'
      - '.github/workflows/validate-jtp-source-close.yml'
  push:
    branches: [main]
    paths:
      - 'archive/JTP_FEE_AUTHORITY_PAYMENT_SOURCE_CLOSE_24SEP2026.md'
      - 'assets/data/jtp-fee-authority-source-close-20260924.json'
      - 'en/estate-payment-counsel-independence/index.html'
      - 'es/pago-masa-independencia-defensa/index.html'
      - 'en/counsel-defence-continuity/index.html'
      - 'es/continuidad-defensa-letrados/index.html'
      - 'governance/JTP_PAYMENT_FUNDED_EXIT_HOSTILE_READER_RED_TEAM_24SEP2026.md'
      - 'scripts/validate_jtp_source_close.py'
      - '.github/workflows/validate-jtp-source-close.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate source-close contract
        run: python3 scripts/validate_jtp_source_close.py
