permissions:
  actions: read
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify deterministic project-safe reciprocal links
        run: python scripts/build_alberto_meeting_point_project_links.py --check
      - name: Validate specialist graph and finite caret census
        run: python scripts/validate_alberto_meeting_point_cross_proceeding.py
      - name: Validate first-hop rendered caret provenance
        run: python scripts/validate_alberto_meeting_point_first_hop_caret.py
      - name: Validate canonical identity registry
        run: python scripts/validate_operational_identity_registry.py
      - name: Validate scope separation in the current digest
        run: python scripts/validate_current_reverse_engineered_digest.py

  verify-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE: https://sbu001monterecco.github.io/por-derecho
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Attest successful Pages deployment for the exact pushed SHA
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import json
          import os
          import time
          import urllib.request

          repository = os.environ['REPOSITORY']
          expected_sha = os.environ['EXPECTED_SHA']
          token = os.environ['GH_TOKEN']
          api = (
              f'https://api.github.com/repos/{repository}/actions/runs'
              f'?head_sha={expected_sha}&per_page=100'
          )
          last_seen = []
          for attempt in range(1, 49):
              request = urllib.request.Request(
                  api,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'por-derecho-am357-pages-attestation/2',
                  },
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  payload = json.load(response)
              candidates = [
                  run for run in payload.get('workflow_runs', [])
                  if run.get('name') == 'pages build and deployment'
                  and run.get('path') == 'dynamic/pages/pages-build-deployment'
                  and run.get('head_sha') == expected_sha
              ]
              last_seen = [
                  {
                      'id': run.get('id'),
                      'head_sha': run.get('head_sha'),
                      'status': run.get('status'),
                      'conclusion': run.get('conclusion'),
                      'html_url': run.get('html_url'),
                  }
                  for run in candidates
              ]
              successful = next(
                  (
                      run for run in candidates
                      if run.get('status') == 'completed'
                      and run.get('conclusion') == 'success'
                  ),
                  None,
              )
              if successful:
                  print(json.dumps({
                      'state': 'EXACT_PAGES_RUN_ATTESTED',
                      'expected_sha': expected_sha,
                      'pages_run_id': successful.get('id'),
                      'pages_run_number': successful.get('run_number'),
                      'pages_head_sha': successful.get('head_sha'),
                      'pages_url': successful.get('html_url'),
                      'attempt': attempt,
                  }, sort_keys=True))
                  raise SystemExit(0)
              print(f'Pages attestation attempt {attempt}/48: pending', flush=True)
              if attempt < 48:
                  time.sleep(10)

          print(json.dumps({
              'state': 'EXACT_PAGES_RUN_NOT_ATTESTED',
              'expected_sha': expected_sha,
              'last_seen': last_seen,
          }, sort_keys=True))
          raise SystemExit(1)
      - name: Read back exact deployed cross-proceeding graph
        shell: python
        run: |
          import hashlib
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          base = os.environ['BASE'].rstrip('/')
          head_sha = os.environ['GITHUB_SHA']
          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()

          class DocumentParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.anchors = []
                  self.ids = set()
                  self.links = []
                  self.meta = []

              def handle_starttag(self, tag, attrs):
                  item = dict(attrs)
                  if item.get('id'):
                      self.ids.add(item['id'])
                  if tag == 'a' and item.get('href'):
                      self.anchors.append(item['href'])
                  elif tag == 'link':
                      self.links.append(item)
                  elif tag == 'meta':
                      self.meta.append(item)

          def fetch_bytes(route):
              separator = '&' if '?' in route else '?'
              url = f'{base}{route}{separator}am357_live={head_sha}-{time.time_ns()}'
              request = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'por-derecho-am357-live-readback/1',
                      'Cache-Control': 'no-cache',
                      'Pragma': 'no-cache',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{route}: HTTP {response.status}')
                  return response.read()

          hubs = {
              'es': '/es/alberto-lopez-villarrubia-meeting-point-357-masa-activa/',
              'en': '/en/alberto-lopez-villarrubia-meeting-point-357-active-estate/',
          }
          source_routes = {
              'es': [
                  '/es/concurso-36-2012-magistrado-juez/#ledger',
                  '/es/concurso-36-2012-masa-activa-2018-2021/#contradiccion',
                  '/es/toma-control-sun-park-7-junio-2018/#hechos-7-junio',
                  '/es/adjudicacion-2022-reconstruccion-documental/',
                  '/es/lava-verde-club-sei-meeting-point/#cadena',
                  '/es/fti-touristik-meeting-point-insolvencia-preconcurso-bluesea/#sepi',
                  '/es/cuaderno-juridico/meeting-point-357-2024-trazabilidad-judicial/#registro',
                  '/es/ona-hotels-salida-concurso-36-2012/expediente-unitario-abril-2018-octubre-2019/',
                  '/es/reconstruccion-unitaria-autoridades-publicas/',
              ],
              'en': [
                  '/en/insolvency-36-2012-mercantile-court-1/#ledger',
                  '/en/insolvency-36-2012-active-estate-2018-2021/#contradiction',
                  '/en/sun-park-takeover-7-june-2018/#events-of-7-june',
                  '/en/2022-adjudication-documentary-reconstruction/',
                  '/en/lava-verde-club-sei-meeting-point/#chain',
                  '/en/fti-touristik-meeting-point-insolvency-preinsolvency-bluesea/#sepi',
                  '/en/legal-notebook/meeting-point-357-2024-judicial-traceability/#register',
                  '/en/ona-hotels-insolvency-exit-36-2012/unitary-record-april-2018-october-2019/',
                  '/en/public-authority-unitary-case-reconstruction/',
              ],
          }
          support_routes = [
              '/es/registro-identidad-materia/',
              '/es/verificacion-caepr-caret-digest-unitario/',
              '/es/ingenieria-inversa-criminal-unitaria/',
              '/es/hipotesis-criminal-unitaria-2011-presente/',
              '/en/matter-identity-registry/',
              '/en/caepr-caret-unitary-digest/',
              '/en/unitary-criminal-reverse-engineering/',
              '/en/unitary-criminal-hypothesis-2011-present/',
          ]
          legacy_route = '/es/concurso-36-2012-juzgado-mercantil-1/'
          matrix_route = '/assets/data/alberto-meeting-point-357-multidirectional-evidence-v1.json'
          manifest_route = '/publication-manifests/alberto-meeting-point-multidirectional-criminal-first-20260827.json'

          def route_to_path(route):
              clean = route.split('#', 1)[0].split('?', 1)[0].lstrip('/')
              return clean + 'index.html' if clean.endswith('/') else clean

          candidate_paths = [
              route_to_path(route)
              for route in (
                  list(hubs.values())
                  + [
                      route.split('#', 1)[0]
                      for language in ('es', 'en')
                      for route in source_routes[language]
                  ]
                  + support_routes
                  + [legacy_route]
              )
          ]
          candidate_paths += [
              'assets/data/alberto-meeting-point-357-multidirectional-evidence-v1.json',
              'assets/data/caepr-caret-alberto-meeting-point-357-v1.json',
              'assets/data/caepr-caret-unitary-digest-v1.json',
              'assets/data/matter-identity-registry-v1.json',
              'publication-manifests/alberto-meeting-point-multidirectional-criminal-first-20260827.json',
              'CURRENT_REVERSE_ENGINEERED_DIGEST.md',
              'ops/CURRENT_REVERSE_ENGINEERED_DIGEST.json',
              'sitemap.xml',
              'sitemap-cgpj.xml',
              'sitemap-judicial-spine.xml',
              'sitemap-meeting-point.xml',
          ]
          first_hop_path = 'assets/data/caepr-caret-alberto-meeting-point-first-hop-v1.json'
          if (workspace / first_hop_path).is_file():
              candidate_paths.append(first_hop_path)
          assert len(source_routes['es']) + len(source_routes['en']) == 18
          assert len(support_routes) == 8
          assert len(candidate_paths) == len(set(candidate_paths))

          def path_to_route(path):
              if path.endswith('/index.html'):
                  return '/' + path[:-len('index.html')]
              return '/' + path

          local_bytes = {}
          for path in candidate_paths:
              resolved = (workspace / path).resolve()
              if workspace not in resolved.parents:
                  raise AssertionError(f'candidate escapes checkout: {path}')
              if not resolved.is_file():
                  raise AssertionError(f'missing candidate file: {path}')
              local_bytes[path] = resolved.read_bytes()

          live_bytes = {}
          last_mismatches = []
          for attempt in range(1, 49):
              current = {}
              mismatches = []
              for path in candidate_paths:
                  route = path_to_route(path)
                  try:
                      remote = fetch_bytes(route)
                      current[route] = remote
                  except Exception as exc:
                      mismatches.append({'path': path, 'error': str(exc)})
                      continue
                  local = local_bytes[path]
                  if remote != local:
                      mismatches.append({
                          'path': path,
                          'local_sha256': hashlib.sha256(local).hexdigest(),
                          'live_sha256': hashlib.sha256(remote).hexdigest(),
                      })
              if not mismatches:
                  live_bytes = current
                  break
              last_mismatches = mismatches
              print(
                  f'Exact-byte readback attempt {attempt}/48: '
                  f'{len(mismatches)} mismatch(es)',
                  flush=True,
              )
              if attempt < 48:
                  time.sleep(10)
          else:
              raise SystemExit(
                  'LIVE RELEASE GATE FAILED: exact-byte mismatch after '
                  f'Pages attestation: {json.dumps(last_mismatches, sort_keys=True)}'
              )

          bodies = {
              route: payload.decode('utf-8', errors='strict')
              for route, payload in live_bytes.items()
          }

          def body(route):
              clean = route.split('#', 1)[0]
              return bodies[clean]

          def document(route):
              parser = DocumentParser()
              parser.feed(body(route))
              return parser

          def absolute_links(route):
              page_url = base + route
              return {urljoin(page_url, href) for href in document(route).anchors}

          def require_link(source, target):
              expected = base + target
              if expected not in absolute_links(source):
