name: Verify publication live state

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-publication-live
  cancel-in-progress: false

jobs:
  live-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify deployed/live manifests against public host
        run: python scripts/validate_publication_integrity.py --live
