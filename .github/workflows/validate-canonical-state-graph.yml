name: Validate canonical state graph

on:
  pull_request:
    paths:
      - 'governance/CANONICAL_STATE_GRAPH_TRUTH_MACHINE_26SEP2026.md'
      - 'assets/data/canonical-state-graph-overlay-v1.json'
      - 'assets/data/matter-identity-registry-v1.people.json'
      - 'assets/data/matter-identity-registry-v1.organisations.json'
      - 'assets/data/matter-identity-registry-v1.institutions.json'
      - 'assets/data/matter-identity-registry-v1.proceedings.json'
      - 'assets/data/concurso36-complete-record-v1.json'
      - 'assets/data/concurso36-court-file-v1.json'
      - 'scripts/validate_canonical_state_graph_truth_machine.py'
      - 'archive/knowledge-project/SUN_PARK_CANONICAL_REGISTER_READ_FIRST.md'
      - 'AGENTS.md'
  push:
    branches: [main]
    paths:
      - 'governance/CANONICAL_STATE_GRAPH_TRUTH_MACHINE_26SEP2026.md'
      - 'assets/data/canonical-state-graph-overlay-v1.json'
      - 'assets/data/matter-identity-registry-v1.people.json'
      - 'assets/data/matter-identity-registry-v1.organisations.json'
      - 'assets/data/matter-identity-registry-v1.institutions.json'
      - 'assets/data/matter-identity-registry-v1.proceedings.json'
      - 'assets/data/concurso36-complete-record-v1.json'
      - 'assets/data/concurso36-court-file-v1.json'
      - 'scripts/validate_canonical_state_graph_truth_machine.py'

permissions:
  contents: read

jobs:
  canonical-state-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical state graph
        run: python3 scripts/validate_canonical_state_graph_truth_machine.py
