name: Publication integrity gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publication-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate publication and deletion-safety invariants
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/validate_publication_integrity.py
      - name: Validate operational control-plane invariants
        run: python scripts/validate_operational_items.py
      - name: Validate DIP 80 living casebook
        run: python scripts/validate_dip80_casebook.py
      - name: Smoke-test DIP 80 internal navigation and responsive structure
        run: python scripts/smoke_dip80_navigation.py
      - name: Render DIP 80 mobile casebook in headless Chrome
        shell: bash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/dip80-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 1
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          url="http://127.0.0.1:8765/es/icalpa-mesa-del-ponente/dip-80-2026/manual-vivo/"
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --run-all-compositor-stages-before-draw --virtual-time-budget=3000 --window-size=390,844 --screenshot=/tmp/dip80-mobile.png "$url"
          test -s /tmp/dip80-mobile.png
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --run-all-compositor-stages-before-draw --virtual-time-budget=3000 --window-size=390,844 --dump-dom "$url" >/tmp/dip80-mobile-dom.html
          grep -q 'AHORA: ¿qué decisión humana requiere el expediente?' /tmp/dip80-mobile-dom.html
          if ! grep -q 'Pasivo y créditos controvertidos' /tmp/dip80-mobile-dom.html; then
            echo 'Dynamic module render missing; server requests:'
            cat /tmp/dip80-http.log
            echo 'DOM error markers:'
            grep -E 'Casebook data unavailable|app-error|modules' /tmp/dip80-mobile-dom.html | head -20 || true
            exit 1
          fi
          grep -q '>M01<' /tmp/dip80-mobile-dom.html
          sha256sum /tmp/dip80-mobile.png
      - name: Validate mission-critical repository invariants
        run: python scripts/validate_mission_critical_repo.py
