name: CI root-cause one-shot canonical parity repair

on:
  push:
    branches:
      - fix/ci-control-plane-root-cause-20260904
    paths:
      - '.github/workflows/ci-root-cause-selfpatch-20260904.yml'

permissions:
  contents: write

concurrency:
  group: ci-root-cause-one-shot-parity-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/ci-control-plane-root-cause-20260904
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Synchronize canonical identity registry surfaces and remove brittle date lock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')
          registry_path = root / 'assets/data/matter-identity-registry-v1.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          counts = registry['counts']
          control_date = registry['control_date']
          assert counts == {
              'total': 351,
              'PERSON': 165,
              'ORGANISATION': 83,
              'STRUCTURE': 11,
              'INSTITUTION': 49,
              'PROCEEDING': 43,
          }, counts
          assert control_date == '2026-09-03', control_date

          labels = {
              'en': {
                  'path': root / 'en/matter-identity-registry/index.html',
                  'people': 'people', 'organisations': 'organisations', 'structures': 'structures',
                  'institutions': 'institutions', 'proceedings': 'proceedings',
                  'eyebrow_old': '2 SEPTEMBER 2026', 'eyebrow_new': '3 SEPTEMBER 2026',
                  'coverage_prefix': 'The',
              },
              'es': {
                  'path': root / 'es/registro-identidad-materia/index.html',
                  'people': 'personas', 'organisations': 'organizaciones', 'structures': 'estructuras',
                  'institutions': 'instituciones', 'proceedings': 'procedimientos',
                  'eyebrow_old': '2 SEPTIEMBRE 2026', 'eyebrow_new': '3 SEPTIEMBRE 2026',
                  'coverage_prefix': 'Los',
              },
          }

          marker = '-'.join(str(counts[k]) for k in ('total','PERSON','ORGANISATION','STRUCTURE','INSTITUTION','PROCEEDING'))

          for lang, cfg in labels.items():
              path = cfg['path']
              text = path.read_text(encoding='utf-8')
              text = text.replace(cfg['eyebrow_old'], cfg['eyebrow_new'])
              text = re.sub(r'data-static-registry-counts="[0-9-]+"', f'data-static-registry-counts="{marker}"', text, count=1)
              for key in ('TOTAL','PERSON','ORGANISATION','STRUCTURE','INSTITUTION','PROCEEDING'):
                  value = counts['total'] if key == 'TOTAL' else counts[key]
                  text = re.sub(rf'(data-registry-stat="{key}">)\d+', rf'\g<1>{value}', text, count=1)

              # Update prose denominator wherever this page describes the canonical register.
              if lang == 'en':
                  text = re.sub(
                      r'\b(?:348|350|351) (?:immutable IDs|canonical identities|identities)',
                      lambda m: f"{counts['total']} " + m.group(0).split(' ',1)[1], text)
                  text = text.replace('162 people', f"{counts['PERSON']} people")
                  text = text.replace('48 institutions', f"{counts['INSTITUTION']} institutions")
                  text = text.replace('44 institutions', f"{counts['INSTITUTION']} institutions")
                  text = text.replace('<strong>348 IDs</strong>', f"<strong>{counts['total']} IDs</strong>")
                  text = text.replace('static canonical denominator is 348', f"static canonical denominator is {counts['total']}")
              else:
                  text = re.sub(
                      r'\b(?:348|350|351) (?:IDs inmutables|identidades canónicas|identidades)',
                      lambda m: f"{counts['total']} " + m.group(0).split(' ',1)[1], text)
                  text = text.replace('162 personas', f"{counts['PERSON']} personas")
                  text = text.replace('48 instituciones', f"{counts['INSTITUTION']} instituciones")
                  text = text.replace('44 instituciones', f"{counts['INSTITUTION']} instituciones")
                  text = text.replace('<strong>348 IDs</strong>', f"<strong>{counts['total']} IDs</strong>")
                  text = text.replace('denominador canónico estático es 348', f"denominador canónico estático es {counts['total']}")

              # Update the structured Dataset without hand-editing its JSON.
              match = re.search(r'(<script type="application/ld\+json">)(.*?)(</script>)', text, re.S)
              assert match, path
              dataset = json.loads(match.group(2))
              dataset['dateModified'] = control_date
              for item in dataset.get('variableMeasured', []):
                  name = item.get('name')
                  mapping_en = {'Total':'total','People':'PERSON','Organisations':'ORGANISATION','Structures':'STRUCTURE','Institutions':'INSTITUTION','Proceedings':'PROCEEDING'}
                  mapping_es = {'Total':'total','Personas':'PERSON','Organizaciones':'ORGANISATION','Estructuras':'STRUCTURE','Instituciones':'INSTITUTION','Procedimientos':'PROCEEDING'}
                  mapping = mapping_en if lang == 'en' else mapping_es
                  if name in mapping:
                      item['value'] = counts[mapping[name]]
              if lang == 'en':
                  dataset['description'] = f"Canonical register of {counts['total']} identities: {counts['PERSON']} people, {counts['ORGANISATION']} organisations, {counts['STRUCTURE']} structures, {counts['INSTITUTION']} institutions and {counts['PROCEEDING']} proceedings, connected to institutional actions and an evidence graph."
              else:
                  dataset['description'] = f"Registro canónico de {counts['total']} identidades: {counts['PERSON']} personas, {counts['ORGANISATION']} organizaciones, {counts['STRUCTURE']} estructuras, {counts['INSTITUTION']} instituciones y {counts['PROCEEDING']} procedimientos, conectado con acciones institucionales y un grafo probatorio."
              dataset_text = json.dumps(dataset, ensure_ascii=False, separators=(',', ':'))
              text = text[:match.start(2)] + dataset_text + text[match.end(2):]
              path.write_text(text, encoding='utf-8')

          state_path = root / 'ops/CURRENT_UNITARY_STATE.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          identity = state['identity_registry']
          identity['control_date'] = control_date
          identity['counts'] = counts.copy()
          identity['total'] = counts['total']
          identity['INSTITUTION'] = counts['INSTITUTION']
          identity['PROCEEDING'] = counts['PROCEEDING']
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          validator_path = root / 'scripts/validate_dp3205_2014_publication.py'
          validator = validator_path.read_text(encoding='utf-8')
          old = '''require(registry_control_date == "2026-09-02", "canonical current registry control date is stale")
          includes(registry_en, f'"dateModified":"{registry_control_date}"', relative(REGISTRY_EN))
          includes(registry_en, "2 SEPTEMBER 2026", relative(REGISTRY_EN))
          includes(registry_es, f'"dateModified":"{registry_control_date}"', relative(REGISTRY_ES))
          includes(registry_es, "2 SEPTIEMBRE 2026", relative(REGISTRY_ES))'''.replace('          ', '')
          new = '''require(
              isinstance(registry_control_date, str)
              and bool(re.fullmatch(r"\\d{4}-\\d{2}-\\d{2}", registry_control_date))
              and registry_control_date >= "2026-09-02",
              "canonical current registry control date is malformed or predates the controlled release",
          )
          includes(registry_en, f'"dateModified":"{registry_control_date}"', relative(REGISTRY_EN))
          includes(registry_es, f'"dateModified":"{registry_control_date}"', relative(REGISTRY_ES))'''.replace('          ', '')
          assert old in validator, 'expected brittle registry-date block not found'
          validator_path.write_text(validator.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate repaired 3205 and mission-critical policy except this one-shot writer
        run: |
          python -B scripts/validate_dp3205_2014_publication.py
          python -B -m py_compile scripts/production_smoke_check_v2.py

      - name: Commit only the canonical parity repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            en/matter-identity-registry/index.html \
            es/registro-identidad-materia/index.html \
            ops/CURRENT_UNITARY_STATE.json \
            scripts/validate_dp3205_2014_publication.py
          git diff --cached --check
          git commit -m 'CI: synchronize canonical identity registry state'
          git push origin HEAD:fix/ci-control-plane-root-cause-20260904

# One-shot branch-only repair runner. Delete after its repair commit succeeds.
