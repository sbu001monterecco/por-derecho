name: Temporary sync identity-registry static parity

on:
  push:
    branches:
      - agent/workspace-persistence-closeout-20260901
    paths:
      - 'scripts/sync_matter_identity_registry_static.py'
      - '.github/workflows/temporary-sync-identity-registry-static.yml'

permissions:
  contents: write

concurrency:
  group: temporary-identity-registry-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Generate canonical static parity
        run: |
          python -m py_compile scripts/sync_matter_identity_registry_static.py
          python scripts/sync_matter_identity_registry_static.py --write
          python scripts/sync_matter_identity_registry_static.py --check

      - name: Validate repaired publication and workspace controls
        run: |
          python -m py_compile scripts/validate_dp3205_2014_publication.py
          python -B scripts/validate_dp3205_2014_publication.py
          python -B scripts/workspace_persistence.py validate-repository

      - name: Remove one-shot workflow and commit generated parity
        shell: bash
        run: |
          rm -f .github/workflows/temporary-sync-identity-registry-static.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            en/matter-identity-registry/index.html \
            es/registro-identidad-materia/index.html \
            ops/CURRENT_UNITARY_STATE.json \
            scripts/validate_dp3205_2014_publication.py \
            scripts/sync_matter_identity_registry_static.py \
            .github/workflows/temporary-sync-identity-registry-static.yml
          if git diff --cached --quiet; then
            echo "No generated parity changes to commit"
            exit 0
          fi
          git commit -m "Synchronize canonical identity registry static parity"
          git push origin "HEAD:${GITHUB_REF_NAME}"
