name: Evidence control plane contract

on:
  pull_request:
    paths:
      - 'ops/evidence-control-plane/**'
      - 'ops/federation/**'
      - 'schemas/por-derecho-evidence-control-plane-v1.schema.json'
      - 'schemas/por-derecho-federation-envelope-v1.schema.json'
      - 'scripts/validate_evidence_control_plane.py'
      - 'scripts/validate_federation_bridge.py'
      - 'tests/test_evidence_control_plane.py'
      - 'tests/test_federation_bridge.py'
      - '.github/workflows/evidence-control-plane-contract.yml'
  push:
    branches: [main]
    paths:
      - 'ops/evidence-control-plane/**'
      - 'ops/federation/**'
      - 'schemas/por-derecho-evidence-control-plane-v1.schema.json'
      - 'schemas/por-derecho-federation-envelope-v1.schema.json'
      - 'scripts/validate_evidence_control_plane.py'
      - 'scripts/validate_federation_bridge.py'
      - 'tests/test_evidence_control_plane.py'
      - 'tests/test_federation_bridge.py'
      - '.github/workflows/evidence-control-plane-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned schema validator
        run: python3 -m pip install --disable-pip-version-check --quiet jsonschema==4.25.1
      - name: Run evidence control plane unit tests
        run: python3 -m unittest tests/test_evidence_control_plane.py -v
      - name: Validate portable evidential contract
        run: python3 scripts/validate_evidence_control_plane.py
      - name: Run recursive federation unit tests
        run: python3 -m unittest tests/test_federation_bridge.py -v
      - name: Validate recursive federated state exchange
        run: python3 scripts/validate_federation_bridge.py
