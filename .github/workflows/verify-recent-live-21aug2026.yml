name: Verify 21 August asset recovery and CGPJ live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-recent-live-21aug2026.yml'
      - 'scripts/verify_recent_live_21aug2026.py'
      - 'assets/site.js'
      - 'assets/asset-recovery-preservation-20260821.js'
      - 'en/asset-recovery-intervention-confiscation/**'
      - 'es/recuperacion-activos-intervencion-decomiso/**'
      - 'en/cgpj-public-prosecution-routing-update-20-august-2026/**'
      - 'es/actualizacion-cgpj-fiscalia-20-agosto-2026/**'
      - 'sitemap-asset-recovery.xml'
      - 'sitemap-cgpj.xml'
  pull_request:
    paths:
      - '.github/workflows/verify-recent-live-21aug2026.yml'
      - 'scripts/verify_recent_live_21aug2026.py'
      - 'assets/site.js'
      - 'assets/asset-recovery-preservation-20260821.js'
      - 'en/asset-recovery-intervention-confiscation/**'
      - 'es/recuperacion-activos-intervencion-decomiso/**'
      - 'en/cgpj-public-prosecution-routing-update-20-august-2026/**'
      - 'es/actualizacion-cgpj-fiscalia-20-agosto-2026/**'
      - 'sitemap-asset-recovery.xml'
      - 'sitemap-cgpj.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recent-live-20260821-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify production routes and exact markers
        run: |
          python scripts/verify_recent_live_21aug2026.py \
            --attempts 5 \
            --interval 20 \
            --timeout 25 \
            --output artifacts/recent-live-20260821/result.json
      - name: Upload route-level production evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recent-live-20260821
          path: artifacts/recent-live-20260821/result.json
          if-no-files-found: error
          retention-days: 30
