name: Activate operative Cuatrecasas source language
on:
  push:
    branches: [agent/cuatrecasas-operative-closeout-20260927]
    paths: [.github/workflows/cuatrecasas-operative-source-20260927.yml]
permissions:
  contents: write
concurrency:
  group: cuatrecasas-operative-source-20260927
  cancel-in-progress: false
jobs:
  prepare-reviewed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/cuatrecasas-operative-closeout-20260927
          fetch-depth: 0
      - name: Transform and verify additive changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 -m py_compile scripts/activate_cuatrecasas_workprogramme_20260927.py
          python3 scripts/activate_cuatrecasas_workprogramme_20260927.py --apply --commit
          python3 scripts/validate_repository_preservation.py
          python3 scripts/validate_publication_integrity.py
          python3 scripts/validate_audience_experience.py
          git diff --check
          git rm -- .github/workflows/cuatrecasas-operative-source-20260927.yml
          git commit -m 'Remove completed one-off operative-language runner before review'
          git push origin HEAD:refs/heads/agent/cuatrecasas-operative-closeout-20260927
