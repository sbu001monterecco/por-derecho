name: Verify 2022 adjudication reconstruction live

on:
  push:
    branches: [main]
    paths:
      - 'es/adjudicacion-2022-reconstruccion-documental/index.html'
      - 'en/2022-adjudication-documentary-reconstruction/index.html'
      - 'publication-manifests/adjudicacion-2022-reconstruction-2026-08-19.json'
      - 'sitemap-adjudicacion-2022.xml'
      - '.github/workflows/verify-adjudicacion-2022-live.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-adjudicacion-2022-live
  cancel-in-progress: false

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Poll public GitHub Pages routes
        id: verify
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base = "https://sbu001monterecco.github.io/por-derecho"
          source_sha = os.environ["SOURCE_SHA"]
          run_id = os.environ["RUN_ID"]
          cache_bust = f"source={source_sha[:12]}&run={run_id}"
          targets = {
              "es": {
                  "url": f"{base}/es/adjudicacion-2022-reconstruccion-documental/?{cache_bust}",
                  "markers": [
                      "Reconstrucción activa",
                      "13.168.082,02 €",
                      "No se afirma que exista una única acción",
                      "/por-derecho/en/2022-adjudication-documentary-reconstruction/",
                  ],
              },
              "en": {
                  "url": f"{base}/en/2022-adjudication-documentary-reconstruction/?{cache_bust}",
                  "markers": [
                      "Active reconstruction",
                      "EUR 13,168,082.02",
                      "This page does not claim that one proceeding",
                      "/por-derecho/es/adjudicacion-2022-reconstruccion-documental/",
                  ],
              },
              "sitemap": {
                  "url": f"{base}/sitemap-adjudicacion-2022.xml?{cache_bust}",
                  "markers": [
                      "/por-derecho/es/adjudicacion-2022-reconstruccion-documental/",
                      "/por-derecho/en/2022-adjudication-documentary-reconstruction/",
                  ],
              },
          }

          def fetch(url: str):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Por-Derecho-adjudicacion-live-verifier/1.0",
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                  },
              )
              with urllib.request.urlopen(req, timeout=25) as response:
                  return response.status, response.read().decode("utf-8", "replace")

          last = {}
          for attempt in range(1, 31):
              checks = {}
              details = {}
              for name, target in targets.items():
                  try:
                      status, body = fetch(target["url"])
                      marker_checks = {marker: marker in body for marker in target["markers"]}
                      checks[f"{name}_http_200"] = status == 200
                      checks[f"{name}_markers"] = all(marker_checks.values())
                      details[name] = {
                          "status": status,
                          "bytes": len(body.encode("utf-8")),
                          "markers": marker_checks,
                      }
                  except Exception as exc:
                      checks[f"{name}_http_200"] = False
                      checks[f"{name}_markers"] = False
                      details[name] = {"error": repr(exc)}

              last = {
                  "attempt": attempt,
                  "source_sha": source_sha,
                  "run_id": run_id,
                  "checks": checks,
                  "details": details,
                  "urls": {name: target["url"] for name, target in targets.items()},
              }
              print(json.dumps(last, ensure_ascii=False, indent=2))
              if all(checks.values()):
                  evidence = {"status": "LIVE_VERIFIED", **last}
                  with open("/tmp/adjudicacion-2022-live-verification.json", "w", encoding="utf-8") as handle:
                      json.dump(evidence, handle, ensure_ascii=False, indent=2)
                  raise SystemExit(0)
              time.sleep(5)

          evidence = {"status": "NOT_VERIFIED", **last}
          with open("/tmp/adjudicacion-2022-live-verification.json", "w", encoding="utf-8") as handle:
              json.dump(evidence, handle, ensure_ascii=False, indent=2)
          raise SystemExit(1)
          PY

      - name: Show live-verification evidence
        if: always()
        run: cat /tmp/adjudicacion-2022-live-verification.json || true

      - name: Publish live-verification commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["SOURCE_SHA"]
          run_id = os.environ["RUN_ID"]
          success = os.environ["VERIFY_OUTCOME"] == "success"
          payload = {
              "state": "success" if success else "failure",
              "target_url": f"https://github.com/{repository}/actions/runs/{run_id}",
              "description": (
                  "Bilingual 2022 adjudication reconstruction verified live"
                  if success
                  else "2022 adjudication reconstruction not verified live"
              ),
              "context": "pages-propagation/adjudicacion-2022",
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/statuses/{sha}",
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "Por-Derecho-adjudicacion-live-verifier/1.0",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.read().decode("utf-8", "replace"))
          PY

      - name: Fail when public-edge verification did not succeed
        if: steps.verify.outcome != 'success'
        run: exit 1
