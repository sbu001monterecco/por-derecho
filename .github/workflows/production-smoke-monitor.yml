name: Production smoke monitor

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production-smoke-monitor.yml'
      - 'scripts/production_smoke_check.py'
      - 'es/rsm/**'
      - 'en/rsm/**'
  pull_request:
    paths:
      - '.github/workflows/production-smoke-monitor.yml'
      - 'scripts/production_smoke_check.py'
      - 'es/rsm/**'
      - 'en/rsm/**'
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-smoke-monitor
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check the public production host
        id: smoke
        continue-on-error: true
        run: |
          python scripts/production_smoke_check.py \
            --attempts 2 \
            --interval 15 \
            --timeout 20 \
            --output artifacts/production-smoke/latest.json
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-smoke-evidence
          path: artifacts/production-smoke/latest.json
          if-no-files-found: error
          retention-days: 30
      - name: Open or update a production incident
        if: steps.smoke.outcome != 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '[PRODUCTION] GitHub Pages smoke check failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = data.find(issue => !issue.pull_request && issue.title === title);
            const body = [
              'Mission-critical production smoke verification failed.',
              '',
              `Workflow: ${runUrl}`,
              `Commit: ${context.sha}`,
              `Detected: ${new Date().toISOString()}`,
              '',
              'Use `ops/GITHUB_MISSION_CRITICAL_RUNBOOK.md` before making production changes.',
              'The workflow artifact `production-smoke-evidence` contains route-level HTTP and marker evidence.'
            ].join('\n');
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
      - name: Fail the workflow when production is unhealthy
        if: steps.smoke.outcome != 'success'
        run: exit 1
