name: Validate Treasury transparency 7/2026

on:
  pull_request:
    paths:
      - "es/tesoro-transparencia-7-2026-28agosto/**"
      - "en/treasury-transparency-7-2026-28-august/**"
      - "es/deuda-publica-ric-canarias/**"
      - "en/canary-ric-public-debt/**"
      - "es/ricpe-responsabilidad-documental/**"
      - "en/ricpe-documentary-accountability/**"
      - "es/registros-institucionales/**"
      - "en/institutional-records/**"
      - "assets/data/treasury-transparency-7-2026-v1.json"
      - "assets/data/unitary-route-registry-v1.json"
      - "archive/TESORO_TRANSPARENCIA_7_2026_CONTINUITY_AUDIT_28AUG2026.md"
      - "archive/PROCEEDINGS_MASTER_REGISTER.csv"
      - "archive/MASTER_PROCEEDINGS_REGISTER_INTERNAL_20AUG2026.md"
      - "archive/CORRECTION_REGISTER.md"
      - "archive/MISSING_EVIDENCE_REGISTER.md"
      - "archive/CONTINUOUS_MAINTENANCE_MATRIX.md"
      - "publication-manifests/treasury-transparency-7-2026-20260830.json"
      - "docs/deletion-audits/2026-08-30-treasury-transparency-7-2026.md"
      - "sitemap-treasury-transparency-7-2026.xml"
      - "robots.txt"
      - "scripts/validate_treasury_transparency_7_2026.py"
      - ".github/workflows/validate-treasury-transparency-7-2026.yml"
  push:
    branches: [main]
    paths:
      - "es/tesoro-transparencia-7-2026-28agosto/**"
      - "en/treasury-transparency-7-2026-28-august/**"
      - "es/deuda-publica-ric-canarias/**"
      - "en/canary-ric-public-debt/**"
      - "es/ricpe-responsabilidad-documental/**"
      - "en/ricpe-documentary-accountability/**"
      - "es/registros-institucionales/**"
      - "en/institutional-records/**"
      - "assets/data/treasury-transparency-7-2026-v1.json"
      - "assets/data/unitary-route-registry-v1.json"
      - "archive/TESORO_TRANSPARENCIA_7_2026_CONTINUITY_AUDIT_28AUG2026.md"
      - "archive/PROCEEDINGS_MASTER_REGISTER.csv"
      - "archive/MASTER_PROCEEDINGS_REGISTER_INTERNAL_20AUG2026.md"
      - "archive/CORRECTION_REGISTER.md"
      - "archive/MISSING_EVIDENCE_REGISTER.md"
      - "archive/CONTINUOUS_MAINTENANCE_MATRIX.md"
      - "publication-manifests/treasury-transparency-7-2026-20260830.json"
      - "docs/deletion-audits/2026-08-30-treasury-transparency-7-2026.md"
      - "sitemap-treasury-transparency-7-2026.xml"
      - "robots.txt"
      - "scripts/validate_treasury_transparency_7_2026.py"
      - ".github/workflows/validate-treasury-transparency-7-2026.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python scripts/validate_treasury_transparency_7_2026.py
