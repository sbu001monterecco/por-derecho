name: RICPE public source and web discovery

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-source-and-web-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run bounded official-source snapshot
        run: |
          mkdir -p recovery-audit
          python scripts/ricpe_public_source_watch.py --output recovery-audit/RICPE_PUBLIC_SOURCE_WATCH.json
      - name: Run bounded public-web discovery
        run: |
          python scripts/ricpe_public_web_discovery.py --output recovery-audit/RICPE_PUBLIC_WEB_DISCOVERY.json
      - name: Preserve raw intake artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ricpe-public-intake-${{ github.run_id }}
          path: |
            recovery-audit/RICPE_PUBLIC_SOURCE_WATCH.json
            recovery-audit/RICPE_PUBLIC_WEB_DISCOVERY.json
          retention-days: 90
