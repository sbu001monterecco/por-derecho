name: MASTER MYND public transfer diagnostic
on:
  push:
    branches: ['worker/master-mynd-site-address-20260905']
    paths: ['.github/workflows/master-mynd-transfer-diagnostic.yml']
permissions:
  contents: read
jobs:
  exact-public-file-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect only the explicitly shared public candidate response
        run: |
          mkdir -p /tmp/mm-public-transfer
          python3 - <<'PY'
          import urllib.request,pathlib,json,hashlib
          url='https://1drv.ms/u/c/bdf43392f576e62f/IQBsnF0I1sdxR7sQ_fUhqqAQAdLlSulkLXpskOR85Z-_sMQ'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=40) as r:
              data=r.read(3000000);out={'url':r.url,'content_type':r.headers.get('Content-Type'),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          pathlib.Path('/tmp/mm-public-transfer/response.html').write_bytes(data)
          pathlib.Path('/tmp/mm-public-transfer/metadata.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: master-mynd-public-transfer-response
          path: /tmp/mm-public-transfer
