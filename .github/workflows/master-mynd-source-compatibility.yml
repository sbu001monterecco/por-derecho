name: MASTER MYND source contract regression
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/source_observation_contracts.py'
      - 'scripts/test_source_observation_contracts.py'
      - 'scripts/master_mynd_projection_contract.py'
      - 'scripts/test_master_mynd_projection_contract.py'
      - 'scripts/validate_alberto_meeting_point_first_hop_caret.py'
      - 'scripts/build_cnmv_interim_measures_20260905.py'
      - 'scripts/orion_architecture_clarification_20260905.py'
      - '.github/workflows/master-mynd-source-compatibility.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Source provenance and exact approved additive projection
        run: |
          python3 -m unittest discover -s scripts -p test_source_observation_contracts.py -v
          python3 -m unittest discover -s scripts -p test_master_mynd_projection_contract.py -v
          python3 scripts/validate_alberto_meeting_point_first_hop_caret.py
          python3 scripts/orion_architecture_clarification_20260905.py --check
          test -z "$(git status --porcelain)"
