name: Materialise unitary criminal reverse engineering

on:
  push:
    branches:
      - strong/unitary-criminal-reverse-engineering-20260820
    paths:
      - 'scripts/materialise_unitary_criminal_payload.py'
      - '.github/workflows/materialise-unitary-criminal-reverse-engineering.yml'

permissions:
  contents: write

jobs:
  materialise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: strong/unitary-criminal-reverse-engineering-20260820
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Materialise controlled source
        run: python scripts/materialise_unitary_criminal_payload.py
      - name: Validate generated architecture
        run: |
          python scripts/validate_unitary_criminal_reverse_engineering.py
          node --check assets/unitary-criminal-reverse-engineering-20260820.js
          node --check assets/site.js
      - name: Commit generated source
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Materialise unitary criminal reverse-engineering architecture'
          git push origin HEAD:strong/unitary-criminal-reverse-engineering-20260820
