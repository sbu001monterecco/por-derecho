# One-off branch materialiser. Remove after the generated source is committed.
name: Materialise unitary criminal reverse engineering

on:
  push:
    branches:
      - strong/unitary-criminal-reverse-engineering-20260820
    paths:
      - 'scripts/materialise_unitary_criminal_payload.py'
      - '.github/workflows/materialise-unitary-criminal-reverse-engineering.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/materialise_unitary_criminal_payload.py'
      - '.github/workflows/materialise-unitary-criminal-reverse-engineering.yml'

permissions:
  contents: write

jobs:
  materialise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: strong/unitary-criminal-reverse-engineering-20260820
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Materialise controlled source
        run: python scripts/materialise_unitary_criminal_payload.py
      - name: Enforce static PP 1041 attribution in both languages
        run: |
          python - <<'PY'
          from pathlib import Path

          marker = 'unitary-criminal-pp1041-static-20260820'
          pages = [
              (
                  Path('en/litigious-credit-retracto-1041-2017/index.html'),
                  "A withdrawal was filed in LPB's name",
                  f'''<section class="section" id="pp1041-controlling-correction" data-correction="{marker}"><div class="shell record"><div class="strong"><strong>A withdrawal was filed in LPB's name after the Insolvency Administrator terminated the formal mandate of the lawyer pursuing the PH122→CAM deed, price, payment and costs.</strong><p>Por Derecho formally alleges that LPB did not validly authorise that abandonment; that it was produced through the Administrator-controlled representation; that its attribution to LPB was false in substance; that it deliberately destroyed a route capable of debt satisfaction or redemption and a successful exit from insolvency; and that it materially benefited CAM and the Acosta Matos perimeter while enabling the alleged wider economic-offence architecture.</p><p><strong>Evidence boundary:</strong> the 25 January 2018 mandate termination and the 5 March 2018 decree recording a withdrawal in LPB's name are documented. The original pleading, instruction, signature, authority, ratification, purpose and any criminal characterisation require the certified PP 1041/2017 file and competent determination.</p></div></div></section>'''
              ),
              (
                  Path('es/retracto-credito-litigioso-1041-2017/index.html'),
                  'Se presentó un desistimiento en nombre de LPB',
                  f'''<section class="section" id="pp1041-controlling-correction" data-correction="{marker}"><div class="shell record"><div class="strong"><strong>Se presentó un desistimiento en nombre de LPB después de que el Administrador concursal pusiera fin al mandato formal del abogado que reclamaba la escritura, el precio, el pago y los costes de la cesión PH122→CAM.</strong><p>Por Derecho alega formalmente que LPB no autorizó válidamente ese abandono; que fue producido mediante la representación controlada por el Administrador; que su atribución a LPB fue falsa en sustancia; que destruyó deliberadamente una vía capaz de satisfacer o redimir la deuda y permitir la salida exitosa del concurso; y que benefició materialmente a CAM y al perímetro Acosta Matos mientras habilitaba la presunta arquitectura más amplia de delitos económicos.</p><p><strong>Límite probatorio:</strong> están documentados el cese del mandato de 25 de enero de 2018 y el Decreto de 5 de marzo de 2018 que registra un desistimiento en nombre de LPB. El escrito original, la instrucción, firma, poder, autorización, ratificación, finalidad y eventual calificación penal requieren el expediente certificado PP 1041/2017 y una determinación competente.</p></div></div></section>'''
              ),
          ]

          for path, phrase, block in pages:
              text = path.read_text(encoding='utf-8')
              # Correct autonomous attribution while preserving what the decree itself records.
              replacements = {
                  '<strong>LPB solicitó el desistimiento</strong>': '<strong>el Decreto atribuye a LPB la solicitud de desistimiento</strong>',
                  '<strong>LPB desiste</strong>': '<strong>se presenta un desistimiento en nombre de LPB</strong>',
                  'desistimiento de la propia LPB': 'desistimiento presentado en nombre de LPB',
                  'los actos judiciales prueban el desistimiento de LPB': 'los actos judiciales prueban que se presentó un desistimiento en nombre de LPB',
                  '<strong>LPB requested withdrawal</strong>': '<strong>the Decree attributes the withdrawal request to LPB</strong>',
                  '<strong>LPB withdraws</strong>': '<strong>a withdrawal is filed in LPB’s name</strong>',
                  "LPB's own withdrawal": "the withdrawal filed in LPB's name",
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if marker not in text:
                  text = text.replace('<main>', '<main>\n' + block, 1)
              if phrase not in text:
                  raise SystemExit(f'{path}: controlling phrase was not materialised')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Validate generated architecture
        run: |
          python scripts/validate_unitary_criminal_reverse_engineering.py
          node --check assets/unitary-criminal-reverse-engineering-20260820.js
          node --check assets/site.js
      - name: Remove permanent workflow from bot-generated commit
        run: rm -f .github/workflows/validate-unitary-criminal-reverse-engineering.yml
      - name: Commit generated source
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Materialise unitary criminal reverse-engineering architecture'
          git push origin HEAD:strong/unitary-criminal-reverse-engineering-20260820
