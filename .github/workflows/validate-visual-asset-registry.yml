name: Validate visual asset identity registry

on:
  pull_request:
    paths:
      - "assets/actors/**"
      - "assets/composites/**"
      - "assets/visual-asset-registry.json"
      - "tests/test_named_person_visual_control_20260925.py"
      - "scripts/validate_named_person_visual_control.py"
      - "governance/FACE_IDENTITY_CONTROL_RULE.md"
      - "assets/data/named-person-visual-control-v1.json"
      - "assets/exact-source-actor-grid-20260925.css"
      - "assets/data/five-actor-exact-source-grid-20260925.json"
      - "assets/data/active-named-person-visual-use-20260925.json"
      - "assets/five-actor-accountability-20260824.css"
      - "assets/community-professional-corporate-network-20260825.css"
      - "ops/REPOSITORY_PRESERVATION_CONTRACT.json"
      - "scripts/validate_visual_asset_registry.py"
      - "scripts/validate_five_private_actor_visual_integration.py"
      - "**/*.html"
      - "**/*.js"
      - "**/*.md"
      - ".github/workflows/validate-visual-asset-registry.yml"
  push:
    branches: [main]
    paths:
      - "assets/actors/**"
      - "assets/composites/**"
      - "assets/visual-asset-registry.json"
      - "assets/five-actor-accountability-20260824.css"
      - "assets/community-professional-corporate-network-20260825.css"
      - "ops/REPOSITORY_PRESERVATION_CONTRACT.json"
      - "scripts/validate_visual_asset_registry.py"
      - "scripts/validate_five_private_actor_visual_integration.py"
      - "**/*.html"
      - "**/*.js"
      - "**/*.md"
      - ".github/workflows/validate-visual-asset-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-asset-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate canonical image identities, byte locks and composite slot maps
        run: python scripts/validate_visual_asset_registry.py

      - name: Validate five-private-actor visual architecture and provenance
        run: python scripts/validate_five_private_actor_visual_integration.py

      - name: Validate deterministic named-person rendering and factual-manifest controls
        run: python scripts/validate_named_person_visual_control.py
