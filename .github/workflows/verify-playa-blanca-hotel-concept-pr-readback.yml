name: Verify Playa Blanca concept live read-back

on:
  pull_request:
    paths:
      - '.github/workflows/verify-playa-blanca-hotel-concept-pr-readback.yml'
      - 'publication-manifests/playa-blanca-hotel-services-concept-20260820.json'
      - 'en/playa-blanca-hotel-services-concept/**'
      - 'es/playa-blanca-concepto-hotel-servicios/**'
      - 'assets/playa-blanca-*'
      - 'assets/site.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playa-blanca-concept-pr-readback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-live-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify public concept pages and homepage feature assets
        env:
          BASE_URL: https://sbu001monterecco.github.io/por-derecho/
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          base_url = os.environ['BASE_URL']
          attempts = 48
          interval = 10
          timeout = 20
          checks = [
              {
                  'kind': 'english_concept_page',
                  'path': 'en/playa-blanca-hotel-services-concept/',
                  'markers': [
                      'A new hotel and local-services concept for a place we continue to believe in.',
                      'Our confidence in Playa Blanca was not taken with it.',
                      'Supercor Exprés or Supercor-format',
                      'No awareness, dialogue, support, approval or outcome concerning this concept is represented.',
                  ],
              },
              {
                  'kind': 'spanish_concept_page',
                  'path': 'es/playa-blanca-concepto-hotel-servicios/',
                  'markers': [
                      'Un nuevo concepto hotelero y de servicios locales para un lugar en el que seguimos creyendo.',
                      'Nuestra confianza en Playa Blanca sigue intacta.',
                      'Supercor Exprés o Supercor',
                      'No se representa conocimiento, diálogo, apoyo, aprobación ni resultado alguno sobre este concepto.',
                  ],
              },
              {
                  'kind': 'homepage_feature_asset',
                  'path': 'assets/playa-blanca-concept-home-20260820.js',
                  'markers': [
                      'pb-home-feature',
                      "route: 'playa-blanca-hotel-services-concept/'",
                      "route: 'playa-blanca-concepto-hotel-servicios/'",
                      'Recovery and reinvestment can proceed in parallel.',
                  ],
              },
              {
                  'kind': 'site_loader_sentinel',
                  'path': 'assets/site.js',
                  'markers': [
                      'site-pre-treasury-154-hq-20260828.js',
                      'playa-blanca-concept-home-20260820.js',
                  ],
              },
              {
                  'kind': 'site_loader_chain',
                  'path': 'assets/site-pre-intervencion-highlight-before-eg95-20260823.js',
                  'markers': [
                      'playa-blanca-concept-home-20260820.js',
                      'data-playa-blanca-concept-loader',
                  ],
              },
              {
                  'kind': 'concept_styles',
                  'path': 'assets/playa-blanca-concept.css',
                  'markers': ['.pb-home-feature', '.pb-confidence-quote', '.pb-status-table'],
              },
              {
                  'kind': 'hero_poster',
                  'path': 'assets/playa-blanca-return-poster.svg',
                  'markers': [
                      'PLAYA BLANCA',
                      'Playa Blanca — a new hotel destination',
                      'HOTEL &amp; LOCAL SERVICES CONCEPT · ILLUSTRATIVE STUDY',
                  ],
              },
          ]

          def now():
              return dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00', 'Z')

          def fetch(url):
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'Por-Derecho-Playa-Blanca-Live-Readback/1.0',
                  'Cache-Control': 'no-cache, no-store, max-age=0',
                  'Pragma': 'no-cache',
                  'Accept': 'text/html,text/javascript,text/css,image/svg+xml,*/*;q=0.8',
              })
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  body = response.read()
                  return (
                      response.status,
                      response.geturl(),
                      response.headers,
                      body.decode('utf-8', errors='replace'),
                      hashlib.sha256(body).hexdigest(),
                      len(body),
                  )

          output = Path('artifacts/playa-blanca-concept-live-readback.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          started = now()
          final = []

          for attempt in range(1, attempts + 1):
              final = []
              all_ok = True
              nonce = f'{int(time.time())}-{attempt}'
              for item in checks:
                  url = urllib.parse.urljoin(base_url, item['path'])
                  checked_url = f'{url}?playa_blanca_live_readback={nonce}'
                  record = {
                      'kind': item['kind'],
                      'url': url,
                      'checked_url': checked_url,
                      'required_markers': item['markers'],
                      'checked_at': now(),
                  }
                  try:
                      status, final_url, headers, text, sha256, size = fetch(checked_url)
                      missing = [marker for marker in item['markers'] if marker not in text]
                      record.update({
                          'status': status,
                          'final_url': final_url,
                          'bytes': size,
                          'sha256': sha256,
                          'etag': headers.get('ETag'),
                          'last_modified': headers.get('Last-Modified'),
                          'x_github_request_id': headers.get('X-GitHub-Request-Id'),
                          'missing_markers': missing,
                          'ok': status == 200 and not missing,
                      })
                  except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, OSError) as exc:
                      record.update({'ok': False, 'error': f'{type(exc).__name__}: {exc}'})
                  if not record['ok']:
                      all_ok = False
                  final.append(record)

              print(
                  f"Attempt {attempt}/{attempts}: " +
                  ', '.join(f"{item['kind']}={'OK' if item['ok'] else 'WAIT'}" for item in final),
                  flush=True,
              )
              if all_ok:
                  payload = {
                      'verified': True,
                      'publication_id': 'playa-blanca-hotel-services-concept-20260820',
                      'source_merge_sha': '11e1c69c4cf4bef4e89f64aef7d8d4162fe689e7',
                      'verification_commit': os.environ.get('GITHUB_SHA'),
                      'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
                      'repository': os.environ.get('GITHUB_REPOSITORY'),
                      'base_url': base_url,
                      'started_at': started,
                      'verified_at': now(),
                      'attempt': attempt,
                      'checks': final,
                  }
                  output.write_text(json.dumps(payload, indent=2), encoding='utf-8')
                  print('PLAYA BLANCA CONCEPT: LIVE PUBLIC READ-BACK VERIFIED', flush=True)
                  raise SystemExit(0)
              if attempt < attempts:
                  time.sleep(interval)

          output.write_text(json.dumps({
              'verified': False,
              'publication_id': 'playa-blanca-hotel-services-concept-20260820',
              'source_merge_sha': '11e1c69c4cf4bef4e89f64aef7d8d4162fe689e7',
              'verification_commit': os.environ.get('GITHUB_SHA'),
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
              'repository': os.environ.get('GITHUB_REPOSITORY'),
              'base_url': base_url,
              'started_at': started,
              'failed_at': now(),
              'attempts': attempts,
              'checks': final,
          }, indent=2), encoding='utf-8')
          raise SystemExit('Playa Blanca concept live read-back was not verified within the polling window')
          PY

      - name: Show live verification evidence
        if: always()
        run: cat artifacts/playa-blanca-concept-live-readback.json || true

      - name: Upload live verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playa-blanca-concept-live-readback
          path: artifacts/playa-blanca-concept-live-readback.json
          if-no-files-found: error
          retention-days: 30
