name: Repository recovery bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repository-backup-bundle.yml'
  schedule:
    - cron: '37 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: repository-recovery-bundle
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKUP_MIRROR_URL: ${{ secrets.POR_DERECHO_BACKUP_MIRROR_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch all branches and tags
        run: |
          git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
          git fetch origin --prune --tags --force
      - name: Create and verify full Git recovery bundle
        run: |
          set -euo pipefail
          mkdir -p artifacts/repository-backup
          BUNDLE="artifacts/repository-backup/por-derecho-${GITHUB_SHA}.bundle"
          git bundle create "$BUNDLE" --all
          git bundle verify "$BUNDLE"
          sha256sum "$BUNDLE" > "$BUNDLE.sha256"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "workflow_sha=${GITHUB_SHA}"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git show-ref
          } > artifacts/repository-backup/refs.txt
      - name: Clean restore, fsck, ref and static-site test
        run: |
          set -euo pipefail
          BUNDLE="artifacts/repository-backup/por-derecho-${GITHUB_SHA}.bundle"
          RESTORE_MIRROR="$RUNNER_TEMP/por-derecho-restore.git"
          RESTORE_WORKTREE="$RUNNER_TEMP/por-derecho-restore"
          rm -rf "$RESTORE_MIRROR" "$RESTORE_WORKTREE"

          git clone --mirror "$BUNDLE" "$RESTORE_MIRROR"
          git --git-dir="$RESTORE_MIRROR" fsck --full
          git --git-dir="$RESTORE_MIRROR" show-ref | sort > "$RUNNER_TEMP/restored-refs.txt"
          git show-ref | sort > "$RUNNER_TEMP/source-refs.txt"
          diff -u "$RUNNER_TEMP/source-refs.txt" "$RUNNER_TEMP/restored-refs.txt"

          git clone "$RESTORE_MIRROR" "$RESTORE_WORKTREE"
          test "$(git -C "$RESTORE_WORKTREE" rev-parse HEAD)" = "$GITHUB_SHA"
          python3 "$RESTORE_WORKTREE/scripts/validate_mission_critical_repo.py"

          python3 -m http.server 8765 --directory "$RESTORE_WORKTREE" > "$RUNNER_TEMP/restore-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:8765/es/" -o "$RUNNER_TEMP/restored-home-es.html"; then
              break
            fi
            sleep 0.5
          done
          grep -q "Project Sun Rock" "$RUNNER_TEMP/restored-home-es.html"
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

          {
            echo "restore_test=PASS"
            echo "workflow_sha=${GITHUB_SHA}"
            echo "restored_head=$(git -C "$RESTORE_WORKTREE" rev-parse HEAD)"
            echo "fsck=PASS"
            echo "refs_match=PASS"
            echo "mission_critical_validation=PASS"
            echo "static_site_smoke=PASS"
            echo "tested_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > artifacts/repository-backup/restore-report.txt
      - name: Upload verified recovery artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: por-derecho-repository-recovery-bundle
          path: artifacts/repository-backup
          if-no-files-found: error
          retention-days: 90
      - name: Mirror all refs to independent remote when configured
        if: env.BACKUP_MIRROR_URL != ''
        run: |
          git push --mirror "$BACKUP_MIRROR_URL"
      - name: Record independent-backup gap when mirror is not configured
        if: env.BACKUP_MIRROR_URL == ''
        run: |
          echo "::warning::POR_DERECHO_BACKUP_MIRROR_URL is not configured. The workflow nevertheless creates and clean-restores a full Git bundle; an off-GitHub copy must be preserved separately before disaster-recovery closure."
      - name: Publish recovery-bundle status
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              target_url: runUrl,
              description: success
                ? 'Verified Git recovery bundle + clean restore passed'
                : 'Git recovery bundle or clean restore failed',
              context: 'backup/repository-recovery-bundle',
            });
