name: Apply public bidder name-only rewrite (temporary)

on:
  push:
    branches:
      - publication/fix-bidder-name-only-20260904

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: publication/fix-bidder-name-only-20260904
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply deterministic public name-only rewrite and self-remove
        run: |
          python scripts/rewrite_public_bidder_anonymisation.py
          python scripts/validate_public_bidder_anonymisation.py
          rm .github/workflows/apply-public-bidder-name-rewrite-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add es en assets .github/workflows/apply-public-bidder-name-rewrite-temp.yml
          if git diff --cached --quiet; then
            echo "No rewrite changes required"
            exit 0
          fi
          git commit -m "Apply public bidder name-only anonymisation rewrite"
          git push origin HEAD:publication/fix-bidder-name-only-20260904
