name: Stage PwC 18 Sep institutional map
on:
  push:
    branches:
      - pwc-18sep-whistleblower-burofax
    paths:
      - .github/workflows/pwc-map-asset-20260918.yml

permissions:
  contents: write

jobs:
  stage-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: pwc-18sep-whistleblower-burofax
          fetch-depth: 0
      - name: Download exact sent-email PNG and verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/graphics
          curl --fail --silent --show-error --location             "https://cdn.websitepublisher.ai/custom/wid27709/images/pwc-whistleblower-burofax-institutional-map-20260918.png"             --output assets/graphics/pwc-whistleblower-burofax-institutional-map-20260918.png
          echo "edf412394dda20779f2cb6a4cbc72d20c3f13143e99b363dbebe9cf7453e41cf  assets/graphics/pwc-whistleblower-burofax-institutional-map-20260918.png" | sha256sum -c -
      - name: Commit asset and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/graphics/pwc-whistleblower-burofax-institutional-map-20260918.png
          git rm .github/workflows/pwc-map-asset-20260918.yml
          git commit -m "PwC: add exact 18 Sep institutional map asset"
          git push origin HEAD:pwc-18sep-whistleblower-burofax
