name: Validate Monte Lanza 2012 accounts digitisation

on:
  push:
    branches: [main]
    paths:
      - 'CHATGPT_START_HERE.md'
      - 'archive/CURRENT_GITHUB_ONLY_HANDOVER_19SEP2026.md'
      - 'assets/documents/montelanza-accounts-2012/**'
      - 'assets/montelanza-accounts-discovery-20260919.js'
      - 'assets/site.js'
      - 'es/cuentas-monte-lanza-2012/**'
      - 'en/monte-lanza-2012-accounts/**'
      - 'es/montelanza-cuentas-2008/**'
      - 'en/montelanza-accounts-2008/**'
      - 'sitemap-community-governance.xml'
      - 'scripts/validate_montelanza_2012_accounts.py'
      - '.github/workflows/validate-montelanza-2012-accounts.yml'
  pull_request:
    paths:
      - 'CHATGPT_START_HERE.md'
      - 'archive/CURRENT_GITHUB_ONLY_HANDOVER_19SEP2026.md'
      - 'assets/documents/montelanza-accounts-2012/**'
      - 'assets/montelanza-accounts-discovery-20260919.js'
      - 'assets/site.js'
      - 'es/cuentas-monte-lanza-2012/**'
      - 'en/monte-lanza-2012-accounts/**'
      - 'es/montelanza-cuentas-2008/**'
      - 'en/montelanza-accounts-2008/**'
      - 'sitemap-community-governance.xml'
      - 'scripts/validate_montelanza_2012_accounts.py'
      - '.github/workflows/validate-montelanza-2012-accounts.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate canonical PDF, OCR, routes and controls
        run: python scripts/validate_montelanza_2012_accounts.py
