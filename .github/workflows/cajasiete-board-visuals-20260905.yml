name: Prepare CajaSiete documentary candidate
on:
  push:
    branches: [worker/cajasiete-board-visuals-20260905]
permissions:
  contents: write
concurrency:
  group: cajasiete-board-preparation-20260905
  cancel-in-progress: false
jobs:
  preserve:
    if: github.ref == 'refs/heads/worker/cajasiete-board-visuals-20260905' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh without rewriting any branch history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - run: python -m pip install cairosvg==2.8.2 pillow==11.3.0 beautifulsoup4==4.14.3 playwright==1.55.0
      - name: Correct relationship classification
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/prepare_cajasiete_board_visuals_20260905.py');s=p.read_text()
          old="'linked_transport_event_ids':['PD-SP-EVT-0176'] if i['direction'].startswith('OUTBOUND') else []"
          new="'linked_transport_event_ids':[],'related_curated_event_ids':['PD-SP-EVT-0176'] if i['direction'].startswith('OUTBOUND') else []"
          assert s.count(old)==1 or new in s,'Unexpected source; stop rather than guessing'
          p.write_text(s.replace(old,new))
          PY
      - name: Generate and validate source-controlled candidate
        run: |
          python scripts/prepare_cajasiete_board_visuals_20260905.py apply
          python scripts/reconcile_institutional_communications.py --check
          python scripts/validate_institutional_communications.py
          python scripts/prepare_cajasiete_board_visuals_20260905.py check
      - name: Install browser engines
        run: python -m playwright install --with-deps chromium firefox webkit
      - name: Three-browser desktop mobile and no-JavaScript checks
        run: |
          python - <<'PY'
          import functools,http.server,threading,json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          root=Path.cwd();serverroot=root.parent/'cajasiete-http';serverroot.mkdir(exist_ok=True)
          mount=serverroot/'por-derecho'
          if not mount.exists():mount.symlink_to(root,target_is_directory=True)
          h=functools.partial(http.server.SimpleHTTPRequestHandler,directory=str(serverroot))
          server=http.server.ThreadingHTTPServer(('127.0.0.1',8873),h);threading.Thread(target=server.serve_forever,daemon=True).start()
          routes=['es/cajasiete-sun-park-financiacion-comparabilidad/','en/cajasiete-sun-park-financing-comparability/'];out=[]
          shots=Path('qa-cajasiete');shots.mkdir(exist_ok=True)
          with sync_playwright() as p:
            for name in ['chromium','firefox','webkit']:
              browser=getattr(p,name).launch()
              for width in [390,1280]:
                for js in [True,False]:
                  context=browser.new_context(viewport={'width':width,'height':900},java_script_enabled=js)
                  for route in routes:
                    page=context.new_page();response=page.goto('http://127.0.0.1:8873/por-derecho/'+route,wait_until='networkidle');assert response.status==200
                    section=page.locator('#board-compliance');assert section.count()==1
                    assert section.locator('figure img').count()==3
                    for image in section.locator('figure img').all():
                      image.scroll_into_view_if_needed()
                      assert image.evaluate('(e)=>e.complete && e.naturalWidth===1080')
                      assert image.get_attribute('alt')
                    assert section.evaluate('(e)=>e.scrollWidth<=e.clientWidth+2'),'new section overflow'
                    assert page.locator('#caja-commercial-original').count()==1
                    for link in section.locator('a[href^="#"]').all():
                      target=link.get_attribute('href');assert page.locator(target).count()>=1,target
                    if width==390 and not js:section.screenshot(path=str(shots/(name+'-'+route[:2]+'-mobile-nojs.png')))
                    out.append({'engine':name,'width':width,'javascript':js,'route':route,'status':'PASS'})
                    page.close()
                  context.close()
              browser.close()
          server.shutdown()
          Path('ops/CAJASIETE_BOARD_BROWSER_20260905.json').write_text(json.dumps({'control_id':'PD-CAJASIETE-BOARD-VISUALS-20260905','cases':out,'case_count':len(out),'status':'PASS','scope':'New reader, 24 browser/viewport/JS cases; not whole-site certification'},indent=2)+'\n')
          PY
      - name: Preserve branch-only candidate excluding workflows
        env:
          SEED_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          test "$BRANCH" = worker/cajasiete-board-visuals-20260905
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$SEED_SHA"
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          r=json.loads(Path('ops/CAJASIETE_BOARD_VISUAL_ACCEPTANCE_20260905.json').read_text())
          paths=list(r['paths'])+['ops/CAJASIETE_BOARD_VISUAL_ACCEPTANCE_20260905.json','ops/CAJASIETE_BOARD_BROWSER_20260905.json']
          assert not any(p.startswith('.github/') for p in paths),'Automation must not modify workflow files'
          subprocess.run(['git','add','--']+paths,check=True)
          PY
          git commit -m 'Prepare six CajaSiete bilingual visuals with preserved sources and 24 browser checks; not deployed'
          git push origin HEAD:"$BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cajasiete-board-verified-candidate
          path: |
            qa-cajasiete/
            ops/CAJASIETE_BOARD_*.json
            ops/cajasiete-board-source-input-20260905.json
            scripts/prepare_cajasiete_board_visuals_20260905.py
            assets/media/cajasiete-board-*
            assets/data/institutional-communications-register-v1.json
            data/digital-media-asset-register-v1.json
            es/cajasiete-sun-park-financiacion-comparabilidad/index.html
            en/cajasiete-sun-park-financing-comparability/index.html
