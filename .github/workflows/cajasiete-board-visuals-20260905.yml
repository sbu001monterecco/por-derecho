name: Prepare CajaSiete documentary candidate
on:
  push:
    branches: [worker/cajasiete-board-visuals-20260905]
permissions:
  contents: write
concurrency:
  group: cajasiete-board-preparation-20260905
  cancel-in-progress: false
jobs:
  preserve:
    if: github.ref == 'refs/heads/worker/cajasiete-board-visuals-20260905' && github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[cajasiete-review-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure worker-only commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: python -m pip install cairosvg==2.8.2 pillow==11.3.0 beautifulsoup4==4.14.3 playwright==1.55.0
      - run: python -m playwright install --with-deps chromium firefox webkit
      - name: Reconcile the existing delta on actual main and validate before worker preservation
        run: python scripts/reconcile_cajasiete_documentary_review_20260905.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cajasiete-current-main-review-${{ github.run_id }}
          path: qa-cajasiete-review/
          if-no-files-found: warn
          retention-days: 30
