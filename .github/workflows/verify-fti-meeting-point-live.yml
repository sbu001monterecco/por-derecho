name: Verify FTI Meeting Point chain live

on:
  push:
    branches: [main]
    paths:
      - 'es/fti-touristik-meeting-point-insolvencia-preconcurso-bluesea/**'
      - 'en/fti-touristik-meeting-point-insolvency-preinsolvency-bluesea/**'
      - '.github/workflows/verify-fti-meeting-point-live.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-fti-meeting-point-live
  cancel-in-progress: false

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Poll exact public routes
        id: verify
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base='https://sbu001monterecco.github.io/por-derecho'
          sha=os.environ['SOURCE_SHA']; run=os.environ['RUN_ID']; q=f'source={sha[:12]}&run={run}'
          targets={
            'es':(f'{base}/es/fti-touristik-meeting-point-insolvencia-preconcurso-bluesea/?{q}',[
              'CLUB SEI → FTI → INSOLVENCIA → PRECONCURSO → BLUESEA',
              'Referencia 2024-94', 'Bierbach → Abegg', 'Meeting Point Spain · 357/2024', 'PORTOBELLO', 'BLUESEA']),
            'en':(f'{base}/en/fti-touristik-meeting-point-insolvency-preinsolvency-bluesea/?{q}',[
              'CLUB SEI → FTI → INSOLVENCY → PRE-INSOLVENCY → BLUESEA',
              'Reference 2024-94', 'Bierbach → Abegg', 'Meeting Point Spain · 357/2024', 'PORTOBELLO', 'BLUESEA'])}
          def fetch(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Por-Derecho-FTI-MP-live-verifier/1.0','Cache-Control':'no-cache','Pragma':'no-cache'})
            with urllib.request.urlopen(req,timeout=25) as r: return r.status,r.read().decode('utf-8','replace')
          last={}
          for attempt in range(1,49):
            checks={}; details={}
            for name,(url,markers) in targets.items():
              try:
                status,body=fetch(url); mm={m:m in body for m in markers}
                checks[name]=status==200 and all(mm.values()); details[name]={'status':status,'markers':mm,'bytes':len(body.encode())}
              except Exception as e:
                checks[name]=False; details[name]={'error':repr(e)}
            last={'attempt':attempt,'checks':checks,'details':details}
            print(json.dumps(last,ensure_ascii=False,indent=2))
            if all(checks.values()): break
            time.sleep(5)
          ok=all(last.get('checks',{}).values())
          with open('/tmp/fti-mp-live.json','w') as f: json.dump({'status':'PASS' if ok else 'FAIL',**last},f,ensure_ascii=False,indent=2)
          raise SystemExit(0 if ok else 1)
          PY

      - name: Show verification evidence
        if: always()
        run: cat /tmp/fti-mp-live.json || true

      - name: Publish persistent live status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['SOURCE_SHA']; run=os.environ['RUN_ID']; success=os.environ['VERIFY_OUTCOME']=='success'
          payload={'state':'success' if success else 'failure','target_url':f'https://github.com/{repo}/actions/runs/{run}','description':'FTI / Meeting Point chain verified live' if success else 'FTI / Meeting Point live verification failed','context':'pages-propagation/fti-meeting-point-chain'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',data=json.dumps(payload).encode(),method='POST',headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Por-Derecho-FTI-MP-live-verifier/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r: print(r.read().decode())
          PY

      - name: Fail if live verification failed
        if: steps.verify.outcome != 'success'
        run: exit 1
