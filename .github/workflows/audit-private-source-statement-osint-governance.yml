name: Audit private-source, statement and OSINT governance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Optional Git base revision for a multi-commit manual audit
        required: false
        type: string

permissions:
  contents: read

jobs:
  advisory-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Audit only newly added private-source and statement material
        env:
          EVENT_BASE: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}
        run: |
          BASE_SHA="$EVENT_BASE"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          python scripts/validate_private_source_statement_osint_governance.py --base "$BASE_SHA"
