name: Validate unitary criminal reverse engineering

on:
  push:
    branches: [main]
    paths:
      - 'es/ingenieria-inversa-criminal-unitaria/**'
      - 'en/unitary-criminal-reverse-engineering/**'
      - 'es/retracto-credito-litigioso-1041-2017/**'
      - 'en/litigious-credit-retracto-1041-2017/**'
      - 'es/administrador-concursal-puerta-credito-titulo/**'
      - 'en/insolvency-administrator-credit-to-title-gatekeeper/**'
      - 'es/pacto-comisorio-arquitectura-credito-titulo/**'
      - 'en/pacto-comisorio-credit-to-title-architecture/**'
      - 'es/ingenieria-forense-criminal-sun-park/**'
      - 'en/sun-park-criminal-engineering-investigation/**'
      - 'es/ingenieria-inversa-360-cadena-sun-park/**'
      - 'en/reverse-engineering-360-sun-park-chain/**'
      - 'assets/unitary-criminal-reverse-engineering-20260820.js'
      - 'assets/site.js'
      - 'research/unitary-criminal-reverse-engineering/**'
      - 'publication-manifests/unitary-criminal-reverse-engineering-20260820.json'
      - 'scripts/validate_unitary_criminal_reverse_engineering.py'
      - 'sitemap-criminal-engineering.xml'
      - '.github/workflows/validate-unitary-criminal-reverse-engineering.yml'
  pull_request:
    paths:
      - 'es/ingenieria-inversa-criminal-unitaria/**'
      - 'en/unitary-criminal-reverse-engineering/**'
      - 'es/retracto-credito-litigioso-1041-2017/**'
      - 'en/litigious-credit-retracto-1041-2017/**'
      - 'es/administrador-concursal-puerta-credito-titulo/**'
      - 'en/insolvency-administrator-credit-to-title-gatekeeper/**'
      - 'es/pacto-comisorio-arquitectura-credito-titulo/**'
      - 'en/pacto-comisorio-credit-to-title-architecture/**'
      - 'es/ingenieria-forense-criminal-sun-park/**'
      - 'en/sun-park-criminal-engineering-investigation/**'
      - 'es/ingenieria-inversa-360-cadena-sun-park/**'
      - 'en/reverse-engineering-360-sun-park-chain/**'
      - 'assets/unitary-criminal-reverse-engineering-20260820.js'
      - 'assets/site.js'
      - 'research/unitary-criminal-reverse-engineering/**'
      - 'publication-manifests/unitary-criminal-reverse-engineering-20260820.json'
      - 'scripts/validate_unitary_criminal_reverse_engineering.py'
      - 'sitemap-criminal-engineering.xml'
      - '.github/workflows/validate-unitary-criminal-reverse-engineering.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate evidence architecture and PP 1041 attribution
        run: python scripts/validate_unitary_criminal_reverse_engineering.py
      - name: Validate JavaScript syntax
        run: |
          node --check assets/unitary-criminal-reverse-engineering-20260820.js
          node --check assets/site.js
      - name: Validate bilingual canonical and alternate routes
        run: |
          python - <<'PY'
          from pathlib import Path
          checks = {
              'es/ingenieria-inversa-criminal-unitaria/index.html': [
                  '/por-derecho/es/ingenieria-inversa-criminal-unitaria/',
                  '/por-derecho/en/unitary-criminal-reverse-engineering/'
              ],
              'en/unitary-criminal-reverse-engineering/index.html': [
                  '/por-derecho/en/unitary-criminal-reverse-engineering/',
                  '/por-derecho/es/ingenieria-inversa-criminal-unitaria/'
              ],
          }
          errors=[]
          for rel, markers in checks.items():
              text=Path(rel).read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in text:
                      errors.append(f'{rel}: missing {marker}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print('BILINGUAL UNITARY CRIMINAL ROUTES: PASS')
          PY
