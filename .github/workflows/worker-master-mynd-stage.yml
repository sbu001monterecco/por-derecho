name: MASTER MYND reader acceptance
on:
  pull_request:
    paths:
      - 'en/acosta-matos-family/**'
      - 'es/acosta-matos-familia/**'
      - 'en/sun-park-mynd-yaiza/**'
      - 'es/sun-park-mynd-yaiza/**'
      - 'assets/master-mynd-acosta-matos-architect.webp'
      - 'assets/acosta-matos-family-hotel-plans.jpg'
      - 'assets/data/sun-park-mynd-yaiza-site-v1.json'
      - 'assets/data/matter-identity-registry-v1*'
      - 'scripts/*master_mynd*'
      - '.github/workflows/worker-master-mynd-stage.yml'
  push:
    branches: ['worker/master-mynd-site-address-20260905','main']
    paths:
      - 'en/acosta-matos-family/**'
      - 'es/acosta-matos-familia/**'
      - 'en/sun-park-mynd-yaiza/**'
      - 'es/sun-park-mynd-yaiza/**'
      - 'assets/master-mynd-acosta-matos-architect.webp'
      - 'assets/data/sun-park-mynd-yaiza-site-v1.json'
      - 'scripts/*master_mynd*'
      - '.github/workflows/worker-master-mynd-stage.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: master-mynd-reader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  candidate-reader:
    name: MASTER MYND source and three-engine reader
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install reader-test dependencies
        run: |
          python -m pip install --quiet playwright pillow beautifulsoup4
          python -m playwright install --with-deps chromium firefox webkit
      - name: Validate existing identity, source bytes and the full reader
        run: |
          python scripts/validate_master_mynd.py
          python scripts/validate_operational_identity_registry.py
          python scripts/reconcile_identity_registry_projections.py --check
          python scripts/validate_satire_publication_governance.py
          python scripts/check_master_mynd_browser.py
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: master-mynd-candidate-reader
          path: /tmp/master-mynd-browser
          if-no-files-found: ignore
  deployed-reader:
    name: MASTER MYND exact deployment reader
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: candidate-reader
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Wait for this exact GitHub Pages source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          for attempt in range(48):
              with urllib.request.urlopen(urllib.request.Request(api+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']+'&per_page=100',headers=headers),timeout=30) as r:
                  runs=json.load(r)['workflow_runs']
              pages=[r for r in runs if r['name']=='pages build and deployment']
              if pages and pages[0]['status']=='completed':
                  assert pages[0]['conclusion']=='success',pages[0]['html_url']
                  print('Exact Pages run',pages[0]['id']);break
              time.sleep(10)
          else:raise SystemExit('Exact Pages deployment not established; no live claim')
          PY
      - name: Inspect the actual deployed host in three browser engines
        run: |
          python -m pip install --quiet playwright pillow beautifulsoup4
          python -m playwright install --with-deps chromium firefox webkit
          python scripts/check_master_mynd_browser.py --base-url https://sbu001monterecco.github.io/por-derecho --output /tmp/master-mynd-live
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: master-mynd-live-reader
          path: /tmp/master-mynd-live
          if-no-files-found: ignore
