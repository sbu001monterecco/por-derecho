name: MASTER MYND staging diagnostic — no publication authority
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report the preserved import failure without retrying or writing
        run: |
          echo 'Run 33984431597 failed with HTTP403 while retrieving the public-safe candidate archive.'
          echo 'No candidate source files were applied or committed by that run.'
          echo 'This replacement workflow is read-only: no download, archive application, commit, merge or deployment.'
          echo 'The 38-file candidate, original-image hashes, canonical hotel/address delta and proof gaps are recorded in Control Tower1428.'
          echo 'Resume only through an authorised transfer and the current single integration lane; no timeout or worker takeover is implied.'
