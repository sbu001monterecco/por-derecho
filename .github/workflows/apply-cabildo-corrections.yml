name: Apply Cabildo chronology corrections

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-cabildo-corrections.yml

permissions:
  contents: write

jobs:
  apply-corrections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = [
              (
                  '<div><strong>356</strong><span>records</span></div><div><strong>78</strong><span>destination bodies</span></div>',
                  '<div><strong>356</strong><span>records</span></div><div><strong>77</strong><span>distinct CSV destination labels</span></div>',
                  'English destination metric',
              ),
              (
                  'The result is 78 distinct destination-body labels; the directory represents them one by one under normalised official display names.',
                  'The result is 77 distinct exact values in the CSV’s “Órgano Destino” field. Display names below are normalised for readability; the number of rows is not a count of separate legal persons.',
                  'English count-control note',
              ),
              (
                  'All 78 bodies, grouped by function',
                  'Destination directory, grouped by function',
                  'English directory heading',
              ),
              (
                  '<div><strong>356</strong><span>registros</span></div><div><strong>78</strong><span>órganos destino</span></div>',
                  '<div><strong>356</strong><span>registros</span></div><div><strong>77</strong><span>etiquetas CSV de destino distintas</span></div>',
                  'Spanish destination metric',
              ),
              (
                  'El resultado es de 78 etiquetas distintas de órgano destino; el directorio las representa una a una con nombres oficiales normalizados.',
                  'El resultado es de 77 valores exactos distintos en el campo «Órgano Destino» del CSV. Los nombres mostrados se normalizan para facilitar la lectura; el número de filas no equivale a un recuento de personas jurídicas.',
                  'Spanish count-control note',
              ),
              (
                  'Los 78 órganos, agrupados por función',
                  'Directorio de destinos, agrupado por función',
                  'Spanish directory heading',
              ),
              (
                  'The documentary sequence separates three matters. Cabildo’s 10 March 2026 rejection did not determine title or authority. Its 7 April access resolution identified six tourism files concerning all units, holder/name changes, refurbishment and classification, but their existence does not validate the premises used. The 18 June communication formally demanded author, signature, office, mandate, exact community, units, verification, effect, funding, incentives and preservation; it establishes the claimant’s alert, not Cabildo acceptance or a merits decision.',
                  'The documentary sequence separates three matters. Cabildo’s 10 March 2026 rejection did not determine title or authority. The access file records a proposal dated 7 April 2026 followed by the April 2026 decision granting access; that sequence identified six tourism files concerning all units, holder/name changes, refurbishment and classification. Neither those procedural acts nor the files’ existence validates the premises used. The 18 June communication formally demanded author, signature, office, mandate, exact community, units, verification, effect, funding, incentives and preservation; it establishes the claimant’s alert, not Cabildo acceptance or a merits decision.',
                  'English April chronology',
              ),
              (
                  'La secuencia documental distingue tres cosas. La inadmisión del Cabildo de 10 de marzo de 2026 no decidió título ni autoridad. La resolución de acceso de 7 de abril identificó seis expedientes turísticos sobre totalidad de unidades, cambios de titular/nombre, reforma y clasificación, pero su existencia no valida las premisas usadas. La comunicación de 18 de junio formalizó la exigencia de autor, firma, cargo, mandato, Comunidad exacta, unidades, verificación, efecto, fondos, incentivos y preservación; acredita la alerta del reclamante, no una aceptación o decisión de fondo del Cabildo.',
                  'La secuencia documental distingue tres cosas. La inadmisión del Cabildo de 10 de marzo de 2026 no decidió título ni autoridad. El expediente de acceso contiene una propuesta fechada el 7 de abril de 2026, seguida de la decisión de abril de 2026 que concedió el acceso; esa secuencia identificó seis expedientes turísticos sobre la totalidad de las unidades, cambios de titular/nombre, reforma y clasificación. Ni esos actos procedimentales ni la existencia de los expedientes validan las premisas utilizadas. La comunicación de 18 de junio formalizó la exigencia de autor, firma, cargo, mandato, Comunidad exacta, unidades, verificación, efecto, fondos, incentivos y preservación; acredita la alerta del reclamante, no una aceptación o decisión de fondo del Cabildo.',
                  'Spanish April chronology',
              ),
          ]

          html_files = list(Path('.').rglob('*.html'))
          totals = {label: 0 for _, _, label in replacements}
          touched = []

          for path in html_files:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new, label in replacements:
                  count = text.count(old)
                  if count:
                      totals[label] += count
                      text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  touched.append(str(path))

          missing = [label for label, count in totals.items() if count == 0]
          if missing:
              raise SystemExit('Expected source text not found: ' + ', '.join(missing))

          print('Touched files:')
          for path in touched:
              print(' -', path)
          print('Replacement counts:')
          for label, count in totals.items():
              print(f' - {label}: {count}')
          PY

      - name: Validate corrected public wording
        shell: bash
        run: |
          ! grep -R --include='*.html' -n '78 distinct destination-body labels' .
          ! grep -R --include='*.html' -n 'All 78 bodies, grouped by function' .
          ! grep -R --include='*.html' -n '78 etiquetas distintas de órgano destino' .
          ! grep -R --include='*.html' -n 'Los 78 órganos, agrupados por función' .
          ! grep -R --include='*.html' -n 'Its 7 April access resolution identified six tourism files' .
          ! grep -R --include='*.html' -n 'La resolución de acceso de 7 de abril identificó seis expedientes turísticos' .
          grep -R --include='*.html' -n '77 distinct exact values' en/index.html
          grep -R --include='*.html' -n '77 valores exactos distintos' es/index.html
          grep -R --include='*.html' -n 'proposal dated 7 April 2026' en/updates/index.html
          grep -R --include='*.html' -n 'propuesta fechada el 7 de abril de 2026' es/actualizaciones/index.html

      - name: Commit corrections and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-cabildo-corrections.yml
          git config user.name 'Project Sun Rock site maintainer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Correct Cabildo chronology and destination metric'
          git push
