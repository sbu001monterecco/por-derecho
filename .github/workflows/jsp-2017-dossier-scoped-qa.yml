name: JSP 2017 dossier scoped QA
on:
  pull_request:
    paths:
      - 'assets/data/matter-identity-registry-v1.json'
      - 'assets/data/matter-identity-registry-v1.jsp-*-20260905.json'
      - 'assets/data/jsp-2017-source-relationship-register.json'
      - 'assets/jsp-dossier-2017.*'
      - 'es/jsp-montelanza-concurso-liquidacion/**'
      - 'en/jsp-montelanza-insolvency-liquidation/**'
      - 'scripts/validate_jsp_2017_dossier.py'
      - '.github/workflows/jsp-2017-dossier-scoped-qa.yml'
permissions:
  contents: read
jobs:
  scoped-jsp-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate scoped identities, preservation, source relationships and local links
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/validate_jsp_2017_dossier.py --base "$BASE_SHA"
      - name: Confirm no tracked-file mutation
        if: always()
        run: git diff --exit-code && git diff --cached --exit-code
      - name: Preserve finite review report and exact review sources
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jsp-2017-scoped-review
          path: jsp-qa/
          if-no-files-found: warn
          retention-days: 14
