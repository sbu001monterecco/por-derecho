name: JSP live evidence verification
on:
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  live-evidence:
    if: >-
      github.repository == 'sbu001monterecco/por-derecho' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') ||
       (github.event_name == 'issue_comment' && github.event.issue.number == 1428 && github.event.comment.user.login == 'sbu001monterecco' && startsWith(github.event.comment.body, '/pd-release verify 1474 ')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false
      - name: Install read-only evidence and browser tooling
        run: |
          python3 -m pip install pymupdf==1.28.2 pillow==12.3.0 playwright
          python3 -m playwright install --with-deps chromium firefox webkit
      - name: Compare deployed files with exact checked-out source
        shell: bash
        run: |
          set -euo pipefail
          passed=false
          for attempt in 1 2 3; do
            if python3 scripts/verify_jsp_official_evidence.py --live; then
              passed=true
              break
            fi
            sleep 20
          done
          test "$passed" = true
      - name: Verify actual public JSP pages in three engines
        run: |
          python3 scripts/test_jsp_reader_browser.py --live
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: jsp-live-evidence-verification
          path: |
            /tmp/jsp-evidence-verification.json
            /tmp/jsp-browser-report
          retention-days: 30
          if-no-files-found: error
# Reads only. No authenticated mutation, dynamic shell text from comments,
# email, filing, witness contact, branch change or deployment operation.
