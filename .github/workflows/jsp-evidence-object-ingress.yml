name: JSP official evidence integrity
on:
  pull_request:
    paths:
      - 'assets/evidence/jsp-2017/**'
      - 'assets/data/jsp-official-images-provenance-20260905.json'
      - 'scripts/verify_jsp_official_evidence.py'
      - '.github/workflows/jsp-evidence-object-ingress.yml'
  push:
    branches: [main]
    paths: ['assets/evidence/jsp-2017/**', 'scripts/verify_jsp_official_evidence.py']
  workflow_dispatch:
    inputs:
      live:
        description: Verify actual public bytes after Pages deployment
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  evidence-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 -m pip install pymupdf==1.28.2 pillow==12.3.0
      - name: Check preserved original, pixel derivatives and corruption rejection
        env:
          CHECK_LIVE: ${{ inputs.live || false }}
        run: |
          if test "$CHECK_LIVE" = true; then
            python3 scripts/verify_jsp_official_evidence.py --live
          else
            python3 scripts/verify_jsp_official_evidence.py
          fi
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: jsp-official-evidence-integrity
          path: /tmp/jsp-evidence-verification.json
          retention-days: 30
          if-no-files-found: error
# The one-shot hash-locked unreferenced-blob admission completed in run33991404616.
# It is retired. This permanent workflow has no token writer, blob POST, ref,
# tree, commit, Contents mutation, Pages mutation or publication power.
