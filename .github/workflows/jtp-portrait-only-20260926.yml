name: JTP portrait-only approved replacement

on:
  push:
    branches:
      - jtp-real-portrait-only-20260926
    paths:
      - .github/workflows/jtp-portrait-only-20260926.yml

permissions:
  contents: write

jobs:
  replace-jtp-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: jtp-real-portrait-only-20260926
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic image dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Replace only approved JTP rectangle and verify pixel lock
        run: python scripts/apply_jtp_portrait_only_20260926.py

      - name: Remove transport chunks
        run: |
          rm -f ops/jtp/jtp-approved-small-20260926.part*
          rm -f ops/jtp/jtp-approved-20260926.part*

      - name: Commit verified output
        run: |
          git config user.name "SBU001 Monterecco"
          git config user.email "sbu001@monterecco.com"
          git add -A
          git status --short
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "[jtp-update] Replace only JTP portrait in actor composite"
          git push origin HEAD:jtp-real-portrait-only-20260926
