name: Validate legal professional register

on:
  pull_request:
    paths:
      - 'assets/data/matter-identity-registry-v1.json'
      - 'assets/data/matter-identity-registry-v1.professional-people.json'
      - 'assets/data/matter-identity-registry-v1.professional-organisations.json'
      - 'assets/data/legal-professionals-register-v1.json'
      - 'assets/legal-professionals-register.js'
      - 'assets/legal-professionals-register.css'
      - 'es/profesionales-representantes/**'
      - 'en/professionals-representatives/**'
      - 'scripts/validate_legal_professional_register.py'
      - '.github/workflows/validate-legal-professional-register.yml'
      - '.github/governance/records/LEGAL_PROFESSIONAL_REGISTER_AUTHORIZATION_20260825.md'
  push:
    branches: [main]
    paths:
      - 'assets/data/matter-identity-registry-v1.json'
      - 'assets/data/matter-identity-registry-v1.professional-people.json'
      - 'assets/data/matter-identity-registry-v1.professional-organisations.json'
      - 'assets/data/legal-professionals-register-v1.json'
      - 'assets/legal-professionals-register.js'
      - 'assets/legal-professionals-register.css'
      - 'es/profesionales-representantes/**'
      - 'en/professionals-representatives/**'
      - 'scripts/validate_legal_professional_register.py'
      - '.github/workflows/validate-legal-professional-register.yml'
      - '.github/governance/records/LEGAL_PROFESSIONAL_REGISTER_AUTHORIZATION_20260825.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate lawyer, firm and procurador census
        run: python scripts/validate_legal_professional_register.py
      - name: Validate browser script syntax
        run: node --check assets/legal-professionals-register.js
