name: DP1901 June one-time verified file import

on:
  push:
    branches:
      - worker/dp1901-june-source-satire-preservation-20260920
    paths:
      - .github/workflows/dp1901-june-one-time-import.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: dp1901-june-one-time-import
  cancel-in-progress: false

jobs:
  import-approved-public-files:
    if: github.repository == 'sbu001monterecco/por-derecho' && github.ref == 'refs/heads/worker/dp1901-june-source-satire-preservation-20260920'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout the exact worker commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install the transport cryptography dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1
      - name: Receive encrypted locator, verify every byte, and import only approved files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, datetime, hashlib, io, json, os, pathlib, secrets, subprocess, sys, time, urllib.parse, urllib.request, zipfile
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding, rsa
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          REPO = 'sbu001monterecco/por-derecho'
          BRANCH = 'worker/dp1901-june-source-satire-preservation-20260920'
          PREFIX = 'evidence/judicial/dp-1901-2026/june-digitised-20260920/'
          TOKEN = os.environ['GH_TOKEN']
          START_SHA = os.environ['GITHUB_SHA']
          RUN_ID = os.environ['GITHUB_RUN_ID']
          API = 'https://api.github.com/repos/' + REPO
          stage = 'initialization'

          def api(path, data=None):
              headers = {'Authorization': 'Bearer ' + TOKEN, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'PD-scoped-file-import'}
              body = None if data is None else json.dumps(data).encode()
              if body is not None:
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(API + path, data=body, headers=headers)
              with urllib.request.urlopen(req, timeout=40) as response:
                  return json.load(response)

          def git(*args):
              return subprocess.check_output(['git', *args], stderr=subprocess.DEVNULL).decode().strip()

          def safe_url(url):
              u = urllib.parse.urlparse(url)
              return u.scheme == 'https' and not u.username and not u.password and u.port in (None, 443) and bool(u.hostname) and u.hostname.endswith('.oaiusercontent.com')

          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  if not safe_url(newurl):
                      raise ValueError('Download redirect outside approved transport host')
                  return super().redirect_request(req, fp, code, msg, headers, newurl)

          def main():
              global stage
              assert os.environ['GITHUB_REPOSITORY'] == REPO
              assert os.environ['GITHUB_REF'] == 'refs/heads/' + BRANCH
              expected = json.loads(pathlib.Path('operations/imports/dp1901-june-digitised-20260920-expected.json').read_text())
              assert expected['zip_sha256'] == 'dfbc37aa17637d04fbeef509f33b795e85a5e4a591fec345b58de262657af736'
              assert expected['zip_bytes'] == 54172687 and expected['file_count'] == 18
              assert expected['prefix'] == PREFIX
              assert api('/git/ref/heads/' + BRANCH)['object']['sha'] == START_SHA
              receipt_path = pathlib.Path(PREFIX + 'UPLOAD_RECEIPT.json')
              if receipt_path.exists():
                  raise ValueError('Import already present; no repeat write')
              started = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
              private_key = rsa.generate_private_key(public_exponent=65537, key_size=3072)
              nonce = secrets.token_hex(24)
              public_key = private_key.public_key().public_bytes(serialization.Encoding.PEM, serialization.PublicFormat.SubjectPublicKeyInfo).decode()
              challenge = {'schema': 'pd-june-import-challenge-v1', 'run_id': RUN_ID, 'worker_sha': START_SHA, 'branch': BRANCH, 'nonce': nonce, 'public_key_pem': public_key, 'zip_sha256': expected['zip_sha256'], 'expires_after_seconds': 900}
              ready = api('/issues/1428/comments', {'body': 'PD-JUNE-IMPORT-READY\n' + json.dumps(challenge, indent=2)})
              print('Ready to receive the encrypted one-time transfer locator; no bearer URL is logged.', flush=True)
              stage = 'encrypted locator reception'
              payload = None
              end = time.monotonic() + 900
              while time.monotonic() < end and payload is None:
                  comments = api('/issues/1428/comments?per_page=100&since=' + urllib.parse.quote(started))
                  for comment in comments:
                      body = comment.get('body', '')
                      if comment['id'] <= ready['id'] or comment.get('user', {}).get('login') != 'sbu001monterecco' or not body.startswith('PD-JUNE-IMPORT-PAYLOAD\n'):
                          continue
                      try:
                          candidate = json.loads(body.split('\n', 1)[1])
                          if candidate.get('nonce') == nonce and str(candidate.get('run_id')) == RUN_ID:
                              payload = candidate
                              break
                      except (ValueError, TypeError):
                          continue
                  if payload is None:
                      time.sleep(10)
              if payload is None:
                  raise TimeoutError('No matching authorized payload received')
              wrapped = base64.b64decode(payload['wrapped_key'], validate=True)
              aes_key = private_key.decrypt(wrapped, padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()), algorithm=hashes.SHA256(), label=None))
              locator = AESGCM(aes_key).decrypt(base64.b64decode(payload['iv'], validate=True), base64.b64decode(payload['ciphertext'], validate=True), nonce.encode())
              url = json.loads(locator)['url']
              if not safe_url(url):
                  raise ValueError('Locator is not on the approved transport host')
              stage = 'approved public ZIP transfer'
              opener = urllib.request.build_opener(SafeRedirect())
              req = urllib.request.Request(url, headers={'User-Agent': 'PD-scoped-file-import'})
              with opener.open(req, timeout=180) as response:
                  archive = response.read(expected['zip_bytes'] + 1)
              del url, locator, private_key, aes_key
              if len(archive) != expected['zip_bytes'] or hashlib.sha256(archive).hexdigest() != expected['zip_sha256']:
                  raise ValueError('ZIP size or SHA-256 differs from the approved artifact')
              stage = 'file-by-file validation'
              approved = {r['path']: r for r in expected['files']}
              assert len(approved) == 18
              contents = {}
              with zipfile.ZipFile(io.BytesIO(archive)) as z:
                  entries = z.infolist()
                  if len(entries) != 18 or set(z.namelist()) != set(approved):
                      raise ValueError('ZIP membership differs from approved 18 files')
                  for entry in entries:
                      name = entry.filename
                      parts = pathlib.PurePosixPath(name).parts
                      if not name.startswith(PREFIX) or '..' in parts or name.startswith('/') or '\\' in name or entry.is_dir() or ((entry.external_attr >> 16) & 0o170000) == 0o120000:
                          raise ValueError('Invalid archive path or type')
                      row = approved[name]
                      if entry.file_size != row['bytes']:
                          raise ValueError('Uncompressed size mismatch')
                      data = z.read(entry)
                      blob_sha = hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
                      if hashlib.sha256(data).hexdigest() != row['sha256'] or blob_sha != row['git_blob_sha']:
                          raise ValueError('File hash mismatch')
                      target = pathlib.Path(name)
                      if target.exists() or any(p.is_symlink() for p in target.parents):
                          raise ValueError('Would overwrite an existing path or follow a symlink')
                      if name.endswith('.pdf') and not data.startswith(b'%PDF-'):
                          raise ValueError('Invalid PDF header')
                      if not name.endswith('.pdf'):
                          data.decode('utf-8')
                      contents[name] = data
              if sum(n.endswith('.pdf') for n in contents) != 7 or sum('/full-text/' in n for n in contents) != 7:
                  raise ValueError('PDF/text denominator mismatch')
              manifest = json.loads(contents[PREFIX + 'manifest.json'])
              stage = 'branch-only commit'
              if api('/git/ref/heads/' + BRANCH)['object']['sha'] != START_SHA:
                  raise ValueError('Worker branch moved; refusing concurrent overwrite')
              for name, data in contents.items():
                  path = pathlib.Path(name)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(data)
              receipt = {'schema': 'pd-june-upload-receipt-v1', 'state': 'VERIFIED_FILES_COMMITTED_IN_THIS_TREE', 'repository': REPO, 'branch': BRANCH, 'parent_sha': START_SHA, 'run_id': RUN_ID, 'imported_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'zip_sha256': expected['zip_sha256'], 'zip_bytes': len(archive), 'files_verified': 18, 'pdf_files': 7, 'page_accounted_text_files': 7, 'source_page_instances': 680, 'public_pdf_pages_including_covers': 687, 'withheld_source_page_instances': 31, 'per_file_sha256_and_git_blob_verified': True, 'files': expected['files'], 'native_unredacted_originals_uploaded': False, 'main_merged': False, 'website_deployed': False, 'image_generated': False, 'limits': 'Digitisation and hash verification do not certify source authenticity, court incorporation, legal findings or full public disclosure of privacy-withheld pages. This receipt must be paired with successful remote branch verification.'}
              receipt_path.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n')
              git('config', 'user.name', 'github-actions[bot]')
              git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
              git('add', '--', *contents.keys(), str(receipt_path))
              staged = set(git('diff', '--cached', '--name-only').splitlines())
              if staged != set(contents) | {str(receipt_path)}:
                  raise ValueError('Staged paths differ from approved import')
              git('commit', '-m', 'Upload seven actual redacted June PDFs and complete page-accounted text')
              commit = git('rev-parse', 'HEAD')
              git('push', 'origin', 'HEAD:refs/heads/' + BRANCH)
              if api('/git/ref/heads/' + BRANCH)['object']['sha'] != commit:
                  raise ValueError('Remote branch verification failed')
              stage = 'completion notification'
              api('/issues/1428/comments', {'body': 'PD-JUNE-IMPORT-COMPLETE\n' + json.dumps({'run_id': RUN_ID, 'branch': BRANCH, 'commit': commit, 'files_uploaded': 19, 'pdf_count': 7, 'text_count': 7, 'verified_input_files': 18, 'source_page_instances': 680, 'public_pdf_pages': 687, 'withheld_page_instances': 31, 'zip_sha256': expected['zip_sha256'], 'remote_branch_verified': True, 'main_merged': False, 'website_deployed': False}, indent=2)})
              print('Verified and uploaded 18 approved content files plus the receipt to worker commit ' + commit, flush=True)

          try:
              main()
          except Exception as error:
              print('Import stopped at stage: ' + stage + '; exception type: ' + type(error).__name__, file=sys.stderr)
              print('No bearer URL, private transport key or decrypted locator is included in this error report.', file=sys.stderr)
              sys.exit(1)
          PY
