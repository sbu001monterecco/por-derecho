name: Verify Palacete cache-busted live HTML PR

on:
  pull_request:
    paths:
      - '.github/workflows/verify-palacete-cachebust-live-pr.yml'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify deployed HTML uses fresh image URLs and files match repository
        run: |
          python3 - <<'PY'
          import hashlib, json, time, urllib.request
          from pathlib import Path

          base='https://sbu001monterecco.github.io/por-derecho/'
          page='es/fundacion-por-derecho/palacete-por-derecho/'
          assets=[
            'assets/palacete-san-bernardo-historica-marco.webp',
            'assets/palacete-san-bernardo-historica-detalle.webp',
            'assets/palacete-por-derecho-vision-01.webp',
            'assets/palacete-por-derecho-vision-02.webp',
          ]
          version='v=20260819b'
          required=[
            'palacete-san-bernardo-historica-marco.webp?'+version,
            'palacete-san-bernardo-historica-detalle.webp?'+version,
            'palacete-por-derecho-vision-01.webp?'+version,
            'palacete-por-derecho-vision-02.webp?'+version,
            'site.js?v=20260819e',
          ]
          expected={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in assets}

          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Por-Derecho-Palacete-Cache-Verifier/1.0','Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache'})
            with urllib.request.urlopen(req,timeout=25) as r:
              return r.status, dict(r.headers.items()), r.read()

          last={}
          for attempt in range(1,49):
            nonce=f'{int(time.time())}-{attempt}'
            status,headers,body=get(f'{base}{page}?verify={nonce}')
            text=body.decode('utf-8','replace')
            missing=[m for m in required if m not in text]
            result={'attempt':attempt,'page_status':status,'page_bytes':len(body),'last_modified':headers.get('Last-Modified'),'missing_versioned_refs':missing,'assets':{}}
            ok=status==200 and not missing
            for asset in assets:
              s,h,b=get(f'{base}{asset}?{version}&verify={nonce}')
              riff=len(b)>=12 and b[:4]==b'RIFF' and b[8:12]==b'WEBP'
              declared=int.from_bytes(b[4:8],'little')+8 if riff else None
              sha=hashlib.sha256(b).hexdigest()
              exact=sha==expected[asset]
              result['assets'][asset]={'status':s,'content_type':h.get('Content-Type'),'bytes':len(b),'declared_bytes':declared,'riff_complete':bool(riff and declared==len(b)),'exact_repository_match':exact}
              ok=ok and s==200 and riff and declared==len(b) and exact
            last=result
            print(json.dumps(result,ensure_ascii=False,indent=2),flush=True)
            if ok:
              print('PALACETE CACHE-BUSTED PUBLIC HTML: VERIFIED',flush=True)
              raise SystemExit(0)
            time.sleep(5)
          print(json.dumps({'final_failure':last},ensure_ascii=False,indent=2),flush=True)
          raise SystemExit(1)
          PY
