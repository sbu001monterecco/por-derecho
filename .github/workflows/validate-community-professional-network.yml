      - 'en/shaila-maria-cogolludo-ramos/**'
      - 'es/francisco-mario-matos-matas/**'
      - 'en/francisco-mario-matos-matas/**'
      - 'es/francisco-de-borja-rodriguez-batllori-laffitte/**'
      - 'en/francisco-de-borja-rodriguez-batllori-laffitte/**'
      - 'es/asuncion-aizpurua-sanchez/**'
      - 'en/asuncion-aizpurua-sanchez/**'
      - 'es/montelanza-monte-lanza-sl/**'
      - 'en/montelanza-monte-lanza-sl/**'
      - 'es/inversiones-salinetas-sl/**'
      - 'en/inversiones-salinetas-sl/**'
