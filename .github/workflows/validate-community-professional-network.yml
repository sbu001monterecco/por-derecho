      - 'scripts/validate_community_professional_network.py'
      - 'scripts/register_community_professional_network_routes.py'
      - 'sitemap*.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate bilingual profiles, evidence lanes and discovery
        run: python scripts/validate_community_professional_network.py
      - name: Validate repository publication controls
        run: |
          python scripts/validate_publication_integrity.py
          python scripts/validate_audience_experience.py
