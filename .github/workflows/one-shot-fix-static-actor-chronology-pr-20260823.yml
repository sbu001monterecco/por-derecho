name: One-shot actor chronology correction on PR

on:
  pull_request:
    branches: [main]
    paths:
      - "en/index.html"
      - "es/index.html"
      - ".github/workflows/one-shot-fix-static-actor-chronology-pr-20260823.yml"
      - ".github/workflows/one-shot-fix-static-actor-chronology-20260823.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/static-homepage-actor-chronology-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Correct static EN/ES actor cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              Path('en/index.html'): {
                  'Francisco Mario Matos Matas': '<article><span class="actor-stage">By 22 Jun 2011 → Community administration</span><strong>Francisco Mario Matos Matas</strong><span class="actor-copy">The 22 June 2011 minutes identify him as Community Administrator. Later sources place him in Pamanil and Community administration; subsequent control, account and information roles must be tested act by act.</span></article>',
                  'Antonio Cogolludo Rojas': '<article><span class="actor-stage">By 10 Apr 2014 → representation / Community</span><strong>Antonio Cogolludo Rojas</strong><span class="actor-copy">The 10 April 2014 notarial record identifies him as Cristina Molina Petit’s representative. Later access, security and business-perimeter roles require date-specific proof.</span></article>',
                  'Shaila María Cogolludo Ramos': '<article><span class="actor-stage">By 8 Apr 2014 → communications / administration</span><strong>Shaila María Cogolludo Ramos</strong><span class="actor-copy">A Pamanil communication dated 8 April 2014 appears signed by FMMM and Shaila. Later Pamanil/Community communications document continuity; this is a locked minimum date, not a claimed first day.</span></article>',
              },
              Path('es/index.html'): {
                  'Francisco Mario Matos Matas': '<article><span class="actor-stage">Antes del 22 jun 2011 → administración comunitaria</span><strong>Francisco Mario Matos Matas</strong><span class="actor-copy">El acta de 22 de junio de 2011 lo identifica como Administrador de la Comunidad. Fuentes posteriores lo sitúan en Pamanil y en la administración comunitaria; los posteriores roles de control, cuentas e información deben probarse acto por acto.</span></article>',
                  'Antonio Cogolludo Rojas': '<article><span class="actor-stage">Antes del 10 abr 2014 → representación / Comunidad</span><strong>Antonio Cogolludo Rojas</strong><span class="actor-copy">El acta notarial de 10 de abril de 2014 lo identifica como representante de Cristina Molina Petit. Los posteriores roles de acceso, seguridad y perímetro empresarial exigen prueba fechada.</span></article>',
                  'Shaila María Cogolludo Ramos': '<article><span class="actor-stage">Antes del 8 abr 2014 → comunicaciones / administración</span><strong>Shaila María Cogolludo Ramos</strong><span class="actor-copy">Una comunicación Pamanil de 8 de abril de 2014 aparece firmada por FMMM y Shaila. Las comunicaciones posteriores Pamanil/Comunidad documentan continuidad; es una fecha mínima bloqueada, no un primer día afirmado.</span></article>',
              },
          }

          for path, actors in replacements.items():
              text = path.read_text(encoding='utf-8')
              for name, replacement in actors.items():
                  pattern = re.compile(r'<article><span class="actor-stage">[^<]*</span><strong>' + re.escape(name) + r'</strong><span class="actor-copy">.*?</span></article>')
                  text, count = pattern.subn(replacement, text, count=1)
                  if count != 1:
                      raise SystemExit(f'Expected exactly one static actor card for {name} in {path}; found {count}')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit to PR head
        run: |
          if git diff --quiet -- en/index.html es/index.html; then
            echo "No correction required."
            exit 0
          fi
          git config user.name "por-derecho publication control"
          git config user.email "sbu001@monterecco.com"
          git add en/index.html es/index.html
          git commit -m "Correct static homepage actor chronology"
          git push origin HEAD:${{ github.head_ref }}
