name: Verify PwC Carlos Saavedra live package

on:
  pull_request:
    paths:
      - '.github/workflows/verify-pwc-carlos-saavedra-live.yml'
      - 'scripts/verify_pwc_carlos_saavedra_live.py'
      - 'publication-manifests/pwc-carlos-saavedra-20260901.json'
      - 'archive/PWC_CARLOS_SAAVEDRA_PUBLICATION_CLOSEOUT_01SEP2026.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-pwc-carlos-saavedra-live.yml'
      - 'scripts/verify_pwc_carlos_saavedra_live.py'
      - 'publication-manifests/pwc-carlos-saavedra-20260901.json'
      - 'en/pwc-canarias-carlos-saavedra-sun-park/**'
      - 'es/pwc-canarias-carlos-saavedra-sun-park/**'
      - 'assets/actors/carlos-saavedra--linkedin-profile--20260901.jpg'
      - 'assets/data/caepr-caret-pwc-carlos-saavedra-first-hop-v1.json'
      - 'assets/data/caepr-caret-unitary-digest-v1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-pwc-carlos-saavedra-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate identity expectations against the proposed tree
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location(
              'pwc_live', root / 'scripts/verify_pwc_carlos_saavedra_live.py'
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          identity = json.loads(
              (root / 'assets/data/matter-identity-registry-v1.json').read_text(encoding='utf-8')
          )
          checks = module.validate_json('identity', identity)
          assert checks and all(checks.values()), checks
          for item in module.RESOURCES:
              source = root / item['source_path']
              assert source.is_file(), source
              if item.get('markers'):
                  text = source.read_text(encoding='utf-8')
                  missing = [marker for marker in item['markers'] if marker not in text]
                  assert not missing, (source, missing)
          print('PwC live-verifier proposed-tree expectations: PASS')
          PY
      - name: Verify exact live bytes, markers and finite controls
        if: github.event_name != 'pull_request'
        run: |
          python scripts/verify_pwc_carlos_saavedra_live.py \
            --attempts 20 \
            --delay 15 \
            --output artifacts/pwc-carlos-saavedra-live/verification.json
      - name: Upload live verification evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pwc-carlos-saavedra-live-verification
          path: artifacts/pwc-carlos-saavedra-live/verification.json
          if-no-files-found: error
          retention-days: 30
