name: Review scoped Cuatrecasas source correction
on:
  push:
    branches: [agent/cuatrecasas-position-status-20260927]
    paths: [.github/workflows/cuatrecasas-source-reconcile-20260927.yml]
permissions:
  contents: write
concurrency:
  group: cuatrecasas-source-reconcile-20260927
  cancel-in-progress: false
jobs:
  review-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/cuatrecasas-position-status-20260927
          fetch-depth: 0
      - name: Bilingual and source invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/review_cuatrecasas_position_20260927.py
          python3 -m py_compile scripts/reconcile_cuatrecasas_position_status_20260927.py
          python3 scripts/validate_repository_preservation.py
          python3 scripts/validate_publication_integrity.py
          python3 scripts/validate_audience_experience.py
          git rm -- .github/workflows/cuatrecasas-source-reconcile-20260927.yml
          git commit -m 'Remove completed review runner before final PR checks'
          git push origin HEAD:refs/heads/agent/cuatrecasas-position-status-20260927
