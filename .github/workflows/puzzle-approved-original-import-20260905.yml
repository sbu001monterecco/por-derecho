name: Import the authorised exact Puzzle original
on:
  push:
    branches: [legaltech/uria-search-graph-evidence-20260904]
    paths: [.github/workflows/puzzle-approved-original-import-20260905.yml]
permissions:
  contents: write
concurrency:
  group: puzzle-original-import
  cancel-in-progress: true
jobs:
  original:
    if: github.repository == 'sbu001monterecco/por-derecho'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: legaltech/uria-search-graph-evidence-20260904
          fetch-depth: 1
      - run: python -m pip install --quiet PyMuPDF==1.26.4 Pillow==11.3.0 requests==2.32.5
      - name: Fetch only the exact authorised original from its dedicated public transfer copy
        shell: python
        run: |
          import json,base64,hashlib,pathlib,subprocess,shutil,requests
          import fitz
          from PIL import Image
          branch='legaltech/uria-search-graph-evidence-20260904'
          expected='e441bdb368c0092d5b15ca5ee911eeac266540bde54817e424f3075f4c5fdd47'
          share='https://1drv.ms/b/c/bdf43392f576e62f/IQCdnbR3Hj-qS4-0lXT2neQ0AbnAoVnTNFT7eNntXcc2gkI'
          token='u!'+base64.urlsafe_b64encode(share.encode()).decode().rstrip('=')
          candidates=['https://api.onedrive.com/v1.0/shares/'+token+'/root/content',share+'?download=1']
          observations=[]; temp=pathlib.Path('/tmp/approved-puzzle.pdf'); found=False
          session=requests.Session()
          for source in candidates:
            try:
              with session.get(source,timeout=60,stream=True) as response:
                record={'route':'onedrive-public-content' if 'api.onedrive.com' in source else 'dedicated-public-share','status':response.status_code,'content_type':response.headers.get('Content-Type')}
                observations.append(record)
                if response.status_code!=200: continue
                h=hashlib.sha256(); size=0
                with temp.open('wb') as output:
                  for block in response.iter_content(1024*1024):
                    size+=len(block)
                    if size>50046618: raise ValueError('Oversized source')
                    h.update(block);output.write(block)
                record['size']=size;record['sha256']=h.hexdigest()
                if size==50046618 and h.hexdigest()==expected:
                  found=True;break
            except Exception as exc:
              observations.append({'error_type':type(exc).__name__})
          pathlib.Path('/tmp/puzzle-import-observations.json').write_text(json.dumps(observations,indent=2))
          print(json.dumps(observations,indent=2))
          if not found: raise SystemExit('No byte-exact original received; no repository asset changes made.')
          doc=fitz.open(temp)
          if len(doc)!=32 or doc.is_encrypted: raise SystemExit('PDF contract failed')
          subprocess.run(['git','fetch','origin',branch],check=True)
          subprocess.run(['git','checkout','-B',branch,'FETCH_HEAD'],check=True)
          root=pathlib.Path('assets/docs/puzzle');root.mkdir(parents=True,exist_ok=True)
          original=root/'PUZZLE-2024-original.pdf';shutil.copyfile(temp,original)
          rows=[]
          for index,page in enumerate(doc,1):
            pix=page.get_pixmap(matrix=fitz.Matrix(3200/page.rect.width,3200/page.rect.width),alpha=False)
            image=Image.frombytes('RGB',[pix.width,pix.height],pix.samples)
            large=root/f'page-{index:02d}.jpg';image.save(large,'JPEG',quality=93,optimize=True,progressive=True)
            image.thumbnail((1600,1600));display=root/f'page-{index:02d}.webp';image.save(display,'WEBP',quality=90,method=6)
            rows.append({'page':index,'display':display.as_posix(),'download':large.as_posix(),'width':pix.width,'height':pix.height,'display_sha256':hashlib.sha256(display.read_bytes()).hexdigest(),'download_sha256':hashlib.sha256(large.read_bytes()).hexdigest(),'origin':'Full page rasterised from byte-exact authorised original; no semantic edits','parent_sha256':expected})
          manifest={'schema':'por-derecho.puzzle-assets.v2','original':{'path':original.as_posix(),'sha256':expected,'sizeBytes':50046618,'pageCount':32},'pages':rows,'status':'MATERIALISED_ON_CANDIDATE_BRANCH_NOT_YET_LIVE','source_authority':'Explicit public-repository publication request and Control Tower 1428; dedicated public read-only transfer copy, original private Drive permissions unchanged','court_filing_status':'Not established by file identity or this import'}
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          subprocess.run(['git','add','--','assets/docs/puzzle'],check=True)
          subprocess.run(['git','-c','user.name=Por Derecho controlled import','-c','user.email=299972076+sbu001monterecco@users.noreply.github.com','commit','-m','Materialise byte-exact original Puzzle and source-derived page images'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          print('Source bytes verified; branch commit',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
      - name: Import receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: puzzle-original-import-observations
          path: /tmp/puzzle-import-observations.json
          retention-days: 14
          if-no-files-found: warn
