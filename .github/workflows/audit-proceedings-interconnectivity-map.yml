permissions:
  contents: read

jobs:
  proceedings-interconnectivity-map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Check generated public proceedings projection
        run: python3 scripts/build_public_proceedings_projection.py --check
      - name: Check generated Case Prism projection
        run: python scripts/build_proceedings_case_prism_v2.py --check
      - name: Check generated proceedings interlinkability projection
        run: python3 scripts/build_proceedings_interlinkability_v1.py --check
      - name: Audit proceedings map invariants
        run: python scripts/audit_proceedings_interconnectivity_map.py
      - name: Audit canonical publication and representation gaps
        run: |
          python scripts/audit_master_proceedings_publication.py
          python scripts/audit_counsel_procurador_governance.py
      - name: Validate proceedings renderer JavaScript syntax
        run: |
          node --check assets/proceedings-interconnectivity-map-20260830.js
          node --check assets/master-proceedings-publication-20260830.js
          node --check assets/site.js
          node --check scripts/smoke_proceedings_case_prism.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.50.1
          npx playwright install --with-deps chromium
      - name: Serve static site at production subpath
        run: |
          mkdir -p /tmp/psr-proceedings-site/por-derecho
          cp -a . /tmp/psr-proceedings-site/por-derecho/
          cd /tmp/psr-proceedings-site
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/psr-proceedings-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/por-derecho/en/proceedings-map/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/psr-proceedings-http.log
          exit 1
      - name: Render and interact with Case Prism views
        env:
          PSR_BASE_URL: http://127.0.0.1:8000/por-derecho
        run: node scripts/smoke_proceedings_case_prism.mjs
