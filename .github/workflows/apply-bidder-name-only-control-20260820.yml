name: Apply bidder name-only control (one-time branch migration)

on:
  push:
    branches:
      - chore/bidder-name-only-control-2026-08-20

permissions:
  contents: write

concurrency:
  group: apply-bidder-name-only-control-20260820
  cancel-in-progress: false

jobs:
  apply-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/bidder-name-only-control-2026-08-20
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply exact wording migration
        run: |
          python -m py_compile scripts/apply_bidder_name_only_control_20260820.py
          python scripts/apply_bidder_name_only_control_20260820.py
      - name: Remove one-time migration machinery
        run: |
          rm scripts/apply_bidder_name_only_control_20260820.py
          rm .github/workflows/apply-bidder-name-only-control-20260820.yml
      - name: Validate name-only scope and complete bid preservation
        run: |
          python -m py_compile scripts/validate_public_bidder_anonymisation.py
          python -m py_compile scripts/rewrite_public_bidder_anonymisation.py
          node --check assets/adjudicacion-provenance-cross-site-20260819.js
          python scripts/validate_public_bidder_anonymisation.py
          git diff --check
      - name: Commit the completed migration to the isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit" >&2
            exit 1
          fi
          git commit -m "Apply bidder name-only control and preserve complete bid record"
          git push origin HEAD:chore/bidder-name-only-control-2026-08-20
