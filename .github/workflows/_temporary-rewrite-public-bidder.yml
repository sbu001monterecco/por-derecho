name: Temporary rewrite protected bidder from public source

on:
  push:
    branches:
      - chatgpt/anonymise-third-party-bidder-strengthen-adjudication-20260820
    paths:
      - 'scripts/rewrite_public_bidder_anonymisation.py'
      - '.github/workflows/_temporary-rewrite-public-bidder.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Rewrite protected identifier from public source
        run: python3 scripts/rewrite_public_bidder_anonymisation.py
      - name: Commit source-level anonymisation
        run: |
          if git diff --quiet; then
            echo 'No protected public-source identifiers remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add es en assets index.html sitemap.xml rss.xml 2>/dev/null || true
          git commit -m 'Anonymise third-party bidder in legacy public pages'
          git push origin HEAD:${{ github.ref_name }}
