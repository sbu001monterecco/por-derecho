name: Import RICPE resolution 27 Aug 2026

on:
  push:
    branches:
      - codex/ricpe-full-resolution-questions-20260827
    paths:
      - .github/workflows/import-ricpe-resolution-20260827.yml

permissions:
  contents: write

jobs:
  import-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ricpe-full-resolution-questions-20260827
          fetch-depth: 0
      - name: Download authoritative certificate
        shell: bash
        run: |
          set -euo pipefail
          target="evidence/ricpe-cnmv/2026-08-27"
          mkdir -p "$target/resolution-pages"
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-8c38-8246-b4b0-3039d5733590/raw?se=2026-08-27T12%3A48%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=51eb66ec-f8c2-5df1-ba86-aee1fd21f202&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-27T04%3A06%3A09Z&ske=2026-08-28T04%3A06%3A09Z&sks=b&skv=2026-02-06&sig=EzVQhGjEw6hYL%2BGe42wqr4WaYO1EIpUbfWTju%2BKZ88M%3D' \
            -o "$target/RICPE_Canal_Etico_Certificado_Resolucion_27AGO2026.pdf"
          echo 'db9979715cac4aeb8ded81a998227cfd894144dcd0a50fe81d4b1369904c9bb4  evidence/ricpe-cnmv/2026-08-27/RICPE_Canal_Etico_Certificado_Resolucion_27AGO2026.pdf' | sha256sum -c -
      - name: Render all six pages as JPEG images
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          target="evidence/ricpe-cnmv/2026-08-27"
          pdftoppm -jpeg -r 110 -jpegopt quality=82,progressive=y,optimize=y \
            "$target/RICPE_Canal_Etico_Certificado_Resolucion_27AGO2026.pdf" \
            "$target/resolution-pages/page"
          test "$(find "$target/resolution-pages" -maxdepth 1 -name 'page-*.jpg' | wc -l)" -eq 6
      - name: Commit imported originals and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/ricpe-cnmv/2026-08-27/RICPE_Canal_Etico_Certificado_Resolucion_27AGO2026.pdf evidence/ricpe-cnmv/2026-08-27/resolution-pages
          git rm .github/workflows/import-ricpe-resolution-20260827.yml
          git commit -m 'Add full RICPE resolution PDF and six page images'
          git push origin HEAD:codex/ricpe-full-resolution-questions-20260827
