name: Reconcile proceedings smoke 20260903

on:
  push:
    branches:
      - ministerio-fiscal-fulltext-audit-20260903
    paths:
      - '.github/workflows/reconcile-proceedings-smoke-20260903.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ministerio-fiscal-fulltext-audit-20260903
      - name: Extract render-source context
        shell: python
        run: |
          from pathlib import Path
          src = Path('assets/proceedings-interconnectivity-map-20260830.js').read_text(encoding='utf-8')
          needles = [
              'data-mf-files-matrix-detail',
              'data-mf-file-register',
              'data-mf-file-matrix',
              'exactDecisionRegister',
              'fiscaliaMatrix',
          ]
          out=[]
          for needle in needles:
              out.append(f'=== {needle} ===')
              starts=[]; pos=0
              while True:
                  i=src.find(needle,pos)
                  if i<0: break
                  starts.append(i); pos=i+1
              out.append(f'count={len(starts)} positions={starts}')
              for i in starts[:10]:
                  out.append(src[max(0,i-900):min(len(src),i+1800)])
                  out.append('\n---\n')
          Path('.github/proceedings-render-source-diagnostic.txt').write_text('\n'.join(out),encoding='utf-8')
      - name: Preserve diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/proceedings-render-source-diagnostic.txt
          git commit -m 'Preserve temporary proceedings render diagnostic'
          git push origin HEAD:ministerio-fiscal-fulltext-audit-20260903
