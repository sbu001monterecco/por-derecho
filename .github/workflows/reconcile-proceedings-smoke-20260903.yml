name: Reconcile proceedings smoke 20260903

on:
  push:
    branches:
      - ministerio-fiscal-fulltext-audit-20260903
    paths:
      - '.github/workflows/reconcile-proceedings-smoke-20260903.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ministerio-fiscal-fulltext-audit-20260903
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.50.1
          npx playwright install --with-deps chromium
      - name: Serve and inspect rendered files view
        run: |
          mkdir -p /tmp/psr-site/por-derecho
          cp -a . /tmp/psr-site/por-derecho/
          cd /tmp/psr-site
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/psr-http.log 2>&1 &
          cd "$GITHUB_WORKSPACE"
          cat > /tmp/inspect.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          await page.goto('http://127.0.0.1:8000/por-derecho/en/proceedings-map/', {waitUntil:'networkidle'});
          await page.waitForSelector('#hub');
          await page.waitForTimeout(500);
          const result = await page.locator('#hub').evaluate((hub) => {
            const matrix = hub.querySelector('[data-mf-files-matrix-detail]');
            const register = hub.querySelector('[data-mf-file-register]');
            const describe = (el) => el ? {
              tag: el.tagName,
              id: el.id,
              cls: el.className,
              attrs: Array.from(el.attributes).map(a => [a.name,a.value]),
              text: (el.textContent || '').replace(/\s+/g,' ').trim().slice(0,500),
              parentTag: el.parentElement?.tagName,
              parentId: el.parentElement?.id,
              parentClass: el.parentElement?.className,
              childIndex: el.parentElement ? Array.from(el.parentElement.children).indexOf(el) : -1,
            } : null;
            return {
              matrix: describe(matrix), register: describe(register),
              matrixBeforeRegister: matrix && register ? !!(matrix.compareDocumentPosition(register) & Node.DOCUMENT_POSITION_FOLLOWING) : null,
              registerBeforeMatrix: matrix && register ? !!(register.compareDocumentPosition(matrix) & Node.DOCUMENT_POSITION_FOLLOWING) : null,
              sameParent: !!matrix && !!register && matrix.parentElement === register.parentElement,
              parentChildren: matrix?.parentElement ? Array.from(matrix.parentElement.children).map((el,i)=>({i,tag:el.tagName,id:el.id,cls:el.className,attrs:Array.from(el.attributes).map(a=>a.name)})) : [],
            };
          });
          fs.writeFileSync('.github/proceedings-render-dom-diagnostic.json', JSON.stringify(result,null,2)+'\n');
          await browser.close();
          NODE
          node /tmp/inspect.mjs
      - name: Preserve rendered DOM diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/proceedings-render-dom-diagnostic.json
          git commit -m 'Preserve temporary proceedings DOM diagnostic'
          git push origin HEAD:ministerio-fiscal-fulltext-audit-20260903
