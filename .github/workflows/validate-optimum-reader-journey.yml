name: Validate optimum reader journey

on:
  pull_request:
    paths:
      - 'assets/optimum-reader-journey-20260818.*'
      - 'assets/optimum-reader-journey-finish-20260818.js'
      - 'assets/ricpe-filed-status-20260817.js'
      - 'assets/supervisory-practice-entrypoints-20260818.js'
      - 'assets/unitary-public-shell-20260818.js'
      - 'scripts/render_optimum_reader_journey.mjs'
      - 'archive/OPTIMUM_USER_JOURNEY_EXECUTION_PROMPT_18AUG2026.md'
  push:
    branches: [main]
    paths:
      - 'assets/optimum-reader-journey-20260818.*'
      - 'assets/optimum-reader-journey-finish-20260818.js'
      - 'assets/ricpe-filed-status-20260817.js'
      - 'assets/supervisory-practice-entrypoints-20260818.js'
      - 'assets/unitary-public-shell-20260818.js'
      - 'scripts/render_optimum_reader_journey.mjs'
      - 'archive/OPTIMUM_USER_JOURNEY_EXECUTION_PROMPT_18AUG2026.md'

permissions:
  contents: read

concurrency:
  group: optimum-reader-journey-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check assets/optimum-reader-journey-20260818.js
          node --check assets/optimum-reader-journey-finish-20260818.js
          node --check assets/ricpe-filed-status-20260817.js
          node --check assets/supervisory-practice-entrypoints-20260818.js
          node --check scripts/render_optimum_reader_journey.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.50.1
          npx playwright install --with-deps chromium
      - name: Serve the static site at the production subpath
        run: |
          mkdir -p /tmp/psr-site/por-derecho
          cp -a . /tmp/psr-site/por-derecho/
          cd /tmp/psr-site
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/psr-http.log 2>&1 &
          echo $! > /tmp/psr-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/por-derecho/es/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/psr-http.log
          exit 1
      - name: Render and validate cross-device journeys
        env:
          PSR_BASE_URL: http://127.0.0.1:8000/por-derecho
          PSR_SCREENSHOT_DIR: artifacts/optimum-reader-journey
        run: node scripts/render_optimum_reader_journey.mjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: optimum-reader-journey-screenshots
          path: artifacts/optimum-reader-journey
          if-no-files-found: warn
          retention-days: 14
