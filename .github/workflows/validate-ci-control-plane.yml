name: Validate CI control plane
on:
  push:
    branches: [integration/ci-rules-open-work-20260905]
    paths: ['.github/workflows/validate-ci-control-plane.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-control-plane-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Export bounded current public source and regression results
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,zipfile
          out=pathlib.Path('/tmp/ci-source');out.mkdir()
          command=['python3','-m','unittest','discover','-s','scripts','-p','test_ci_control_plane.py','-v']
          test=subprocess.run(command,capture_output=True,text=True)
          (out/'tests.log').write_text(test.stdout+test.stderr)
          print('NEGATIVE_TESTS',test.returncode,(test.stdout+test.stderr)[-2500:])
          paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          wanted=[]
          for p in paths:
              path=pathlib.Path(p)
              if path.suffix.lower() in {'.py','.json','.yml','.yaml','.html','.js','.css','.md','.txt','.csv','.xml','.svg'}:
                  wanted.append(p)
          with zipfile.ZipFile(out/'source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in wanted:z.write(p)
              z.writestr('AUDIT_SOURCE_SHA',subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          print('SOURCE_BUNDLE',len(wanted),(out/'source.zip').stat().st_size)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ci-source-final-repair
          path: /tmp/ci-source/
          retention-days: 7
