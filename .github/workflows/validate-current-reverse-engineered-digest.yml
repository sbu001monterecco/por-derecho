      - 'scripts/verify_current_reverse_engineered_digest_live.py'
      - '.github/workflows/validate-current-reverse-engineered-digest.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate digest controls
        run: python3 scripts/validate_current_reverse_engineered_digest.py
      - name: Validate first-hop rendered caret provenance
        run: python3 scripts/validate_alberto_meeting_point_first_hop_caret.py
      - name: Validate JSON syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in [
              'ops/CURRENT_REVERSE_ENGINEERED_DIGEST.json',
              'assets/data/alberto-meeting-point-357-multidirectional-evidence-v1.json',
              'assets/data/caepr-caret-alberto-meeting-point-357-v1.json',
              'assets/data/caepr-caret-alberto-meeting-point-first-hop-v1.json',
              'assets/data/caepr-caret-unitary-digest-v1.json',
              'publication-manifests/alberto-meeting-point-multidirectional-criminal-first-20260827.json',
              'publication-manifests/unitary-repository-website-redigest-20260827.json',
          ]:
              json.loads(Path(path).read_text(encoding='utf-8'))
          print('JSON syntax: PASS')
          PY

      - name: Compile exact live verifier
        run: python3 -B -m py_compile scripts/verify_current_reverse_engineered_digest_live.py

  verify-exact-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Attest exact Pages SHA and compare controlled live bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify_current_reverse_engineered_digest_live.py \
            --expected-sha "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --closeout-output artifacts/current-reverse-engineered-digest/deployment-readback-closeout.json
      - name: Upload separate deployment/readback closeout control
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-reverse-engineered-digest-closeout-${{ github.run_id }}
          path: artifacts/current-reverse-engineered-digest/deployment-readback-closeout.json
          if-no-files-found: error
          retention-days: 30
