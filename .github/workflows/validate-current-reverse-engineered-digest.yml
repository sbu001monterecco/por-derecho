name: Validate current reverse-engineered repository and website digest

on:
  pull_request:
    paths:
      - 'CURRENT_REVERSE_ENGINEERED_DIGEST.md'
      - 'ops/CURRENT_REVERSE_ENGINEERED_DIGEST.json'
      - 'publication-manifests/unitary-repository-website-redigest-20260827.json'
      - 'scripts/validate_current_reverse_engineered_digest.py'
      - '.github/workflows/validate-current-reverse-engineered-digest.yml'
  push:
    branches: [main]
    paths:
      - 'CURRENT_REVERSE_ENGINEERED_DIGEST.md'
      - 'ops/CURRENT_REVERSE_ENGINEERED_DIGEST.json'
      - 'publication-manifests/unitary-repository-website-redigest-20260827.json'
      - 'scripts/validate_current_reverse_engineered_digest.py'
      - '.github/workflows/validate-current-reverse-engineered-digest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate digest controls
        run: python3 scripts/validate_current_reverse_engineered_digest.py
      - name: Validate JSON syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in [
              'ops/CURRENT_REVERSE_ENGINEERED_DIGEST.json',
              'publication-manifests/unitary-repository-website-redigest-20260827.json',
          ]:
              json.loads(Path(path).read_text(encoding='utf-8'))
          print('JSON syntax: PASS')
          PY

  verify-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    env:
      BASE: https://sbu001monterecco.github.io/por-derecho
    steps:
      - name: Verify exact public controls with cache busting
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base = os.environ['BASE'].rstrip('/')
          checks = [
              ('/CURRENT_REVERSE_ENGINEERED_DIGEST.md', [
                  'PD-UNITARY-REDIGEST-20260827-01',
                  'Sun Park was one economically integrated hotel platform',
                  '19 / 24 confirmed',
              ]),
              ('/ops/CURRENT_REVERSE_ENGINEERED_DIGEST.json', [
                  'PD-UNITARY-REDIGEST-20260827-01',
                  'REPOSITORY_CONTROLLED_PUBLIC_SAFE',
                  'SUPERSEDED_NOT_MERGEABLE_AS_IS',
              ]),
              ('/publication-manifests/unitary-repository-website-redigest-20260827.json', [
                  'unitary-repository-website-redigest-20260827',
                  'PD-UNITARY-REDIGEST-20260827-01',
                  'material_date_change',
              ]),
          ]

          def fetch(url: str) -> str:
              separator = '&' if '?' in url else '?'
              request = urllib.request.Request(
                  f'{url}{separator}unitary_redigest={int(time.time())}',
                  headers={
                      'User-Agent': 'por-derecho-current-redigest-verifier/1',
                      'Cache-Control': 'no-cache',
                      'Pragma': 'no-cache',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f'HTTP {response.status}')
                  return response.read().decode('utf-8', errors='replace')

          failures = []
          for route, markers in checks:
              url = base + route
              last = ''
              for _ in range(18):
                  try:
                      body = fetch(url)
                      missing = [marker for marker in markers if marker not in body]
                      if not missing:
                          print(f'LIVE VERIFIED {url} :: {len(body)} bytes :: {len(markers)} markers')
                          break
                      last = f'missing {missing}'
                  except Exception as exc:
                      last = str(exc)
                  time.sleep(10)
              else:
                  failures.append(f'{url}: {last}')

          if failures:
              raise SystemExit('LIVE VERIFICATION FAILED\n - ' + '\n - '.join(failures))
          print(json.dumps({'state': 'LIVE_VERIFIED', 'verified_routes': len(checks)}))
          PY
