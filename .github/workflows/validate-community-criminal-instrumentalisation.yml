name: Validate Community criminal-instrumentalisation control

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CHATGPT_START_HERE.md"
      - "COMMUNITY_ACTAS_TWO_TRACK_AUDIT.md"
      - "TWO_COMPETING_GOVERNANCE_RECORDS_2008_2022.md"
      - "THREAD_DELETION_AUDIT_2026-08-19_COMMUNITY_ACTAS.md"
      - "JDAM_ARCHITECTURE_DOCUMENTARY_NODE_MASTER_RECORD_20AUG2026.md"
      - "archive/*COMMUNITY*"
      - "archive/*ACTA*"
      - "archive/CONTINUOUS_MAINTENANCE_MATRIX.md"
      - "archive/SUN_PARK_UNITARY_REPOSITORY_WEBSITE_REDIGEST_21AUG2026.md"
      - "archive/CONTINUOUS_MAINTENANCE_MATRIX_COMMUNITY_ACTAS_UPDATE_17AUG2026.md"
      - "assets/data/community-criminal-instrumentalisation-v1.json"
      - "assets/data/jdam-architecture-documentary-node-v1.json"
      - "es/comunidad-instrumentalizacion/**"
      - "en/community-instrumentalisation/**"
      - "es/arquitectura-nodo-documental-jdam/**"
      - "en/architecture-documentary-node-jdam/**"
      - "scripts/validate_community_criminal_instrumentalisation.py"
      - ".github/workflows/validate-community-criminal-instrumentalisation.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "CHATGPT_START_HERE.md"
      - "COMMUNITY_ACTAS_TWO_TRACK_AUDIT.md"
      - "TWO_COMPETING_GOVERNANCE_RECORDS_2008_2022.md"
      - "THREAD_DELETION_AUDIT_2026-08-19_COMMUNITY_ACTAS.md"
      - "JDAM_ARCHITECTURE_DOCUMENTARY_NODE_MASTER_RECORD_20AUG2026.md"
      - "archive/*COMMUNITY*"
      - "archive/*ACTA*"
      - "archive/CONTINUOUS_MAINTENANCE_MATRIX.md"
      - "archive/SUN_PARK_UNITARY_REPOSITORY_WEBSITE_REDIGEST_21AUG2026.md"
      - "archive/CONTINUOUS_MAINTENANCE_MATRIX_COMMUNITY_ACTAS_UPDATE_17AUG2026.md"
      - "assets/data/community-criminal-instrumentalisation-v1.json"
      - "assets/data/jdam-architecture-documentary-node-v1.json"
      - "es/comunidad-instrumentalizacion/**"
      - "en/community-instrumentalisation/**"
      - "es/arquitectura-nodo-documental-jdam/**"
      - "en/architecture-documentary-node-jdam/**"
      - "scripts/validate_community_criminal_instrumentalisation.py"
      - ".github/workflows/validate-community-criminal-instrumentalisation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Criminal attribution, source status and legal-boundary controls
        run: python scripts/validate_community_criminal_instrumentalisation.py
