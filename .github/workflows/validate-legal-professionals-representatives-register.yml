name: Validate legal professionals and representatives register

on:
  pull_request:
    paths:
      - "assets/data/legal-professionals-representatives-register-v1*.json"
      - "archive/LEGAL_PROFESSIONALS_REPRESENTATIVES_MASTER_CENSUS_25AUG2026.md"
      - ".github/governance/records/FULLEST_LEGAL_PROFESSIONAL_LIST_AUTHORITY_20260825.md"
      - "PERSON_PERIMETER_START_HERE.md"
      - "scripts/validate_legal_professionals_representatives_register.py"
      - ".github/workflows/validate-legal-professionals-representatives-register.yml"
      - "assets/data/matter-identity-registry-v1.people.json"
      - "assets/data/matter-identity-registry-v1.organisations.json"
  push:
    branches: [main]
    paths:
      - "assets/data/legal-professionals-representatives-register-v1*.json"
      - "archive/LEGAL_PROFESSIONALS_REPRESENTATIVES_MASTER_CENSUS_25AUG2026.md"
      - ".github/governance/records/FULLEST_LEGAL_PROFESSIONAL_LIST_AUTHORITY_20260825.md"
      - "PERSON_PERIMETER_START_HERE.md"
      - "scripts/validate_legal_professionals_representatives_register.py"
      - ".github/workflows/validate-legal-professionals-representatives-register.yml"
      - "assets/data/matter-identity-registry-v1.people.json"
      - "assets/data/matter-identity-registry-v1.organisations.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate census, cross-references and privacy limits
        run: python scripts/validate_legal_professionals_representatives_register.py
