name: Orion notice baseline comparison
on:
  push:
    branches: ['integration/orion-notice-register-20260905']
    paths: ['.github/workflows/orion-notice-baseline-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  baseline:
    if: github.ref == 'refs/heads/integration/orion-notice-register-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Compare unchanged base and proposed content without publication or gate changes
        env:
          GH_READ_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.parse, pathlib, subprocess, tempfile, re, sys
          base='145dd4e16773989bef1ddac6ea0428a8cca4a1ff'
          head='f155979cef623fc8192bb59774f2164e0f1e85e3'
          repo='sbu001monterecco/por-derecho'
          root=pathlib.Path.cwd()
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl):
              new=super().redirect_request(req,fp,code,msg,headers,newurl)
              if new is not None and urllib.parse.urlsplit(req.full_url).netloc != urllib.parse.urlsplit(newurl).netloc:
                new.remove_header('Authorization')
              return new
          opener=urllib.request.build_opener(SafeRedirect())
          def get(path, raw=False):
            req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
            with opener.open(req,timeout=35) as response: data=response.read()
            return data.decode('utf-8',errors='replace') if raw else json.loads(data)
          baseline=pathlib.Path(tempfile.mkdtemp(prefix='pd-notice-baseline-'))
          subprocess.run(['git','fetch','--depth=1','origin',base],check=True)
          subprocess.run(['git','worktree','add','--detach',str(baseline),base],check=True)
          if (root/'requirements-ci.txt').exists():
            subprocess.run([sys.executable,'-m','pip','install','--quiet','-r',str(root/'requirements-ci.txt')],check=True)
          scripts={'scripts/validate_first_read_display.py'}
          runs={sha:get('actions/runs?head_sha='+sha+'&per_page=100')['workflow_runs'] for sha in [base,head]}
          base_by={r['workflow_id']:r for r in reversed(runs[base])}
          failures=[r for r in runs[head] if r.get('conclusion')=='failure']
          print('BASE_HEAD_WORKFLOW_COUNTS',len(runs[base]),len(runs[head]),flush=True)
          for r in failures:
            b=base_by.get(r['workflow_id'])
            print('CHECK_COMPARISON',json.dumps({'name':r['name'],'head_run':r['id'],'base_run':b and b['id'],'base_conclusion':b and b.get('conclusion')}),flush=True)
            jobs=get('actions/runs/'+str(r['id'])+'/jobs?per_page=100')['jobs']
            for job in jobs:
              if job.get('conclusion')!='failure': continue
              print('FAILED_JOB',job['id'],job['name'],json.dumps([s.get('name') for s in job.get('steps',[]) if s.get('conclusion')=='failure']),flush=True)
              try:
                log=get('actions/jobs/'+str(job['id'])+'/logs',True)
              except Exception as exc:
                print('LOG_RETRIEVAL_UNAVAILABLE',type(exc).__name__,getattr(exc,'code',None),flush=True)
                continue
              scripts.update(re.findall(r'python3? (scripts/validate_[A-Za-z0-9_]+\.py)(?:\s|$)',log))
              useful=[line for line in log.splitlines() if re.search(r'(?i)(FAIL:|\[error\]|failed:|drift|missing|expected|Traceback|python3? .*scripts/)',line)]
              print('FAILURE_EXCERPT',r['name'],'\n'+'\n'.join(useful[-12:])[-6500:],flush=True)
          results=[]
          for rel in sorted(scripts):
            row={'script':rel}
            for name,where in [('base',baseline),('head',root)]:
              p=where/rel
              if not p.exists():
                row[name]={'state':'SCRIPT_NOT_PRESENT'};continue
              result=subprocess.run([sys.executable,rel],cwd=where,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=180)
              diagnostic=[line for line in result.stdout.splitlines() if re.search(r'(?i)(fail|error|missing|drift|expected|not found)',line)]
              row[name]={'exit':result.returncode,'diagnostic':diagnostic[-12:]}
            row['comparison']='BASE_AND_HEAD_FAIL' if row.get('base',{}).get('exit',0)!=0 and row.get('head',{}).get('exit',0)!=0 else 'REVIEW_REQUIRED' if row.get('head',{}).get('exit',0)!=0 else 'NO_HEAD_FAILURE'
            results.append(row);print('READ_ONLY_COMPARISON',json.dumps(row,ensure_ascii=False),flush=True)
          print('BASELINE_COMPARISON_FINISHED_NO_REPOSITORY_WRITES',json.dumps({'base':base,'read_only_comparisons':len(results),'head_only_failures':[r['script'] for r in results if r['comparison']=='REVIEW_REQUIRED']}),flush=True)
          if any(r['comparison']=='REVIEW_REQUIRED' for r in results): raise SystemExit(1)
