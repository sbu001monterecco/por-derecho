name: Validate current operational router

on:
  pull_request:
    paths:
      - 'CURRENT_START_HERE.md'
      - 'CURRENT_OPERATIONAL_STATE_27AUG2026.md'
      - 'CURRENT_HANDOVER_UNITARY_RECOVERY_27AUG2026.md'
      - 'CURRENT_UNITARY_STATE.md'
      - 'ops/CURRENT_OPERATIONAL_STATE_27AUG2026.json'
      - 'assets/ricpe-cnmv-visual-evidence-20260827.js'
      - 'assets/ricpe-cnmv-closure-update-20260827.js'
      - 'assets/site-pre-intervencion-highlight-20260820.js'
      - 'evidence/ricpe-cnmv/2026-08-27/*.png'
      - 'scripts/validate_current_operational_router.py'
      - '.github/workflows/validate-current-operational-router.yml'
  push:
    branches: [main]
    paths:
      - 'CURRENT_START_HERE.md'
      - 'CURRENT_OPERATIONAL_STATE_27AUG2026.md'
      - 'CURRENT_HANDOVER_UNITARY_RECOVERY_27AUG2026.md'
      - 'CURRENT_UNITARY_STATE.md'
      - 'ops/CURRENT_OPERATIONAL_STATE_27AUG2026.json'
      - 'assets/ricpe-cnmv-visual-evidence-20260827.js'
      - 'assets/ricpe-cnmv-closure-update-20260827.js'
      - 'assets/site-pre-intervencion-highlight-20260820.js'
      - 'evidence/ricpe-cnmv/2026-08-27/*.png'
      - 'scripts/validate_current_operational_router.py'
      - '.github/workflows/validate-current-operational-router.yml'

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate current operational router continuity
        run: python scripts/validate_current_operational_router.py
