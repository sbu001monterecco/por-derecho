name: Public bidder name-only and bid-preservation gate

on:
  pull_request:
    paths:
      - 'es/**'
      - 'en/**'
      - 'assets/**'
      - 'archive/**'
      - 'docs/**'
      - 'operations/**'
      - 'publication-manifests/**'
      - 'index.html'
      - 'sitemap*.xml'
      - 'rss.xml'
      - 'scripts/validate_public_bidder_anonymisation.py'
      - 'scripts/rewrite_public_bidder_anonymisation.py'
      - '.github/workflows/public-bidder-anonymisation.yml'
      - '.github/workflows/validate-adjudicacion-provenance.yml'
      - '.github/workflows/verify-adjudicacion-2022-live.yml'
  push:
    branches: [main]
    paths:
      - 'es/**'
      - 'en/**'
      - 'assets/**'
      - 'archive/**'
      - 'docs/**'
      - 'operations/**'
      - 'publication-manifests/**'
      - 'index.html'
      - 'sitemap*.xml'
      - 'rss.xml'
      - 'scripts/validate_public_bidder_anonymisation.py'
      - 'scripts/rewrite_public_bidder_anonymisation.py'
      - '.github/workflows/public-bidder-anonymisation.yml'
      - '.github/workflows/validate-adjudicacion-provenance.yml'
      - '.github/workflows/verify-adjudicacion-2022-live.yml'

permissions:
  contents: read

jobs:
  name-only-and-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify protected bidder name is absent and the complete bid record is preserved
        run: python scripts/validate_public_bidder_anonymisation.py
