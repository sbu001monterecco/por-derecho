name: Public bidder anonymisation gate

on:
  pull_request:
    paths:
      - 'es/**'
      - 'en/**'
      - 'assets/**'
      - 'index.html'
      - 'sitemap.xml'
      - 'rss.xml'
      - 'scripts/validate_public_bidder_anonymisation.py'
      - '.github/workflows/public-bidder-anonymisation.yml'
  push:
    branches: [main]
    paths:
      - 'es/**'
      - 'en/**'
      - 'assets/**'
      - 'index.html'
      - 'sitemap.xml'
      - 'rss.xml'
      - 'scripts/validate_public_bidder_anonymisation.py'
      - '.github/workflows/public-bidder-anonymisation.yml'

permissions:
  contents: read

jobs:
  anonymisation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify protected bidder identity is absent from public source
        run: python scripts/validate_public_bidder_anonymisation.py
