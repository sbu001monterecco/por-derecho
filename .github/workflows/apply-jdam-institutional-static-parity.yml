name: Apply JDAM institutional static parity

on:
  push:
    branches:
      - static-jdam-institutional-records-20260820
    paths:
      - .github/workflows/apply-jdam-institutional-static-parity.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-jdam-institutional-static-parity
  cancel-in-progress: false

jobs:
  synchronise:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: static-jdam-institutional-records-20260820
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Synchronise static institutional records
        run: python scripts/synchronise_jdam_institutional_static.py
      - name: Validate generated records
        run: |
          git diff --check
          grep -q '26/008474' es/registros-institucionales/index.html
          grep -q '26/008476' en/institutional-records/index.html
          test "$(grep -o 'data-jdam-institutional-parity="2026-08-20"' es/registros-institucionales/index.html | wc -l)" -eq 2
          test "$(grep -o 'data-jdam-institutional-parity="2026-08-20"' en/institutional-records/index.html | wc -l)" -eq 2
      - name: Commit generated static parity
        run: |
          if git diff --quiet -- es/registros-institucionales/index.html en/institutional-records/index.html; then
            echo "Static records already in parity"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add es/registros-institucionales/index.html en/institutional-records/index.html
          git commit -m "Synchronise static COALZ and COAGC institutional records"
          git push origin HEAD:static-jdam-institutional-records-20260820
