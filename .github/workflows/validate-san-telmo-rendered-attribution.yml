name: Validate San Telmo rendered attribution

on:
  pull_request:
    paths:
      - "assets/site.js"
      - "assets/san-telmo-attribution-correction-20260819.js"
      - "assets/san-telmo-source-stamp-20260819.js"
      - "en/index.html"
      - "es/index.html"
      - "en/san-telmo-ricpe-sun-park/index.html"
      - "es/san-telmo-ricpe-sun-park/index.html"
      - "sitemap-san-telmo.xml"
      - "robots.txt"
      - "scripts/validate_san_telmo_attribution_rendered.py"
      - "scripts/render_san_telmo_attribution_live.mjs"
      - ".github/workflows/validate-san-telmo-rendered-attribution.yml"
      - ".github/workflows/verify-san-telmo-rendered-attribution-live.yml"
  push:
    branches: [main]
    paths:
      - "assets/site.js"
      - "assets/san-telmo-attribution-correction-20260819.js"
      - "assets/san-telmo-source-stamp-20260819.js"
      - "en/index.html"
      - "es/index.html"
      - "en/san-telmo-ricpe-sun-park/index.html"
      - "es/san-telmo-ricpe-sun-park/index.html"
      - "sitemap-san-telmo.xml"
      - "robots.txt"
      - "scripts/validate_san_telmo_attribution_rendered.py"
      - "scripts/render_san_telmo_attribution_live.mjs"
      - ".github/workflows/validate-san-telmo-rendered-attribution.yml"
      - ".github/workflows/verify-san-telmo-rendered-attribution-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate JavaScript syntax
        run: |
          node --check assets/site.js
          node --check assets/san-telmo-attribution-correction-20260819.js
          node --check scripts/render_san_telmo_attribution_live.mjs
      - name: Validate attribution, evidence boundaries and discovery controls
        run: python scripts/validate_san_telmo_attribution_rendered.py
