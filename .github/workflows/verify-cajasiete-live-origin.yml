name: Verify CajaSiete live origin

on:
  push:
    paths:
      - ".github/workflows/verify-cajasiete-live-origin.yml"
      - "es/cajasiete-responsabilidad-cumplimiento-trazabilidad/**"
      - "en/cajasiete-accountability-compliance-traceability/**"
      - "es/cajasiete-sun-park-financiacion-comparabilidad/**"
      - "en/cajasiete-sun-park-financing-comparability/**"
      - "es/registros-institucionales/index.html"
      - "en/institutional-records/index.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed CajaSiete routes and markers
        env:
          VERIFY_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, time, urllib.request, urllib.error

          base = "https://sbu001monterecco.github.io/por-derecho/"
          checks = {
              "es/cajasiete-responsabilidad-cumplimiento-trazabilidad/": [
                  "Registro público independiente",
                  "Una parte directamente afectada. Una persona informante desde 2021.",
                  "2021002141",
                  "Cinco preguntas finitas para una respuesta institucional",
              ],
              "en/cajasiete-accountability-compliance-traceability/": [
                  "Independent public record",
                  "A directly affected party. A reporting person since 2021.",
                  "2021002141",
                  "Five finite questions for an institutional response",
              ],
              "es/cajasiete-sun-park-financiacion-comparabilidad/": [
                  "Dos carriles, una separación obligatoria",
              ],
              "en/cajasiete-sun-park-financing-comparability/": [
                  "Two lanes, one mandatory separation",
              ],
              "es/registros-institucionales/": [
                  "suplementos vivos con eventos controlados hasta 18 septiembre 2026",
                  "PD-SP-EVT-0180",
              ],
              "es/cajasiete-responsabilidad-cumplimiento-trazabilidad/snapshots/2026-09-18-1716/": [
                  "PD-CAJASIETE-ACCOUNTABILITY-20260918",
                  'href="/por-derecho/es/cajasiete-sun-park-financiacion-comparabilidad/"',
              ],
          }

          sha = os.environ.get("VERIFY_SHA", "verify")[:12]
          last_errors = []
          for attempt in range(12):
              errors = []
              for route, markers in checks.items():
                  url = f"{base}{route}?pd_live_verify={sha}-{attempt}"
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "PorDerecho-CajaSiete-Live-Origin-Verifier/1.0",
                              "Cache-Control": "no-cache",
                          },
                      )
                      with urllib.request.urlopen(req, timeout=20) as response:
                          body = response.read().decode("utf-8", errors="replace")
                          if response.status != 200:
                              errors.append(f"{route}: HTTP {response.status}")
                              continue
                      missing = [m for m in markers if m not in body]
                      if missing:
                          errors.append(f"{route}: missing {missing!r}")
                  except Exception as exc:
                      errors.append(f"{route}: {type(exc).__name__}: {exc}")
              if not errors:
                  print("CAJASIETE LIVE ORIGIN VERIFICATION: PASS")
                  for route in checks:
                      print(f"PASS {base}{route}")
                  raise SystemExit(0)
              last_errors = errors
              print(f"attempt {attempt + 1}/12 not yet current: " + " | ".join(errors))
              time.sleep(5)

          print("CAJASIETE LIVE ORIGIN VERIFICATION: FAIL")
          for error in last_errors:
              print(" -", error)
          raise SystemExit(1)
          PY
