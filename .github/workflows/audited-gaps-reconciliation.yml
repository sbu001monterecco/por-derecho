name: Audited gaps reconciliation
on:
  push:
    branches: ['worker/audited-gaps-reconcile-20260905', main]
    paths:
      - '.github/workflows/audited-gaps-reconciliation.yml'
      - 'scripts/*audited*20260905.py'
      - 'assets/convergence-graph.*'
      - 'ops/AUDITED_WEBSITE_REPAIRS_20260905.json'
  pull_request:
    paths:
      - '.github/workflows/audited-gaps-reconciliation.yml'
      - 'scripts/*audited*20260905.py'
      - 'assets/convergence-graph.*'
      - 'ops/AUDITED_WEBSITE_REPAIRS_20260905.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audited-gaps-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare-worker:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/worker/audited-gaps-reconcile-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: worker/audited-gaps-reconcile-20260905
          fetch-depth: 0
          persist-credentials: true
      - name: Reconcile and repair only the isolated worker
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main worker/cr-continuity-gapclosure-20260905:refs/remotes/origin/cr-reviewed
          test "$(git rev-parse origin/main)" = adc8c87585609709caafdd90f03ffbb4a4687d83
          if [ -f ops/AUDITED_GAPS_RECONCILIATION_20260905.json ]; then
            python scripts/reconcile_audited_gaps_20260905.py --check
          else
            python scripts/reconcile_audited_gaps_20260905.py --prepare
          fi
          if [ -f ops/AUDITED_WEBSITE_REPAIRS_20260905.json ]; then
            python scripts/repair_audited_website_gaps_20260905.py --check
          else
            python scripts/repair_audited_website_gaps_20260905.py --prepare
          fi
          python scripts/reconcile_audited_gaps_20260905.py --check
      - name: Commit only declared generated content
        shell: python
        run: |
          import json,subprocess
          from pathlib import Path
          p='ops/AUDITED_GAPS_RECONCILIATION_20260905.json';w='ops/AUDITED_WEBSITE_REPAIRS_20260905.json'
          d=json.loads(Path(p).read_text());e=json.loads(Path(w).read_text())
          allowed=sorted(set([r['path'] for r in d['imported_files']]+[r['path'] for r in e['modified_html']]+e['additional_generated_paths']+[p,w]))
          assert not any(p.startswith('.github/') for p in allowed)
          subprocess.run(['git','add','--',*allowed],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
            subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
            subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
            subprocess.run(['git','commit','-m','Repair audited page dependencies, explicit project links and identity queue coverage'],check=True)
            subprocess.run(['git','push','origin','HEAD:refs/heads/worker/audited-gaps-reconcile-20260905'],check=True)
          print('PREPARED_HEAD',subprocess.check_output(['git','rev-parse','HEAD'],text=True))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audited-gap-source-${{ github.run_id }}
          path: diagnostics/audited-gaps-source-checks.json
          retention-days: 30
          if-no-files-found: warn
  check-read-only:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source, privacy boundary, identities and deterministic dependencies
        run: |
          python scripts/reconcile_audited_gaps_20260905.py --check
          python scripts/repair_audited_website_gaps_20260905.py --check
          python scripts/validate_repository_preservation.py
          python scripts/validate_audience_experience.py
          git diff --check
      - name: Install browser runtime
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Existing 58-control continuity rendering
        run: python scripts/check_cr_continuity_browser.py
      - name: Source graph and repaired navigation rendering
        shell: python
        run: |
          from pathlib import Path
          import json,subprocess,time
          from playwright.sync_api import sync_playwright
          d=json.loads(Path('ops/AUDITED_WEBSITE_REPAIRS_20260905.json').read_text())
          routes=[r['path'] for r in d['modified_html'] if any(e['kind']=='DOCUMENTARY_FALLBACK' for e in r['edits'])]
          assert len(routes)==2
          server=subprocess.Popen(['python','-m','http.server','8767','--bind','127.0.0.1','--directory',str(Path.cwd().parent)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          checks=0;report=[]
          try:
            time.sleep(1)
            with sync_playwright() as p:
              b=p.chromium.launch()
              for js in [True,False]:
                for width in [390,1440]:
                  context=b.new_context(java_script_enabled=js,viewport={'width':width,'height':1000})
                  page=context.new_page()
                  for route in routes:
                    response=page.goto('http://127.0.0.1:8767/por-derecho/'+route.removesuffix('index.html'),wait_until='networkidle');assert response.status==200;checks+=1
                    assert page.locator('[data-audit-edge]').count()==d['graph_counts']['edges'];checks+=1
                    if js:
                      page.wait_for_selector('[data-graph-state="ready"]')
                      assert page.locator('[data-node-id]').count()==d['graph_counts']['nodes'];checks+=1
                      assert page.locator('.fc-evidence-row').count()==d['graph_counts']['edges'];checks+=1
                      page.locator('[data-fc-type]').select_option(index=1)
                      assert 0<page.locator('.fc-evidence-row').count()<=d['graph_counts']['edges'];checks+=1
                      page.locator('[data-fc-reset]').click();assert page.locator('.fc-evidence-row').count()==d['graph_counts']['edges'];checks+=1
                      page.locator('[data-node-id]').first.focus();page.keyboard.press('Enter');assert page.locator('[data-fc-inspector] h3').count()==1;checks+=1
                    page.locator('[data-audit-edge] summary').first.click();assert page.locator('[data-audit-edge]').first.get_attribute('open') is not None;checks+=1
                    if js:assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+2');checks+=1
                    page.screenshot(path='/tmp/audit-graph-'+route.split('/')[0]+'-'+str(width)+'-'+str(js)+'.png')
                    report.append({'route':route,'width':width,'javascript':js,'result':'PASS'})
                  context.close()
              b.close()
          finally:server.terminate()
          Path('/tmp/audited-browser.json').write_text(json.dumps({'checks':checks,'cases':report},indent=2));print('GRAPH_BROWSER_PASS',checks)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audited-gap-browser-${{ github.run_id }}
          path: |
            /tmp/audit-graph-*.png
            /tmp/audited-browser.json
            diagnostics/
          retention-days: 30
          if-no-files-found: warn
  live-read-only:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check-read-only
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact public files from the merged revision
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import Request,urlopen
          from concurrent.futures import ThreadPoolExecutor
          import json,hashlib,time,subprocess
          d=json.loads(Path('ops/AUDITED_GAPS_RECONCILIATION_20260905.json').read_text());w=json.loads(Path('ops/AUDITED_WEBSITE_REPAIRS_20260905.json').read_text())
          paths=set([r['path'] for r in d['imported_files']]+[r['path'] for r in w['modified_html']]+w['additional_generated_paths']+['ops/AUDITED_GAPS_RECONCILIATION_20260905.json','ops/AUDITED_WEBSITE_REPAIRS_20260905.json','assets/convergence-graph.css','assets/convergence-graph.js'])
          paths={p for p in paths if not p.startswith('.github/')};head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();remaining=set(paths);deadline=time.monotonic()+1000
          def verify(path):
            route=path.removesuffix('index.html') if path.endswith('index.html') else path
            try:
              req=Request('https://sbu001monterecco.github.io/por-derecho/'+route+'?audit='+head,headers={'Cache-Control':'no-cache','User-Agent':'PorDerecho-Audited-Release'})
              with urlopen(req,timeout=20) as r:actual=r.read()
              return path,actual==Path(path).read_bytes()
            except Exception:return path,False
          while remaining and time.monotonic()<deadline:
            with ThreadPoolExecutor(max_workers=6) as pool:
              for path,ok in pool.map(verify,sorted(remaining)):
                if ok:remaining.remove(path);print('LIVE_EXACT_MATCH',path,head)
            if remaining:time.sleep(15)
          assert not remaining,'Public mismatch: '+str(sorted(remaining))
          print(json.dumps({'result':'LIVE_VERIFIED','commit':head,'exact_resources':len(paths)}))
