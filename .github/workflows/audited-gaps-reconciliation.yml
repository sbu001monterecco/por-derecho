name: Audited gaps reconciliation
on:
  push:
    branches: ['worker/audited-gaps-reconcile-20260905', main]
    paths:
      - '.github/workflows/audited-gaps-reconciliation.yml'
      - 'scripts/*audited*20260905.py'
      - 'assets/convergence-graph.*'
      - 'ops/AUDITED_WEBSITE_REPAIRS_20260905.json'
  pull_request:
    paths:
      - '.github/workflows/audited-gaps-reconciliation.yml'
      - 'scripts/*audited*20260905.py'
      - 'assets/convergence-graph.*'
      - 'ops/AUDITED_WEBSITE_REPAIRS_20260905.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audited-gaps-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare-worker:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/worker/audited-gaps-reconcile-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: worker/audited-gaps-reconcile-20260905
          fetch-depth: 0
          persist-credentials: true
      - name: Reconcile and repair only the isolated worker
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main worker/cr-continuity-gapclosure-20260905:refs/remotes/origin/cr-reviewed
          test "$(git rev-parse origin/main)" = adc8c87585609709caafdd90f03ffbb4a4687d83
          if [ -f ops/AUDITED_GAPS_RECONCILIATION_20260905.json ]; then
            python scripts/reconcile_audited_gaps_20260905.py --check
          else
            python scripts/reconcile_audited_gaps_20260905.py --prepare
          fi
          if [ -f ops/AUDITED_WEBSITE_REPAIRS_20260905.json ]; then
            python scripts/prepare_audited_website_20260905.py --check
          else
            python scripts/prepare_audited_website_20260905.py --prepare
          fi
          python scripts/reconcile_audited_gaps_20260905.py --check
      - name: Commit only declared generated content
        shell: python
        run: |
          import json,subprocess
          from pathlib import Path
          p='ops/AUDITED_GAPS_RECONCILIATION_20260905.json';w='ops/AUDITED_WEBSITE_REPAIRS_20260905.json'
          d=json.loads(Path(p).read_text());e=json.loads(Path(w).read_text())
          allowed=sorted(set([r['path'] for r in d['imported_files']]+[r['path'] for r in e['modified_html']]+e['additional_generated_paths']+[p,w]))
          assert not any(p.startswith('.github/') for p in allowed)
          subprocess.run(['git','add','--',*allowed],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
            subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
            subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
            subprocess.run(['git','commit','-m','Repair audited page dependencies, project links and identity queue coverage'],check=True)
            subprocess.run(['git','push','origin','HEAD:refs/heads/worker/audited-gaps-reconcile-20260905'],check=True)
          print('PREPARED_HEAD',subprocess.check_output(['git','rev-parse','HEAD'],text=True))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audited-gap-source-${{ github.run_id }}
          path: diagnostics/audited-gaps-source-checks.json
          retention-days: 30
          if-no-files-found: warn
  check-read-only:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source, identities and deterministic dependencies
        run: |
          python scripts/reconcile_audited_gaps_20260905.py --check
          python scripts/repair_audited_website_gaps_20260905.py --check
          python scripts/validate_repository_preservation.py
          python scripts/validate_audience_experience.py
          git diff --check
      - name: Install browser runtime
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Complete bilingual 58-control projection and real graph controls
        run: |
          python scripts/check_cr_continuity_browser.py
          python scripts/check_audited_graph_browser_20260905.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audited-gap-browser-${{ github.run_id }}
          path: diagnostics/
          retention-days: 30
          if-no-files-found: warn
  live-read-only:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check-read-only
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact public files from the merged revision
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import Request,urlopen
          from concurrent.futures import ThreadPoolExecutor
          import json,time,subprocess
          d=json.loads(Path('ops/AUDITED_GAPS_RECONCILIATION_20260905.json').read_text());w=json.loads(Path('ops/AUDITED_WEBSITE_REPAIRS_20260905.json').read_text())
          paths=set([r['path'] for r in d['imported_files']]+[r['path'] for r in w['modified_html']]+w['additional_generated_paths']+['ops/AUDITED_GAPS_RECONCILIATION_20260905.json','ops/AUDITED_WEBSITE_REPAIRS_20260905.json','assets/convergence-graph.css','assets/convergence-graph.js'])
          paths={p for p in paths if not p.startswith('.github/')};head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();remaining=set(paths);deadline=time.monotonic()+1000
          def verify(path):
            route=path.removesuffix('index.html') if path.endswith('index.html') else path
            try:
              req=Request('https://sbu001monterecco.github.io/por-derecho/'+route+'?audit='+head,headers={'Cache-Control':'no-cache','User-Agent':'PorDerecho-Audited-Release'})
              with urlopen(req,timeout=20) as r:actual=r.read()
              return path,actual==Path(path).read_bytes()
            except Exception:return path,False
          while remaining and time.monotonic()<deadline:
            with ThreadPoolExecutor(max_workers=6) as pool:
              for path,ok in pool.map(verify,sorted(remaining)):
                if ok:remaining.remove(path);print('LIVE_EXACT_MATCH',path,head)
            if remaining:time.sleep(15)
          assert not remaining,'Public mismatch: '+str(sorted(remaining))
          print(json.dumps({'result':'LIVE_VERIFIED','commit':head,'exact_resources':len(paths)}))
