name: Validate DIP 80 publication lineage

on:
  pull_request:
    paths:
      - "publication-manifests/icalpa-dip80-open-kimono-20260818.json"
      - "scripts/validate_dip80_publication_lineage.py"
      - ".github/workflows/validate-dip80-publication-lineage.yml"
      - "es/icalpa-mesa-del-ponente/dip-80-2026/manual-vivo/**"
      - "en/icalpa-rapporteur-workbench/dip-80-2026/living-casebook/**"
      - "assets/icalpa-dip80-casebook.*"
      - "assets/data/icalpa-dip-80-2026-casebook.json"
  push:
    branches: [main]
    paths:
      - "publication-manifests/icalpa-dip80-open-kimono-20260818.json"
      - "scripts/validate_dip80_publication_lineage.py"
      - ".github/workflows/validate-dip80-publication-lineage.yml"
      - "es/icalpa-mesa-del-ponente/dip-80-2026/manual-vivo/**"
      - "en/icalpa-rapporteur-workbench/dip-80-2026/living-casebook/**"
      - "assets/icalpa-dip80-casebook.*"
      - "assets/data/icalpa-dip-80-2026-casebook.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate current/live versus historical blocked lineage
        run: python scripts/validate_dip80_publication_lineage.py
