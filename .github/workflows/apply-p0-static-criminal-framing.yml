name: Apply P0 static and criminal-framing corrections

on:
  push:
    branches: [p0-static-criminal-framing-20aug2026]
    paths:
      - 'scripts/apply_p0_static_criminal_framing.py'
      - 'scripts/run_p0_static_criminal_framing.py'
      - '.github/workflows/apply-p0-static-criminal-framing.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-static-criminal-framing-20aug2026
          fetch-depth: 0
      - name: Apply deterministic static-source corrections
        run: python3 scripts/run_p0_static_criminal_framing.py
      - name: Repository whitespace and syntax check
        run: |
          git diff --check
          python3 -m py_compile scripts/apply_p0_static_criminal_framing.py scripts/run_p0_static_criminal_framing.py
      - name: Re-run existing supervisory validation
        run: python3 scripts/validate_supervisory_practice.py
      - name: Commit patched public source back to branch
        run: |
          if git diff --quiet; then
            echo 'No HTML changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add es en
          git commit -m 'Apply P0 static and criminal-framing corrections'
          git push origin HEAD:p0-static-criminal-framing-20aug2026
