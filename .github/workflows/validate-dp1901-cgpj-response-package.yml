name: Validate DP1901 CGPJ response package
on:
  pull_request:
    paths:
      - 'drafts/cgpj/2026-09-19_DP1901_CGPJ_RESPONSE_PROPOSED.*'
      - 'assets/visuals/dp1901-20260919/**'
      - 'assets/dp1901-cgpj-response-reader-20260919.js'
      - 'assets/dp1901-routing-collision-20260919.js'
      - 'assets/eg745-fiscalia-interconnectivity-20260918.js'
      - 'data/digital-media-asset-register-v1.json'
      - 'publication-manifests/dp1901-cgpj-response-images-20260919.json'
      - 'es/dp-1901-2026*/**'
      - 'en/dp-1901-2026*/**'
      - 'es/control-21-*/**'
      - 'en/control-21-*/**'
      - 'es/control-24-*/**'
      - 'en/control-24-*/**'
      - 'es/cgpj-comision-permanente-sala-lectura/**'
      - 'en/cgpj-permanent-commission-reader-room/**'
      - 'es/procedimientos/gc-gov-020/**'
      - 'en/proceedings/gc-gov-020/**'
      - 'scripts/validate_dp1901_cgpj_response_package.py'
  push:
    branches: [ main ]
    paths:
      - 'drafts/cgpj/2026-09-19_DP1901_CGPJ_RESPONSE_PROPOSED.*'
      - 'assets/visuals/dp1901-20260919/**'
      - 'assets/dp1901-cgpj-response-reader-20260919.js'
      - 'assets/dp1901-routing-collision-20260919.js'
      - 'assets/eg745-fiscalia-interconnectivity-20260918.js'
      - 'data/digital-media-asset-register-v1.json'
      - 'publication-manifests/dp1901-cgpj-response-images-20260919.json'
      - 'scripts/validate_dp1901_cgpj_response_package.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate package
        run: python3 scripts/validate_dp1901_cgpj_response_package.py
