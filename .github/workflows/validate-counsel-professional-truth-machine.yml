name: Validate counsel professional Truth Machine

on:
  pull_request:
    paths:
      - 'assets/data/legal-professionals-register-v1.json'
      - 'assets/data/legal-professionals-source-discovered-supplement-20260922.json'
      - 'assets/data/counsel-professional-interaction-truth-machine-v1.json'
      - 'assets/data/ac-professional-isolation-attrition-v1.json'
      - 'assets/data/legal-representation-ac-causation-v1.json'
      - 'governance/COUNSEL_PROFESSIONAL_INTERACTION_TRUTH_MACHINE_RULE_22SEP2026.md'
      - 'archive/THREAD_CONTINUITY_COUNSEL_PROFESSIONAL_TRUTH_MACHINE_22SEP2026.md'
      - 'scripts/validate_counsel_professional_truth_machine.py'
      - '.github/workflows/validate-counsel-professional-truth-machine.yml'
  push:
    branches: [main]
    paths:
      - 'assets/data/legal-professionals-register-v1.json'
      - 'assets/data/legal-professionals-source-discovered-supplement-20260922.json'
      - 'assets/data/counsel-professional-interaction-truth-machine-v1.json'
      - 'assets/data/ac-professional-isolation-attrition-v1.json'
      - 'assets/data/legal-representation-ac-causation-v1.json'
      - 'governance/COUNSEL_PROFESSIONAL_INTERACTION_TRUTH_MACHINE_RULE_22SEP2026.md'
      - 'archive/THREAD_CONTINUITY_COUNSEL_PROFESSIONAL_TRUTH_MACHINE_22SEP2026.md'
      - 'scripts/validate_counsel_professional_truth_machine.py'
      - '.github/workflows/validate-counsel-professional-truth-machine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate canonical plus source-discovered professional denominator
        run: python scripts/validate_counsel_professional_truth_machine.py
