name: Materialise continuity v2 patch

on:
  push:
    branches:
      - continuity/v2-eg745-caret-gate-20260902
    paths:
      - 'operations/bootstrap/continuity-v2-patch-bootstrap-manifest.json'
      - 'operations/bootstrap/continuity-v2-visible-patch.part*.b64'
      - 'operations/bootstrap/continuity-v2-source-files.part*.b64'
      - '.github/workflows/materialise-continuity-v2-patch.yml'

permissions:
  contents: write

concurrency:
  group: materialise-continuity-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: continuity/v2-eg745-caret-gate-20260902

      - name: Verify, materialise, validate and commit ordinary source
        env:
          EXPECTED_BASE: 6013473e0e510948d2702fe0b4f5f6cfe45f7028
        run: |
          set -euo pipefail
          MANIFEST=operations/bootstrap/continuity-v2-patch-bootstrap-manifest.json
          if [[ ! -f "$MANIFEST" ]]; then
            echo 'Continuity v2 bootstrap already materialised.'
            exit 0
          fi

          python - <<'PY'
          from __future__ import annotations
          import base64, gzip, hashlib, json, os, subprocess, tarfile
          from pathlib import Path

          root = Path.cwd()
          manifest = json.loads((root / 'operations/bootstrap/continuity-v2-patch-bootstrap-manifest.json').read_text(encoding='utf-8'))
          expected_base = os.environ['EXPECTED_BASE']
          if manifest.get('complete') is not True or manifest.get('base_main_sha') != expected_base:
              raise SystemExit('incomplete bootstrap or base mismatch')
          subprocess.run(['git', 'merge-base', '--is-ancestor', expected_base, 'HEAD'], check=True)

          def decode(parts: list[str], target: Path, expected_sha: str) -> None:
              raw = base64.b64decode(b''.join((root / p).read_bytes() for p in parts), validate=True)
              digest = hashlib.sha256(raw).hexdigest()
              if digest != expected_sha:
                  raise SystemExit(f'{target.name} SHA mismatch: {digest}')
              target.write_bytes(raw)

          patch_gz = root / '.continuity-v2-visible.patch.gz'
          files_tgz = root / '.continuity-v2-source-files.tar.gz'
          decode(manifest['visible_patch']['parts'], patch_gz, manifest['visible_patch']['decoded_gzip_sha256'])
          decode(manifest['source_files']['parts'], files_tgz, manifest['source_files']['decoded_tar_gzip_sha256'])
          patch = root / '.continuity-v2-visible.patch'
          patch.write_bytes(gzip.decompress(patch_gz.read_bytes()))
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)

          with tarfile.open(files_tgz, 'r:gz') as tf:
              for member in tf.getmembers():
                  candidate = (root / member.name).resolve()
                  if root.resolve() not in candidate.parents and candidate != root.resolve():
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if member.issym() or member.islnk():
                      raise SystemExit(f'archive link forbidden: {member.name}')
              tf.extractall(root)

          expected = {
              line.strip()
              for line in (root / 'operations/bootstrap/continuity-v2-expected-paths.txt').read_text(encoding='utf-8').splitlines()
              if line.strip()
          }
          if len(expected) != manifest['expected_materialised_path_count']:
              raise SystemExit(f'expected path count mismatch: {len(expected)}')
          missing = sorted(rel for rel in expected if not (root / rel).is_file())
          if missing:
              raise SystemExit('materialised files missing: ' + ', '.join(missing))

          for rel in sorted(expected):
              source = root / rel
              try:
                  text = source.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              normalized = '\n'.join(line.rstrip(' \t') for line in text.splitlines())
              if text.endswith(('\n', '\r')):
                  normalized += '\n'
              source.write_text(normalized, encoding='utf-8')

          (root / 'archive/CONTINUITY_V2_BOOTSTRAP_MATERIALISATION_02SEP2026.md').write_text(
              '# Continuity v2 bootstrap materialisation\n\n'
              f'- Bootstrap: `{manifest["bootstrap_id"]}`\n'
              f'- Reconciled base: `{expected_base}`\n'
              f'- Materialisation run: `{os.environ.get("GITHUB_RUN_ID", "unknown")}`\n'
              f'- Visible patch SHA-256: `{manifest["visible_patch"]["decoded_gzip_sha256"]}`\n'
              f'- Source archive SHA-256: `{manifest["source_files"]["decoded_tar_gzip_sha256"]}`\n'
              f'- Ordinary materialised paths: `{len(expected)}`\n'
              '- Temporary encoded carriers removed before commit.\n'
              '- Workflow-file changes are applied separately through the authenticated connector lane.\n'
              '- External action boundary: repository and website publication only; no filing, email, service, posting or third-party contact.\n',
              encoding='utf-8'
          )
          PY

          python -m py_compile scripts/workspace_persistence.py scripts/validate_workspace_continuity_v2.py .github/governance/validate_agent_governance_compatibility.py
          python -m unittest discover -s tests -p 'test_workspace_persistence.py' -v
          python -m unittest discover -s tests -p 'test_workspace_continuity_v2.py' -v
          python scripts/workspace_persistence.py validate-repository --output /tmp/workspace-persistence-v1.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          VALIDATION_TREE=$(git write-tree)
          VALIDATION_COMMIT=$(printf '%s\n' 'temporary continuity-v2 validation tree' | git commit-tree "$VALIDATION_TREE" -p HEAD)
          GITHUB_EVENT_NAME=push GITHUB_BASE_SHA="$EXPECTED_BASE" GITHUB_HEAD_SHA="$VALIDATION_COMMIT" \
            python scripts/validate_workspace_continuity_v2.py \
              --base "$EXPECTED_BASE" --head "$VALIDATION_COMMIT" \
              --output /tmp/workspace-continuity-v2.json
          git reset

          rm -f .continuity-v2-visible.patch .continuity-v2-visible.patch.gz .continuity-v2-source-files.tar.gz
          rm -f operations/bootstrap/continuity-v2-payload-20260902.part*.b64
          rm -f operations/bootstrap/continuity-v2-visible-patch.part*.b64
          rm -f operations/bootstrap/continuity-v2-source-files.part*.b64
          rm -f operations/bootstrap/continuity-v2-patch-bootstrap-manifest.json
          rm -f operations/bootstrap/continuity-v2-expected-paths.txt

          # A GITHUB_TOKEN cannot safely author workflow-file changes. Restore
          # those paths for this commit; the authenticated connector applies
          # their already-validated contents immediately after materialisation.
          git restore --source=HEAD --staged --worktree -- \
            .github/workflows/audit-workspace-persistence.yml \
            .github/workflows/publication-integrity-gate.yml \
            .github/workflows/materialise-continuity-v2-patch.yml
          rm -f .github/workflows/enforce-workspace-continuity.yml

          git add -A
          git diff --cached --check
          git commit -m 'Materialise continuity v2 and EG 745 pilot' \
            -m 'Workspace-Impact: PD-WS-20260902-0001, PD-WS-20260901-0001, PD-WS-20260901-0005' \
            -m 'Workspace-Checkpoint: required' \
            -m 'External-Action: repository-and-website-only' \
            -m 'Publication-Scope: continuity-v2-eg745'
          git push origin HEAD:continuity/v2-eg745-caret-gate-20260902
