name: Verify unitary criminal publication live

on:
  push:
    branches: [main]
    paths:
      - 'es/ingenieria-inversa-criminal-unitaria/**'
      - 'en/unitary-criminal-reverse-engineering/**'
      - 'es/retracto-credito-litigioso-1041-2017/**'
      - 'en/litigious-credit-retracto-1041-2017/**'
      - 'es/administrador-concursal-puerta-credito-titulo/**'
      - 'en/insolvency-administrator-credit-to-title-gatekeeper/**'
      - 'es/mapa-probatorio-penal-unitario/**'
      - 'en/unitary-criminal-evidence-map/**'
      - 'PROSECUTION_PUBLIC_STATE_21AUG2026.json'
      - 'assets/prosecution-public-entry-20260821.js'
      - 'assets/unitary-criminal-reverse-engineering-20260820.js'
      - 'assets/site.js'
      - 'sitemap-criminal-engineering.xml'
      - 'sitemap-prosecution-evidence.xml'
      - 'robots.txt'
      - 'scripts/verify_unitary_criminal_live.py'
      - '.github/workflows/verify-unitary-criminal-live.yml'
      - 'publication-manifests/unitary-criminal-reverse-engineering-20260820.json'
  pull_request:
    paths:
      - 'es/ingenieria-inversa-criminal-unitaria/**'
      - 'en/unitary-criminal-reverse-engineering/**'
      - 'es/retracto-credito-litigioso-1041-2017/**'
      - 'en/litigious-credit-retracto-1041-2017/**'
      - 'es/administrador-concursal-puerta-credito-titulo/**'
      - 'en/insolvency-administrator-credit-to-title-gatekeeper/**'
      - 'es/mapa-probatorio-penal-unitario/**'
      - 'en/unitary-criminal-evidence-map/**'
      - 'PROSECUTION_PUBLIC_STATE_21AUG2026.json'
      - 'assets/prosecution-public-entry-20260821.js'
      - 'assets/unitary-criminal-reverse-engineering-20260820.js'
      - 'assets/site.js'
      - 'sitemap-criminal-engineering.xml'
      - 'sitemap-prosecution-evidence.xml'
      - 'robots.txt'
      - 'scripts/verify_unitary_criminal_live.py'
      - '.github/workflows/verify-unitary-criminal-live.yml'
      - 'publication-manifests/unitary-criminal-reverse-engineering-20260820.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-unitary-criminal-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify live bilingual routes, PP 1041 correction, gateway and sitemap
        run: |
          python scripts/verify_unitary_criminal_live.py \
            --attempts 4 \
            --interval 20 \
            --timeout 25 \
            --output artifacts/unitary-criminal-live/latest.json
      - name: Verify 21 August prosecution evidence sharpening live
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          base = 'https://sbu001monterecco.github.io/por-derecho'
          targets = {
            'es_map': (f'{base}/es/mapa-probatorio-penal-unitario/', ['Mapa probatorio penal unitario', 'PP1041', 'AP 804/2018']),
            'en_map': (f'{base}/en/unitary-criminal-evidence-map/', ['Unitary criminal evidence map', 'PP1041', 'Provincial Court Order 804/2018']),
            'es_home': (f'{base}/es/', ['assets/site.js']),
            'en_home': (f'{base}/en/', ['assets/site.js']),
            'site_loader': (f'{base}/assets/site.js', ['PROSECUTION-PUBLIC-ENTRY-20260824', 'prosecution-public-entry-20260821.js']),
            'entry_module': (f'{base}/assets/prosecution-public-entry-20260821.js', ['PROSECUTION-PUBLIC-ENTRY-20260824', '360', 'SENT ≠ DELIVERED']),
            'state': (f'{base}/PROSECUTION_PUBLIC_STATE_21AUG2026.json', ['project-sun-rock-prosecution-public-state/v1', '"registrations": 360', 'AP 804/2018']),
            'sitemap': (f'{base}/sitemap-prosecution-evidence.xml', ['mapa-probatorio-penal-unitario', 'unitary-criminal-evidence-map']),
            'robots': (f'{base}/robots.txt', ['sitemap-prosecution-evidence.xml']),
          }
          def fetch(url, attempt):
            sep = '&' if '?' in url else '?'
            req = urllib.request.Request(f'{url}{sep}livecheck={int(time.time())}-{attempt}', headers={'User-Agent':'Por-Derecho-prosecution-live-verifier/1.0','Cache-Control':'no-cache','Pragma':'no-cache'})
            with urllib.request.urlopen(req, timeout=25) as r:
              return r.status, r.read().decode('utf-8','replace')
          last = {}
          for attempt in range(1, 13):
            checks, details = {}, {}
            for name, (url, markers) in targets.items():
              try:
                status, body = fetch(url, attempt)
                marker_map = {m: (m in body) for m in markers}
                checks[name] = status == 200 and all(marker_map.values())
                details[name] = {'status': status, 'bytes': len(body.encode()), 'markers': marker_map}
              except Exception as exc:
                checks[name] = False
                details[name] = {'error': repr(exc)}
            last = {'attempt': attempt, 'checks': checks, 'details': details}
            print(json.dumps(last, ensure_ascii=False, indent=2))
            if all(checks.values()):
              with open('artifacts/unitary-criminal-live/prosecution-sharpening-20260821.json','w') as f:
                json.dump({'status':'PASS', **last}, f, ensure_ascii=False, indent=2)
              print('PROSECUTION_EVIDENCE_LIVE_VERIFIED')
              raise SystemExit(0)
            time.sleep(10)
          with open('artifacts/unitary-criminal-live/prosecution-sharpening-20260821.json','w') as f:
            json.dump({'status':'FAIL', **last}, f, ensure_ascii=False, indent=2)
          raise SystemExit(1)
          PY
      - name: Upload canonical live-verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unitary-criminal-live-evidence
          path: artifacts/unitary-criminal-live/
          if-no-files-found: error
          retention-days: 90
