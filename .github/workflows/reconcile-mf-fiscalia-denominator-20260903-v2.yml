name: Reconcile MF Fiscalía denominator 23+3 v2

on:
  push:
    branches:
      - ministerio-fiscal-fulltext-audit-20260903
    paths:
      - '.github/workflows/reconcile-mf-fiscalia-denominator-20260903-v2.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ministerio-fiscal-fulltext-audit-20260903
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reconcile current 23+3 Fiscalía denominator
        run: |
          python - <<'PY'
          from pathlib import Path

          builder = Path('scripts/build_proceedings_case_prism_v2.py')
          text = builder.read_text(encoding='utf-8')
          text = text.replace('Ministerio Fiscal · 21 exact + 3 unresolved', 'Ministerio Fiscal · 23 exact + 3 unresolved')
          text = text.replace('Ministerio Fiscal · 21 exactos + 3 no resueltos', 'Ministerio Fiscal · 23 exactos + 3 no resueltos')
          text = text.replace('Complete current public denominator: 21 exact Fiscalía files plus three controlled unresolved references.', 'Complete current public denominator: 23 exact Fiscalía files plus three controlled unresolved references.')
          text = text.replace('Denominador público actual completo: 21 expedientes exactos de Fiscalía y tres referencias no resueltas controladas.', 'Denominador público actual completo: 23 expedientes exactos de Fiscalía y tres referencias no resueltas controladas.')
          marker = '"NAT-FIS-007", "TF-FIS-009", "TF-FIS-010", "UNK-FIS-001"'
          replacement = '"NAT-FIS-007", "LZ-FIS-049", "LZ-FIS-051", "TF-FIS-009", "TF-FIS-010", "UNK-FIS-001"'
          if marker not in text:
              raise SystemExit('Case Prism builder Fiscalía identity marker not found')
          text = text.replace(marker, replacement)
          builder.write_text(text, encoding='utf-8')

          validator = Path('scripts/validate_fiscalia_proceedings_interconnectivity.py')
          text = validator.read_text(encoding='utf-8')
          marker = '"NAT-FIS-007", "TF-FIS-009", "TF-FIS-010", "UNK-FIS-001",'
          replacement = '"NAT-FIS-007", "LZ-FIS-049", "LZ-FIS-051", "TF-FIS-009", "TF-FIS-010", "UNK-FIS-001",'
          if marker not in text:
              raise SystemExit('Validator Fiscalía identity marker not found')
          text = text.replace(marker, replacement)
          text = text.replace('get("fiscalia_exact_files") == 21', 'get("fiscalia_exact_files") == 23')
          text = text.replace('get("fiscalia_identity_total") == 24', 'get("fiscalia_identity_total") == 26')
          text = text.replace('Fiscalía identities: 21 exact + 3 unresolved', 'Fiscalía identities: 23 exact + 3 unresolved')
          validator.write_text(text, encoding='utf-8')
          PY
      - name: Regenerate deterministic public projections
        run: |
          python scripts/build_proceedings_case_prism_v2.py
          python scripts/build_fiscalia_proceedings_interconnectivity.py --apply
      - name: Fail closed on specialist validation
        run: |
          python scripts/build_proceedings_case_prism_v2.py --check
          python scripts/build_fiscalia_proceedings_interconnectivity.py --check
          python scripts/validate_fiscalia_proceedings_interconnectivity.py
          python -m unittest -v scripts/test_build_fiscalia_proceedings_interconnectivity.py
      - name: Commit reconciliation
        run: |
          git config user.name 'sbu001monterecco'
          git config user.email 'sbu001@monterecco.com'
          git add scripts/build_proceedings_case_prism_v2.py scripts/validate_fiscalia_proceedings_interconnectivity.py assets/data/proceedings-case-prism-v1.json assets/data/fiscalia-proceedings-interconnectivity-v1.json
          if git diff --cached --quiet; then
            echo 'No reconciliation changes to commit'
            exit 0
          fi
          git commit -m 'Reconcile Fiscalía 23+3 denominator across Case Prism and graph'
          git push origin HEAD:ministerio-fiscal-fulltext-audit-20260903
