name: Validate thread deletion-safety sentinel

on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * *"
  push:
    paths:
      - ".github/governance/THREAD_DELETION_SAFETY_SENTINEL_25SEP2026.md"
      - "assets/data/thread-deletion-safety-sentinel-v1.json"
      - "scripts/validate_thread_deletion_safety_sentinel.py"
      - ".github/workflows/validate-thread-deletion-safety-sentinel.yml"
      - "AGENTS.md"
      - "CHATGPT_START_HERE.md"
      - "archive/UNIVERSAL_PUBLICATION_AND_THREAD_DELETION_SAFETY_PROTOCOL_18AUG2026.md"
      - "ops/continuity/CONTINUITY_PRESERVATION_PROPAGATION_RULE.md"
  pull_request:
    paths:
      - ".github/governance/THREAD_DELETION_SAFETY_SENTINEL_25SEP2026.md"
      - "assets/data/thread-deletion-safety-sentinel-v1.json"
      - "scripts/validate_thread_deletion_safety_sentinel.py"
      - ".github/workflows/validate-thread-deletion-safety-sentinel.yml"
      - "AGENTS.md"
      - "CHATGPT_START_HERE.md"
      - "archive/UNIVERSAL_PUBLICATION_AND_THREAD_DELETION_SAFETY_PROTOCOL_18AUG2026.md"
      - "ops/continuity/CONTINUITY_PRESERVATION_PROPAGATION_RULE.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python scripts/validate_thread_deletion_safety_sentinel.py
