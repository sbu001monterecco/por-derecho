name: Sun Rock capital relationships

on:
  pull_request:
    paths:
      - 'en/capital-relationships/**'
      - 'es/relaciones-de-capital/**'
      - 'assets/capital-relationships-20260916.css'
      - 'assets/capital-relationships-route-20260916.js'
      - 'assets/data/sun-rock-capital-relationships-v1.json'
      - 'assets/home-future-institutional-20260916.js'
      - 'assets/site.js'
      - 'sitemap-sun-rock-institutional-20260916.xml'
      - 'ci/sun_rock_capital_relationships_acceptance_20260916.py'
      - '.github/workflows/sun-rock-capital-relationships.yml'
  push:
    branches: [main]
    paths:
      - 'en/capital-relationships/**'
      - 'es/relaciones-de-capital/**'
      - 'assets/capital-relationships-20260916.css'
      - 'assets/capital-relationships-route-20260916.js'
      - 'assets/data/sun-rock-capital-relationships-v1.json'
      - 'assets/home-future-institutional-20260916.js'
      - 'assets/site.js'
      - 'sitemap-sun-rock-institutional-20260916.xml'
      - 'ci/sun_rock_capital_relationships_acceptance_20260916.py'
      - '.github/workflows/sun-rock-capital-relationships.yml'

permissions:
  contents: read

jobs:
  acceptance:
    name: Capital relationship acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify public/private gateway controls
        run: python3 ci/sun_rock_capital_relationships_acceptance_20260916.py
