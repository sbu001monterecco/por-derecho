name: Validate LegalTech Uría search, graph and discovery

on:
  pull_request:
    paths:
      - 'assets/data/matter-identity-registry-v1*.json'
      - 'assets/canonical-knowledge-search-20260904.js'
      - 'assets/legaltech-uria-unitary-gap-closure-20260904.js'
      - 'assets/legaltech-review-and-matrix-20260904.js'
      - 'assets/site.js'
      - 'data/canonical-discovery/**'
      - 'data/legaltech/**'
      - 'en/canonical-review/**'
      - 'es/revision-canonica/**'
      - 'en/notice-continued-conduct-matrix/**'
      - 'es/matriz-aviso-conducta-continuada/**'
      - 'en/evidence-intake-selection/**'
      - 'es/seleccion-ingesta-evidencia/**'
      - 'evidence/uria-ricpe-sun-park/**'
      - 'scripts/build_canonical_discovery_candidates.py'
      - 'scripts/validate_legaltech_uria_search_graph.py'
      - '.github/governance/CANONICAL_DISCOVERY_EMAIL_LIBRARY_AND_INTERCONNECTIVITY_PROTOCOL_04SEP2026.md'
      - '.github/workflows/validate-legaltech-uria-search-graph.yml'
  push:
    branches: [main]
    paths:
      - 'assets/data/matter-identity-registry-v1*.json'
      - 'assets/canonical-knowledge-search-20260904.js'
      - 'assets/legaltech-uria-unitary-gap-closure-20260904.js'
      - 'assets/legaltech-review-and-matrix-20260904.js'
      - 'assets/site.js'
      - 'data/canonical-discovery/**'
      - 'data/legaltech/**'
      - 'en/canonical-review/**'
      - 'es/revision-canonica/**'
      - 'en/notice-continued-conduct-matrix/**'
      - 'es/matriz-aviso-conducta-continuada/**'
      - 'en/evidence-intake-selection/**'
      - 'es/seleccion-ingesta-evidencia/**'
      - 'evidence/uria-ricpe-sun-park/**'
      - 'scripts/build_canonical_discovery_candidates.py'
      - 'scripts/validate_legaltech_uria_search_graph.py'
      - '.github/governance/CANONICAL_DISCOVERY_EMAIL_LIBRARY_AND_INTERCONNECTIVITY_PROTOCOL_04SEP2026.md'
      - '.github/workflows/validate-legaltech-uria-search-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legaltech-uria-search-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate canonical identities, graph, evidence selection and privacy
        run: python3 scripts/validate_legaltech_uria_search_graph.py
      - name: Validate JavaScript syntax
        run: |
          node --check assets/canonical-knowledge-search-20260904.js
          node --check assets/legaltech-uria-unitary-gap-closure-20260904.js
          node --check assets/legaltech-review-and-matrix-20260904.js
          node --check assets/site.js
      - name: Scan repository for unregistered identity candidates
        run: python3 scripts/build_canonical_discovery_candidates.py --summary
      - name: Upload review-only candidate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-discovery-candidates-${{ github.sha }}
          path: artifacts/canonical-discovery/repository-candidates-generated.json
          if-no-files-found: error
          retention-days: 30
