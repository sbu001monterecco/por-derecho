name: Validate Concurso 36/2012 court-record reconstruction
on:
  pull_request:
    paths:
      - 'assets/data/concurso36-court-record-reconstruction-v1.json'
      - 'assets/data/concurso36-court-record-reconstruction-2022-appellate-supplement.json'
      - 'assets/data/concurso36-court-record-reconstruction-gapclose2-20260829.json'
      - 'assets/concurso36-court-record-reconstruction.js'
      - 'es/concurso-36-2012-registro-procesal/**'
      - 'en/insolvency-36-2012-court-record/**'
      - 'CHATGPT_START_HERE_CONCURSO36_COURT_RECORD.md'
      - 'publication-manifests/concurso36-court-record-reconstruction-20260829.json'
      - 'publication-manifests/concurso36-court-record-gapclose2-20260829.json'
      - 'archive/CONCURSO36_COURT_RECORD_GAPCLOSE2_CONTINUITY_29AUG2026.md'
      - '.github/workflows/validate-concurso36-court-record-reconstruction.yml'
  push:
    branches: [main]
    paths:
      - 'assets/data/concurso36-court-record-reconstruction-v1.json'
      - 'assets/data/concurso36-court-record-reconstruction-2022-appellate-supplement.json'
      - 'assets/data/concurso36-court-record-reconstruction-gapclose2-20260829.json'
      - 'assets/concurso36-court-record-reconstruction.js'
      - 'es/concurso-36-2012-registro-procesal/**'
      - 'en/insolvency-36-2012-court-record/**'
      - 'CHATGPT_START_HERE_CONCURSO36_COURT_RECORD.md'
      - 'publication-manifests/concurso36-court-record-reconstruction-20260829.json'
      - 'publication-manifests/concurso36-court-record-gapclose2-20260829.json'
      - 'archive/CONCURSO36_COURT_RECORD_GAPCLOSE2_CONTINUITY_29AUG2026.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Validate registry, supplements and continuity controls
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          reg=json.loads((root/'assets/data/concurso36-court-record-reconstruction-v1.json').read_text())
          sup=json.loads((root/'assets/data/concurso36-court-record-reconstruction-2022-appellate-supplement.json').read_text())
          gap=json.loads((root/'assets/data/concurso36-court-record-reconstruction-gapclose2-20260829.json').read_text())
          oldman=json.loads((root/'publication-manifests/concurso36-court-record-reconstruction-20260829.json').read_text())
          newman=json.loads((root/'publication-manifests/concurso36-court-record-gapclose2-20260829.json').read_text())
          assert reg['status'].startswith('CONTROLLED RECONSTRUCTION')
          assert 'RESPONSE_NOT_LOCATED' in reg['response_taxonomy']
          fam=reg['verified_families'][0]
          assert fam['family_id']=='C36-FAM-2022-APPEAL-QUEJA-TESTIMONIOS'
          assert sup['family_id']==fam['family_id']
          assert gap['append_to_family_id']==fam['family_id']
          total=len(fam['records'])+len(sup['records'])+len(gap['append_records'])+sum(len(f['records']) for f in gap['additional_families'])
          assert total==37, total
          ids=[r['id'] for r in gap['append_records']]
          for f in gap['additional_families']: ids.extend(r['id'] for r in f['records'])
          assert len(ids)==len(set(ids))==17
          blob=json.dumps(reg,ensure_ascii=False)+json.dumps(sup,ensure_ascii=False)+json.dumps(gap,ensure_ascii=False)
          for needle in [
              '202210473582179','1202210474270428','202210476786626','1202210481753993','1202210482293471',
              '375/2022','379/2022','A05003250-35d4ff0c0b259734c5ea7dc69411669385141492',
              'A05003250-3587babc6df3d2dbfc90404de381669892710841','A05003250-35188b05fa34b49034efd3977fe1657718796252',
              'A05003250-3520a62213f4ca3ac1e1ed1cecb1657801330688','A05003250-3558b8e3ae715cbf92cda7771ba1644589600797',
              'A05003250-353fa667a7b4171f8f5b31deaf61644846994419','1202210470528468','202210511075435','81e65b9615269c4da8af95989d831c18ce258531747518baacfdd85424d80fc6',
              '1201810216187332','A05003250-354b4c6e25db6943f7e4d268be71614172280325','202110427187708','fa790da25b3059671458564751003635714b9c4e14cf0c50e69921bd3bcacf6d',
              '202210489569008','235019286750B8FD','P12QU27','C36-ORPHAN-20220727-AC-REPORT-5367','DO_NOT_PROMOTE_AS_2021_COURT_FILING_WITHOUT_LATER_RECEIPT'
          ]:
              assert needle in blob, needle
          assert any(r.get('response_taxonomy')=='PROTECTIVE_RESPONSE' for r in sup['records'])
          assert any(r.get('response_taxonomy')=='PROTECTIVE_RESPONSE' for f in gap['additional_families'] for r in f['records'])
          assert any(r.get('record_class')=='registry_record' for f in gap['additional_families'] for r in f['records'])
          assert len(gap['gap_corrections'])>=6
          assert len(gap['open_points_replace'])>=10
          boundary_text=(blob+' '+(root/'CHATGPT_START_HERE_CONCURSO36_COURT_RECORD.md').read_text()).lower()
          for phrase in ['formal court notice','7-jun','unfiled draft','37 controlled/corroborated nodes','non-production is not nonexistence']:
              assert phrase in boundary_text, phrase
          for path in [
              'CHATGPT_START_HERE_CONCURSO36_COURT_RECORD.md',
              'assets/concurso36-court-record-reconstruction.js',
              'es/concurso-36-2012-registro-procesal/index.html',
              'en/insolvency-36-2012-court-record/index.html',
              'archive/CONCURSO36_COURT_RECORD_GAPCLOSE2_CONTINUITY_29AUG2026.md'
          ]: assert (root/path).exists(), path
          handoff=(root/'CHATGPT_START_HERE_CONCURSO36_COURT_RECORD.md').read_text()
          for phrase in [
              'filing -> verified receipt -> court/LAJ act -> service -> review/appeal -> finality -> implementation',
              '37 controlled/corroborated nodes','Auto 308/2022','Queja 379/2022','29-Jul-2021 Aweswell RICPE paper is not a verified 2021 court filing','Recommended short prompt for a new thread'
          ]: assert phrase in handoff, phrase
          assert oldman['primary_registry']=='assets/data/concurso36-court-record-reconstruction-v1.json'
          assert oldman['current_state']=='DEPLOYED'
          assert newman['publication_id']=='concurso36-court-record-gapclose2-20260829'
          assert newman['controlled_node_count_after_merge']==37
          assert newman['current_state'] in {'PREPARED_PENDING_MERGE','PR_OPEN','CI_GREEN','MERGED','DEPLOYED','LIVE_VERIFIED','DELETION_SAFE'}
          print('court-record reconstruction gapclose2: 37 controlled/corroborated nodes OK')
          PY
