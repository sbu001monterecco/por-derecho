name: Validate matter identity registry

on:
  push:
    branches: [main]
    paths:
      - "assets/data/matter-identity-registry-v1*.json"
      - "assets/data/criminal-first-institutional-action-matrix-v1.json"
      - "assets/matter-identity-registry.js"
      - "assets/matter-identity-registry.css"
      - "es/registro-identidad-materia/**"
      - "en/matter-identity-registry/**"
      - "scripts/validate_matter_identity_registry.py"
      - ".github/workflows/validate-matter-identity-registry.yml"
  pull_request:
    paths:
      - "assets/data/matter-identity-registry-v1*.json"
      - "assets/data/criminal-first-institutional-action-matrix-v1.json"
      - "assets/matter-identity-registry.js"
      - "assets/matter-identity-registry.css"
      - "es/registro-identidad-materia/**"
      - "en/matter-identity-registry/**"
      - "scripts/validate_matter_identity_registry.py"
      - ".github/workflows/validate-matter-identity-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Validate registry, routes and action references
        run: python scripts/validate_matter_identity_registry.py
      - name: Check browser script syntax
        run: node --check assets/matter-identity-registry.js
