name: Verify elEconomista Acosta Matos dossier live

on:
  pull_request:
    paths:
      - 'es/eleconomista-javier-romera-enero2025/**'
      - 'en/eleconomista-javier-romera-january2025/**'
      - 'assets/site.js'
      - 'assets/site-pre-treasury-154-hq-20260828.js'
      - 'assets/traceability-crosslinks-20260821.js'
      - '.github/workflows/verify-eleconomista-live.yml'
  push:
    branches: [main]
    paths:
      - 'es/eleconomista-javier-romera-enero2025/**'
      - 'en/eleconomista-javier-romera-january2025/**'
      - 'assets/site.js'
      - 'assets/site-pre-treasury-154-hq-20260828.js'
      - 'assets/unitary-criminal-reverse-engineering-20260820.js'
      - 'assets/traceability-crosslinks-20260821.js'
      - '.github/workflows/verify-eleconomista-live.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-eleconomista-live
  cancel-in-progress: false

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Poll exact public elEconomista source routes
        id: verify_raw
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request

          base = 'https://sbu001monterecco.github.io/por-derecho'
          sha = os.environ['SOURCE_SHA']
          run_id = os.environ['RUN_ID']
          targets = {
              'es': (f'{base}/es/eleconomista-javier-romera-enero2025/', [
                  'data-eleconomista-static-acosta="20260820c"',
                  'Project Sun Rock acusa al perímetro Acosta Matos de haber ido deliberadamente a por la historia de elEconomista hasta conseguir que se detuviera.',
                  'contradicción materialmente autolesiva',
                  'Club Sei Lanzarote',
                  'Calle Janubio 3',
                  'no acusamos a Javier Romera ni a elEconomista',
              ]),
              'en': (f'{base}/en/eleconomista-javier-romera-january2025/', [
                  'data-eleconomista-static-acosta="20260820c"',
                  'Project Sun Rock accuses the Acosta Matos perimeter of deliberately going after the elEconomista story until it was stopped.',
                  'materially self-damaging contradiction',
                  'Club Sei Lanzarote',
                  'Calle Janubio 3',
                  'we do not accuse Javier Romera or elEconomista',
              ]),
          }

          def fetch(url):
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Por-Derecho-elEconomista-live-verifier/1.0',
                  'Cache-Control': 'no-cache',
                  'Pragma': 'no-cache',
              })
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.status, r.read().decode('utf-8', 'replace')

          last = {}
          for attempt in range(1, 37):
              checks, details = {}, {}
              for name, (url, markers) in targets.items():
                  try:
                      nonce = time.time_ns()
                      checked_url = f'{url}?source={sha}&run={run_id}&attempt={attempt}&nonce={nonce}'
                      status, body = fetch(checked_url)
                      mm = {m: m in body for m in markers}
                      checks[f'{name}_http_200'] = status == 200
                      checks[f'{name}_markers'] = all(mm.values())
                      details[name] = {'url': checked_url, 'status': status, 'bytes': len(body.encode()), 'markers': mm}
                  except Exception as exc:
                      checks[f'{name}_http_200'] = False
                      checks[f'{name}_markers'] = False
                      details[name] = {'error': repr(exc)}
              last = {'attempt': attempt, 'source_sha': sha, 'run_id': run_id, 'checks': checks, 'details': details}
              print(json.dumps(last, ensure_ascii=False, indent=2))
              if all(checks.values()):
                  with open('/tmp/eleconomista-live-source.json','w',encoding='utf-8') as f:
                      json.dump({'status':'SOURCE_LIVE_VERIFIED', **last}, f, ensure_ascii=False, indent=2)
                  raise SystemExit(0)
              time.sleep(5)
          with open('/tmp/eleconomista-live-source.json','w',encoding='utf-8') as f:
              json.dump({'status':'SOURCE_NOT_VERIFIED', **last}, f, ensure_ascii=False, indent=2)
          raise SystemExit(1)
          PY

      - name: Use preinstalled Chrome with Playwright
        run: |
          npm install --no-save playwright@1.50.1
          BROWSER_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER_PATH"
          echo "PSR_BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          "$BROWSER_PATH" --version

      - name: Verify exact rendered elEconomista DOM
        id: verify_dom
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const base = 'https://sbu001monterecco.github.io/por-derecho';
          const q = `source=${process.env.SOURCE_SHA.slice(0,12)}&run=${process.env.RUN_ID}`;
          const targets = [
            {
              key:'es', url:`${base}/es/eleconomista-javier-romera-enero2025/?${q}`,
              markers:['Project Sun Rock acusa al perímetro Acosta Matos de haber ido deliberadamente a por la historia','contradicción materialmente autolesiva','Club Sei Lanzarote','Calle Janubio 3','no acusamos a Javier Romera ni a elEconomista']
            },
            {
              key:'en', url:`${base}/en/eleconomista-javier-romera-january2025/?${q}`,
              markers:['Project Sun Rock accuses the Acosta Matos perimeter of deliberately going after the elEconomista story','materially self-damaging contradiction','Club Sei Lanzarote','Calle Janubio 3','we do not accuse Javier Romera or elEconomista']
            }
          ];
          (async()=>{
            const browser = await chromium.launch({headless:true, executablePath:process.env.PSR_BROWSER_PATH});
            const results=[];
            let ok=true;
            for(const t of targets){
              const page=await browser.newPage();
              await page.goto(t.url,{waitUntil:'networkidle',timeout:60000});
              const body=await page.locator('body').innerText();
              const dataset=await page.locator('body').getAttribute('data-eleconomista-static-acosta');
              const markers=Object.fromEntries(t.markers.map(m=>[m,body.includes(m)]));
              const passed=dataset==='20260820c' && Object.values(markers).every(Boolean);
              ok &&= passed;
              results.push({key:t.key,url:t.url,dataset,markers,passed});
              await page.close();
            }
            await browser.close();
            fs.mkdirSync('artifacts/eleconomista-live',{recursive:true});
            fs.writeFileSync('artifacts/eleconomista-live/result.json',JSON.stringify({status:ok?'PASS':'FAIL',source_sha:process.env.SOURCE_SHA,results},null,2));
            console.log(JSON.stringify({status:ok?'PASS':'FAIL',results},null,2));
            process.exit(ok?0:1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Verify rendered Meeting Point propagation
        id: verify_mp
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const base = 'https://sbu001monterecco.github.io/por-derecho';
          const targets = [
            {key:'lava-es',url:`${base}/es/lava-verde-club-sei-meeting-point/`,selector:'[data-mp-direct-commercial-source-20260821]',markers:['sonnenklar.TV','Calle Janubio 3','No acreditan todavía']},
            {key:'lava-en',url:`${base}/en/lava-verde-club-sei-meeting-point/`,selector:'[data-mp-direct-commercial-source-20260821]',markers:['sonnenklar.TV','Calle Janubio 3','do not yet establish']},
            {key:'357-es',url:`${base}/es/cuaderno-juridico/meeting-point-357-2024-trazabilidad-judicial/`,selector:'[data-mp357-custody-boundary-20260821]',markers:['Límite 357/2024','Auren','impropiedad']},
            {key:'357-en',url:`${base}/en/legal-notebook/meeting-point-357-2024-judicial-traceability/`,selector:'[data-mp357-custody-boundary-20260821]',markers:['357/2024 boundary','Auren','improper']},
            {key:'takeover-es',url:`${base}/es/toma-control-sun-park-7-junio-2018/`,selector:'[data-takeover-meeting-point-gateway-20260821]',markers:['Lava Verde','Club Sei','Meeting Point/FTI']},
            {key:'takeover-en',url:`${base}/en/sun-park-takeover-7-june-2018/`,selector:'[data-takeover-meeting-point-gateway-20260821]',markers:['Lava Verde','Club Sei','Meeting Point/FTI']},
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.PSR_BROWSER_PATH});
            let finalResults=[]; let ok=false;
            for(let attempt=1;attempt<=8;attempt++){
              let pass=true; const results=[];
              for(const t of targets){
                const page=await browser.newPage();
                const diagnostics=[];
                page.on('pageerror', error=>diagnostics.push(`pageerror:${String(error)}`));
                page.on('requestfailed', request=>diagnostics.push(`requestfailed:${request.url()}:${request.failure()?.errorText||'unknown'}`));
                try{
                  const nonce=`${Date.now()}-${attempt}-${Math.random().toString(16).slice(2)}`;
                  const checkedUrl=`${t.url}?source=${process.env.SOURCE_SHA}&run=${process.env.RUN_ID}&attempt=${attempt}&nonce=${nonce}`;
                  await page.goto(checkedUrl,{waitUntil:'domcontentloaded',timeout:60000});
                  await page.waitForSelector(t.selector,{state:'attached',timeout:20000});
                  const el=page.locator(t.selector);
                  const count=await el.count();
                  const text=count?await el.innerText():'';
                  const folded=text.toLocaleLowerCase('es');
                  const markers=Object.fromEntries(t.markers.map(m=>[m,folded.includes(m.toLocaleLowerCase('es'))]));
                  const passed=count===1 && Object.values(markers).every(Boolean);
                  pass &&= passed;
                  results.push({key:t.key,url:checkedUrl,count,markers,diagnostics,passed});
                }catch(e){pass=false;results.push({key:t.key,error:String(e),diagnostics,passed:false});}
                finally{await page.close();}
              }
              finalResults=results;
              console.log(JSON.stringify({attempt,pass,results},null,2));
              if(pass){ok=true;break;}
              await new Promise(r=>setTimeout(r,3000));
            }
            await browser.close();
            fs.mkdirSync('artifacts/meeting-point-live',{recursive:true});
            fs.writeFileSync('artifacts/meeting-point-live/result.json',JSON.stringify({status:ok?'PASS':'FAIL',source_sha:process.env.SOURCE_SHA,results:finalResults},null,2));
            process.exit(ok?0:1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Show exact-route verification evidence
        if: always()
        run: |
          cat /tmp/eleconomista-live-source.json || true
          cat artifacts/eleconomista-live/result.json || true
          cat artifacts/meeting-point-live/result.json || true

      - name: Publish persistent exact-route status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_OUTCOME: ${{ steps.verify_raw.outcome }}
          DOM_OUTCOME: ${{ steps.verify_dom.outcome }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['SOURCE_SHA']; run=os.environ['RUN_ID']
          success=os.environ['RAW_OUTCOME']=='success' and os.environ['DOM_OUTCOME']=='success'
          payload={
            'state':'success' if success else 'failure',
            'target_url':f'https://github.com/{repo}/actions/runs/{run}',
            'description':'elEconomista Acosta Matos dossier verified live' if success else 'elEconomista dossier live verification failed',
            'context':'pages-propagation/eleconomista-acosta-matos',
          }
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',data=json.dumps(payload).encode(),method='POST',headers={
            'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Por-Derecho-elEconomista-live-verifier/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r: print(r.read().decode())
          PY

      - name: Publish persistent Meeting Point status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MP_OUTCOME: ${{ steps.verify_mp.outcome }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['SOURCE_SHA']; run=os.environ['RUN_ID']
          success=os.environ['MP_OUTCOME']=='success'
          payload={
            'state':'success' if success else 'failure',
            'target_url':f'https://github.com/{repo}/actions/runs/{run}',
            'description':'Meeting Point six-route propagation verified live' if success else 'Meeting Point six-route live verification failed',
            'context':'pages-propagation/meeting-point-final',
          }
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',data=json.dumps(payload).encode(),method='POST',headers={
            'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Por-Derecho-MeetingPoint-live-verifier/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r: print(r.read().decode())
          PY

      - name: Fail when exact-route verification did not succeed
        if: steps.verify_raw.outcome != 'success' || steps.verify_dom.outcome != 'success' || steps.verify_mp.outcome != 'success'
        run: exit 1
