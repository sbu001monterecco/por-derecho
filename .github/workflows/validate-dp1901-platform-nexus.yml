name: Validate DP1901 platform recovery nexus
on:
  pull_request:
    paths:
      - 'assets/site.js'
      - 'assets/dp1901-platform-recovery-nexus-20260920.*'
      - 'assets/data/dp1901-platform-recovery-nexus-20260920.json'
      - 'assets/data/dp1901-routing-collision-v1.json'
      - 'es/dp-1901-plataforma-recuperacion/**'
      - 'en/dp-1901-platform-recovery/**'
      - 'es/presidencia-plataforma-grupo-recuperacion/**'
      - 'en/presidencia-platform-group-recovery/**'
      - 'archive/DP1901_PLATFORM_RECOVERY_NEXUS_THESIS_20SEP2026.md'
      - 'archive/PRESIDENCIA_PUBLIC_THESIS_EXPONE_SOLICITA_20SEP2026.md'
      - 'scripts/validate_dp1901_platform_nexus.py'
      - 'scripts/render_dp1901_platform_nexus.mjs'
      - '.github/workflows/validate-dp1901-platform-nexus.yml'
  push:
    branches: [main]
    paths:
      - 'assets/site.js'
      - 'assets/dp1901-platform-recovery-nexus-20260920.*'
      - 'assets/data/dp1901-platform-recovery-nexus-20260920.json'
      - 'assets/data/dp1901-routing-collision-v1.json'
      - 'es/dp-1901-plataforma-recuperacion/**'
      - 'en/dp-1901-platform-recovery/**'
      - 'es/presidencia-plataforma-grupo-recuperacion/**'
      - 'en/presidencia-platform-group-recovery/**'
      - 'archive/DP1901_PLATFORM_RECOVERY_NEXUS_THESIS_20SEP2026.md'
      - 'archive/PRESIDENCIA_PUBLIC_THESIS_EXPONE_SOLICITA_20SEP2026.md'
      - 'scripts/validate_dp1901_platform_nexus.py'
      - 'scripts/render_dp1901_platform_nexus.mjs'
      - '.github/workflows/validate-dp1901-platform-nexus.yml'
permissions:
  contents: read
concurrency:
  group: dp1901-platform-nexus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Source and JavaScript checks
        run: |
          python3 scripts/validate_dp1901_platform_nexus.py
          node --check assets/site.js
          node --check assets/dp1901-platform-recovery-nexus-20260920.js
          node --check scripts/render_dp1901_platform_nexus.mjs
      - name: Install existing pinned browser stack
        run: |
          npm install --no-save playwright@1.50.1
          npx playwright install --with-deps chromium
      - name: Serve exact checkout at project subpath
        run: |
          mkdir -p /tmp/pd-nexus-site
          ln -s "$GITHUB_WORKSPACE" /tmp/pd-nexus-site/por-derecho
          python3 -m http.server 8000 --bind 127.0.0.1 --directory /tmp/pd-nexus-site >/tmp/pd-nexus-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/por-derecho/assets/data/dp1901-platform-recovery-nexus-20260920.json >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Render all 44 scoped routes at desktop and mobile
        env:
          PSR_BASE_URL: http://127.0.0.1:8000/por-derecho
        run: node scripts/render_dp1901_platform_nexus.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dp1901-platform-nexus-browser
          path: artifacts/dp1901-platform-nexus
          if-no-files-found: warn
          retention-days: 14
