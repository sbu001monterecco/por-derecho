name: Cuatrecasas RAUDA publication
on:
  push:
    branches: ['integration/cuatrecasas-rauda-20260905', main]
    paths:
      - '.github/workflows/cuatrecasas-rauda-publication.yml'
      - 'scripts/build_cuatrecasas_rauda_20260905.py'
      - 'assets/content/cuatrecasas-rauda-20260905.*.html'
      - 'ops/CUATRECASAS_RAUDA_RELEASE_20260905.json'
  pull_request:
    paths:
      - '.github/workflows/cuatrecasas-rauda-publication.yml'
      - 'scripts/build_cuatrecasas_rauda_20260905.py'
      - 'assets/content/cuatrecasas-rauda-20260905.*.html'
      - 'ops/CUATRECASAS_RAUDA_RELEASE_20260905.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cuatrecasas-rauda-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare-integration-only:
    if: github.ref == 'refs/heads/integration/cuatrecasas-rauda-20260905' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/cuatrecasas-rauda-20260905
          fetch-depth: 50
          persist-credentials: true
      - name: Current-main guard and deterministic additive generation
        run: |
          git fetch --no-tags --depth=50 origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = e482e29325091bcc32af3fd2b2624335c6699e19
          python -m py_compile scripts/build_cuatrecasas_rauda_20260905.py
          python scripts/build_cuatrecasas_rauda_20260905.py --write
      - name: Commit allowlisted generated output to the integration branch only
        shell: python
        run: |
          import json,subprocess
          from pathlib import Path
          path='ops/CUATRECASAS_RAUDA_RELEASE_20260905.json'
          data=json.loads(Path(path).read_text())
          allowed=data['outputs']+[path]
          subprocess.run(['git','add','--',*allowed],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
            subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
            subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
            subprocess.run(['git','commit','-m','Render Cuatrecasas RAUDA review, source lineage and reciprocal public links'],check=True)
            subprocess.run(['git','push','origin','HEAD:refs/heads/integration/cuatrecasas-rauda-20260905'],check=True)
          print('PREPARED_HEAD',subprocess.check_output(['git','rev-parse','HEAD']).decode().strip())
  validate-read-only:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 60
          persist-credentials: false
      - name: Exact source, canonical preservation, safe boundaries and links
        run: |
          git fetch --no-tags --depth=60 origin main:refs/remotes/origin/main
          python scripts/build_cuatrecasas_rauda_20260905.py --check
      - name: Compare repository controls with immutable source baseline
        shell: python
        run: |
          import subprocess,json,re
          from pathlib import Path
          base=Path('/tmp/cr-baseline')
          subprocess.run(['git','worktree','add','--detach',str(base),'e482e29325091bcc32af3fd2b2624335c6699e19'],check=True)
          files=['validate_repository_preservation.py','validate_publication_integrity.py','validate_audience_experience.py']
          files += [p.name for p in sorted(Path('scripts').glob('validate*identity*registry*.py')) if p.name not in files]
          results=[]
          for file in files:
            row={'validator':file}
            for label,cwd in [('base',base),('head',Path.cwd())]:
              r=subprocess.run(['python','scripts/'+file],cwd=cwd,capture_output=True,text=True)
              row[label]={'exit':r.returncode,'stdout':r.stdout[-35000:],'stderr':r.stderr[-2000:]}
            print(json.dumps(row,ensure_ascii=False));results.append(row)
            if row['base']['exit']==0 and row['head']['exit']!=0:raise SystemExit('New validator failure: '+file)
            if row['head']['exit']!=0:
              def errors(text):
                try:
                  d=json.loads(text[text.index('{'):]);return d.get('errors',d.get('failures',[]))
                except Exception:return None
              old=errors(row['base']['stdout']);new=errors(row['head']['stdout'])
              if old is not None and new is not None:
                fresh=[x for x in new if x not in old]
                if fresh:raise SystemExit('New errors in '+file+': '+json.dumps(fresh,ensure_ascii=False))
          Path('/tmp/cr-validation-baseline-comparison.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print('Inherited failures are recorded separately; no global rule or protection is changed.')
      - name: Install browser runtime
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Desktop, mobile and no-script source navigation
        shell: python
        run: |
          import json,subprocess,time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          a=json.loads(Path('ops/CUATRECASAS_RAUDA_RELEASE_20260905.json').read_text())
          server=subprocess.Popen(['python','-m','http.server','8765','--bind','127.0.0.1','--directory',str(Path.cwd().parent)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          checks=0
          try:
            time.sleep(2)
            with sync_playwright() as p:
              b=p.chromium.launch()
              for width in [390,1440]:
                page=b.new_page(viewport={'width':width,'height':1000})
                for row in a['pages']:
                  url='http://127.0.0.1:8765/por-derecho/'+row['path'].removesuffix('index.html')
                  response=page.goto(url,wait_until='networkidle');assert response.status==200;checks+=1
                  ident='cuatrecasas-rauda-revision-20260905'+('' if row['role']=='main' else '-crosslink')
                  section=page.locator('#'+ident);assert section.count()==1;checks+=1
                  section.scroll_into_view_if_needed();assert section.is_visible();checks+=1
                  assert section.evaluate('(e)=>e.getBoundingClientRect().width<=innerWidth+2');checks+=1
                  if row['role']=='main':
                    assert page.locator('.pd-cr-jump a').count()==1;checks+=1
                    assert page.locator('.pd-cr-source').count()==4;checks+=1
                    for source in ['PD-CR-COM-20220218','PD-CR-COM-20220307','PD-CR-SOURCE-ETJ163-20260903','PD-CR-SOURCE-DP748-20260716']:
                      assert page.locator('#'+source).count()==1;checks+=1
                    assert page.locator('.pd-cr-identity').get_attribute('data-caret-state')=='CARET_PENDING';checks+=1
                    page.screenshot(path='/tmp/cr-'+row['path'].split('/')[0]+'-'+str(width)+'.png',full_page=False)
                page.close()
              context=b.new_context(java_script_enabled=False,viewport={'width':390,'height':1000})
              page=context.new_page()
              for lang in ['es','en']:
                page.goto('http://127.0.0.1:8765/por-derecho/'+lang+'/cuatrecasas-sun-park/')
                assert page.locator('.pd-cr-source').count()==4;checks+=1
                page.locator('.pd-cr-jump a').click()
                assert page.locator('#cuatrecasas-rauda-revision-20260905').is_visible();checks+=1
              context.close();b.close()
            print(json.dumps({'result':'BROWSER_PASS','checks':checks,'pages':len(a['pages']),'widths':[390,1440],'languages':['es','en'],'no_script':True}))
          finally:server.terminate()
  live-read-only:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate-read-only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 60
          persist-credentials: false
      - name: Exact public-block and release-manifest readback
        run: python scripts/build_cuatrecasas_rauda_20260905.py --live
