name: Verify P0 static/criminal framing live

on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_p0_static_live.py'
      - '.github/workflows/verify-p0-static-live.yml'
  pull_request:
    paths:
      - 'scripts/verify_p0_static_live.py'
      - '.github/workflows/verify-p0-static-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify public Pages markers
        run: |
          python3 scripts/verify_p0_static_live.py \
            --attempts 60 \
            --interval 10 \
            --timeout 20 \
            --output artifacts/p0-static-live/verification.json
      - name: Upload live verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p0-static-live-evidence
          path: artifacts/p0-static-live/verification.json
          if-no-files-found: error
          retention-days: 30
