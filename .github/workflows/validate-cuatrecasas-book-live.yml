name: Validate Cuatrecasas book live publication

on:
  pull_request:
    paths:
      - 'publication-manifests/cuatrecasas-book-media-delta-20260831.json'
      - 'archive/CUATRECASAS_BOOK_MEDIA_DELTA_IMPLEMENTATION_31AUG2026.md'
      - 'scripts/validate_cuatrecasas_book_live.py'
      - '.github/workflows/validate-cuatrecasas-book-live.yml'
  push:
    branches:
      - main
    paths:
      - 'publication-manifests/cuatrecasas-book-media-delta-20260831.json'
      - 'archive/CUATRECASAS_BOOK_MEDIA_DELTA_IMPLEMENTATION_31AUG2026.md'
      - 'scripts/validate_cuatrecasas_book_live.py'
      - '.github/workflows/validate-cuatrecasas-book-live.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuatrecasas-book-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-route-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify live bilingual book and gap routes
        run: >-
          python scripts/validate_cuatrecasas_book_live.py
          --deployment-sha 4938164da577b27ad63bb731d74013ee90979727
          --pages-run-id 33374111565
          --output artifacts/cuatrecasas-book-live-verification.json
      - name: Upload live verification record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuatrecasas-book-live-verification
          path: artifacts/cuatrecasas-book-live-verification.json
          if-no-files-found: error
          retention-days: 30
