name: Validate Ministerio Fiscal canonical directory

on:
  pull_request:
    paths:
      - 'assets/data/ministerio-fiscal-directory-v1.json'
      - 'assets/data/institutional-communications-register-v1.json'
      - 'archive/PROCEEDINGS_MASTER_REGISTER.csv'
      - 'assets/ministerio-fiscal-directory-20260902.*'
      - 'es/ministerio-fiscal/**'
      - 'en/public-prosecution-service/**'
      - 'scripts/validate_ministerio_fiscal_directory.py'
      - '.github/workflows/validate-ministerio-fiscal-directory.yml'
  push:
    branches: [main]
    paths:
      - 'assets/data/ministerio-fiscal-directory-v1.json'
      - 'assets/data/institutional-communications-register-v1.json'
      - 'archive/PROCEEDINGS_MASTER_REGISTER.csv'
      - 'assets/ministerio-fiscal-directory-20260902.*'
      - 'es/ministerio-fiscal/**'
      - 'en/public-prosecution-service/**'
      - 'scripts/validate_ministerio_fiscal_directory.py'
      - '.github/workflows/validate-ministerio-fiscal-directory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-ministerio-fiscal-directory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate canonical directory and event numbering
        run: python scripts/validate_ministerio_fiscal_directory.py
      - name: JavaScript syntax
        run: node --check assets/ministerio-fiscal-directory-20260902.js
