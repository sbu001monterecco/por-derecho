name: EG745 regenerate proceedings interlinkability
on:
  push:
    branches:
      - eg745-imminent-filing-interconnectivity-20260918
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Regenerate controlled projection
        run: python scripts/build_proceedings_interlinkability_v1.py
      - name: Verify regenerated projection
        run: python scripts/build_proceedings_interlinkability_v1.py --check
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: eg745-proceedings-interlinkability-generated
          path: assets/data/proceedings-interlinkability-v1.json
          if-no-files-found: error
