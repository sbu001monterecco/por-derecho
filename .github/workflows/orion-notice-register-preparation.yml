name: Orion notice register preparation
on:
  push:
    branches: ['integration/orion-notice-register-20260905', main]
    paths:
      - '.github/workflows/orion-notice-register-preparation.yml'
      - 'scripts/prepare_orion_notice_register_20260905.py'
      - 'ops/orion-notice-register-input-20260905.json'
      - 'ops/ORION_NOTICE_CANONICAL_CROSSWALK_20260905.json'
      - 'assets/data/institutional-communications-register-v1.json'
  pull_request:
    paths:
      - '.github/workflows/orion-notice-register-preparation.yml'
      - 'scripts/prepare_orion_notice_register_20260905.py'
      - 'ops/orion-notice-register-input-20260905.json'
      - 'ops/ORION_NOTICE_CANONICAL_CROSSWALK_20260905.json'
      - 'assets/data/institutional-communications-register-v1.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orion-notice-register-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python -m pip install --quiet jsonschema
      - run: |
          python scripts/reconcile_institutional_communications.py --check
          python scripts/validate_institutional_communications.py
          python -m unittest -v scripts/test_reconcile_institutional_communications.py
          python scripts/validate_redsara_authority_discovery.py
          python scripts/prepare_orion_notice_register_20260905.py check
  verify-live:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify deployed canonical register and affected pages without mutating main
        run: python scripts/prepare_orion_notice_register_20260905.py live
      - name: Verify live reciprocal fragments, exact page blocks, source descriptors and images
        shell: python
        run: |
          import sys, json, hashlib, urllib.request, subprocess
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import prepare_orion_notice_register_20260905 as control
          audit=control.check()
          cross=control.read(control.CROSSWALK)
          sha=subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          urls=set()
          blocks={}
          for route in audit['pages_checked']:
            text=(Path(route)/'index.html').read_text()
            block=text.split(control.START,1)[1].split(control.END,1)[0]
            blocks[route]=block
            parsed=control.Links();parsed.feed(block);urls.update(parsed.urls)
          paths={u.removeprefix('/por-derecho/').split('#',1)[0] for u in urls}
          paths |= set(blocks)
          def fetch(path):
            url='https://sbu001monterecco.github.io/por-derecho/'+path+'?notice-verify='+sha[:12]
            with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'PorDerecho-release-verifier'}),timeout=35) as response:
              return path,response.read()
          with ThreadPoolExecutor(max_workers=6) as pool: fetched=dict(pool.map(fetch,sorted(paths)))
          fragments=0
          for url in urls:
            path,sep,fragment=url.removeprefix('/por-derecho/').partition('#')
            if sep:
              parser=control.Links();parser.feed(fetched[path].decode('utf-8'))
              assert fragment in parser.ids, url
              fragments+=1
          for route,expected in blocks.items():
            actual=fetched[route].decode('utf-8').split(control.START,1)[1].split(control.END,1)[0]
            assert actual==expected, 'stale live block '+route
          for path in [control.REGISTER,control.CROSSWALK]:
            assert fetched[path]==Path(path).read_bytes(), 'live source data mismatch '+path
          images=0
          for source in cross['sources'].values():
            if source.get('public_asset'):
              assert hashlib.sha256(fetched[source['public_asset']]).hexdigest()==source['public_asset_sha256']
              images+=1
          assert images==4, 'all four registered public figures must resolve'
          print(json.dumps({'status':'LIVE_LINKS_ANCHORS_IMAGES_AND_EXACT_BLOCKS_VERIFIED','checked_commit':sha,'pages':len(blocks),'public_targets':len(paths),'unique_internal_links':len(urls),'fragments_verified':fragments,'image_hashes_verified':images,'register_sha256':audit['register_sha256']},indent=2))
