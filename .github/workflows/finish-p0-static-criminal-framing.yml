name: Finish P0 static and criminal-framing corrections

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/finish_p0_static_criminal_framing.py'
      - '.github/workflows/finish-p0-static-criminal-framing.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  finish-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply final static cleanup
        run: python3 scripts/finish_p0_static_criminal_framing.py
      - name: Static integrity
        run: |
          git diff --check
          python3 -m py_compile scripts/finish_p0_static_criminal_framing.py
          python3 scripts/validate_supervisory_practice.py
      - name: Commit cleanup back to PR branch
        run: |
          if git diff --quiet; then
            echo 'No cleanup changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add es en
          git commit -m 'Finish P0 static and criminal-framing corrections'
          git push origin HEAD:${{ github.head_ref }}
