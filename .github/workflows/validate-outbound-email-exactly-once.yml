name: Validate outbound email exactly-once guard

on:
  pull_request:
    paths:
      - "EMAIL_SEND_EXACTLY_ONCE_EXECUTION_GUARD.md"
      - ".github/governance/outbound-email-exactly-once-guard-v1.json"
      - ".github/governance/test_outbound_email_exactly_once_guard.py"
      - ".github/workflows/validate-outbound-email-exactly-once.yml"
      - "archive/OUTBOUND_EMAIL_DUPLICATE_SEND_INCIDENT_25AUG2026.md"
  push:
    branches:
      - main
    paths:
      - "EMAIL_SEND_EXACTLY_ONCE_EXECUTION_GUARD.md"
      - ".github/governance/outbound-email-exactly-once-guard-v1.json"
      - ".github/governance/test_outbound_email_exactly_once_guard.py"
      - ".github/workflows/validate-outbound-email-exactly-once.yml"
      - "archive/OUTBOUND_EMAIL_DUPLICATE_SEND_INCIDENT_25AUG2026.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-exactly-once-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate exactly-once email execution guard
        run: python3 .github/governance/test_outbound_email_exactly_once_guard.py
