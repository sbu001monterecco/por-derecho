name: Verify Concurso 36/2012 linked continuity live

on:
  pull_request:
    paths:
      - 'CONCURSO36_CONTINUE_HERE.md'
      - 'assets/data/concurso36-linked-continuity-20260829-v1.json'
      - 'publication-manifests/concurso36-linked-continuity-20260829.json'
      - 'docs/deletion-audits/2026-08-29-concurso36-linked-continuity.md'
      - 'en/insolvency-36-2012-continuity-control/**'
      - 'es/concurso-36-2012-control-continuidad/**'
      - 'scripts/validate_concurso36_linked_continuity.py'
      - 'scripts/verify_concurso36_linked_continuity_live.py'
      - 'scripts/production_smoke_check.py'
      - '.github/workflows/validate-concurso36-linked-continuity.yml'
      - '.github/workflows/verify-concurso36-linked-continuity-live.yml'
  push:
    branches: [main]
    paths:
      - 'CONCURSO36_CONTINUE_HERE.md'
      - 'assets/data/concurso36-linked-continuity-20260829-v1.json'
      - 'publication-manifests/concurso36-linked-continuity-20260829.json'
      - 'docs/deletion-audits/2026-08-29-concurso36-linked-continuity.md'
      - 'en/insolvency-36-2012-continuity-control/**'
      - 'es/concurso-36-2012-control-continuidad/**'
      - 'scripts/validate_concurso36_linked_continuity.py'
      - 'scripts/verify_concurso36_linked_continuity_live.py'
      - 'scripts/production_smoke_check.py'
      - '.github/workflows/validate-concurso36-linked-continuity.yml'
      - '.github/workflows/verify-concurso36-linked-continuity-live.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: concurso36-linked-continuity-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile and validate the exact source package
        run: |
          python -B -m py_compile scripts/verify_concurso36_linked_continuity_live.py
          python -B scripts/validate_concurso36_linked_continuity.py
      - name: Serve pull-request checkout at the production subpath
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$(dirname "$GITHUB_WORKSPACE")" > /tmp/concurso36-linked-live-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/por-derecho/en/insolvency-36-2012-continuity-control/ > /dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/concurso36-linked-live-server.log
          exit 1
      - name: Verify pull-request checkout byte-for-byte
        if: github.event_name == 'pull_request'
        run: |
          python scripts/verify_concurso36_linked_continuity_live.py \
            --base-url http://127.0.0.1:4173/por-derecho/ \
            --attempts 1 \
            --output artifacts/concurso36-linked-continuity-live/result.json
      - name: Attest successful Pages deployment for the exact merge SHA
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repository = os.environ["REPOSITORY"]
          expected_sha = os.environ["EXPECTED_SHA"]
          token = os.environ["GH_TOKEN"]
          api = (
              f"https://api.github.com/repos/{repository}/actions/runs"
              f"?head_sha={expected_sha}&per_page=100"
          )
          last_seen = []
          for attempt in range(1, 49):
              request = urllib.request.Request(
                  api,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "Por-Derecho-Concurso36-Linked-Pages-Attestation/1.0",
                  },
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  payload = json.load(response)
              candidates = [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("name") == "pages build and deployment"
                  and run.get("path") == "dynamic/pages/pages-build-deployment"
              ]
              last_seen = [
                  {
                      "id": run.get("id"),
                      "head_sha": run.get("head_sha"),
                      "status": run.get("status"),
                      "conclusion": run.get("conclusion"),
                      "html_url": run.get("html_url"),
                  }
                  for run in candidates
              ]
              successful = next(
                  (
                      run for run in candidates
                      if run.get("head_sha") == expected_sha
                      and run.get("status") == "completed"
                      and run.get("conclusion") == "success"
                  ),
                  None,
              )
              if successful:
                  result = {
                      "ok": True,
                      "expected_sha": expected_sha,
                      "pages_run_id": successful["id"],
                      "pages_run_number": successful.get("run_number"),
                      "pages_head_sha": successful.get("head_sha"),
                      "pages_url": successful.get("html_url"),
                      "attempt": attempt,
                  }
                  output = "artifacts/concurso36-linked-continuity-live/pages-attestation.json"
                  os.makedirs(os.path.dirname(output), exist_ok=True)
                  with open(output, "w", encoding="utf-8") as handle:
                      json.dump(result, handle, indent=2)
                      handle.write("\n")
                  print(json.dumps(result, indent=2))
                  raise SystemExit(0)
              print(f"Pages attestation attempt {attempt}/48: pending", flush=True)
              if attempt < 48:
                  time.sleep(10)

          print(json.dumps({"ok": False, "expected_sha": expected_sha, "last_seen": last_seen}, indent=2))
          raise SystemExit(1)
          PY
      - name: Wait for and verify the exact public deployment
        if: github.event_name != 'pull_request'
        run: |
          python scripts/verify_concurso36_linked_continuity_live.py \
            --attempts 48 \
            --interval 10 \
            --output artifacts/concurso36-linked-continuity-live/result.json
      - name: Upload exact readback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: concurso36-linked-continuity-live
          path: artifacts/concurso36-linked-continuity-live/
          if-no-files-found: error
          retention-days: 30
