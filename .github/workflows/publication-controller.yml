name: Publication controller
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: por-derecho-publication
  cancel-in-progress: false
  queue: max
jobs:
  control:
    if: github.event.issue.number == 1428 && github.event.comment.user.login == 'sbu001monterecco' && github.event.comment.author_association == 'OWNER' && startsWith(github.event.comment.body, '/pd-release ')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Materialize exact Cajasiete PNG on reviewed mirror branch
        if: ${{ startsWith(github.event.comment.body, '/pd-release materialize-cajasiete ') }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pd-release-controller
          if [[ "$COMMAND_BODY" =~ ^/pd-release\ materialize-cajasiete\ mirror/cajasiete-final-20260916\ ([a-f0-9]{40})$ ]]; then
            expected_head="${BASH_REMATCH[1]}"
          else
            echo "Refusing non-exact Cajasiete materialization command" >&2
            exit 1
          fi
          branch='mirror/cajasiete-final-20260916'
          asset='assets/cajasiete-independent-records-20260916.png'
          source='https://por-derecho-setup-or-gitlab-setup-c2b10f.gitlab.io/por-derecho-setup-or-gitlab-setup/assets/cajasiete-independent-records-20260916.png'
          expected_sha256='b9ec46c279d64abd29b0583ae076390a3ef8ea99f3455463f9c54aa71aa4d403'
          expected_bytes='2599733'
          actual_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
          test "$actual_head" = "$expected_head" || { echo "Mirror branch moved: $actual_head" >&2; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/contents/$asset?ref=$branch" >/dev/null 2>&1; then
            echo "Target asset already exists; refusing replay" >&2
            exit 1
          fi
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            -H 'Cache-Control: no-cache' \
            "$source?pd_release=$expected_head" \
            -o /tmp/cajasiete-independent-records-20260916.png
          observed_bytes="$(wc -c < /tmp/cajasiete-independent-records-20260916.png | tr -d ' ')"
          test "$observed_bytes" = "$expected_bytes" || { echo "Unexpected byte count: $observed_bytes" >&2; exit 1; }
          printf '%s  %s\n' "$expected_sha256" /tmp/cajasiete-independent-records-20260916.png | sha256sum --check --strict -
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('/tmp/cajasiete-independent-records-20260916.png')
          raw=p.read_bytes()
          if raw[:8] != b'\x89PNG\r\n\x1a\n' or raw[12:16] != b'IHDR':
              raise SystemExit('Not the required PNG/IHDR structure')
          dims=struct.unpack('>II', raw[16:24])
          if dims != (1122,1402):
              raise SystemExit(f'Unexpected PNG dimensions: {dims!r}')
          PY
          python3 - <<'PY'
          import base64, json
          raw=open('/tmp/cajasiete-independent-records-20260916.png','rb').read()
          payload={
            'message':'Mirror canonical exact Cajasiete PNG from live-verified GitLab',
            'branch':'mirror/cajasiete-final-20260916',
            'content':base64.b64encode(raw).decode('ascii'),
          }
          with open('/tmp/cajasiete-payload.json','w') as f:
              json.dump(payload,f,separators=(',',':'))
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$asset" \
            --input /tmp/cajasiete-payload.json > /tmp/cajasiete-result.json
          new_head="$(python3 -c 'import json; print(json.load(open("/tmp/cajasiete-result.json"))["commit"]["sha"])')"
          served_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
          test "$new_head" = "$served_head" || { echo "Branch head mismatch after materialization" >&2; exit 1; }
          python3 - <<PY
          import json
          json.dump({
            'status':'EXACT_CAJASIETE_PNG_MATERIALIZED',
            'branch':'$branch',
            'prior_head':'$expected_head',
            'new_head':'$new_head',
            'path':'$asset',
            'bytes':2599733,
            'sha256':'$expected_sha256',
            'width':1122,
            'height':1402,
            'source':'$source',
          },open('/tmp/pd-release-controller/materialize-cajasiete.json','w'),indent=2)
          PY
      - name: Materialize exact public CNMV dependencies on reviewed Cajasiete mirror branch
        if: ${{ startsWith(github.event.comment.body, '/pd-release materialize-cnmv-cajasiete ') }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pd-release-controller /tmp/pd-cnmv-assets
          if [[ "$COMMAND_BODY" =~ ^/pd-release\ materialize-cnmv-cajasiete\ mirror/cajasiete-final-20260916\ ([a-f0-9]{40})$ ]]; then
            expected_head="${BASH_REMATCH[1]}"
          else
            echo "Refusing non-exact CNMV dependency materialization command" >&2
            exit 1
          fi
          branch='mirror/cajasiete-final-20260916'
          source_root='https://por-derecho-setup-or-gitlab-setup-c2b10f.gitlab.io/por-derecho-setup-or-gitlab-setup/'
          actual_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
          test "$actual_head" = "$expected_head" || { echo "Mirror branch moved: $actual_head" >&2; exit 1; }
          cat > /tmp/pd-cnmv-assets/manifest.tsv <<'EOF'
          assets/evidence/cnmv-2026-01-22/2026008544/CNMV_2026-01-22_2026008544_page-1_PUBLIC_REDACTED.png	726750	5c568b5a26261c4a21d6df7aa1473a90c18ca433660916e46e577a97966003ef
          assets/evidence/cnmv-2026-01-22/2026008544/CNMV_2026-01-22_2026008544_page-2_PUBLIC.png	361964	b7679cb7430493ce277b8637f8a2977b895d0022dafc32c86910383b6a6b1be7
          assets/evidence/cnmv-2026-09-04/2026149422/CNMV_2026-09-04_2026149422_public_composite.webp	397258	7b7c296a2003bb9714bdb83e9ec6f5923e833a6482d2906c904aa83a58c4d95a
          assets/evidence/cnmv-2026-09-04/2026149422/CNMV_2026-09-04_2026149422_verified_transcription_ES.txt	6709	54bfbf9d743fa23f5e78bbd913eb315f5e4a38d20e1095dc4c8f09fdb6c5eec0
          EOF
          while IFS=$'\t' read -r path expected_bytes expected_sha256; do
            test -n "$path" || continue
            if gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$branch" >/dev/null 2>&1; then
              echo "Target already exists; refusing overwrite: $path" >&2
              exit 1
            fi
            target="/tmp/pd-cnmv-assets/$(basename "$path")"
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 15 --max-time 120 \
              -H 'Cache-Control: no-cache' \
              "${source_root}${path}?pd_release=$expected_head" \
              -o "$target"
            observed_bytes="$(wc -c < "$target" | tr -d ' ')"
            test "$observed_bytes" = "$expected_bytes" || { echo "Unexpected byte count for $path: $observed_bytes" >&2; exit 1; }
            printf '%s  %s\n' "$expected_sha256" "$target" | sha256sum --check --strict -
          done < /tmp/pd-cnmv-assets/manifest.tsv
          python3 - <<'PY'
          from pathlib import Path
          import struct
          root=Path('/tmp/pd-cnmv-assets')
          p1=(root/'CNMV_2026-01-22_2026008544_page-1_PUBLIC_REDACTED.png').read_bytes()
          p2=(root/'CNMV_2026-01-22_2026008544_page-2_PUBLIC.png').read_bytes()
          for name,raw in [('page-1',p1),('page-2',p2)]:
              if raw[:8] != b'\x89PNG\r\n\x1a\n' or raw[12:16] != b'IHDR':
                  raise SystemExit(f'{name}: not PNG/IHDR')
              if struct.unpack('>II',raw[16:24]) != (2481,3508):
                  raise SystemExit(f'{name}: unexpected PNG dimensions')
          webp=(root/'CNMV_2026-09-04_2026149422_public_composite.webp').read_bytes()
          if not (webp[:4] == b'RIFF' and webp[8:12] == b'WEBP'):
              raise SystemExit('composite: not RIFF/WEBP')
          text=(root/'CNMV_2026-09-04_2026149422_verified_transcription_ES.txt').read_text(encoding='utf-8')
          for marker in ('CNMV — 4 de septiembre de 2026','Transcripción comprobada contra el PDF original firmado','REGISTRO DE SALIDA'):
              if marker not in text:
                  raise SystemExit('transcription marker missing: '+marker)
          PY
          base_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$actual_head" --jq '.tree.sha')"
          export GITHUB_REPOSITORY actual_head base_tree branch
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          root=Path('/tmp/pd-cnmv-assets')
          entries=[]
          rows=[]
          for line in (root/'manifest.tsv').read_text().splitlines():
              if not line.strip():
                  continue
              path,size,sha256=line.split('\t')
              local=root/Path(path).name
              payload={'content':base64.b64encode(local.read_bytes()).decode('ascii'),'encoding':'base64'}
              blob_json=root/('blob-'+str(len(entries))+'.json')
              blob_json.write_text(json.dumps(payload,separators=(',',':')))
              result=subprocess.check_output(['gh','api','--method','POST',f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",'--input',str(blob_json)],text=True)
              blob_sha=json.loads(result)['sha']
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob_sha})
              rows.append({'path':path,'bytes':int(size),'sha256':sha256,'git_blob_sha':blob_sha})
          tree_payload={'base_tree':os.environ['base_tree'],'tree':entries}
          (root/'tree.json').write_text(json.dumps(tree_payload,separators=(',',':')))
          tree=json.loads(subprocess.check_output(['gh','api','--method','POST',f"repos/{os.environ['GITHUB_REPOSITORY']}/git/trees",'--input',str(root/'tree.json')],text=True))
          commit_payload={'message':'Mirror canonical public CNMV dependencies for Cajasiete readers','tree':tree['sha'],'parents':[os.environ['actual_head']]}
          (root/'commit.json').write_text(json.dumps(commit_payload,separators=(',',':')))
          commit=json.loads(subprocess.check_output(['gh','api','--method','POST',f"repos/{os.environ['GITHUB_REPOSITORY']}/git/commits",'--input',str(root/'commit.json')],text=True))
          current=subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/{os.environ['branch']}",'--jq','.object.sha'],text=True).strip()
          if current != os.environ['actual_head']:
              raise SystemExit('Mirror branch moved during materialization; refusing ref update')
          ref_payload=root/'ref.json'
          ref_payload.write_text(json.dumps({'sha':commit['sha'],'force':False},separators=(',',':')))
          subprocess.check_call(['gh','api','--method','PATCH',f"repos/{os.environ['GITHUB_REPOSITORY']}/git/refs/heads/{os.environ['branch']}",'--input',str(ref_payload)])
          receipt={'status':'EXACT_PUBLIC_CNMV_DEPENDENCIES_MATERIALIZED','branch':os.environ['branch'],'prior_head':os.environ['actual_head'],'new_head':commit['sha'],'source_root':'https://por-derecho-setup-or-gitlab-setup-c2b10f.gitlab.io/por-derecho-setup-or-gitlab-setup/','files':rows}
          Path('/tmp/pd-release-controller/materialize-cnmv-cajasiete.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
          served_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
          receipt_head="$(python3 -c 'import json; print(json.load(open("/tmp/pd-release-controller/materialize-cnmv-cajasiete.json"))["new_head"])')"
          test "$served_head" = "$receipt_head" || { echo "Branch head mismatch after CNMV materialization" >&2; exit 1; }
      - name: Materialize exact live-verified AEAT / RICPE / MYND semantic visual
        if: ${{ startsWith(github.event.comment.body, '/pd-release materialize-aeat-visual ') }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pd-release-controller /tmp/pd-aeat-visual
          if [[ "$COMMAND_BODY" =~ ^/pd-release\ materialize-aeat-visual\ mirror/aeat-ricpe-mynd-visual-20260917\ ([a-f0-9]{40})$ ]]; then
            expected_head="${BASH_REMATCH[1]}"
          else
            echo "Refusing non-exact AEAT visual materialization command" >&2
            exit 1
          fi
          branch='mirror/aeat-ricpe-mynd-visual-20260917'
          canonical_gitlab_main='a901005930fb8f289a0621ed3f1c26184bc0304f'
          source_root='https://por-derecho-setup-or-gitlab-setup-c2b10f.gitlab.io/por-derecho-setup-or-gitlab-setup/'
          actual_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
          test "$actual_head" = "$expected_head" || { echo "Mirror branch moved: $actual_head" >&2; exit 1; }
          export GITHUB_REPOSITORY branch actual_head canonical_gitlab_main source_root
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path

          repo=os.environ['GITHUB_REPOSITORY']
          branch=os.environ['branch']
          expected_head=os.environ['actual_head']
          source_root=os.environ['source_root']
          source_sha=os.environ['canonical_gitlab_main']
          marker='data-pd-asset-id="visual.aeat-ricpe-mynd-accountability-20260916.es"'
          routes={
            'es/cadena-instrumentalizacion-ric-fondos-incentivos/index.html':'<section class="hero">',
            'es/ricpe-idoneidad-series-f-g/index.html':'<section class="hero-q">',
            'es/patron-efectos-favorables-acosta-matos/index.html':'<section class="hero">',
          }
          required=(
            'Alegación de Project Sun Rock · síntesis visual · no hallazgo oficial',
            'AEAT / RICPE / MYND YAIZA',
            'la inspección original de Pink comenzó antes',
            'no declara colusión, favoritismo, represalia, delito ni responsabilidad individual',
          )

          def gh_json(args, payload=None):
              cmd=['gh','api']+args
              if payload is not None:
                  p=Path('/tmp/pd-aeat-visual/payload.json')
                  p.write_text(json.dumps(payload,separators=(',',':')))
                  cmd += ['--input',str(p)]
              return json.loads(subprocess.check_output(cmd,text=True))

          entries=[]
          receipt_rows=[]
          for path,hero in routes.items():
              req=urllib.request.Request(source_root+path+'?pd_release='+source_sha,
                  headers={'Cache-Control':'no-cache','User-Agent':'PorDerecho-Mirror-Materializer'})
              with urllib.request.urlopen(req,timeout=40) as response:
                  canonical=response.read().decode('utf-8')
              if canonical.count(marker)!=1:
                  raise SystemExit('Canonical live visual marker count differs: '+path)
              pos=canonical.index(marker)
              start=canonical.rfind('<section',0,pos)
              end=canonical.find('</section>',pos)
              if start<0 or end<0:
                  raise SystemExit('Cannot bound canonical visual section: '+path)
              end += len('</section>')
              fragment=canonical[start:end]
              for text in required:
                  if text not in fragment:
                      raise SystemExit('Canonical visual boundary missing in '+path+': '+text)
              if any(token in fragment for token in ('libfile_','/Por Derecho/Project Sun Rock/Visual Assets/','private-email','<script')):
                  raise SystemExit('Private/non-semantic material leaked into visual fragment: '+path)
              current=gh_json([f'repos/{repo}/contents/{path}?ref={branch}'])
              if current.get('encoding')!='base64':
                  raise SystemExit('GitHub route cannot be read as exact bytes: '+path)
              raw=base64.b64decode(current['content']).decode('utf-8')
              if marker in raw:
                  raise SystemExit('AEAT visual already present; refusing replay: '+path)
              if raw.count(hero)!=1:
                  raise SystemExit('GitHub hero marker differs: '+path)
              hstart=raw.index(hero)
              hend=raw.find('</section>',hstart)
              if hend<0:
                  raise SystemExit('Cannot locate GitHub hero close: '+path)
              hend += len('</section>')
              updated=raw[:hend]+'\n'+fragment+'\n'+raw[hend:]
              if updated.count(marker)!=1:
                  raise SystemExit('Updated route marker count differs: '+path)
              blob=gh_json(['--method','POST',f'repos/{repo}/git/blobs'],{
                  'content':base64.b64encode(updated.encode()).decode('ascii'),'encoding':'base64'})
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
              receipt_rows.append({
                  'path':path,
                  'git_blob_sha':blob['sha'],
                  'fragment_bytes':len(fragment.encode()),
                  'fragment_sha256':hashlib.sha256(fragment.encode()).hexdigest(),
              })

          base_commit=gh_json([f'repos/{repo}/git/commits/{expected_head}'])
          tree=gh_json(['--method','POST',f'repos/{repo}/git/trees'],{
              'base_tree':base_commit['tree']['sha'],'tree':entries})
          commit=gh_json(['--method','POST',f'repos/{repo}/git/commits'],{
              'message':'Mirror live-verified AEAT / RICPE / MYND semantic visual',
              'tree':tree['sha'],'parents':[expected_head]})
          current_ref=gh_json([f'repos/{repo}/git/ref/heads/{branch}'])['object']['sha']
          if current_ref!=expected_head:
              raise SystemExit('Mirror branch moved during AEAT visual materialization')
          gh_json(['--method','PATCH',f'repos/{repo}/git/refs/heads/{branch}'],{
              'sha':commit['sha'],'force':False})
          receipt={
              'status':'EXACT_LIVE_VERIFIED_AEAT_RICPE_MYND_SEMANTIC_VISUAL_MATERIALIZED',
              'canonical_gitlab_main':source_sha,
              'canonical_gitlab_pipeline':2856131784,
              'canonical_live_verify_job':16549983937,
              'source_root':source_root,
              'branch':branch,
              'prior_head':expected_head,
              'new_head':commit['sha'],
              'asset_id':'visual.aeat-ricpe-mynd-accountability-20260916.es',
              'source_raster_copied':False,
              'files':receipt_rows,
          }
          Path('/tmp/pd-release-controller/materialize-aeat-visual.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
          served_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
          receipt_head="$(python3 -c 'import json; print(json.load(open("/tmp/pd-release-controller/materialize-aeat-visual.json"))["new_head"])')"
          test "$served_head" = "$receipt_head" || { echo "Branch head mismatch after AEAT visual materialization" >&2; exit 1; }
      - name: Process authenticated exact-SHA permit or recovery; never merge main
        if: ${{ !startsWith(github.event.comment.body, '/pd-release materialize-cajasiete ') && !startsWith(github.event.comment.body, '/pd-release materialize-cnmv-cajasiete ') && !startsWith(github.event.comment.body, '/pd-release materialize-aeat-visual ') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pd_release_controller.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: publication-controller-${{ github.run_id }}
          path: /tmp/pd-release-controller/
          if-no-files-found: warn
          retention-days: 30
