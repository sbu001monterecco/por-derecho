name: Bounded homepage completion acceptance 20260925
on:
  push:
    branches: [maintenance/homepage-refinement-authoring-20260925]
    paths: ['.maintenance-homepage/**', '.github/workflows/homepage-refinement-authoring-20260925.yml']
permissions:
  contents: read
concurrency:
  group: homepage-refinement-authoring-20260925
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 230cd172f17f3cd8db0c18e6b07d63bda7f40b7a
          path: site
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the exact committed candidate; do not mutate any repository ref
        shell: bash
        env:
          GITHUB_BASE_SHA: 7bd0def057efa6ddf531d80c673c75030fc9f647
          GITHUB_HEAD_SHA: 230cd172f17f3cd8db0c18e6b07d63bda7f40b7a
        run: |
          set -euo pipefail
          mkdir -p review/source
          cd site
          test "$(git rev-parse HEAD)" = "$GITHUB_HEAD_SHA"
          git diff --check "$GITHUB_BASE_SHA" HEAD
          git diff --binary "$GITHUB_BASE_SHA" HEAD > ../review/candidate.patch
          git diff --name-only "$GITHUB_BASE_SHA" HEAD > ../review/changed-paths.txt
          git rev-parse HEAD > ../review/tested-sha.txt
          while IFS= read -r path; do
            mkdir -p "../review/source/$(dirname "$path")"
            cp "$path" "../review/source/$path"
          done < ../review/changed-paths.txt
          python3 scripts/validate_repository_preservation.py | tee ../review/preservation.log
          python3 scripts/validate_publication_integrity.py | tee ../review/publication.log
          python3 scripts/validate_audience_experience.py | tee ../review/audience.log
          python3 scripts/validate_cam_creditor_control_criminal_lead.py | tee ../review/attribution.log
          for path in assets/audience-experience-order-20260823.js assets/optimum-reader-journey-finish-20260818.js assets/unitary-public-shell-20260818.js assets/matkator-asset-rights-inbound-20260902.js; do node --check "$path"; done
      - name: Install bounded browser-test dependency
        run: python3 -m pip install --quiet playwright==1.55.0
      - name: Strengthen existing browser acceptance with real keyboard input and runtime error checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.maintenance-homepage/browser.py');s=p.read_text()
          old="page = context.new_page(); page.set_default_timeout(20000)"
          new=old+'\n'+' '*16+"page_errors = []"+'\n'+' '*16+"page.on('pageerror', lambda e: page_errors.append(str(e)))"
          assert old in s;s=s.replace(old,new)
          old="search.locator('input').fill('Acosta')"
          added=["assert search.locator('input').input_value() == 'Acosta', 'Real input lost text'", "assert search.locator('input').evaluate('(e)=>document.activeElement===e'), 'Search loses keyboard focus'", "search.locator('input').fill('')", "search.locator('input').press_sequentially('Acosta', delay=100)", "page.wait_for_timeout(300)", "assert search.locator('input').input_value() == 'Acosta', 'Sequential typing was interrupted'", "assert search.locator('input').evaluate('(e)=>document.activeElement===e'), 'Typed query lost focus'"]
          new='\n'.join([old]+[' '*24+x for x in added])
          assert old in s;s=s.replace(old,new)
          old="row.update(private_cards=5, institution_cards=2, scope_visible=True, navigation_preserved=True, required_images_loaded=True)"
          new="assert not page_errors, 'Uncaught runtime errors: ' + '; '.join(page_errors)"+'\n'+' '*20+old+'\n'+' '*20+"row['search_typing_and_focus'] = 'PASS' if js else 'NOT_APPLICABLE'"+'\n'+' '*20+"row['runtime_errors'] = page_errors"
          assert old in s;s=s.replace(old,new)
          compile(s,str(p),'exec')
          p.write_text(s);Path('review/acceptance-browser.py').write_text(s)
          PY
      - name: Render all sixteen cases with real typing after legacy scripts settle
        run: python3 .maintenance-homepage/browser.py "$GITHUB_WORKSPACE/site" "$GITHUB_WORKSPACE/review"
      - name: Preserve exact acceptance inputs and outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: homepage-refinement-completion-review
          path: review
          retention-days: 14
