name: Bounded homepage query-reset trace
on:
  push:
    branches: [maintenance/homepage-refinement-authoring-20260925]
    paths: ['.maintenance-homepage/**', '.github/workflows/homepage-refinement-authoring-20260925.yml']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b08bf1071e35ad74429877588b86a3a0f3391377
          persist-credentials: false
      - run: python3 -m pip install --quiet playwright==1.55.0
      - name: Trace only; no release acceptance or source mutation
        run: |
          mkdir -p review
          python3 - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from functools import partial
          import tempfile,threading,shutil,json
          root=Path('.').resolve();serve=Path(tempfile.mkdtemp());(serve/'por-derecho').symlink_to(root,target_is_directory=True)
          class Q(SimpleHTTPRequestHandler):
              def log_message(self,*a):pass
          server=ThreadingHTTPServer(('127.0.0.1',8765),partial(Q,directory=str(serve)));threading.Thread(target=server.serve_forever,daemon=True).start()
          init=r'''window.trace=[];const d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');Object.defineProperty(HTMLInputElement.prototype,'value',{...d,set(v){if(this.id==='canonical-home-search-input')window.trace.push({kind:'set',value:v,stack:new Error().stack,time:performance.now()});d.set.call(this,v);}});for(const type of ['focusin','focusout','input','change'])document.addEventListener(type,e=>{if(e.target.id==='canonical-home-search-input')window.trace.push({kind:type,value:e.target.value,active:document.activeElement?.id,time:performance.now()});},true);for(const name of ['appendChild','insertBefore','removeChild']){const old=Node.prototype[name];Node.prototype[name]=function(...args){const a=document.activeElement;if(a?.id==='canonical-home-search-input'&&args.some(n=>n instanceof Node&&(n===a||n.contains?.(a))))window.trace.push({kind:name,stack:new Error().stack,time:performance.now()});return old.apply(this,args);};}'''
          rows=[]
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True,executable_path=shutil.which('google-chrome'),args=['--no-sandbox'])
              for attempt in range(3):
                  c=b.new_context(viewport={'width':390,'height':900});c.add_init_script(init);page=c.new_page();errors=[];page.on('pageerror',lambda e:errors.append(e.stack))
                  page.route('**/*',lambda r:r.continue_() if r.request.url.startswith('http://127.0.0.1:8765/') else r.abort());page.goto('http://127.0.0.1:8765/por-derecho/en/',wait_until='load');page.wait_for_timeout(11000)
                  page.wait_for_function('window.PorDerechoCanonicalSearch?.count>0');i=page.locator('#canonical-home-search-input');i.fill('Acosta');page.wait_for_timeout(1000)
                  filled={'value':i.input_value(),'results':page.locator('.canonical-search-result').count()}
                  i.click();i.press('ControlOrMeta+A');i.press_sequentially('Acosta',delay=100);page.wait_for_timeout(1000)
                  row={'attempt':attempt,'filled':filled,'typed':{'value':i.input_value(),'results':page.locator('.canonical-search-result').count()},'trace':page.evaluate('window.trace'),'errors':errors};rows.append(row);print(json.dumps(row),flush=True);c.close()
              b.close()
          server.shutdown();Path('review/query-reset-trace.json').write_text(json.dumps(rows,indent=2))
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: homepage-query-reset-trace
          path: review
          retention-days: 14
