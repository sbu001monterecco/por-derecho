  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unitary-enterprise-attribution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate all eighteen real attribution blocks (read only)
        run: |
          python3 scripts/sync_unitary_enterprise_attribution_20260826.py
          git diff --exit-code

      - name: Validate attributed-enterprise and manifest controls
        run: python3 scripts/validate_unitary_enterprise_attribution.py

      - name: Validate synchronized specialist state
        run: python3 scripts/validate_unitary_control_plane.py

      - name: Verify deployed exact blocks and machine boundaries
        if: github.event_name != 'pull_request'
        env:
          BASE: https://sbu001monterecco.github.io/por-derecho
        shell: python
        run: |
          import json
          import os
          import time
          import urllib.request

          base = os.environ['BASE'].rstrip('/')
          with open('assets/data/material-updates-v1.json', encoding='utf-8') as stream:
              source_material_updates = json.load(stream)
          expected_material_date = source_material_updates.get('latest_material_date')
          if not isinstance(expected_material_date, str) or len(expected_material_date) != 10:
              raise SystemExit('Canonical latest_material_date is missing or malformed')
          expected_public_parity = f'{expected_material_date}_LIVE_VERIFIED'
          en = 'Gil Marer and Aweswell allege one continuing economic-criminal enterprise, advanced through successive adoption and divided functions.'
          es = 'Gil Marer y Aweswell alegan una sola empresa continuada de criminalidad económica, desarrollada mediante adopción sucesiva y división de funciones.'
          en_time = 'This is only a factual allegation of connection: it does not characterise the conduct as a continuing or permanent offence or alter completion, any participation window or limitation period for any specific offence.'
          es_time = 'Esta es solo una alegación fáctica de conexión: no califica los hechos como delito continuado o permanente ni altera la consumación, la ventana de participación o la prescripción de ningún delito concreto.'
          en_boundary = [en, en_time, '570 bis', '570 ter', 'original pact', 'any person’s participation or guilt', 'not a judicial finding']
          es_boundary = [es, es_time, '570 bis', '570 ter', 'pacto originario', 'la participación de persona alguna ni culpabilidad', 'hallazgo judicial']

          targets = {}
          for route in (
              '/en/',
              '/en/unitary-criminal-evidence-map/',
              '/en/unitary-criminal-reverse-engineering/',
              '/en/sun-park-criminal-engineering-investigation/',
              '/en/unitary-record/',
              '/en/updates/',
              '/en/updates/feed.xml',
          ):
              targets[route] = en_boundary
          for route in (
              '/es/',
              '/es/mapa-probatorio-penal-unitario/',
              '/es/ingenieria-inversa-criminal-unitaria/',
              '/es/ingenieria-forense-criminal-sun-park/',
              '/es/registro-unitario/',
              '/es/actualizaciones/',
              '/es/actualizaciones/feed.xml',
          ):
              targets[route] = es_boundary
          targets['/assets/prosecution-public-entry-20260821.js'] = en_boundary + es_boundary
          targets['/assets/criminal-engineering-investigation-20260819.js'] = en_boundary + es_boundary
          targets['/assets/data/material-updates-v1.json'] = ['ALG-ENT-018', '2026-08-26', 'manifest', 'adds no evidential support']
          targets['/archive/POR_DERECHO_UNITARY_CRIMINAL_ENTERPRISE_POSITION_AND_RDM_MANIFEST_ADDENDUM_26AUG2026.md'] = [
              'ALG-ENT-018', 'one continuing economic-criminal enterprise', 'successive adoption and divided functions',
              'CP 570 bis', 'CP 570 ter', 'adds **no evidential support to `ALG-ENT-018`**', 'NOT YET TESTABLE FROM MANIFEST',
          ]
          targets['/archive/prompts/RDM_PRIVATE_MAILBOX_UNITARY_CRIMINAL_ENTERPRISE_ANALYSIS_PROMPT_26AUG2026.md'] = [
              'MANIFEST-ONLY PHASE A', 'NATIVE PHASE B OPEN', 'ALG-ENT-018', 'NOT YET TESTABLE FROM MANIFEST',
          ]

          def fetch(route, attempt):
              url = f"{base}{route}{'&' if '?' in route else '?'}pdue={int(time.time())}-{attempt}"
              request = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'por-derecho-unitary-enterprise-verifier/1.0',
                      'Cache-Control': 'no-cache',
                      'Pragma': 'no-cache',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f'HTTP {response.status}')
                  return response.read().decode('utf-8', errors='replace')

          failures = []
          for route, markers in targets.items():
              last = ''
              for attempt in range(1, 19):
                  try:
                      body = fetch(route, attempt)
                      lowered = body.lower()
                      missing = [marker for marker in markers if marker.lower() not in lowered]
                      if not missing:
                          print(f'LIVE VERIFIED {route} :: {len(body.encode("utf-8"))} bytes :: {len(markers)} markers')
                          break
                      last = f'missing {missing}'
                  except Exception as exc:
                      last = repr(exc)
                  time.sleep(10)
              else:
                  failures.append(f'{route}: {last}')

          state_route = '/ops/CURRENT_UNITARY_STATE.json'
          manifest_route = '/publication-manifests/unitary-enterprise-rdm-manifest-analysis-20260826.json'
          merge_sha = '77e2ba300af45a953947160af63283a64512e876'
          tree_sha = '4f0ac26c5548ae44c68933306c68165cbb6c973e'

          def valid_state(value):
              repository = value.get('repository', {})
              material = value.get('material_updates', {})
              promoted = value.get('promoted_material_publication', {})
              publication = value.get('publication', {})
              pages = publication.get('last_pages_deployment', {})
              readback = publication.get('current_sha_edge_readback', {})
              return (
                  value.get('control_id') == 'PD-UNITARY-STATE-20260826-01'
                  and value.get('status') == 'LIVE_VERIFIED'
                  and repository.get('source_publication_merge_sha') == merge_sha
                  and repository.get('verified_tree_sha') == tree_sha
                  and promoted.get('control_id') == 'PD-UNITARY-STATE-20260826-01'
                  and promoted.get('state') == 'LIVE_VERIFIED'
                  and promoted.get('publication_merge_sha') == merge_sha
                  and promoted.get('publication_tree_sha') == tree_sha
                  and promoted.get('pages_run_id') == 32942972472
                  and promoted.get('live_verification_run_id') == 32942975508
                  and promoted.get('live_verification_job_id') == 98097657687
                  and material.get('latest_material_date') == expected_material_date
                  and material.get('repository_latest_material_date') == expected_material_date
                  and material.get('last_live_verified_material_date') == expected_material_date
                  and material.get('public_parity') == expected_public_parity
                  and pages.get('sha') == merge_sha
                  and pages.get('tree_sha') == tree_sha
                  and pages.get('run_id') == 32942972472
                  and pages.get('run_number') == 1128
                  and pages.get('completed_at') == '2026-08-26T07:29:45Z'
                  and readback.get('state') == 'LIVE_VERIFIED'
                  and readback.get('workflow_run_id') == 32942975508
                  and readback.get('workflow_run_number') == 4
                  and readback.get('job_id') == 98097657687
                  and readback.get('head_sha') == merge_sha
                  and readback.get('tree_sha') == tree_sha
                  and readback.get('completed_at') == '2026-08-26T07:29:55Z'
                  and readback.get('verified_url_count') == 21
                  and len(publication.get('live_urls', [])) == 21
              )

          def valid_manifest(value):
              allegation = value.get('controlling_allegation', {})
              deployment = value.get('deployment_evidence', {})
              readback = value.get('live_verification_evidence', {})
              private_source = value.get('private_source', {})
              return (
                  value.get('control_id') == 'PD-UNITARY-STATE-20260826-01'
                  and value.get('current_state') == 'LIVE_VERIFIED'
                  and value.get('status') == 'live_verified'
                  and value.get('publication_merge_sha') == merge_sha
                  and value.get('publication_tree_sha') == tree_sha
                  and value.get('pages_run_id') == 32942972472
                  and value.get('live_verification') == 'passed_exact_no_cache'
                  and deployment.get('pages_run_id') == 32942972472
                  and deployment.get('pages_run_number') == 1128
                  and deployment.get('head_sha') == merge_sha
                  and deployment.get('tree_sha') == tree_sha
                  and deployment.get('completed_at') == '2026-08-26T07:29:45Z'
                  and readback.get('workflow_run_id') == 32942975508
                  and readback.get('workflow_run_number') == 4
                  and readback.get('job_id') == 98097657687
                  and readback.get('head_sha') == merge_sha
                  and readback.get('tree_sha') == tree_sha
                  and readback.get('completed_at') == '2026-08-26T07:29:55Z'
                  and readback.get('verified_url_count') == 21
                  and len(value.get('live_urls', [])) == 21
                  and allegation.get('not_a_finding') is True
                  and allegation.get('independent_of_rdm_manifest') is True
                  and allegation.get('rdm_manifest_evidential_support') == 'NONE_UNTIL_RELEVANT_NATIVES_ARE_ACQUIRED_AUTHENTICATED_AND_TESTED'
                  and private_source.get('phase_b') == 'NATIVE_EMAIL_ATTACHMENT_AND_DRIVE_ACQUISITION_AND_ANALYSIS_OPEN'
              )

          for route, validator in (
              (state_route, valid_state),
              (manifest_route, valid_manifest),
          ):
              last = ''
              for attempt in range(1, 19):
                  try:
                      value = json.loads(fetch(route, attempt))
                      if validator(value):
                          print(f'LIVE VERIFIED {route} :: structured JSON')
                          break
                      last = 'structured boundary mismatch'
                  except Exception as exc:
                      last = repr(exc)
                  time.sleep(10)
              else:
                  failures.append(f'{route}: {last}')

          if failures:
              raise SystemExit('UNITARY ENTERPRISE LIVE VERIFICATION FAILED\n - ' + '\n - '.join(failures))

      - name: Summary
        if: always()
        run: |
          {
            echo '## Unitary enterprise attribution verification'
            echo
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- SHA: $GITHUB_SHA"
            echo '- Source gate: 18 exact same-block ES/EN attributions, read only.'
            echo '- Allegation: `ALG-ENT-018`; `ALG-ORG-011` remains retired.'
            echo '- State: `PD-UNITARY-STATE-20260826-01 / LIVE_VERIFIED` at exact merge, Pages run and no-cache verifier evidence.'
            if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
              echo '- Public edge readback is reserved for the post-merge main push.'
            else
              echo '- Public ES/EN routes, feeds, runtime assets, controls and structured machine records were read back without cache.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
