name: Puzzle controlled derivative staging
on:
  push:
    branches: ['worker/puzzle-repair-verification-20260905-b']
    paths: ['.github/workflows/puzzle-controlled-derivatives-20260905.yml']
permissions:
  contents: read
concurrency:
  group: puzzle-controlled-derivatives-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stage-authorised-source-derivatives:
    if: github.repository == 'sbu001monterecco/por-derecho' && github.ref == 'refs/heads/worker/puzzle-repair-verification-20260905-b'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned source renderer
        run: python -m pip install PyMuPDF==1.26.7 Pillow==11.3.0
      - name: Verify exact archival master and generate complete page derivatives
        run: |
          python scripts/build_puzzle_derivatives_20260905.py --source assets/docs/puzzle/PUZZLE-2024-original.pdf --root /tmp/puzzle-derivatives
      - name: Stage only authorised derivative Git objects for manual integration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, time, urllib.request
          root=pathlib.Path('/tmp/puzzle-derivatives')
          assert os.environ['GITHUB_REPOSITORY']=='sbu001monterecco/por-derecho'
          assert os.environ['GITHUB_REF']=='refs/heads/worker/puzzle-repair-verification-20260905-b'
          manifest=root/'data/puzzle/puzzle-assets-20260905.json'
          data=json.loads(manifest.read_text())
          assert data['source_sha256']=='e441bdb368c0092d5b15ca5ee911eeac266540bde54817e424f3075f4c5fdd47'
          paths=[a['path'] for a in data['assets'] if a['role']!='archival_master']+[p[k] for p in data['pages'] for k in ['path','preview']]+['data/puzzle/puzzle-assets-20260905.json']
          assert len(paths)==68 and len(set(paths))==68
          entries=[]
          for path in paths:
              assert path.startswith('assets/docs/puzzle/') or path=='data/puzzle/puzzle-assets-20260905.json'
              payload=(root/path).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(payload)).encode()+b'\0'+payload).hexdigest()
              body=json.dumps({'content':base64.b64encode(payload).decode(),'encoding':'base64'}).encode()
              request=urllib.request.Request('https://api.github.com/repos/sbu001monterecco/por-derecho/git/blobs',data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'Por-Derecho-controlled-source-renderer','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=180) as response: result=json.load(response)
              assert result['sha']==expected, 'Git object identity mismatch'
              item={'path':path,'mode':'100644','type':'blob','sha':result['sha']}
              entries.append(item)
              print('STAGED',path,result['sha'],len(payload),hashlib.sha256(payload).hexdigest(),flush=True)
              time.sleep(.1)
          staging={'source_commit':os.environ['GITHUB_SHA'],'source_sha256':data['source_sha256'],'action':'Created unreferenced Git blobs only. No branch ref, PR, main, deployment or source original changed. Active integrator must review and attach selected objects before publication.','tree_elements':entries}
          (root/'staged-git-objects.json').write_text(json.dumps(staging,indent=2)+'\n')
          print('STAGING COMPLETE',json.dumps(staging))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puzzle-controlled-source-derivatives
          path: /tmp/puzzle-derivatives
          retention-days: 7
