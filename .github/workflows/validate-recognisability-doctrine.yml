name: Validate evidential recognisability doctrine

on:
  pull_request:
    paths:
      - 'archive/POR_DERECHO_EVIDENTIAL_RECOGNISABILITY_RELATIONSHIP_PRESERVATION_PROTOCOL_21AUG2026.md'
      - 'research/por-derecho/second-pair-of-eyes/recognisability-overlay.md'
      - 'research/por-derecho/foundation-stage-2/04_FRAGMENTED_TRUTH_BREADTH_PARADOX_SYNTHETIC_CASE_21AUG2026.md'
      - 'en/por-derecho/research-and-training/fragmented-truth/**'
      - 'es/por-derecho/investigacion-y-formacion/verdad-fragmentada/**'
      - '.github/workflows/validate-recognisability-doctrine.yml'
  push:
    branches: [main]
    paths:
      - 'archive/POR_DERECHO_EVIDENTIAL_RECOGNISABILITY_RELATIONSHIP_PRESERVATION_PROTOCOL_21AUG2026.md'
      - 'research/por-derecho/second-pair-of-eyes/recognisability-overlay.md'
      - 'research/por-derecho/foundation-stage-2/04_FRAGMENTED_TRUTH_BREADTH_PARADOX_SYNTHETIC_CASE_21AUG2026.md'
      - 'en/por-derecho/research-and-training/fragmented-truth/**'
      - 'es/por-derecho/investigacion-y-formacion/verdad-fragmentada/**'
      - '.github/workflows/validate-recognisability-doctrine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check canonical doctrine and locked methodology
        shell: bash
        run: |
          set -euo pipefail
          protocol='archive/POR_DERECHO_EVIDENTIAL_RECOGNISABILITY_RELATIONSHIP_PRESERVATION_PROTOCOL_21AUG2026.md'
          overlay='research/por-derecho/second-pair-of-eyes/recognisability-overlay.md'
          synthetic='research/por-derecho/foundation-stage-2/04_FRAGMENTED_TRUTH_BREADTH_PARADOX_SYNTHETIC_CASE_21AUG2026.md'
          en='en/por-derecho/research-and-training/fragmented-truth/index.html'
          es='es/por-derecho/investigacion-y-formacion/verdad-fragmentada/index.html'

          test -s "$protocol"
          test -s "$overlay"
          test -s "$synthetic"
          test -s "$en"
          test -s "$es"

          grep -Fq 'Separate responsibility. Integrate evidence.' "$protocol"
          grep -Fq 'The whole can be too broad to investigate. The pieces can be too small to reveal the whole.' "$protocol"
          grep -Fq 'do **not** add a seventh core check' "$protocol"
          grep -Fq 'Source → Authority → Perimeter → Contradiction → Consequence → Reversibility' "$overlay"
          grep -Fq 'The method must be capable of clearing the concern.' "$overlay"
          grep -Fq 'F5 — possible coordinated fragmentation requiring investigation' "$synthetic"
          grep -Fq 'no live-matter data' "$synthetic"

      - name: Check bilingual public boundaries and reciprocity
        shell: bash
        run: |
          set -euo pipefail
          en='en/por-derecho/research-and-training/fragmented-truth/index.html'
          es='es/por-derecho/investigacion-y-formacion/verdad-fragmentada/index.html'

          grep -Fq 'Initiative in formation' "$en"
          grep -Fq 'independent review not yet performed' "$en"
          grep -Fq 'No seventh check.' "$en"
          grep -Fq '/es/por-derecho/investigacion-y-formacion/verdad-fragmentada/' "$en"

          grep -Fq 'Iniciativa en formación' "$es"
          grep -Fq 'revisión independiente aún no realizada' "$es"
          grep -Fq 'No hay una séptima comprobación.' "$es"
          grep -Fq '/en/por-derecho/research-and-training/fragmented-truth/' "$es"

          ! grep -Eiq 'institutional adoption confirmed|adopted by|endorsed by|fundación constituida|foundation registered' "$en" "$es"
