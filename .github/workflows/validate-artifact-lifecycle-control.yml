name: Validate artifact lifecycle control

on:
  pull_request:
    paths:
      - '.github/governance/ARTIFACT_LIFECYCLE_CROSS_SURFACE_RECONCILIATION_07OCT2026.md'
      - 'assets/data/artifact-lifecycle-cross-surface-v1.json'
      - 'scripts/validate_artifact_lifecycle_cross_surface.py'
      - 'AGENTS.md'
      - 'CHATGPT_START_HERE.md'
      - '.github/workflows/validate-artifact-lifecycle-control.yml'
  push:
    branches: [main]
    paths:
      - '.github/governance/ARTIFACT_LIFECYCLE_CROSS_SURFACE_RECONCILIATION_07OCT2026.md'
      - 'assets/data/artifact-lifecycle-cross-surface-v1.json'
      - 'scripts/validate_artifact_lifecycle_cross_surface.py'
      - 'AGENTS.md'
      - 'CHATGPT_START_HERE.md'
      - '.github/workflows/validate-artifact-lifecycle-control.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'
      - run: python scripts/validate_artifact_lifecycle_cross_surface.py
