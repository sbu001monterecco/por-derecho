name: Verify Monte Lanza 2012 accounts live publication

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/documents/montelanza-accounts-2012/**'
      - 'es/cuentas-monte-lanza-2012/**'
      - 'en/monte-lanza-2012-accounts/**'
      - 'es/montelanza-cuentas-2008/**'
      - 'en/montelanza-accounts-2008/**'
      - 'scripts/verify_montelanza_2012_accounts_live.py'
      - '.github/workflows/verify-montelanza-2012-accounts-live.yml'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Wait for Pages propagation
        run: sleep 30
      - name: Verify bilingual pages, reciprocal links and PDF hash
        run: python scripts/verify_montelanza_2012_accounts_live.py
