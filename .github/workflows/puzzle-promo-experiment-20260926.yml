name: Puzzle floating promo experiment 20260926

on:
  push:
    branches:
      - experiment/puzzle-floating-promo-20260926
    paths:
      - 'assets/puzzle-promo-experiment-20260926.js'
      - 'scripts/check_puzzle_promo_experiment_20260926.py'
      - 'en/insolvency-36-2012-ac-opposition-lpb-appeal-september-2026/index.html'
      - 'es/concurso-36-2012-oposicion-ac-apelacion-lpb-septiembre-2026/index.html'
      - 'en/estate-payment-counsel-independence/index.html'
      - 'es/pago-masa-independencia-defensa/index.html'
      - '.github/workflows/puzzle-promo-experiment-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: puzzle-promo-experiment-20260926-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install browser runtime
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Run isolated cross-browser and responsive experiment
        run: |
          python scripts/check_puzzle_promo_experiment_20260926.py \
            --root . \
            --output artifacts/puzzle-promo-experiment-20260926
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: puzzle-promo-experiment-20260926-${{ github.run_id }}
          path: artifacts/puzzle-promo-experiment-20260926/
          retention-days: 14
