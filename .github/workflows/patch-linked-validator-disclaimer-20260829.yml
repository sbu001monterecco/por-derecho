name: Patch linked validator disclaimer 20260829

on:
  push:
    branches:
      - fix/concurso36-continuity-truth-20260829
    paths:
      - .github/workflows/patch-linked-validator-disclaimer-20260829.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/concurso36-continuity-truth-20260829
          fetch-depth: 0
      - name: Align exact disclaimer markers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/validate_concurso36_linked_continuity.py")
          text = path.read_text(encoding="utf-8")
          substitutions = {
              "Not located in the controlled corpus does not mean that the document does not exist.": "“Not located” means absent from the controlled corpus; it does not establish nonexistence, loss, suppression or alteration.",
              "No localizado en el corpus controlado no significa que el documento no exista.": "«No localizado» significa ausente del corpus controlado; no demuestra inexistencia, pérdida, supresión ni alteración.",
          }
          for old, new in substitutions.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected one marker to replace: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/patch-linked-validator-disclaimer-20260829.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate_concurso36_linked_continuity.py
          git commit -m "Align linked validator with controlled disclaimer wording"
          git push origin HEAD:fix/concurso36-continuity-truth-20260829
