name: Homepage canonical contract

on:
  pull_request:
    paths:
      - 'en/index.html'
      - 'es/index.html'
      - 'en/homepage-archive-20260925.html'
      - 'es/portada-archivo-20260925.html'
      - 'en/future/**'
      - 'es/futuro/**'
      - 'en/start/**'
      - 'es/inicio/**'
      - 'en/evidence/**'
      - 'es/evidencia/**'
      - 'en/recovery-command-center/**'\n      - 'es/centro-mando-recuperacion/**'\n      - 'en/por-derecho/**'\n      - 'es/por-derecho/**'\n      - 'en/updates/**'\n      - 'es/actualizaciones/**'\n      - 'en/legal-notebook/**'\n      - 'es/cuaderno-juridico/**'\n      - 'en/matter-identity-registry/**'\n      - 'es/registro-identidad-materia/**'\n      - 'en/legal-privacy/**'\n      - 'es/aviso-legal-privacidad/**'\n      - 'assets/homepage-legacy-route-20260925.js'\n      - 'ops/HOMEPAGE_CANONICAL_CONTRACT_20260925.json'
      - 'ci/homepage_canonical_contract_20260925.py'
      - '.github/workflows/homepage-canonical-contract.yml'
  push:
    branches: [main]
    paths:
      - 'en/index.html'
      - 'es/index.html'
      - 'en/homepage-archive-20260925.html'
      - 'es/portada-archivo-20260925.html'
      - 'en/future/**'
      - 'es/futuro/**'
      - 'en/start/**'
      - 'es/inicio/**'
      - 'en/evidence/**'
      - 'es/evidencia/**'
      - 'ops/HOMEPAGE_CANONICAL_CONTRACT_20260925.json'
      - 'ci/homepage_canonical_contract_20260925.py'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ci/homepage_canonical_contract_20260925.py
