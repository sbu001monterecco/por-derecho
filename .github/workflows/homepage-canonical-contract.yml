name: Homepage canonical contract

on:
  pull_request:
    paths:
      - 'en/index.html'
      - 'es/index.html'
      - 'en/future/**'
      - 'es/futuro/**'
      - 'en/homepage-archive-20260925.html'
      - 'es/portada-archivo-20260925.html'
      - 'ops/HOMEPAGE_CANONICAL_CONTRACT_20260925.json'
      - 'ci/homepage_canonical_contract_20260925.py'
  push:
    branches: [main]
    paths:
      - 'en/index.html'
      - 'es/index.html'
      - 'en/future/**'
      - 'es/futuro/**'
      - 'en/homepage-archive-20260925.html'
      - 'es/portada-archivo-20260925.html'
      - 'ops/HOMEPAGE_CANONICAL_CONTRACT_20260925.json'
      - 'ci/homepage_canonical_contract_20260925.py'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ci/homepage_canonical_contract_20260925.py
