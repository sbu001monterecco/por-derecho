name: Homepage canonical contract

on:
  pull_request:
    paths:
      - 'en/index.html'
      - 'es/index.html'
      - 'en/future/**'
      - 'es/futuro/**'
      - 'en/homepage-archive-20260925.html'
      - 'es/portada-archivo-20260925.html'
      - 'ops/HOMEPAGE_CANONICAL_CONTRACT_20260925.json'
      - 'ci/homepage_canonical_contract_20260925.py'
  push:
    branches: [main]
    paths:
      - 'en/index.html'
      - 'es/index.html'
      - 'en/future/**'
      - 'es/futuro/**'
      - 'en/homepage-archive-20260925.html'
      - 'es/portada-archivo-20260925.html'
      - 'ops/HOMEPAGE_CANONICAL_CONTRACT_20260925.json'
      - 'ci/homepage_canonical_contract_20260925.py'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python ci/homepage_canonical_contract_20260925.py
