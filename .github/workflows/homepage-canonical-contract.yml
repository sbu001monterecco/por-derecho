name: Homepage canonical contract

on:
  pull_request:
    paths:
      - 'en/index.html'
      - 'es/index.html'
      - 'en/homepage-archive-20260925.html'
      - 'es/portada-archivo-20260925.html'
      - 'en/recovery-command-center/**'
      - 'es/centro-mando-recuperacion/**'
      - 'en/future/**'
      - 'es/futuro/**'
      - 'en/por-derecho/**'
      - 'es/por-derecho/**'
      - 'en/evidence/**'
      - 'es/evidencia/**'
      - 'en/start/**'
      - 'es/inicio/**'
      - 'en/updates/**'
      - 'es/actualizaciones/**'
      - 'en/legal-notebook/**'
      - 'es/cuaderno-juridico/**'
      - 'en/matter-identity-registry/**'
      - 'es/registro-identidad-materia/**'
      - 'en/legal-privacy/**'
      - 'es/aviso-legal-privacidad/**'
      - 'assets/homepage-legacy-route-20260925.js'
      - 'ops/HOMEPAGE_CANONICAL_CONTRACT_20260925.json'
      - 'ci/homepage_canonical_contract_20260925.py'
      - '.github/workflows/homepage-canonical-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'en/index.html'
      - 'es/index.html'
      - 'en/homepage-archive-20260925.html'
      - 'es/portada-archivo-20260925.html'
      - 'en/recovery-command-center/**'
      - 'es/centro-mando-recuperacion/**'
      - 'en/future/**'
      - 'es/futuro/**'
      - 'en/por-derecho/**'
      - 'es/por-derecho/**'
      - 'en/evidence/**'
      - 'es/evidencia/**'
      - 'en/start/**'
      - 'es/inicio/**'
      - 'en/updates/**'
      - 'es/actualizaciones/**'
      - 'en/legal-notebook/**'
      - 'es/cuaderno-juridico/**'
      - 'en/matter-identity-registry/**'
      - 'es/registro-identidad-materia/**'
      - 'en/legal-privacy/**'
      - 'es/aviso-legal-privacidad/**'
      - 'assets/homepage-legacy-route-20260925.js'
      - 'ops/HOMEPAGE_CANONICAL_CONTRACT_20260925.json'
      - 'ci/homepage_canonical_contract_20260925.py'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ci/homepage_canonical_contract_20260925.py
