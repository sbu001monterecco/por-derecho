name: Reconcile 108 communications state
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/data/institutional-communications-register-v1.json'
      - 'scripts/reconcile_institutional_communications.py'
      - '.github/workflows/reconcile-108-20260924.yml'
permissions:
  contents: write
jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/reconcile_institutional_communications.py --apply
      - run: |
          if git diff --quiet -- assets/data/institutional-communications-register-v1.json ops/INSTITUTIONAL_COMMUNICATIONS_SCAN_CHECKPOINT.json; then exit 0; fi
          git config user.name "por-derecho-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data/institutional-communications-register-v1.json ops/INSTITUTIONAL_COMMUNICATIONS_SCAN_CHECKPOINT.json
          git commit -m "Reconcile 24 Sep institutional communications generated state"
          git push origin HEAD:${{ github.head_ref }}
