name: Validate Fiscalía proceedings interconnectivity

on:
  pull_request:
    paths:
      - 'archive/PROCEEDINGS_MASTER_REGISTER.csv'
      - 'archive/PROCEEDINGS_CASE_PRISM_V1_SEED_30AUG2026.json'
      - 'assets/data/institutional-communications-register-v1.json'
      - 'assets/data/fiscalia-proceedings-link-assertions-v1.json'
      - 'assets/data/fiscalia-proceedings-interconnectivity-v1.json'
      - 'assets/data/proceedings-case-prism-v1.json'
      - 'assets/data/proceedings-interlinkability-v1.json'
      - 'assets/fiscalia-proceedings-interconnectivity-20260831.*'
      - 'assets/master-proceedings-publication-20260830.js'
      - 'assets/proceedings-interconnectivity-map-20260830.js'
      - 'assets/site.js'
      - 'en/master-proceedings-register/index.html'
      - 'es/registro-maestro-procedimientos/index.html'
      - 'en/proceedings-map/index.html'
      - 'es/mapa-procedimientos/index.html'
      - 'en/public-prosecution-communications-proceedings/**'
      - 'es/fiscalia-comunicaciones-procedimientos/**'
      - 'scripts/build_fiscalia_proceedings_interconnectivity.py'
      - 'scripts/validate_fiscalia_proceedings_interconnectivity.py'
      - 'scripts/test_build_fiscalia_proceedings_interconnectivity.py'
      - 'scripts/smoke_fiscalia_proceedings_interconnectivity.mjs'
      - '.github/workflows/validate-fiscalia-proceedings-interconnectivity.yml'
  push:
    branches: [main]
    paths:
      - 'assets/data/fiscalia-proceedings-interconnectivity-v1.json'
      - 'scripts/validate_fiscalia_proceedings_interconnectivity.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate deterministic graph and reciprocal routes
        run: |
          python scripts/build_fiscalia_proceedings_interconnectivity.py --check
          python scripts/validate_fiscalia_proceedings_interconnectivity.py
          python -m unittest -v scripts/test_build_fiscalia_proceedings_interconnectivity.py
      - name: Validate JavaScript syntax
        run: |
          node --check assets/fiscalia-proceedings-interconnectivity-20260831.js
          node --check assets/master-proceedings-publication-20260830.js
          node --check assets/proceedings-interconnectivity-map-20260830.js
          node --check scripts/smoke_fiscalia_proceedings_interconnectivity.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.50.1
          npx playwright install --with-deps chromium
      - name: Serve the repository at its production subpath
        run: |
          mkdir -p /tmp/psr-fiscalia-site/por-derecho
          cp -a . /tmp/psr-fiscalia-site/por-derecho/
          cd /tmp/psr-fiscalia-site
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/psr-fiscalia-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/por-derecho/en/public-prosecution-communications-proceedings/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/psr-fiscalia-http.log
          exit 1
      - name: Verify bilingual interaction and reciprocal deep links
        env:
          PSR_BASE_URL: http://127.0.0.1:8000/por-derecho
        run: node scripts/smoke_fiscalia_proceedings_interconnectivity.mjs
