name: Verify criminal-engineering and case information architecture live

on:
  push:
    branches: [main]
    paths:
      - 'es/ingenieria-forense-criminal-sun-park/**'
      - 'en/sun-park-criminal-engineering-investigation/**'
      - 'es/correcciones-control-versiones/**'
      - 'en/corrections-version-control/**'
      - 'es/implementacion-notarial-protocolo-457/**'
      - 'en/notarial-implementation-protocol-457/**'
      - 'es/implementacion-registral-finca-por-finca/**'
      - 'en/land-registry-implementation-property-by-property/**'
      - 'assets/site.js'
      - 'assets/site-pre-treasury-154-hq-20260828.js'
      - 'assets/site-pre-intervencion-highlight-20260820.js'
      - 'assets/site-pre-intervencion-highlight-before-eg95-20260823.js'
      - 'assets/case-information-architecture-20260819.js'
      - 'assets/data/criminal-engineering-investigation-v1.json'
      - 'scripts/render_criminal_engineering_investigation.mjs'
      - 'publication-manifests/criminal-engineering-investigation-20260819.json'
      - 'publication-manifests/case-information-architecture-20260819.json'
      - 'sitemap-criminal-engineering.xml'
      - 'sitemap-case-governance.xml'
      - 'robots.txt'
      - '.github/workflows/verify-criminal-engineering-investigation-live.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-criminal-engineering-investigation-live
  cancel-in-progress: false

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Poll public source routes, assets and sitemaps
        id: verify_raw
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base = 'https://sbu001monterecco.github.io/por-derecho'
          source_sha = os.environ['SOURCE_SHA']
          run_id = os.environ['RUN_ID']
          query = f'source={source_sha[:12]}&run={run_id}'
          targets = {
              'es': (f'{base}/es/ingenieria-forense-criminal-sun-park/?{query}', [
                  'ALEGACIÓN CENTRAL DE POR DERECHO', 'Las ocho fases de la presunta ingeniería', 'Derecho de respuesta']),
              'en': (f'{base}/en/sun-park-criminal-engineering-investigation/?{query}', [
                  'POR DERECHO CENTRAL ALLEGATION', 'The eight phases of the alleged engineering', 'Right of response']),
              'case_module': (f'{base}/assets/case-information-architecture-20260819.js?{query}', [
                  'data-case-context-gateway', 'case-issue-register', 'LIVE_VERIFIED =']),
              'outer_loader': (f'{base}/assets/site.js?{query}', [
                  'site-pre-treasury-154-hq-20260828.js?v=20260828a',
                  'data-pre-treasury-154-site-loader']),
              'pre_treasury_loader': (f'{base}/assets/site-pre-treasury-154-hq-20260828.js?{query}', [
                  'site-pre-intervencion-highlight-20260820.js?v=20260824e',
                  'data-pre-intervencion-site-loader']),
              'case_loader_wrapper': (f'{base}/assets/site-pre-intervencion-highlight-20260820.js?{query}', [
                  'site-pre-intervencion-highlight-before-eg95-20260823.js?v=20260824e',
                  'data-pre-fiscalia-eg95-pre-intervencion-loader']),
              'case_loader': (f'{base}/assets/site-pre-intervencion-highlight-before-eg95-20260823.js?{query}', [
                  'case-information-architecture-20260819.js?v=20260819b',
                  'data-case-information-architecture-loader']),
              'data': (f'{base}/assets/data/criminal-engineering-investigation-v1.json?{query}', [
                  '"schema_version": "1.1"', '"CE-010"', '"corrections_es"', '"notary_es"', '"registry_es"']),
              'es_corrections': (f'{base}/es/correcciones-control-versiones/?{query}', [
                  'Correcciones materiales vigentes', 'Control de versiones y uso previo']),
              'en_corrections': (f'{base}/en/corrections-version-control/?{query}', [
                  'Current material corrections', 'Version control and prior use']),
              'es_notary': (f'{base}/es/implementacion-notarial-protocolo-457/?{query}', [
                  'protocolo 457', 'Defensa notarial más fuerte']),
              'en_notary': (f'{base}/en/notarial-implementation-protocol-457/?{query}', [
                  'Protocol 457', 'Strongest notarial defence']),
              'es_registry': (f'{base}/es/implementacion-registral-finca-por-finca/?{query}', [
                  'finca por finca', 'Defensa registral más fuerte']),
              'en_registry': (f'{base}/en/land-registry-implementation-property-by-property/?{query}', [
                  'property by property', 'Strongest Registry defence']),
              'criminal_sitemap': (f'{base}/sitemap-criminal-engineering.xml?{query}', [
                  '/por-derecho/es/ingenieria-forense-criminal-sun-park/', '/por-derecho/en/sun-park-criminal-engineering-investigation/']),
              'governance_sitemap': (f'{base}/sitemap-case-governance.xml?{query}', [
                  '/por-derecho/es/correcciones-control-versiones/', '/por-derecho/en/notarial-implementation-protocol-457/', '/por-derecho/es/implementacion-registral-finca-por-finca/']),
          }

          def fetch(url, attempt):
              separator = '&' if '?' in url else '?'
              cache_busted_url = f'{url}{separator}attempt={attempt}&nonce={time.time_ns()}'
              request = urllib.request.Request(cache_busted_url, headers={
                  'User-Agent': 'Por-Derecho-case-architecture-live-verifier/1.0',
                  'Cache-Control': 'no-cache',
                  'Pragma': 'no-cache',
              })
              with urllib.request.urlopen(request, timeout=25) as response:
                  return response.status, response.read().decode('utf-8', 'replace')

          last = {}
          for attempt in range(1, 37):
              checks, details = {}, {}
              for name, (url, markers) in targets.items():
                  try:
                      status, body = fetch(url, attempt)
                      marker_checks = {marker: marker in body for marker in markers}
                      checks[f'{name}_http_200'] = status == 200
                      checks[f'{name}_markers'] = all(marker_checks.values())
                      details[name] = {'status': status, 'bytes': len(body.encode('utf-8')), 'markers': marker_checks}
                  except Exception as exc:
                      checks[f'{name}_http_200'] = False
                      checks[f'{name}_markers'] = False
                      details[name] = {'error': repr(exc)}
              last = {'attempt': attempt, 'source_sha': source_sha, 'run_id': run_id, 'checks': checks, 'details': details}
              print(json.dumps(last, ensure_ascii=False, indent=2))
              if all(checks.values()):
                  with open('/tmp/criminal-engineering-live-source.json', 'w', encoding='utf-8') as handle:
                      json.dump({'status': 'SOURCE_LIVE_VERIFIED', **last}, handle, ensure_ascii=False, indent=2)
                  raise SystemExit(0)
              time.sleep(5)

          with open('/tmp/criminal-engineering-live-source.json', 'w', encoding='utf-8') as handle:
              json.dump({'status': 'SOURCE_NOT_VERIFIED', **last}, handle, ensure_ascii=False, indent=2)
          raise SystemExit(1)
          PY
      - name: Use preinstalled Chrome with Playwright
        run: |
          npm install --no-save playwright@1.50.1
          BROWSER_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER_PATH" ]; then
            echo "No preinstalled Chrome/Chromium found" >&2
            exit 1
          fi
          echo "PSR_BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          "$BROWSER_PATH" --version
      - name: Verify rendered public DOM, CE tracker and compact contexts
        id: verify_dom
        continue-on-error: true
        env:
          PSR_BASE_URL: https://sbu001monterecco.github.io/por-derecho
          PSR_CRIMINAL_ENGINEERING_ARTIFACT_DIR: artifacts/criminal-engineering-live
        run: node scripts/render_criminal_engineering_investigation.mjs
      - name: Show verification evidence
        if: always()
        run: |
          cat /tmp/criminal-engineering-live-source.json || true
          cat artifacts/criminal-engineering-live/result.json || true
      - name: Publish persistent commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_OUTCOME: ${{ steps.verify_raw.outcome }}
          DOM_OUTCOME: ${{ steps.verify_dom.outcome }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['SOURCE_SHA']
          run_id = os.environ['RUN_ID']
          success = os.environ['RAW_OUTCOME'] == 'success' and os.environ['DOM_OUTCOME'] == 'success'
          payload = {
              'state': 'success' if success else 'failure',
              'target_url': f'https://github.com/{repository}/actions/runs/{run_id}',
              'description': 'Case information architecture verified live' if success else 'Case information architecture live verification failed',
              'context': 'pages-propagation/case-information-architecture',
          }
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/statuses/{sha}',
              data=json.dumps(payload).encode('utf-8'),
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'Por-Derecho-case-architecture-live-verifier/1.0',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.read().decode('utf-8', 'replace'))
          PY
      - name: Fail when public-edge verification did not succeed
        if: steps.verify_raw.outcome != 'success' || steps.verify_dom.outcome != 'success'
        run: exit 1
