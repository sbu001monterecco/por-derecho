name: Prepare final CI rules candidate
on:
  push:
    branches: [integration/ci-rules-open-work-20260905]
    paths: ['.github/workflows/prepare-ci-rules-finish.yml']
permissions:
  contents: read
concurrency:
  group: prepare-ci-rules-finish
  cancel-in-progress: true
jobs:
  prepare:
    if: github.ref == 'refs/heads/integration/ci-rules-open-work-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Apply exact reviewed transformations and export validated Git blobs only
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_BASE_SHA: 090a678ad53cd9216e673b0cfc643cd084e5286c
          GITHUB_HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import concurrent.futures,json,os,pathlib,subprocess,urllib.request
          root=pathlib.Path.cwd();out=pathlib.Path('/tmp/ci-control-plane');out.mkdir(exist_ok=True)
          api='https://api.github.com/repos/sbu001monterecco/por-derecho/'
          def request(path,data=None):
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
              req=urllib.request.Request(api+path,headers=headers,data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          base=os.environ['GITHUB_BASE_SHA']
          assert request('git/ref/heads/main')['object']['sha']==base,'Main advanced; rebase/review first'
          edits=json.loads(pathlib.Path('.github/ci-final-edits.json').read_text())
          changed=set()
          for row in edits:
              path=pathlib.Path(row['path']);assert not path.is_absolute() and '..' not in path.parts
              text=path.read_text();assert text.count(row['old'])==1,(row['path'],'exact edit anchor changed')
              path.write_text(text.replace(row['old'],row['new'],1));changed.add(row['path'])
          for name in ('.github/ci-final-edits.json','.github/workflows/prepare-ci-rules-finish.yml'):
              pathlib.Path(name).unlink();changed.add(name)
          assert pathlib.Path('es/por-derecho/como-funciona/index.html').is_file()
          subprocess.run(['git','diff','--check'],check=True)
          assert not subprocess.check_output(['git','diff',base,'--','assets/data','publication-manifests','evidence','archive']), 'Canonical evidence or immutable history changed'
          result=subprocess.run(['python3','scripts/validate_ci_control_plane.py'],capture_output=True,text=True)
          print('ACCEPTANCE_EXIT',result.returncode);print(result.stdout[-15000:]);print(result.stderr[-2000:])
          (out/'combined.log').write_text(result.stdout+result.stderr)
          def blob(path):
              element={'path':path,'mode':'100644','type':'blob'}
              p=pathlib.Path(path)
              if not p.exists():return {**element,'sha':None}
              return {**element,'sha':request('git/blobs',{'content':p.read_text(),'encoding':'utf-8'})['sha']}
          elements=list(concurrent.futures.ThreadPoolExecutor(max_workers=4).map(blob,sorted(changed)))
          assert request('git/ref/heads/main')['object']['sha']==base,'Main advanced while checking'
          obj={'state':'PREPARED_NOT_DEPLOYED','acceptance_exit':result.returncode,'parent':os.environ['GITHUB_SHA'],'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'elements':elements}
          (out/'tree.json').write_text(json.dumps(obj,indent=2));print('CANDIDATE_TREE',json.dumps(obj))
          # The runner does not create any tree, commit, ref, PR or deployment.
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ci-final-candidate
          path: /tmp/ci-control-plane/
          if-no-files-found: error
          retention-days: 14
