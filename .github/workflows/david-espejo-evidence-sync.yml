name: Validate David Espejo evidence sync

on:
  pull_request:
    paths:
      - 'es/david-espejo-perito-forense/**'
      - 'en/david-espejo-expert-witness/**'
      - 'assets/data/david-espejo-expert-evidence-v1.json'
      - 'assets/data/david-espejo-expert-evidence-v2.json'
      - 'es/cuaderno-juridico/index.html'
      - 'en/legal-notebook/index.html'
      - 'es/index.html'
      - 'en/index.html'
      - 'es/actualizaciones/index.html'
      - 'en/updates/index.html'
      - 'es/actualizaciones/feed.xml'
      - 'en/updates/feed.xml'
      - 'es/actualizaciones/david-espejo-evidencia-pericial/**'
      - 'en/updates/david-espejo-expert-evidence/**'
      - 'sitemap-david-espejo.xml'
      - 'robots.txt'
      - 'scripts/validate_david_espejo_evidence_sync.py'
      - '.github/workflows/david-espejo-evidence-sync.yml'
      - 'archive/DAVID_ESPEJO_PUBLIC_SYNC_25AUG2026.md'
  push:
    branches: [main]
    paths:
      - 'es/david-espejo-perito-forense/**'
      - 'en/david-espejo-expert-witness/**'
      - 'assets/data/david-espejo-expert-evidence-v1.json'
      - 'assets/data/david-espejo-expert-evidence-v2.json'
      - 'es/cuaderno-juridico/index.html'
      - 'en/legal-notebook/index.html'
      - 'es/index.html'
      - 'en/index.html'
      - 'es/actualizaciones/index.html'
      - 'en/updates/index.html'
      - 'es/actualizaciones/feed.xml'
      - 'en/updates/feed.xml'
      - 'es/actualizaciones/david-espejo-evidencia-pericial/**'
      - 'en/updates/david-espejo-expert-evidence/**'
      - 'sitemap-david-espejo.xml'
      - 'robots.txt'
      - 'scripts/validate_david_espejo_evidence_sync.py'
      - '.github/workflows/david-espejo-evidence-sync.yml'
      - 'archive/DAVID_ESPEJO_PUBLIC_SYNC_25AUG2026.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bilingual pages, register and discovery routes
        run: python scripts/validate_david_espejo_evidence_sync.py
