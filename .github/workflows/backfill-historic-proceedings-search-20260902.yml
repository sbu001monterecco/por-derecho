name: Backfill historic proceedings search 20260902
on:
  push:
    branches: [authority-search/historic-proceedings-search-backfill-20260902]
    paths:
      - .github/workflows/backfill-historic-proceedings-search-20260902.yml
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: authority-search/historic-proceedings-search-backfill-20260902
          fetch-depth: 0
      - name: Enrich committed proceeding pages with maximum safe contextual interlinks
        run: |
          python3 scripts/_enrich_proceeding_contextual_links_20260902.py
      - name: Reconcile static CAEPR count markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ('es/registro-identidad-materia/index.html','en/matter-identity-registry/index.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'data-static-registry-counts="\d+-\d+-\d+-\d+-\d+-\d+"', 'data-static-registry-counts="348-164-83-11-47-43"', s)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Validate key controls
        run: |
          python3 scripts/validate_canonical_home_search.py
          python3 scripts/validate_proceeding_pages_interlinks_20260902.py
          python3 scripts/validate_proceeding_contextual_links_20260902.py
          python3 scripts/validate_operational_truth.py
          python3 scripts/validate_current_reverse_engineered_digest.py
          python3 scripts/validate_dp3205_2014_publication.py
      - name: Commit contextual interlink release
        run: |
          git config user.name por-derecho-governance-bot
          git config user.email sbu001monterecco@users.noreply.github.com
          git add assets/data/proceeding-interlink-graph-20260902.json \
            es/procedimientos en/proceedings \
            es/registro-identidad-materia/index.html \
            en/matter-identity-registry/index.html
          git commit -m "Expand proceeding pages with contextual reciprocal navigation" || exit 0
          git push origin HEAD:authority-search/historic-proceedings-search-backfill-20260902
