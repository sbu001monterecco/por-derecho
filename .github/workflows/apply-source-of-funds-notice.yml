name: Apply source-of-funds notice

on:
  push:
    branches:
      - codex/source-of-funds-notice-20260820
    paths:
      - scripts/apply-source-of-funds-notice.py
      - .github/workflows/apply-source-of-funds-notice.yml

permissions:
  contents: write

jobs:
  generate:
    if: >-
      !contains(github.event.head_commit.message, '[source notice generated]') &&
      !contains(github.event.head_commit.message, '[remove generator workflow]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate publication changes
        run: python scripts/apply-source-of-funds-notice.py
      - name: Commit generated site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Publish source-of-funds notice [source notice generated]"
          git push
