name: Materialize DIP 80 open-kimono casebook

on:
  push:
    branches:
      - agent/dip80-open-kimono-casebook-completion
  pull_request:
    branches:
      - main
    paths:
      - archive/dip80-open-kimono-payload/**
      - .github/workflows/materialize-dip80-open-kimono.yml

permissions:
  contents: write

concurrency:
  group: dip80-open-kimono-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message || '', '[materialized]') }}
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
      PAYLOAD_SHA256: 685a0ffcf010c26a871deeaf5ff8dd98610003d377a38ad15f33a4d2b86dc5eb
    steps:
      - name: Check out controlled branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Reassemble and verify controlled source payload
        shell: bash
        run: |
          set -euo pipefail
          test -d archive/dip80-open-kimono-payload
          find archive/dip80-open-kimono-payload -maxdepth 1 -type f -name 'part-*.b64' -print | sort > /tmp/dip80-parts.txt
          test "$(wc -l < /tmp/dip80-parts.txt)" -eq 9
          xargs cat < /tmp/dip80-parts.txt > /tmp/dip80-payload.b64
          base64 --decode /tmp/dip80-payload.b64 > /tmp/dip80-open-kimono.tar.gz
          echo "${PAYLOAD_SHA256}  /tmp/dip80-open-kimono.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/dip80-open-kimono.tar.gz
          rm -rf archive/dip80-open-kimono-payload
          rm -f archive/dip80-open-kimono-bootstrap.tar.gz
          # The final reusable validation workflow is installed by the authenticated
          # connector after this source commit, avoiding workflow-token scope ambiguity.
          rm -f .github/workflows/validate-dip80-open-kimono.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run hard 28-section acceptance audit
        run: python scripts/validate_dip80_open_kimono.py

      - name: Validate JavaScript syntax
        run: node --check assets/dip80-open-kimono.js

      - name: Commit materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize DIP 80 open-kimono living casebook [materialized]"
          git push origin "HEAD:${TARGET_BRANCH}"
