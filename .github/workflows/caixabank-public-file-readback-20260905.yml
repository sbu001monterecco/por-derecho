name: CaixaBank anonymous PDF byte readback
on:
  push:
    branches: ['worker/caixabank-360-audit-20260905']
    paths: ['.github/workflows/caixabank-public-file-readback-20260905.yml']
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read the existing public mirror anonymously
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,pathlib,urllib.request,urllib.parse,concurrent.futures
          share='https://1drv.ms/b/c/bdf43392f576e62f/IQDp2mBSGL5GQ5cNBhcEiVKrAcn8t1WXaYOaZCDghdJjo8Q'
          encoded='u!'+base64.urlsafe_b64encode(share.encode()).decode().rstrip('=')
          urls=[share+'?download=1','https://api.onedrive.com/v1.0/shares/'+encoded+'/root/content','https://api.onedrive.com/v1.0/shares/'+encoded+'/driveItem/content']
          def check(url):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=45) as r:
                data=r.read(); return {'request':url,'status':r.status,'mime':r.headers.get('Content-Type'),'bytes':len(data),'pdf':data.startswith(b'%PDF-'),'sha256':hashlib.sha256(data).hexdigest()}
            except Exception as e:return {'request':url,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex: rows=list(ex.map(check,urls))
          pathlib.Path('/tmp/public-file-readback.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: caixabank-anonymous-byte-readback
          path: /tmp/public-file-readback.json
          retention-days: 7
