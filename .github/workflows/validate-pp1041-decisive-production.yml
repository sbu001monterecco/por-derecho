name: Validate PP 1041 decisive production

on:
  push:
    branches: [main]
    paths:
      - 'en/pp1041-single-most-important-production/**'
      - 'es/pp1041-produccion-documental-decisiva/**'
      - 'research/unitary-criminal-reverse-engineering/PP1041-SINGLE-MOST-IMPORTANT-PRODUCTION.md'
      - 'research/unitary-criminal-reverse-engineering/data/pp1041_decisive_production.json'
      - 'assets/unitary-criminal-reverse-engineering-20260820.js'
      - 'sitemap-criminal-engineering.xml'
      - 'scripts/validate_pp1041_decisive_production.py'
      - '.github/workflows/validate-pp1041-decisive-production.yml'
  pull_request:
    paths:
      - 'en/pp1041-single-most-important-production/**'
      - 'es/pp1041-produccion-documental-decisiva/**'
      - 'research/unitary-criminal-reverse-engineering/PP1041-SINGLE-MOST-IMPORTANT-PRODUCTION.md'
      - 'research/unitary-criminal-reverse-engineering/data/pp1041_decisive_production.json'
      - 'assets/unitary-criminal-reverse-engineering-20260820.js'
      - 'sitemap-criminal-engineering.xml'
      - 'scripts/validate_pp1041_decisive_production.py'
      - '.github/workflows/validate-pp1041-decisive-production.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate bilingual production pages and evidence controls
        run: python scripts/validate_pp1041_decisive_production.py
      - name: Validate gateway JavaScript syntax
        run: node --check assets/unitary-criminal-reverse-engineering-20260820.js
