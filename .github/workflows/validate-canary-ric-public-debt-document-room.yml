name: Validate Canary RIC Treasury document room

on:
  pull_request:
    paths:
      - 'evidence/canary-ric-public-debt/**'
      - 'es/evidencia/tesoro-deuda-ric-2022-2025-documentos/**'
      - 'en/evidence/treasury-ric-debt-2022-2025-documents/**'
      - 'es/deuda-publica-ric-canarias/**'
      - 'en/canary-ric-public-debt/**'
      - 'scripts/validate_canary_ric_public_debt_document_room.py'
      - '.github/workflows/validate-canary-ric-public-debt-document-room.yml'
  push:
    branches: [main]
    paths:
      - 'evidence/canary-ric-public-debt/**'
      - 'es/evidencia/tesoro-deuda-ric-2022-2025-documentos/**'
      - 'en/evidence/treasury-ric-debt-2022-2025-documents/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyMuPDF
      - run: python scripts/validate_canary_ric_public_debt_document_room.py
