name: Verify PR 830 CAM non-dilution live

on:
  push:
    branches: [main]
    paths:
      - 'en/cam-creditor-control-shadow-administration-judicial-omission/**'
      - 'es/control-acreedor-cam-administracion-hecho-omision-judicial/**'
      - 'en/index.html'
      - 'es/index.html'
      - 'assets/site.js'
      - 'assets/prosecution-public-entry-20260821.js'
      - 'assets/cam-direct-instruction-shadow-admin-judicial-omission-20260823.js'
      - 'assets/data/cam-creditor-control-criminal-lead-v1.json'
      - '.github/workflows/verify-pr830-cam-nondilution-live.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-pr830-cam-nondilution-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_MERGE_SHA: 05cba3c9af7071f96b56eae90a67a2ceae3a783d
      RESULT_BRANCH: verification/pr830-cam-live
      RESULT_PATH: verification/pr830-cam-live.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify merged CAM rule on the public edge
        env:
          VERIFY_TRIGGER_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          base = "https://sbu001monterecco.github.io/por-derecho"
          targets = {
              "english_cam_dossier": (
                  f"{base}/en/cam-creditor-control-shadow-administration-judicial-omission/",
                  [
                      'data-express-criminal-attribution="20260823"',
                      "Gil Marer and Aweswell expressly allege",
                      "These are direct criminal allegations supported by a multi-layer evidential corpus. They are not judicial findings.",
                      "The attribution is direct.",
                      "Laura Patricia Acosta Matos",
                      '<span data-source-literal>“Laura Matos”</span>',
                  ],
              ),
              "spanish_cam_dossier": (
                  f"{base}/es/control-acreedor-cam-administracion-hecho-omision-judicial/",
                  [
                      'data-express-criminal-attribution="20260823"',
                      "Gil Marer y Aweswell atribuyen directamente",
                      "Son acusaciones penales directas apoyadas en un corpus probatorio de varias capas. No son declaraciones judiciales.",
                      "La atribución es directa.",
                      "Laura Patricia Acosta Matos",
                      '<span data-source-literal>«Laura Matos»</span>',
                  ],
              ),
              "english_home": (f"{base}/en/", ["../assets/site.js", "The case in 60 seconds"]),
              "spanish_home": (f"{base}/es/", ["../assets/site.js", "El caso en 60 segundos"]),
              "site_loader": (
                  f"{base}/assets/site.js",
                  [
                      "PROSECUTION-PUBLIC-ENTRY-20260821",
                      "prosecution-public-entry-20260821.js?v=20260821a",
                      "AUDIENCE-EXPERIENCE-ORDER-AND-DEDUPLICATION-20260823",
                  ],
              ),
              "first_read_module": (
                  f"{base}/assets/prosecution-public-entry-20260821.js",
                  [
                      "Gil Marer and Aweswell directly allege an organised criminal course—not merely a set of questions.",
                      "Gil Marer y Aweswell alegan directamente un curso delictivo organizado, no una mera serie de preguntas.",
                      "Laura Patricia Acosta Matos",
                      "Relationship is not responsibility; missing proof does not erase the allegation.",
                      "Relación no es responsabilidad; la prueba pendiente no borra la acusación.",
                  ],
              ),
              "cam_cross_site_module": (
                  f"{base}/assets/cam-direct-instruction-shadow-admin-judicial-omission-20260823.js",
                  ["CAM-CREDITOR-CONTROL-CRIMINAL-LEAD-20260823", "Laura Patricia Acosta Matos"],
              ),
              "machine_readable_record": (
                  f"{base}/assets/data/cam-creditor-control-criminal-lead-v1.json",
                  ["CAM-CREDITOR-CONTROL-CRIMINAL-LEAD-20260823", "Laura Patricia Acosta Matos", "direct_attribution"],
              ),
          }

          def fetch(url: str, attempt: int) -> tuple[int, str]:
              sep = "&" if "?" in url else "?"
              req = urllib.request.Request(
                  f"{url}{sep}pr830live={int(time.time())}-{attempt}",
                  headers={
                      "User-Agent": "Por-Derecho-PR830-live-verifier/1.0",
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.status, response.read().decode("utf-8", "replace")

          latest = {}
          passed = False
          for attempt in range(1, 31):
              checks = {}
              details = {}
              for name, (url, markers) in targets.items():
                  try:
                      status, body = fetch(url, attempt)
                      marker_results = {marker: marker in body for marker in markers}
                      checks[name] = status == 200 and all(marker_results.values())
                      details[name] = {
                          "url": url,
                          "http_status": status,
                          "bytes": len(body.encode("utf-8")),
                          "markers": marker_results,
                      }
                  except Exception as exc:
                      checks[name] = False
                      details[name] = {"url": url, "error": repr(exc)}
              latest = {"attempt": attempt, "checks": checks, "details": details}
              print(json.dumps(latest, ensure_ascii=False, indent=2))
              if all(checks.values()):
                  passed = True
                  break
              time.sleep(15)

          record = {
              "schema": "por-derecho/pr830-cam-live-verification/v1",
              "status": "PASS" if passed else "FAIL",
              "source_merge_sha": os.environ["SOURCE_MERGE_SHA"],
              "verification_trigger_sha": os.environ["VERIFY_TRIGGER_SHA"],
              "verified_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "public_base": base,
              **latest,
          }
          output = Path("/tmp/pr830-cam-live.json")
          output.write_text(json.dumps(record, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"WROTE {output} STATUS={record['status']}")
          PY

      - name: Publish machine-readable verification record to a dedicated branch
        run: |
          cp /tmp/pr830-cam-live.json /tmp/pr830-cam-live-preserved.json
          git config user.name "por-derecho-live-verifier"
          git config user.email "sbu001@monterecco.com"
          git switch --orphan "$RESULT_BRANCH"
          git rm -rf .
          mkdir -p "$(dirname "$RESULT_PATH")"
          cp /tmp/pr830-cam-live-preserved.json "$RESULT_PATH"
          git add "$RESULT_PATH"
          git commit -m "Record PR 830 CAM public-edge verification for ${GITHUB_SHA}"
          git push --force origin "HEAD:refs/heads/$RESULT_BRANCH"

      - name: Enforce successful live verification
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/pr830-cam-live.json').read_text(encoding='utf-8'))
          if data.get('status') != 'PASS':
              raise SystemExit('PR 830 CAM PUBLIC EDGE: FAIL')
          print('PR 830 CAM PUBLIC EDGE: LIVE VERIFIED')
          PY
