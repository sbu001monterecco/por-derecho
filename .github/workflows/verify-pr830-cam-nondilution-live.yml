name: Verify PR 830 CAM non-dilution live

on:
  pull_request:
    branches: [main]
    paths:
      - 'en/cam-creditor-control-shadow-administration-judicial-omission/**'
      - 'es/control-acreedor-cam-administracion-hecho-omision-judicial/**'
      - 'en/index.html'
      - 'es/index.html'
      - 'assets/site.js'
      - 'assets/prosecution-public-entry-20260821.js'
      - 'assets/cam-direct-instruction-shadow-admin-judicial-omission-20260823.js'
      - 'assets/data/cam-creditor-control-criminal-lead-v1.json'
      - 'assets/data/cam-nondilution-thread-closeout-v1.json'
      - 'scripts/validate_cam_creditor_control_criminal_lead.py'
      - '.github/workflows/verify-pr830-cam-nondilution-live.yml'
  push:
    branches: [main]
    paths:
      - 'en/cam-creditor-control-shadow-administration-judicial-omission/**'
      - 'es/control-acreedor-cam-administracion-hecho-omision-judicial/**'
      - 'en/index.html'
      - 'es/index.html'
      - 'assets/site.js'
      - 'assets/prosecution-public-entry-20260821.js'
      - 'assets/cam-direct-instruction-shadow-admin-judicial-omission-20260823.js'
      - 'assets/data/cam-creditor-control-criminal-lead-v1.json'
      - 'assets/data/cam-nondilution-thread-closeout-v1.json'
      - 'scripts/validate_cam_creditor_control_criminal_lead.py'
      - '.github/workflows/verify-pr830-cam-nondilution-live.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-pr830-cam-nondilution-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_MERGE_SHA: 05cba3c9af7071f96b56eae90a67a2ceae3a783d
      GITHUB_EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate CAM attribution and source fidelity from checked-out source
        run: python3 scripts/validate_cam_creditor_control_criminal_lead.py

      - name: Verify merged CAM rule on the public edge
        if: github.event_name != 'pull_request'
        env:
          VERIFY_TRIGGER_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import json
          import os
          import time
          import urllib.request

          base = "https://sbu001monterecco.github.io/por-derecho"
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          targets = {
              "english_cam_dossier": (
                  f"{base}/en/cam-creditor-control-shadow-administration-judicial-omission/",
                  [
                      'data-express-criminal-attribution="20260824"',
                      "Gil Marer and Aweswell expressly allege",
                      "These are direct criminal allegations supported by a multi-layer evidential corpus. They are not judicial findings.",
                      "The attribution is direct.",
                      "Laura Patricia Acosta Matos",
                      '<span data-source-literal>“Laura Matos”</span>',
                  ],
              ),
              "spanish_cam_dossier": (
                  f"{base}/es/control-acreedor-cam-administracion-hecho-omision-judicial/",
                  [
                      'data-express-criminal-attribution="20260824"',
                      "Gil Marer y Aweswell atribuyen directamente",
                      "Son acusaciones penales directas apoyadas en un corpus probatorio de varias capas. No son declaraciones judiciales.",
                      "La atribución es directa.",
                      "Laura Patricia Acosta Matos",
                      '<span data-source-literal>«Laura Matos»</span>',
                  ],
              ),
              "english_home": (
                  f"{base}/en/",
                  [
                      "../assets/site.js",
                      "The case in 60 seconds",
                      "By 22 Jun 2011 → Community administration",
                      "The 22 June 2011 minutes identify him as Community Administrator.",
                      "By 10 Apr 2014 → representation / Community",
                      "The 10 April 2014 notarial record identifies him as Cristina Molina Petit’s representative.",
                      "By 8 Apr 2014 → communications / administration",
                      "A Pamanil communication dated 8 April 2014 appears signed by FMMM and Shaila.",
                  ],
              ),
              "spanish_home": (
                  f"{base}/es/",
                  [
                      "../assets/site.js",
                      "El caso en 60 segundos",
                      "Antes del 22 jun 2011 → administración comunitaria",
                      "El acta de 22 de junio de 2011 lo identifica como Administrador de la Comunidad.",
                      "Antes del 10 abr 2014 → representación / Comunidad",
                      "El acta notarial de 10 de abril de 2014 lo identifica como representante de Cristina Molina Petit.",
                      "Antes del 8 abr 2014 → comunicaciones / administración",
                      "Una comunicación Pamanil de 8 de abril de 2014 aparece firmada por FMMM y Shaila.",
                  ],
              ),
              "site_loader": (
                  f"{base}/assets/site.js",
                  [
                      "PROSECUTION-PUBLIC-ENTRY-20260824",
                      "prosecution-public-entry-20260821.js?v=20260824a",
                      "AUDIENCE-EXPERIENCE-ORDER-AND-DEDUPLICATION-20260823",
                  ],
              ),
              "first_read_module": (
                  f"{base}/assets/prosecution-public-entry-20260821.js",
                  [
                      "Gil Marer and Aweswell allege one continuing economic-criminal enterprise, advanced through successive adoption and divided functions.",
                      "Gil Marer y Aweswell alegan una sola empresa continuada de criminalidad económica, desarrollada mediante adopción sucesiva y división de funciones.",
                      "This is only a factual allegation of connection: it does not characterise the conduct as a continuing or permanent offence",
                      "Esta es solo una alegación fáctica de conexión: no califica los hechos como delito continuado o permanente",
                      "Laura Patricia Acosta Matos",
                      "Relationship is not responsibility; missing proof does not erase the allegation.",
                      "Relación no es responsabilidad; la prueba pendiente no borra la acusación.",
                  ],
              ),
              "cam_cross_site_module": (
                  f"{base}/assets/cam-direct-instruction-shadow-admin-judicial-omission-20260823.js",
                  [
                      "Gil Marer and Aweswell directly allege",
                      "Laura Patricia Acosta Matos",
                      "Direct allegation ≠ adjudicated finding",
                  ],
              ),
              "machine_readable_record": (
                  f"{base}/assets/data/cam-creditor-control-criminal-lead-v1.json",
                  [
                      "CAM-CREDITOR-CONTROL-CRIMINAL-LEAD-20260823",
                      "Laura Patricia Acosta Matos",
                      "DIRECT_ACTOR_SPECIFIC_CRIMINAL_ATTRIBUTION_NOT_MERE_QUESTION_OR_LEAD",
                      '"criminal_guilt_adjudicated": false',
                  ],
              ),
          }

          # Pull-request checks verify the currently deployed substantive package and
          # the already-merged PR #808 chronology. New closeout markers are required
          # only after the closeout source itself is on main and Pages has propagated.
          if event_name != "pull_request":
              targets["cam_cross_site_module"][1].extend([
                  "Publication control: merged, publicly verified and recoverable without the originating chat.",
                  "Control de publicación: fusionado, verificado públicamente y recuperable sin el chat de origen.",
                  "cam-nondilution-thread-closeout-v1.json",
              ])
              targets["thread_closeout_record"] = (
                  f"{base}/assets/data/cam-nondilution-thread-closeout-v1.json",
                  [
                      "CAM-NONDILUTION-THREAD-CLOSEOUT-20260823",
                      "DELETION_SAFE_WITH_OPEN_EVIDENCE",
                      "05cba3c9af7071f96b56eae90a67a2ceae3a783d",
                      "22f10cea2cab18539c55d6283eb9ebce16d40f71",
                      '"direct_attribution_preserved": true',
                      '"this_closeout_authorizes_email": false',
                  ],
              )

          def fetch(url: str, attempt: int) -> tuple[int, str]:
              separator = "&" if "?" in url else "?"
              request = urllib.request.Request(
                  f"{url}{separator}pr830live={int(time.time())}-{attempt}",
                  headers={
                      "User-Agent": "Por-Derecho-PR830-live-verifier/2.0",
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.status, response.read().decode("utf-8", "replace")

          latest: dict = {}
          passed = False
          for attempt in range(1, 31):
              checks: dict[str, bool] = {}
              details: dict[str, dict] = {}
              for name, (url, markers) in targets.items():
                  try:
                      status, body = fetch(url, attempt)
                      marker_results = {marker: marker in body for marker in markers}
                      checks[name] = status == 200 and all(marker_results.values())
                      details[name] = {
                          "url": url,
                          "http_status": status,
                          "bytes": len(body.encode("utf-8")),
                          "markers": marker_results,
                      }
                  except Exception as exc:
                      checks[name] = False
                      details[name] = {"url": url, "error": repr(exc)}

              latest = {"attempt": attempt, "checks": checks, "details": details}
              print(json.dumps(latest, ensure_ascii=False, indent=2))
              if all(checks.values()):
                  passed = True
                  break
              time.sleep(15)

          record = {
              "schema": "por-derecho/pr830-cam-live-verification/v2",
              "status": "PASS" if passed else "FAIL",
              "event_name": event_name,
              "source_merge_sha": os.environ["SOURCE_MERGE_SHA"],
              "verification_trigger_sha": os.environ["VERIFY_TRIGGER_SHA"],
              "verified_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "public_base": base,
              **latest,
          }
          print("PR830_CAM_LIVE_RESULT=" + json.dumps(record, ensure_ascii=False, separators=(",", ":")))
          if not passed:
              raise SystemExit("PR 830 CAM PUBLIC EDGE: FAIL")
          print("PR 830 CAM PUBLIC EDGE: LIVE VERIFIED")
          PY
