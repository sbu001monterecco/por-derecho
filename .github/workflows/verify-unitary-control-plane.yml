name: Verify unitary control-plane synchronization

on:
  pull_request:
    paths:
      - 'CURRENT_UNITARY_STATE.md'
      - 'ops/CURRENT_UNITARY_STATE.json'
      - 'ops/CURRENT_STATE.json'
      - 'ops/PRODUCTION_STATUS.json'
      - 'ops/PR_RECONCILIATION_LEDGER.json'
      - 'assets/data/material-updates-v1.json'
      - 'assets/data/matter-identity-registry-v1*.json'
      - 'es/registro-identidad-materia/index.html'
      - 'en/matter-identity-registry/index.html'
      - 'es/actualizaciones/index.html'
      - 'en/updates/index.html'
      - 'sitemap-unitary-control-plane.xml'
      - 'robots.txt'
      - 'scripts/validate_unitary_control_plane.py'
      - 'publication-manifests/unitary-control-plane-sync-20260825.json'
      - '.github/workflows/verify-unitary-control-plane.yml'
  push:
    branches: [main]
    paths:
      - 'CURRENT_UNITARY_STATE.md'
      - 'ops/CURRENT_UNITARY_STATE.json'
      - 'ops/CURRENT_STATE.json'
      - 'ops/PRODUCTION_STATUS.json'
      - 'ops/PR_RECONCILIATION_LEDGER.json'
      - 'assets/data/material-updates-v1.json'
      - 'assets/data/matter-identity-registry-v1*.json'
      - 'es/registro-identidad-materia/index.html'
      - 'en/matter-identity-registry/index.html'
      - 'es/actualizaciones/index.html'
      - 'en/updates/index.html'
      - 'sitemap-unitary-control-plane.xml'
      - 'robots.txt'
      - 'scripts/validate_unitary_control_plane.py'
      - 'publication-manifests/unitary-control-plane-sync-20260825.json'
      - '.github/workflows/verify-unitary-control-plane.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unitary-control-plane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate synchronized control planes
        run: python3 scripts/validate_unitary_control_plane.py
      - name: Validate JSON and XML syntax
        run: |
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          for path in ['ops/CURRENT_UNITARY_STATE.json','ops/CURRENT_STATE.json','ops/PRODUCTION_STATUS.json','ops/PR_RECONCILIATION_LEDGER.json','assets/data/material-updates-v1.json','publication-manifests/unitary-control-plane-sync-20260825.json']:
              json.loads(Path(path).read_text(encoding='utf-8'))
          ET.parse('sitemap-unitary-control-plane.xml')
          print('JSON/XML syntax: PASS')
          PY
      - name: Verify public exact markers and structured JSON
        if: github.event_name != 'pull_request'
        env:
          BASE: https://sbu001monterecco.github.io/por-derecho
        shell: python
        run: |
          import json, os, time, urllib.request
          base=os.environ['BASE'].rstrip('/')
          text_checks=[
            ('/es/registro-identidad-materia/',['data-static-registry-counts="185-86-66-10-13-10"','data-registry-stat="TOTAL">185','Los <strong>185 IDs</strong>']),
            ('/en/matter-identity-registry/',['data-static-registry-counts="185-86-66-10-13-10"','data-registry-stat="TOTAL">185','The <strong>185 IDs</strong>']),
            ('/es/actualizaciones/',['Última actualización material','<strong>25 agosto 2026</strong>']),
            ('/en/updates/',['Latest material update','<strong>25 August 2026</strong>']),
            ('/sitemap-unitary-control-plane.xml',['<lastmod>2026-08-25</lastmod>','registro-identidad-materia','matter-identity-registry']),
            ('/robots.txt',['sitemap-unitary-control-plane.xml'])]
          def fetch(route):
            req=urllib.request.Request(base+route,headers={'User-Agent':'por-derecho-unitary-control-plane-verifier/2'})
            with urllib.request.urlopen(req,timeout=30) as response:
              if response.status!=200: raise RuntimeError(f'HTTP {response.status}')
              return response.read().decode('utf-8',errors='replace')
          failures=[]
          for route,expected in text_checks:
            last=''
            for _ in range(12):
              try:
                body=fetch(route); missing=[m for m in expected if m not in body]
                if not missing: print(f'LIVE VERIFIED {route} :: {len(body)} bytes'); break
                last=f'missing {missing}'
              except Exception as exc: last=str(exc)
              time.sleep(10)
            else: failures.append(f'{route}: {last}')
          for route,check in [
            ('/ops/CURRENT_UNITARY_STATE.json',lambda d: d.get('control_id')=='PD-UNITARY-STATE-20260825-01' and d.get('identity_registry',{}).get('counts',{}).get('total')==185),
            ('/assets/data/material-updates-v1.json',lambda d: d.get('control_id')=='PD-MATERIAL-UPDATES-001' and d.get('latest_material_date')=='2026-08-25')]:
            last=''
            for _ in range(12):
              try:
                body=fetch(route); data=json.loads(body)
                if check(data): print(f'LIVE JSON VERIFIED {route} :: {len(body)} bytes'); break
                last='structured assertion failed'
              except Exception as exc: last=str(exc)
              time.sleep(10)
            else: failures.append(f'{route}: {last}')
          if failures: raise SystemExit('LIVE VERIFICATION FAILED\n - '+'\n - '.join(failures))
      - name: Summary
        if: always()
        run: |
          {
            echo '## Unitary control-plane verification'
            echo
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- SHA: $GITHUB_SHA"
            echo '- Operational truth and specialist unitary state are validated as separate layers.'
            echo '- Identity denominator: `185 / 86 / 66 / 10 / 13 / 10`'
            if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
              echo '- Source parity and syntax verified; public readback is reserved for the post-merge main push.'
            else
              echo '- Public HTML, structured JSON, sitemap and robots were verified.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
