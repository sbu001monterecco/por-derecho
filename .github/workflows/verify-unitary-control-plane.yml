name: Verify unitary control-plane synchronization

on:
  pull_request:
    paths:
      - 'CURRENT_UNITARY_STATE.md'
      - 'ops/CURRENT_UNITARY_STATE.json'
      - 'ops/CURRENT_STATE.json'
      - 'ops/PRODUCTION_STATUS.json'
      - 'ops/PR_RECONCILIATION_LEDGER.json'
      - 'assets/data/material-updates-v1.json'
      - 'assets/data/matter-identity-registry-v1*.json'
      - 'es/registro-identidad-materia/index.html'
      - 'en/matter-identity-registry/index.html'
      - 'es/actualizaciones/index.html'
      - 'en/updates/index.html'
      - 'sitemap-unitary-control-plane.xml'
      - 'robots.txt'
      - 'scripts/validate_unitary_control_plane.py'
      - 'publication-manifests/unitary-control-plane-sync-20260825.json'
      - 'publication-manifests/unitary-enterprise-rdm-manifest-analysis-20260826.json'
      - '.github/workflows/verify-unitary-control-plane.yml'
  push:
    branches: [main]
    paths:
      - 'CURRENT_UNITARY_STATE.md'
      - 'ops/CURRENT_UNITARY_STATE.json'
      - 'ops/CURRENT_STATE.json'
      - 'ops/PRODUCTION_STATUS.json'
      - 'ops/PR_RECONCILIATION_LEDGER.json'
      - 'assets/data/material-updates-v1.json'
      - 'assets/data/matter-identity-registry-v1*.json'
      - 'es/registro-identidad-materia/index.html'
      - 'en/matter-identity-registry/index.html'
      - 'es/actualizaciones/index.html'
      - 'en/updates/index.html'
      - 'sitemap-unitary-control-plane.xml'
      - 'robots.txt'
      - 'scripts/validate_unitary_control_plane.py'
      - 'publication-manifests/unitary-control-plane-sync-20260825.json'
      - 'publication-manifests/unitary-enterprise-rdm-manifest-analysis-20260826.json'
      - '.github/workflows/verify-unitary-control-plane.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unitary-control-plane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate synchronized control plane
        run: python3 scripts/validate_unitary_control_plane.py

      - name: Validate JSON and XML syntax
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for path in [
              'ops/CURRENT_UNITARY_STATE.json',
              'ops/CURRENT_STATE.json',
              'ops/PRODUCTION_STATUS.json',
              'ops/PR_RECONCILIATION_LEDGER.json',
              'assets/data/material-updates-v1.json',
              'publication-manifests/unitary-control-plane-sync-20260825.json',
              'publication-manifests/unitary-enterprise-rdm-manifest-analysis-20260826.json',
          ]:
              json.loads(Path(path).read_text(encoding='utf-8'))
          ET.parse('sitemap-unitary-control-plane.xml')
          print('JSON/XML syntax: PASS')
          PY

      - name: Verify public exact markers and structured state
        if: github.event_name != 'pull_request'
        env:
          BASE: https://sbu001monterecco.github.io/por-derecho
        shell: python
        run: |
          import json, os, time, urllib.request

          base=os.environ['BASE'].rstrip('/')
          text_checks=[
            ('/es/registro-identidad-materia/',['data-static-registry-counts="194-86-66-10-15-17"','data-registry-stat="TOTAL">194','Los <strong>194 IDs</strong>']),
            ('/en/matter-identity-registry/',['data-static-registry-counts="194-86-66-10-15-17"','data-registry-stat="TOTAL">194','The <strong>194 IDs</strong>']),
            ('/es/actualizaciones/',['Última actualización material','<strong>26 agosto 2026</strong>','ALG-ENT-018']),
            ('/en/updates/',['Latest material update','<strong>26 August 2026</strong>','ALG-ENT-018']),
            ('/assets/data/material-updates-v1.json',['PD-MATERIAL-UPDATES-001','2026-08-26','ALG-ENT-018']),
            ('/sitemap-unitary-control-plane.xml',['<lastmod>2026-08-26</lastmod>','<lastmod>2026-08-25</lastmod>','registro-identidad-materia','matter-identity-registry']),
            ('/robots.txt',['sitemap-unitary-control-plane.xml'])]

          def fetch(url):
            separator='&' if '?' in url else '?'
            url=f'{url}{separator}unitary={int(time.time())}'
            req=urllib.request.Request(url,headers={
              'User-Agent':'por-derecho-unitary-control-plane-verifier/3',
              'Cache-Control':'no-cache',
              'Pragma':'no-cache',
            })
            with urllib.request.urlopen(req,timeout=30) as response:
              if response.status!=200: raise RuntimeError(f'HTTP {response.status}')
              return response.read().decode('utf-8',errors='replace')

          failures=[]
          for route,markers in text_checks:
            url=base+route; last=''
            for _ in range(12):
              try:
                body=fetch(url); missing=[m for m in markers if m not in body]
                if not missing:
                  print(f'LIVE VERIFIED {url} :: {len(body)} bytes :: {len(markers)} markers'); break
                last=f'missing {missing}'
              except Exception as exc: last=str(exc)
              time.sleep(10)
            else: failures.append(f'{url}: {last}')

          state_url=base+'/ops/CURRENT_UNITARY_STATE.json'
          merge_sha='77e2ba300af45a953947160af63283a64512e876'
          tree_sha='4f0ac26c5548ae44c68933306c68165cbb6c973e'
          last=''
          for _ in range(12):
            try:
              body=fetch(state_url)
              state=json.loads(body)
              assert state.get('control_id')=='PD-UNITARY-STATE-20260826-01'
              assert state.get('status')=='LIVE_VERIFIED'
              counts=state.get('identity_registry',{}).get('counts',{})
              assert counts=={'total':194,'PERSON':86,'ORGANISATION':66,'STRUCTURE':10,'INSTITUTION':15,'PROCEEDING':17}
              repository=state.get('repository',{})
              assert repository.get('source_publication_merge_sha')==merge_sha
              assert repository.get('verified_tree_sha')==tree_sha
              promoted=state.get('promoted_material_publication',{})
              assert promoted.get('control_id')=='PD-UNITARY-STATE-20260826-01'
              assert promoted.get('state')=='LIVE_VERIFIED'
              assert promoted.get('publication_merge_sha')==merge_sha
              assert promoted.get('publication_tree_sha')==tree_sha
              assert promoted.get('pages_run_id')==32942972472
              assert promoted.get('live_verification_run_id')==32942975508
              assert promoted.get('live_verification_job_id')==98097657687
              material=state.get('material_updates',{})
              assert material.get('repository_latest_material_date')=='2026-08-26'
              assert material.get('last_live_verified_material_date')=='2026-08-26'
              assert material.get('public_parity')=='2026-08-26_LIVE_VERIFIED'
              publication=state.get('publication',{})
              pages=publication.get('last_pages_deployment',{})
              assert pages.get('sha')==merge_sha and pages.get('tree_sha')==tree_sha
              assert pages.get('run_id')==32942972472 and pages.get('run_number')==1128
              assert pages.get('completed_at')=='2026-08-26T07:29:45Z'
              readback=publication.get('current_sha_edge_readback',{})
              assert readback.get('state')=='LIVE_VERIFIED'
              assert readback.get('workflow_run_id')==32942975508
              assert readback.get('workflow_run_number')==4
              assert readback.get('job_id')==98097657687
              assert readback.get('head_sha')==merge_sha and readback.get('tree_sha')==tree_sha
              assert readback.get('completed_at')=='2026-08-26T07:29:55Z'
              assert readback.get('verified_url_count')==21
              assert len(publication.get('live_urls',[]))==21
              print(f'LIVE VERIFIED {state_url} :: structured JSON :: state={readback.get("state")}')
              break
            except Exception as exc:
              last=str(exc); time.sleep(10)
          else:
            failures.append(f'{state_url}: structured validation failed: {last}')

          manifest_url=base+'/publication-manifests/unitary-enterprise-rdm-manifest-analysis-20260826.json'
          last=''
          for _ in range(12):
            try:
              manifest=json.loads(fetch(manifest_url))
              assert manifest.get('control_id')=='PD-UNITARY-STATE-20260826-01'
              assert manifest.get('current_state')=='LIVE_VERIFIED'
              assert manifest.get('status')=='live_verified'
              assert manifest.get('publication_merge_sha')==merge_sha
              assert manifest.get('publication_tree_sha')==tree_sha
              assert manifest.get('pages_run_id')==32942972472
              assert manifest.get('live_verification')=='passed_exact_no_cache'
              allegation=manifest.get('controlling_allegation',{})
              assert allegation.get('not_a_finding') is True
              assert allegation.get('independent_of_rdm_manifest') is True
              assert allegation.get('rdm_manifest_evidential_support')=='NONE_UNTIL_RELEVANT_NATIVES_ARE_ACQUIRED_AUTHENTICATED_AND_TESTED'
              private_source=manifest.get('private_source',{})
              assert private_source.get('phase_b')=='NATIVE_EMAIL_ATTACHMENT_AND_DRIVE_ACQUISITION_AND_ANALYSIS_OPEN'
              readback=manifest.get('live_verification_evidence',{})
              assert readback.get('workflow_run_id')==32942975508
              assert readback.get('workflow_run_number')==4
              assert readback.get('job_id')==98097657687
              assert readback.get('head_sha')==merge_sha and readback.get('tree_sha')==tree_sha
              assert readback.get('completed_at')=='2026-08-26T07:29:55Z'
              assert readback.get('verified_url_count')==21
              assert len(manifest.get('live_urls',[]))==21
              print(f'LIVE VERIFIED {manifest_url} :: structured JSON')
              break
            except Exception as exc:
              last=str(exc); time.sleep(10)
          else:
            failures.append(f'{manifest_url}: structured validation failed: {last}')

          if failures: raise SystemExit('LIVE VERIFICATION FAILED\n - '+'\n - '.join(failures))

      - name: Summary
        if: always()
        run: |
          {
            echo '## Unitary control-plane verification'
            echo
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- SHA: $GITHUB_SHA"
            echo '- Control: `PD-UNITARY-STATE-20260826-01 / LIVE_VERIFIED`'
            echo '- Evidence: merge `77e2ba300af45a953947160af63283a64512e876`, Pages `32942972472`, verifier `32942975508` / job `98097657687`.'
            echo '- Identity denominator: `194 / 86 / 66 / 10 / 15 / 17`'
            if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
              echo '- Source parity and syntax verified; public readback is reserved for the post-merge main push.'
            else
              echo '- Public ES/EN identity and 26-Aug update routes, promoted state and manifest JSON, updates JSON, sitemap and robots were verified.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
