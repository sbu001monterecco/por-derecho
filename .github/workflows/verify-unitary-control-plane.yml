name: Verify unitary control-plane synchronization

on:
  pull_request:
    paths:
      - 'CURRENT_UNITARY_STATE.md'
      - 'ops/CURRENT_UNITARY_STATE.json'
      - 'ops/CURRENT_STATE.json'
      - 'ops/PRODUCTION_STATUS.json'
      - 'ops/PR_RECONCILIATION_LEDGER.json'
      - 'assets/data/material-updates-v1.json'
      - 'assets/data/matter-identity-registry-v1*.json'
      - 'assets/data/non-lpb-matkator-owner-court-network-v1.json'
      - 'es/registro-identidad-materia/**'
      - 'en/matter-identity-registry/**'
      - 'es/jv1260-ap89-continuidad-cam/**'
      - 'en/jv1260-ap89-cam-continuity/**'
      - 'es/actualizaciones/index.html'
      - 'en/updates/index.html'
      - 'sitemap-unitary-control-plane.xml'
      - 'sitemap-owner-court-network.xml'
      - 'robots.txt'
      - 'scripts/validate_unitary_control_plane.py'
      - 'scripts/validate_non_lpb_owner_court_network.py'
      - 'scripts/validate_legal_professional_register.py'
      - 'publication-manifests/unitary-control-plane-sync-20260825.json'
      - 'publication-manifests/non-lpb-matkator-owner-court-network-20260826.json'
      - '.github/workflows/verify-unitary-control-plane.yml'
  push:
    branches: [main]
    paths:
      - 'CURRENT_UNITARY_STATE.md'
      - 'ops/CURRENT_UNITARY_STATE.json'
      - 'ops/CURRENT_STATE.json'
      - 'ops/PRODUCTION_STATUS.json'
      - 'ops/PR_RECONCILIATION_LEDGER.json'
      - 'assets/data/material-updates-v1.json'
      - 'assets/data/matter-identity-registry-v1*.json'
      - 'assets/data/non-lpb-matkator-owner-court-network-v1.json'
      - 'es/registro-identidad-materia/**'
      - 'en/matter-identity-registry/**'
      - 'es/jv1260-ap89-continuidad-cam/**'
      - 'en/jv1260-ap89-cam-continuity/**'
      - 'es/actualizaciones/index.html'
      - 'en/updates/index.html'
      - 'sitemap-unitary-control-plane.xml'
      - 'sitemap-owner-court-network.xml'
      - 'robots.txt'
      - 'scripts/validate_unitary_control_plane.py'
      - 'scripts/validate_non_lpb_owner_court_network.py'
      - 'scripts/validate_legal_professional_register.py'
      - 'publication-manifests/unitary-control-plane-sync-20260825.json'
      - 'publication-manifests/non-lpb-matkator-owner-court-network-20260826.json'
      - '.github/workflows/verify-unitary-control-plane.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unitary-control-plane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate synchronized control plane
        run: |
          python3 scripts/validate_unitary_control_plane.py
          python3 scripts/validate_non_lpb_owner_court_network.py
          python3 scripts/validate_legal_professional_register.py

      - name: Validate JSON and XML syntax
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for path in [
              'ops/CURRENT_UNITARY_STATE.json',
              'ops/CURRENT_STATE.json',
              'ops/PRODUCTION_STATUS.json',
              'ops/PR_RECONCILIATION_LEDGER.json',
              'assets/data/material-updates-v1.json',
              'assets/data/matter-identity-registry-v1.json',
              'assets/data/non-lpb-matkator-owner-court-network-v1.json',
              'publication-manifests/unitary-control-plane-sync-20260825.json',
              'publication-manifests/non-lpb-matkator-owner-court-network-20260826.json',
          ]:
              json.loads(Path(path).read_text(encoding='utf-8'))
          ET.parse('sitemap-unitary-control-plane.xml')
          ET.parse('sitemap-owner-court-network.xml')
          print('JSON/XML syntax: PASS')
          PY

      - name: Verify public exact markers and structured state
        if: github.event_name != 'pull_request'
        env:
          BASE: https://sbu001monterecco.github.io/por-derecho
        shell: python
        run: |
          import json, os, time, urllib.request

          base=os.environ['BASE'].rstrip('/')
          text_checks=[
            ('/es/registro-identidad-materia/',['data-static-registry-counts="187-88-66-10-13-10"','data-registry-stat="TOTAL">187','Los <strong>187 IDs</strong>','perimetro-propietarios-no-lpb-matkator/']),
            ('/en/matter-identity-registry/',['data-static-registry-counts="187-88-66-10-13-10"','data-registry-stat="TOTAL">187','The <strong>187 IDs</strong>','non-lpb-matkator-owner-network/']),
            ('/es/registro-identidad-materia/perimetro-propietarios-no-lpb-matkator/',['PD-SP-OWNER-COURT-NETWORK-001','Celia Guillén Pérez','Manuel Molina Climent','Gerardo Zacarías Acosta Matos','Javier Acosta Matos']),
            ('/en/matter-identity-registry/non-lpb-matkator-owner-network/',['PD-SP-OWNER-COURT-NETWORK-001','Celia Guillén Pérez','Manuel Molina Climent','Gerardo Zacarías Acosta Matos','Javier Acosta Matos']),
            ('/es/jv1260-ap89-continuidad-cam/',['JV 1260/2011','AP 89/2014','red canónica']),
            ('/en/jv1260-ap89-cam-continuity/',['JV 1260/2011','AP 89/2014','canonical network']),
            ('/es/actualizaciones/',['Última actualización material','<strong>25 agosto 2026</strong>']),
            ('/en/updates/',['Latest material update','<strong>25 August 2026</strong>']),
            ('/assets/data/non-lpb-matkator-owner-court-network-v1.json',['PD-SP-OWNER-COURT-NETWORK-001','PD-SP-P-0087','PD-SP-P-0088']),
            ('/assets/data/material-updates-v1.json',['PD-MATERIAL-UPDATES-001','MU-20260825-CONTROL-PLANE-SYNC']),
            ('/sitemap-owner-court-network.xml',['perimetro-propietarios-no-lpb-matkator','non-lpb-matkator-owner-network']),
            ('/robots.txt',['sitemap-unitary-control-plane.xml','sitemap-owner-court-network.xml'])]

          def fetch(url):
            req=urllib.request.Request(url,headers={'User-Agent':'por-derecho-unitary-control-plane-verifier/3'})
            with urllib.request.urlopen(req,timeout=30) as response:
              if response.status!=200: raise RuntimeError(f'HTTP {response.status}')
              return response.read().decode('utf-8',errors='replace')

          failures=[]
          for route,markers in text_checks:
            url=base+route; last=''
            for _ in range(12):
              try:
                body=fetch(url); missing=[m for m in markers if m not in body]
                if not missing:
                  print(f'LIVE VERIFIED {url} :: {len(body)} bytes :: {len(markers)} markers'); break
                last=f'missing {missing}'
              except Exception as exc: last=str(exc)
              time.sleep(10)
            else: failures.append(f'{url}: {last}')

          state_url=base+'/ops/CURRENT_UNITARY_STATE.json'
          last=''
          for _ in range(12):
            try:
              body=fetch(state_url)
              state=json.loads(body)
              assert state.get('control_id')=='PD-UNITARY-STATE-20260825-01'
              counts=state.get('identity_registry',{}).get('counts',{})
              assert counts=={'total':187,'PERSON':88,'ORGANISATION':66,'STRUCTURE':10,'INSTITUTION':13,'PROCEEDING':10}
              assert state.get('status') in {'PREPARED_PENDING_MERGE_AND_LIVE_READBACK','LIVE_VERIFIED'}
              owner=state.get('canonical_routes',{}).get('owner_network',[])
              assert len(owner)==2
              print(f'LIVE VERIFIED {state_url} :: structured JSON :: state={state.get("status")}')
              break
            except Exception as exc:
              last=str(exc); time.sleep(10)
          else:
            failures.append(f'{state_url}: structured validation failed: {last}')

          if failures: raise SystemExit('LIVE VERIFICATION FAILED\n - '+'\n - '.join(failures))

      - name: Summary
        if: always()
        run: |
          {
            echo '## Unitary control-plane verification'
            echo
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- SHA: $GITHUB_SHA"
            echo '- Control: `PD-UNITARY-STATE-20260825-01`'
            echo '- Identity denominator: `187 / 88 / 66 / 10 / 13 / 10`'
            echo '- Owner network: `PD-SP-OWNER-COURT-NETWORK-001`'
            if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
              echo '- Source parity, owner-network integrity and syntax verified; public readback is reserved for the post-merge main push.'
            else
              echo '- Public ES/EN identity, owner-network, JV/AP bridge and update routes plus structured state and sitemaps were verified.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"