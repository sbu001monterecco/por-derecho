name: Validate Aguiar Acosta caret event proceeding control

on:
  pull_request:
    paths:
      - 'assets/data/aguiar-acosta-person-event-proceeding-control-v1.json'
      - 'assets/data/caepr-caret-irea-ricpe-colliers-continuity-v1.json'
      - 'assets/data/matter-identity-registry-v1.people.json'
      - 'archive/PROCEEDINGS_MASTER_REGISTER.csv'
      - 'scripts/validate_aguiar_acosta_caret_event_proceeding.py'
      - '.github/workflows/validate-aguiar-acosta-caret-event-proceeding.yml'
  push:
    branches: [main]
    paths:
      - 'assets/data/aguiar-acosta-person-event-proceeding-control-v1.json'
      - 'assets/data/caepr-caret-irea-ricpe-colliers-continuity-v1.json'
      - 'assets/data/matter-identity-registry-v1.people.json'
      - 'archive/PROCEEDINGS_MASTER_REGISTER.csv'
      - 'scripts/validate_aguiar_acosta_caret_event_proceeding.py'
      - '.github/workflows/validate-aguiar-acosta-caret-event-proceeding.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/validate_aguiar_acosta_caret_event_proceeding.py
