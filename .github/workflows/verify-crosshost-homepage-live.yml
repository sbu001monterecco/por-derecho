name: Verify cross-host homepage live parity

on:
  push:
    branches: [main]
    paths:
      - 'en/index.html'
      - 'es/index.html'
      - 'en/future/index.html'
      - 'es/futuro/index.html'
      - 'scripts/verify_crosshost_homepage_live_20260925.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-crosshost-homepage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify GitHub and GitLab live homepage parity
        run: python scripts/verify_crosshost_homepage_live_20260925.py
