name: Verify AC Community de facto administration live

on:
  push:
    branches: [main]
    paths:
      - 'es/administracion-de-hecho-comunidad-ac/index.html'
      - 'en/de-facto-administration-community-ac/index.html'
      - 'assets/ac-community-de-facto-administration-20260820.js'
      - 'assets/ac-de-facto-knowing-facilitation-visibility-20260820.js'
      - 'assets/ac-de-facto-knowing-facilitation-stability-20260820.js'
      - 'assets/homepage-actor-family-pwc-note-20260819.js'
      - 'assets/five-actor-accountability-20260824.css'
      - 'assets/audience-experience-order-20260823.js'
      - 'assets/ricpe-identity-correction-20260815.js'
      - 'assets/site-base-20260819.js'
      - 'assets/site-pre-intervencion-highlight-before-eg95-20260823.js'
      - 'assets/site-pre-intervencion-highlight-20260820.js'
      - 'assets/data/ac-de-facto-knowing-facilitation-visibility-v1.json'
      - 'assets/site.js'
      - 'es/index.html'
      - 'en/index.html'
      - 'sitemap-ac-community-de-facto-administration.xml'
      - 'robots.txt'
      - 'scripts/render_ac_community_de_facto_administration.mjs'
      - 'operations/AC_COMMUNITY_DE_FACTO_ADMINISTRATION_ACTIVATION_2026-08-20.md'
      - 'operations/AC_DE_FACTO_MANAGEMENT_KNOWING_FACILITATION_VISIBILITY_ACTIVATION_2026-08-20.md'
      - 'publication-manifests/ac-community-de-facto-administration-2026-08-20.json'
      - 'publication-manifests/ac-de-facto-knowing-facilitation-visibility-2026-08-20.json'
      - 'archive/THREAD_DELETION_AUDIT_AC_PRIVATE_ACTOR_DE_FACTO_ADMINISTRATION_20AUG2026.md'
      - 'archive/THREAD_DELETION_AUDIT_AC_DE_FACTO_KNOWING_FACILITATION_VISIBILITY_20AUG2026.md'
      - '.github/workflows/verify-ac-community-de-facto-administration-live.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-ac-community-de-facto-live
  cancel-in-progress: false

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Poll public source routes and visibility assets
        id: source
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = 'https://sbu001monterecco.github.io/por-derecho'
          suffix = f"source={os.environ['SOURCE_SHA'][:12]}&run={os.environ['RUN_ID']}"
          targets = {
            'es': (f'{base}/es/administracion-de-hecho-comunidad-ac/?{suffix}', ['data-ac-community-shadow-control-page="20260824"','718.663,24','1.145.798,29']),
            'en': (f'{base}/en/de-facto-administration-community-ac/?{suffix}', ['data-ac-community-shadow-control-page="20260824"','718,663.24','1,145,798.29']),
            'home_es': (f'{base}/es/?{suffix}', ['data-pd-five-ac="20260824b"','data-private-actor-card="05"','data-institution-card="administrator"','data-institution-card="judge"','data-linkage-row','Laura Patricia Acosta Matos']),
            'home_en': (f'{base}/en/?{suffix}', ['data-pd-five-ac="20260824b"','data-private-actor-card="05"','data-institution-card="administrator"','data-institution-card="judge"','data-linkage-row','Laura Patricia Acosta Matos']),
            'base_module': (f'{base}/assets/ac-community-de-facto-administration-20260820.js?{suffix}', ['data-ac-dfa-update','data-ac-dfa-crosslink']),
            'visibility_module': (f'{base}/assets/ac-de-facto-knowing-facilitation-visibility-20260820.js?{suffix}', ['Cinco administradores en la sombra alegados y una habilitación institucional activa','Five alleged shadow administrators and active institutional enablement','paquete de garantías','security package','data-ac-dfa-allegation-visibility','data-ac-dfa-impact-chain','data-ac-dfa-route-relevance']),
            'stability_module': (f'{base}/assets/ac-de-facto-knowing-facilitation-stability-20260820.js?{suffix}', ['panel.dataset.acDfaUpdate','panel.dataset.acDfaCrosslink','panels.slice(1).forEach(removePanel)','data.acDfaVisibilityStability']),
            'five_actor_module': (f'{base}/assets/homepage-actor-family-pwc-note-20260819.js?{suffix}', ["section.dataset.pdFiveAc = '20260824b'",'data-private-actor-card','data-institution-card','data-linkage-row','pd:five-actor-visual-ready']),
            'five_actor_css': (f'{base}/assets/five-actor-accountability-20260824.css?{suffix}', ['.pd-five-ac__cards','.pd-five-ac__institutional-grid','.pd-five-ac__linkage-row']),
            'audience_order': (f'{base}/assets/audience-experience-order-20260823.js?{suffix}', ["deduplicate('section[data-pd-five-ac]')",'audienceProtectedFiveActorVisual','fiveActorVisualVisible','pd:five-actor-visual-ready']),
            'loader': (f'{base}/assets/site.js?{suffix}', ['ac-community-de-facto-administration-20260820.js?v=20260824a','ac-de-facto-knowing-facilitation-visibility-20260820.js?v=20260824a','data-ac-de-facto-knowing-facilitation-visibility-loader','ac-de-facto-knowing-facilitation-stability-20260820.js?v=20260824a','data-ac-de-facto-knowing-facilitation-stability-loader','audience-experience-order-20260823.js?v=20260824b']),
            'sitemap': (f'{base}/sitemap-ac-community-de-facto-administration.xml?{suffix}', ['/por-derecho/es/administracion-de-hecho-comunidad-ac/','/por-derecho/en/de-facto-administration-community-ac/']),
            'robots': (f'{base}/robots.txt?{suffix}', ['sitemap-ac-community-de-facto-administration.xml'])
          }
          last = {}
          for attempt in range(1,31):
            checks, details = {}, {}
            for name,(url,markers) in targets.items():
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Por-Derecho-live-verifier/3.1','Cache-Control':'no-cache','Pragma':'no-cache'})
                with urllib.request.urlopen(req,timeout=25) as response:
                  body=response.read().decode('utf-8','replace')
                  checks[f'{name}_http']=response.status==200
                  checks[f'{name}_markers']=all(marker in body for marker in markers)
                  details[name]={'status':response.status,'bytes':len(body.encode('utf-8')),'markers':{m:m in body for m in markers}}
              except Exception as exc:
                checks[f'{name}_http']=False; checks[f'{name}_markers']=False; details[name]={'error':repr(exc)}
            last={'attempt':attempt,'source_sha':os.environ['SOURCE_SHA'],'run_id':os.environ['RUN_ID'],'checks':checks,'details':details}
            print(json.dumps(last,ensure_ascii=False,indent=2))
            if all(checks.values()):
              with open('/tmp/ac-dfa-source.json','w') as f: json.dump({'status':'SOURCE_LIVE_VERIFIED',**last},f,indent=2)
              raise SystemExit(0)
            time.sleep(5)
          with open('/tmp/ac-dfa-source.json','w') as f: json.dump({'status':'SOURCE_NOT_VERIFIED',**last},f,indent=2)
          raise SystemExit(1)
          PY
      - name: Use preinstalled Chrome with Playwright
        run: |
          npm install --no-save playwright@1.50.1
          BROWSER_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER_PATH"
          echo "PSR_BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
      - name: Verify rendered public pages and route classes
        id: dom
        continue-on-error: true
        env:
          PSR_BASE_URL: https://sbu001monterecco.github.io/por-derecho
          PSR_AC_DFA_ARTIFACT_DIR: artifacts/ac-community-de-facto-live
        run: node scripts/render_ac_community_de_facto_administration.mjs
      - name: Show verification evidence
        if: always()
        run: |
          cat /tmp/ac-dfa-source.json || true
          cat artifacts/ac-community-de-facto-live/result.json || true
      - name: Publish durable public-edge statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          DOM_OUTCOME: ${{ steps.dom.outcome }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          success = os.environ['SOURCE_OUTCOME'] == 'success' and os.environ['DOM_OUTCOME'] == 'success'
          repository = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['SOURCE_SHA']
          run_id = os.environ['RUN_ID']
          contexts = [
            ('pages-propagation/ac-community-de-facto-administration', 'AC–Community bilingual routes verified live'),
            ('pages-propagation/ac-de-facto-knowing-facilitation-visibility', 'De facto-management allegation visibility verified live')
          ]
          for context, success_description in contexts:
            payload = {
              'state': 'success' if success else 'failure',
              'target_url': f'https://github.com/{repository}/actions/runs/{run_id}',
              'description': success_description if success else 'AC de facto-management public-edge verification failed',
              'context': context
            }
            request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/statuses/{sha}',
              data=json.dumps(payload).encode('utf-8'),
              method='POST',
              headers={
                'Accept':'application/vnd.github+json',
                'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
                'Content-Type':'application/json',
                'X-GitHub-Api-Version':'2022-11-28',
                'User-Agent':'Por-Derecho-live-verifier/3.1'
              }
            )
            with urllib.request.urlopen(request,timeout=30) as response:
              print(response.read().decode('utf-8','replace'))
          PY
      - name: Fail when verification failed
        if: steps.source.outcome != 'success' || steps.dom.outcome != 'success'
        run: exit 1
