name: Evidence intelligence — RPL 2523 pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/evidence-intelligence/**'
      - '.github/workflows/evidence-intelligence-rpl2523-pilot.yml'
      - 'assets/data/calificacion-rpl2523-evidence-map-v1.json'
      - 'assets/data/matter-identity-registry-v1*.json'
      - 'archive/CALIFICACION_OPPOSITIONS_APPEALS_FIVE_PARTY_SOURCE_CONTROL_23AUG2026.md'
  push:
    branches: [main]
    paths:
      - '.github/evidence-intelligence/**'
      - '.github/workflows/evidence-intelligence-rpl2523-pilot.yml'
      - 'assets/data/calificacion-rpl2523-evidence-map-v1.json'
      - 'assets/data/matter-identity-registry-v1*.json'
      - 'archive/CALIFICACION_OPPOSITIONS_APPEALS_FIVE_PARTY_SOURCE_CONTROL_23AUG2026.md'

permissions:
  contents: read

jobs:
  validate-and-retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate identity compatibility and public/private boundary
        run: python .github/evidence-intelligence/scripts/validate_identity_compatibility.py --repo-root .
      - name: Run strict RPL 2523 retrieval proof
        run: >-
          python .github/evidence-intelligence/scripts/run_rpl2523_retrieval_pilot.py
          --repo-root .
          --output artifacts/evidence-intelligence/rpl2523-retrieval-results.json
      - name: Upload retrieval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpl2523-retrieval-proof-${{ github.sha }}
          path: artifacts/evidence-intelligence/rpl2523-retrieval-results.json
          if-no-files-found: warn
          retention-days: 30
