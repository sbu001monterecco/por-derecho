name: PD temporary ACTA projection regeneration

on:
  push:
    branches:
      - pd-mem-001-20260923-v3

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: pd-mem-001-20260923-v3
          fetch-depth: 1

      - name: Regenerate and validate deterministic projection
        run: |
          set -euo pipefail
          python3 scripts/build_community_acta_authority_interconnectivity.py
          python3 scripts/build_community_acta_authority_interconnectivity.py --check
          python3 scripts/validate_community_acta_authority_interconnectivity.py

      - name: Commit projection and self-remove runner
        run: |
          set -euo pipefail
          rm .github/workflows/pd-temp-regenerate-acta-projection.yml
          git add assets/data/community-acta-authority-interconnectivity-v1.json .github/workflows/pd-temp-regenerate-acta-projection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate stale ACTA authority projection"
          git push origin HEAD:pd-mem-001-20260923-v3
