name: Validate Puzzle continuity and external devices

on:
  pull_request:
    paths:
      - 'assets/puzzle-hybrid-viewer-20260904.js'
      - 'assets/puzzle-public-interest-continuity-20260905.js'
      - 'data/puzzle/**'
      - 'en/puzzle/**'
      - 'es/puzzle/**'
      - 'assets/site.js'
      - 'scripts/validate_puzzle_continuity_public_interest.py'
      - '.github/governance/PUZZLE_CONTINUITY_PUBLIC_INTEREST_ALERTADOR_STANDARD_05SEP2026.md'
      - '.github/workflows/validate-puzzle-continuity-public-interest.yml'
  push:
    branches: [main]
    paths:
      - 'assets/puzzle-hybrid-viewer-20260904.js'
      - 'assets/puzzle-public-interest-continuity-20260905.js'
      - 'data/puzzle/**'
      - 'en/puzzle/**'
      - 'es/puzzle/**'
      - 'assets/site.js'
      - 'scripts/validate_puzzle_continuity_public_interest.py'
      - '.github/governance/PUZZLE_CONTINUITY_PUBLIC_INTEREST_ALERTADOR_STANDARD_05SEP2026.md'
      - '.github/workflows/validate-puzzle-continuity-public-interest.yml'

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_puzzle_continuity_public_interest.py
      - run: node --check assets/puzzle-hybrid-viewer-20260904.js
      - run: node --check assets/puzzle-public-interest-continuity-20260905.js

  external-device-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Simulate desktop tablet iPhone Android against public Pages
        env:
          BASE: https://sbu001monterecco.github.io/por-derecho
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const devices = [
            ['desktop',{width:1440,height:900}],
            ['tablet',{width:768,height:1024}],
            ['iphone',{width:390,height:844}],
            ['android',{width:412,height:915}],
          ];
          const routes=['/en/puzzle/','/es/puzzle/'];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const failures=[];
            for(const [name,viewport] of devices){
              const page=await browser.newPage({viewport});
              const jsErrors=[];
              page.on('pageerror',e=>jsErrors.push(String(e)));
              for(const route of routes){
                let response=null;
                for(let attempt=0;attempt<8;attempt++){
                  try { response=await page.goto(process.env.BASE+route+'#p10',{waitUntil:'domcontentloaded',timeout:30000}); }
                  catch(e){}
                  if(response && response.ok()) break;
                  await sleep(15000);
                }
                if(!response || !response.ok()){ failures.push(`${name} ${route}: HTTP unavailable`); continue; }
                await page.waitForTimeout(2500);
                const result=await page.evaluate(()=>({
                  viewer:!!document.querySelector('[data-pd-puzzle-viewer]'),
                  continuity:!!document.querySelector('[data-pd-puzzle-continuity]'),
                  pageInput:document.querySelector('[data-page-input]')?.value,
                  pdfState:document.querySelector('[data-pd-puzzle-viewer]')?.dataset.pdfState,
                  download:!!document.querySelector('[data-pd-puzzle-download], [data-original-pdf][download]'),
                  overflow:document.documentElement.scrollWidth > document.documentElement.clientWidth + 4
                }));
                console.log(name,route,result);
                if(!result.viewer) failures.push(`${name} ${route}: viewer absent`);
                if(!result.continuity) failures.push(`${name} ${route}: continuity layer absent`);
                if(result.pageInput!=='10') failures.push(`${name} ${route}: #p10 did not resolve`);
                if(!result.download) failures.push(`${name} ${route}: download control absent`);
                if(result.overflow) failures.push(`${name} ${route}: horizontal overflow`);
              }
              if(jsErrors.length) failures.push(`${name}: JS errors ${jsErrors.join(' | ')}`);
              await page.close();
            }
            await browser.close();
            if(failures.length){ console.error(failures.join('\n')); process.exit(1); }
          })();
          NODE
