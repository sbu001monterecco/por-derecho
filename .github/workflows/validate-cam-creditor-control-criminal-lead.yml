      - 'assets/prosecution-public-entry-20260821.js'
      - 'assets/audience-experience-order-20260823.js'
      - 'assets/sitewide-discovery-nav-20260821.js'
      - 'en/index.html'
      - 'es/index.html'
      - 'en/cam-creditor-control-shadow-administration-judicial-omission/**'
      - 'es/control-acreedor-cam-administracion-hecho-omision-judicial/**'
      - 'en/insolvency-36-2012-insolvency-administrator/**'
      - 'es/concurso-36-2012-administrador-concursal/**'
      - 'en/de-facto-administration-community-ac/**'
      - 'es/administracion-de-hecho-comunidad-ac/**'
      - 'assets/calificacion-2018-creditor-material-control-20260816.js'
      - 'publication-manifests/ac-community-de-facto-administration-2026-08-20.json'
      - 'sitemap.xml'
      - 'sitemap-criminal-engineering.xml'
      - 'publication-manifests/cam-creditor-control-criminal-lead-20260823.json'
      - 'deployment-probes/cam-creditor-control-criminal-lead-20260823.json'
      - 'docs/deletion-audits/2026-08-23-cam-creditor-control-criminal-lead-thread.md'
      - 'scripts/validate_cam_creditor_control_criminal_lead.py'
      - 'scripts/validate_audience_experience.py'
      - 'scripts/render_audience_experience.mjs'
      - '.github/workflows/validate-cam-creditor-control-criminal-lead.yml'
      - '.github/workflows/validate-audience-experience.yml'
  push:
    branches: [main]
    paths:
      - 'archive/EXPRESS_CRIMINAL_ATTRIBUTION_NON_DILUTION_SOURCE_FIDELITY_RULE_23AUG2026.md'
      - 'archive/IDENTITY_CONTROL_LAURA_PATRICIA_ACOSTA_MATOS_23AUG2026.md'
      - 'archive/CAM_2017_2018_DIRECT_INSTRUCTION_LENDER_POSSESSION_SHADOW_ADMINISTRATION_JUDICIAL_OMISSION_LEAD_23AUG2026.md'
      - 'archive/CORRECTION_REGISTER_CAM_7JUNE_CRIMINAL_LEAD_ADDENDUM_23AUG2026.md'
      - 'archive/MISSING_EVIDENCE_REGISTER_CAM_7JUNE_CRIMINAL_LEAD_ADDENDUM_23AUG2026.md'
      - 'archive/CONTINUOUS_MAINTENANCE_MATRIX_CAM_7JUNE_CRIMINAL_LEAD_ADDENDUM_23AUG2026.md'
      - 'assets/data/cam-creditor-control-criminal-lead-v1.json'
      - 'assets/cam-direct-instruction-shadow-admin-judicial-omission-20260823.js'
      - 'assets/prosecution-public-entry-20260821.js'
      - 'assets/audience-experience-order-20260823.js'
      - 'assets/sitewide-discovery-nav-20260821.js'
      - 'en/index.html'
      - 'es/index.html'
      - 'en/cam-creditor-control-shadow-administration-judicial-omission/**'
      - 'es/control-acreedor-cam-administracion-hecho-omision-judicial/**'
      - 'en/insolvency-36-2012-insolvency-administrator/**'
      - 'es/concurso-36-2012-administrador-concursal/**'
      - 'en/de-facto-administration-community-ac/**'
      - 'es/administracion-de-hecho-comunidad-ac/**'
      - 'assets/calificacion-2018-creditor-material-control-20260816.js'
      - 'publication-manifests/ac-community-de-facto-administration-2026-08-20.json'
      - 'sitemap.xml'
      - 'sitemap-criminal-engineering.xml'
      - 'publication-manifests/cam-creditor-control-criminal-lead-20260823.json'
      - 'deployment-probes/cam-creditor-control-criminal-lead-20260823.json'
      - 'docs/deletion-audits/2026-08-23-cam-creditor-control-criminal-lead-thread.md'
      - 'scripts/validate_cam_creditor_control_criminal_lead.py'
      - 'scripts/validate_audience_experience.py'
      - 'scripts/render_audience_experience.mjs'
      - '.github/workflows/validate-cam-creditor-control-criminal-lead.yml'
      - '.github/workflows/validate-audience-experience.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-cam-creditor-control-criminal-lead-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Validate direct attribution, source fidelity, contrary record and non-finding boundaries
        run: python3 scripts/validate_cam_creditor_control_criminal_lead.py
      - name: Validate related audience source contract
        run: python3 scripts/validate_audience_experience.py
      - name: Validate JavaScript syntax
        run: |
          node --check assets/cam-direct-instruction-shadow-admin-judicial-omission-20260823.js
          node --check assets/prosecution-public-entry-20260821.js
          node --check assets/audience-experience-order-20260823.js
          node --check scripts/render_audience_experience.mjs
