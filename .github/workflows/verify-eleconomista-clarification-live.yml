name: Verify elEconomista source-status clarification live

on:
  push:
    branches: [main]
    paths:
      - 'assets/traceability-crosslinks-20260821.js'
      - 'assets/site.js'
      - '.github/workflows/verify-eleconomista-clarification-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Use preinstalled browser
        run: |
          npm install --no-save playwright@1.50.1
          BROWSER_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER_PATH"
          echo "PSR_BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"

      - name: Verify rendered clarification on ES and EN routes
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const base = 'https://sbu001monterecco.github.io/por-derecho';
          const sha = process.env.GITHUB_SHA || 'manual';
          const targets = [
            {
              key: 'es',
              url: `${base}/es/eleconomista-javier-romera-enero2025/?source=${sha.slice(0,12)}`,
              markers: ['NO FIRME', 'LPB ≠ SUN PARK', 'MEETING POINT NO RESUELTO', 'El documento que detuvo la publicación no contestó la pregunta factual']
            },
            {
              key: 'en',
              url: `${base}/en/eleconomista-javier-romera-january2025/?source=${sha.slice(0,12)}`,
              markers: ['NOT FINAL', 'LPB ≠ SUN PARK', 'MEETING POINT UNDECIDED', 'The document that stopped publication did not answer the factual question']
            }
          ];

          (async () => {
            const browser = await chromium.launch({headless: true, executablePath: process.env.PSR_BROWSER_PATH});
            let ok = false;
            let last = [];
            for (let attempt = 1; attempt <= 36; attempt++) {
              ok = true;
              last = [];
              for (const t of targets) {
                const page = await browser.newPage();
                try {
                  await page.goto(t.url, {waitUntil: 'networkidle', timeout: 60000});
                  const el = page.locator('#eleconomista-source-status-clarification-20260821');
                  const count = await el.count();
                  const text = count ? await el.innerText() : '';
                  const markers = Object.fromEntries(t.markers.map(m => [m, text.includes(m)]));
                  const passed = count === 1 && Object.values(markers).every(Boolean);
                  ok = ok && passed;
                  last.push({key: t.key, count, markers, passed});
                } catch (err) {
                  ok = false;
                  last.push({key: t.key, error: String(err), passed: false});
                } finally {
                  await page.close();
                }
              }
              console.log(JSON.stringify({attempt, ok, last}, null, 2));
              if (ok) break;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            await browser.close();
            if (!ok) process.exit(1);
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
