name: Validate lender-liability architecture

on:
  pull_request:
    paths:
      - "research/lender-of-record-liability/**"
      - "en/lender-of-record/liability/**"
      - "es/acreedor-de-registro/responsabilidad/**"
      - "sitemap-lender-liability.xml"
      - "robots.txt"
      - ".github/workflows/validate-lender-liability.yml"
  push:
    branches: [main]
    paths:
      - "research/lender-of-record-liability/**"
      - "en/lender-of-record/liability/**"
      - "es/acreedor-de-registro/responsabilidad/**"
      - "sitemap-lender-liability.xml"
      - "robots.txt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate structured lender-liability data
        run: python research/lender-of-record-liability/validate.py
      - name: Check bilingual public routes and reciprocal alternates
        run: |
          test -f en/lender-of-record/liability/index.html
          test -f es/acreedor-de-registro/responsabilidad/index.html
          grep -q 'hreflang="es"' en/lender-of-record/liability/index.html
          grep -q 'hreflang="en"' es/acreedor-de-registro/responsabilidad/index.html
          grep -q '/es/acreedor-de-registro/responsabilidad/' en/lender-of-record/liability/index.html
          grep -q '/en/lender-of-record/liability/' es/acreedor-de-registro/responsabilidad/index.html
          grep -q 'sitemap-lender-liability.xml' robots.txt
