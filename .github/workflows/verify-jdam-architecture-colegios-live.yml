name: Verify JDAM architecture record live

on:
  push:
    branches: [main]
    paths:
      - "es/arquitectura-nodo-documental-jdam/**"
      - "en/architecture-documentary-node-jdam/**"
      - "assets/jdam-*"
      - "assets/site.js"
      - "sitemap-jdam-architecture.xml"
      - "robots.txt"
      - "scripts/verify_jdam_architecture_colegios_live.py"
      - ".github/workflows/verify-jdam-architecture-colegios-live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-jdam-architecture-live
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify GitHub Pages public edge
        run: python scripts/verify_jdam_architecture_colegios_live.py
