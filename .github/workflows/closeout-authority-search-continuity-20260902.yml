          }

          machine = {
              'schema': 'por-derecho.workspace-handoff.v1',
              'handoff_id': handoff_id,
              'workspace_id': workspace_id,
              'date': '2026-09-02',
              'status': 'DELETION_SAFE_WITH_OPEN_WORK',
              'repository': 'sbu001monterecco/por-derecho',
              'authoritative_baseline_sha': baseline,
              'publication': {
                  'state': 'LIVE_VERIFIED',
                  'primary_pr': 1347,
                  'visibility_hotfix_pr': 1351,
                  'merge_sha': baseline,
                  'pages_run_id': 33622844666,
                  'live_browser_run_id': 33623082252,
                  'artifact_id': 9843703946,
                  'artifact_sha256': '2738c514d4523d9a645233db848b5d51d457e23ce7598b3e89e2149bc0fd0fd9',
                  'indexed_entries': 464
              },
              'authority_state': {
                  'control_id': 'PD-SP-JUSTICE-AUTHORITY-CURRENT-20260902-01',
                  'governance_path': '.github/governance/JUDICIAL_PROSECUTORIAL_AUTHORITY_REGISTER_CONTINUITY_02SEP2026.md',
                  'named_people': 59,
                  'caret_confirmed': 56,
                  'caret_pending': 3,
                  'caret_suspended': 0,
                  'historic_docket_backfill': 'OPEN_NOT_CERTIFIED_COMPLETE'
              },
              'key_ids': {
                  'master_provincial_court': 'PD-SP-I-0044',
                  'provincial_court_section_2': 'PD-SP-I-0025',
                  'provincial_court_section_4': 'PD-SP-I-0014',
                  'dp748': 'PD-SP-R-0003',
                  'graciela_perez_valencia': 'PD-SP-P-0147',
                  'ricardo_mosteyrin': 'PD-SP-P-0058',
                  'auren_reestructuraciones_slp': 'PD-SP-O-0070'
              },
              'action_ledger': action_ledger
          }
          Path(handoff_json_path).parent.mkdir(parents=True, exist_ok=True)
          Path(handoff_json_path).write_text(json.dumps(machine, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          md = f'''# Justice authority / caret search — live closeout and successor handoff

**Handoff ID:** `{handoff_id}`  
**Workspace ID:** `{workspace_id}`  
**Date:** 2 September 2026  
**Status:** `DELETION_SAFE_WITH_OPEN_WORK`  
**Release state:** `LIVE_VERIFIED`

## 1. Scope

This workspace is the durable continuation object for the 2 September 2026 judicial/prosecutorial authority-register, CAEPR caret-search and court-hierarchy release. It closes the continuity gap that existed when the release was already merged/live but had not yet been assigned its own `PD-WS-*` workspace entry.

A new thread must treat the repository, not the originating chat, as the system of record.

## 2. Authoritative repository and publication state

- Verified publication baseline before this continuity PR: `{baseline}`.
- Primary authority/search release: PR **#1347**, merged at `5e12444f44b27b3c94d7bc31c80e2d56ef58bb08`.
- Visibility repair: PR **#1351**, final release SHA `{baseline}`.
- GitHub Pages run **33622844666 / #1401**: build, status and deployment successful for the exact final release SHA.
- Final public Chromium run **33623082252**: successful ES/EN live verification.
- Verification artifact **9843703946**, SHA-256 `2738c514d4523d9a645233db848b5d51d457e23ce7598b3e89e2149bc0fd0fd9`.
- Live canonical search indexed **464** entries at verification.

The final browser run verified visible top-level search controls in both languages, outside closed `<details>`, canonical-name/full-ID/caret/NIG/Master-ID queries, and representative HTTP-200 click-throughs.

## 3. Controlling authority state

Authority governance is `.github/governance/JUDICIAL_PROSECUTORIAL_AUTHORITY_REGISTER_CONTINUITY_02SEP2026.md`, control `PD-SP-JUSTICE-AUTHORITY-CURRENT-20260902-01`.

Current source-identified justice-professional denominator:

- **59** named people;
- **56** `CARET_CONFIRMED`;
- **3** `CARET_PENDING`;
- **0** suspended.

This means **CURRENT SOURCE-IDENTIFIED DENOMINATOR VERIFIED**. It does **not** mean every historic/current official docket has been obtained or that every role is certified complete.

The release also preserves the court hierarchy rather than collapsing organs:

- `PD-SP-I-0044` — Audiencia Provincial de Las Palmas, master institution;
- `PD-SP-I-0025` — Sección Segunda;
- `PD-SP-I-0014` — Sección Cuarta.

## 4. Search and caret contract

The bilingual homepage search resolves current CAEPR / public Master Proceedings data by names/aliases, proceeding references, NIG, Master IDs, full `PD-SP-*` IDs, typed carets and numeric carets. Representative live checks included:

- Graciela Pérez-Valencia Díaz → `PD-SP-P-0147` → `^P-0147` / `^0147`;
- DP 748/2026 → `PD-SP-R-0003` → `^R-0003` → NIG `3802343220260002351` → `TF-CRI-003`;
- Audiencia Provincial de Las Palmas → `PD-SP-I-0044` → `^I-0044` / `^0044`;
- Sección Segunda → `PD-SP-I-0025`;
- Ricardo de Mosteyrín Sampalo → `PD-SP-P-0058`;
- AUREN REESTRUCTURACIONES SLP → `PD-SP-O-0070` → `^O-0070`.

A search hit or displayed caret never expands the evidential meaning of identity confirmation.

## 5. Continuity and evidence boundaries

Every source-supported Judge/Magistrate, LAJ and Fiscal is registered once under an immutable person ID and linked act-by-act/date-by-date. Courts and Fiscalía offices remain separate institution identities. Unknown applicable identities are explicit gaps, never silent blanks. Historical substitutions append; they do not overwrite earlier capacity.

Do not infer conduct, authorship, knowledge, intent, bias, wrongdoing, liability or outcome from identity, office, heading, signature or searchability alone.

## 6. Publication state is not filing state

For this workspace:

- repository release = merged;
- public website = deployed;
- ES/EN search and representative routes = live verified;
- institutional filing/service/email/social publication = separate processes and are not created by this closeout.

## 7. Open work

1. **Historic/current official-docket backfill — P1.** Continue obtaining primary/certified docket sources. Each newly recoverable Judge/Magistrate, LAJ or Fiscal must be canonically registered or an explicit source-defined gap retained.
2. **Proceeding-role completeness — P2.** Continue toward explicit authority-role states on every applicable Master Proceedings row; do not call global historic coverage complete before that denominator is closed.
3. **Concurrent proceedings-interconnectivity successor-hash drift — P2.** Reconcile against the then-current `main` as a separate control-plane issue; do not weaken unrelated gates.

## 8. Controlling read order for a successor

1. `CURRENT_WORKSPACE_HANDOFF.md`
2. this handoff
3. `{handoff_json_path}`
4. `.github/governance/JUDICIAL_PROSECUTORIAL_AUTHORITY_REGISTER_CONTINUITY_02SEP2026.md`
5. `assets/data/justice-authority-register-current-v2.json`
6. `.github/governance/CAEPR_CARET_IDENTITY_AND_ALL_IS_VERIFICATION_PROTOCOL_26AUG2026.md`
