              raise SystemExit(f'workspace already exists: {workspace_id}')
          if any(value.startswith('PD-WS-20260902-') for value in ids):
              raise SystemExit(f'2026-09-02 workspace collision: {[value for value in ids if value.startswith("PD-WS-20260902-")]}')

