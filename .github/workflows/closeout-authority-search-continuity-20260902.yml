          new_boot = f'''## New-thread bootstrap

> Continue `{workspace_id}` from repository continuity state, not prior chat memory. Read `CURRENT_WORKSPACE_HANDOFF.md`, `{handoff_md_path}`, its machine companion, the judicial/prosecutorial authority continuity control and the current authority/CAEPR/Master Proceedings controls. Re-fetch current `main` before changes. Preserve explicit historic-docket gaps and act/date/capacity boundaries. Do not re-run broad discovery unless the handoff identifies a stale gap. Then continue the priority proceeding, currently E.G. 745/2026, using this verified authority/caret/search layer as the continuity substrate.'''
          pointer = pointer[:start] + new_boot + pointer[end:]
          pointer_path.write_text(pointer, encoding='utf-8')
          PY

      - name: Validate continuity and authority contracts
        run: |
          python3 -m py_compile scripts/workspace_persistence.py
          python3 -m unittest discover -s tests -p 'test_workspace_persistence.py' -v
          mkdir -p artifacts/workspace-persistence-audit
