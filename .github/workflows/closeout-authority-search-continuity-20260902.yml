              'workspace_id': workspace_id,
              'title': 'Judicial/prosecutorial authority register, caret search and court-hierarchy release',
              'status': 'DELETION_SAFE_WITH_OPEN_WORK',
              'current_handoff_id': handoff_id,
              'handoff_path': handoff_md_path,
              'machine_handoff_path': handoff_json_path,
              'topic_keys': [
                  'JUSTICE_AUTHORITY', 'CARET', 'CAEPR', 'JUDGES', 'LAJ', 'FISCALIA',
                  'FISCALES', 'COURT_HIERARCHY', 'HOMEPAGE_SEARCH', 'CONTINUITY'
              ],
