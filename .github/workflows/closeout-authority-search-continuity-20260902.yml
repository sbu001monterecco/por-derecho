        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: continuity/authority-search-live-closeout-20260902
          fetch-depth: 0
          persist-credentials: true

      - name: Register durable workspace and handoff
        shell: bash
        run: |
          python3 - <<'PY'
