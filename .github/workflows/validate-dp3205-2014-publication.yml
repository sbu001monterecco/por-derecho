name: Validate 3205/2014 Arrecife publication

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile validator
        run: python -B -m py_compile scripts/validate_dp3205_2014_publication.py
      - name: Validate actor/action matrix JSON
        run: python -B -m json.tool assets/data/dp3205-contemporaneous-retrospective-actor-action-matrix-v1.json >/dev/null
      - name: Validate identity, temporal ledgers, actor actions, privacy, translation and interlinks
        run: python -B scripts/validate_dp3205_2014_publication.py
