name: AWESWELL identity guard
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate canonical identity and repository text
        run: python3 scripts/validate_aweswell_identity.py --all
      - name: Exercise outbound fail-closed preflight
        run: |
          printf '%s\n' 'AWESWELL LIMITED (company number 07716847)' | python3 scripts/validate_aweswell_identity.py --outbound -
          if printf '%s\n' 'Oswell Limited' | python3 scripts/validate_aweswell_identity.py --outbound -; then
            echo "Expected forbidden variant to fail" >&2
            exit 1
          fi
