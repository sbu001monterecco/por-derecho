name: Migrate GC-HC-010 master projection — manual check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gc-hc-010-master-projection-migration-check
  cancel-in-progress: true

jobs:
  migrate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Apply deterministic Reg. No. 24 correction in the runner only
        run: python3 scripts/migrate_gc_hc_010_master_projection_04sep2026.py

      - name: Validate Control 21-22-24 continuity
        run: python3 scripts/validate_control_21_22_24_continuity.py

      - name: Assert canonical projection is already current
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- archive/PROCEEDINGS_MASTER_REGISTER.csv assets/data/proceedings-master-public-v1.json; then
            echo 'GC-HC-010 canonical row and public projection are already current.'
            exit 0
          fi
          echo '::error::Deterministic migration still produces a canonical delta. Review it and publish through a separately authorized PR; this diagnostic workflow is intentionally read-only.'
          git --no-pager diff -- archive/PROCEEDINGS_MASTER_REGISTER.csv assets/data/proceedings-master-public-v1.json
          exit 1

      - name: Audit broader master proceedings publication
        continue-on-error: true
        run: python3 scripts/audit_master_proceedings_publication.py

# One-off migration automation retired from push-triggered publication on 04-Sep-2026.
# This preserved workflow is now a read-only/manual diagnostic; it cannot push or open PRs.
