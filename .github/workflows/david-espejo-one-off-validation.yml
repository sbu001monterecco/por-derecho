name: One-off validate David Espejo branch

on:
  push:
    branches:
      - codex/david-espejo-evidence-sync-20260825
    paths:
      - '.github/workflows/david-espejo-one-off-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/david-espejo-evidence-sync-20260825
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all bilingual evidence and discovery routes
        run: python scripts/validate_david_espejo_evidence_sync.py
