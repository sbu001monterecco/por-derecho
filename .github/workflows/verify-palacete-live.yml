# SCRATCH TRANSPORT ONLY — never merge this branch.
# The short-lived download capability below contains only the image expressly
# authorized for public publication; no private legal records are transferred.
# Final publication keeps neither this workflow nor the temporary URL.
name: Scratch DP1901 exact image transfer
on:
  push:
    branches: ['worker/dp1901-image-transfer-20260921']
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'sbu001monterecco/por-derecho' && github.ref == 'refs/heads/worker/dp1901-image-transfer-20260921'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Import exact public illustration as immutable blob only
        env:
          IMAGE_SOURCE: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-e45c-81f4-a142-8da971bdba2a/raw?se=2026-09-20T23%3A56%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=3b342bc0-b8bf-5b1f-aa7a-394c7e7f8e08&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T15%3A42%3A30Z&ske=2026-09-21T15%3A42%3A30Z&sks=b&skv=2026-02-06&sig=z7IKsyWCGqJozaHqdnXEOmZsALno1CH1Gq8TUXMJbfw%3D'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.parse, urllib.request
          source = os.environ['IMAGE_SOURCE']
          print('::add-mask::' + source)
          p = urllib.parse.urlparse(source)
          assert p.scheme == 'https' and p.hostname and p.hostname.endswith('.oaiusercontent.com')
          try:
              with urllib.request.urlopen(source, timeout=40) as response:
                  image = response.read(4000000)
          except Exception:
              raise SystemExit('IMAGE_TRANSFER_DOWNLOAD_FAILED; source URL withheld')
          expected = 'ca301b92c670abcaa691bbd5b569dfb971034595c300238369e265f861fe947d'
          assert len(image) == 2590908 and image.startswith(b'\x89PNG\r\n\x1a\n'), 'Image size/type mismatch'
          assert hashlib.sha256(image).hexdigest() == expected, 'Image hash mismatch'
          git_sha = hashlib.sha1(b'blob ' + str(len(image)).encode() + b'\0' + image).hexdigest()
          request = urllib.request.Request('https://api.github.com/repos/sbu001monterecco/por-derecho/git/blobs', data=json.dumps({'content': base64.b64encode(image).decode(), 'encoding':'base64'}).encode(), method='POST', headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json', 'X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          assert result['sha'] == git_sha, 'Remote blob mismatch'
          print(json.dumps({'status':'EXACT_IMAGE_BLOB_STORED','bytes':len(image),'sha256':expected,'git_blob_sha':git_sha,'branches_changed':False,'deployment_performed':False}))
          PY
