# SCRATCH TRANSPORT ONLY — never merge this branch.
# Production verifier remains unchanged on main. No ref/main writes or deploys.
name: Scratch DP1901 exact image assembly
on:
  push:
    branches: ['worker/dp1901-image-transfer-20260921']
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'sbu001monterecco/por-derecho' && github.ref == 'refs/heads/worker/dp1901-image-transfer-20260921'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install pinned image decoder
        run: python3 -m pip install --quiet Pillow==11.3.0
      - name: Assemble hash-controlled public image and create immutable delivery blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, urllib.request
          from PIL import Image
          api='https://api.github.com/repos/sbu001monterecco/por-derecho'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'}
          def request(path, data=None):
              req=urllib.request.Request(api+path,data=None if data is None else json.dumps(data).encode(),headers=headers,method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req,timeout=60) as r: return json.load(r)
          segments=['886eb0f80f4308232c7d0e9d60973d157c11edd8','e6dea9d8700fa5a915b32e9e6c11f24b419088ba','c9a4d1db6af27ddd7ee164915b70ae022f82cfe7','3d81768fd8d6ad8f9c6e4a3de2abd03c7fef20d6','47ed0ef8360bbee9069cd3d624f4a601aac796eb','bd56bf9c03bd6ee93da7456df3ad8fe935f407ac','ee93d6dbeef45dadfa5344548836797b19a3c927','8a5569d87284040c265160552e408c5402739332']
          image=b''.join(base64.b64decode(request('/git/blobs/'+sha)['content']) for sha in segments)
          assert len(image)==59248
          assert hashlib.sha256(image).hexdigest()=='24d6993e0d546903248c83d5da273d26a91817663c6ea3329d1dd332919f4997'
          decoded=Image.open(io.BytesIO(image)); decoded.load(); assert decoded.size==(1055,1491)
          def store(data,label):
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              result=request('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              assert result['sha']==sha
              print(json.dumps({'asset':label,'git_blob_sha':sha,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'dimensions':list(decoded.size)}))
          store(image,'optimized-avif-rendition')
          jpeg=io.BytesIO(); decoded.convert('RGB').save(jpeg,format='JPEG',quality=94,optimize=True,progressive=True)
          store(jpeg.getvalue(),'jpeg-share-rendition-from-avif')
          print('VERIFIED_PUBLIC_IMAGE_BLOBS_CREATED; NO_BRANCH_MUTATION_OR_DEPLOYMENT')
          PY
