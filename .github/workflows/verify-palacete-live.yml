# SCRATCH TRANSPORT ONLY. This branch must never be merged.
# Reuses an existing dispatchable workflow filename only in an isolated worker ref.
# No branch/main writes, no deployment, no change to the production verifier.
name: Scratch DP1901 exact image transfer
on:
  workflow_dispatch:
    inputs:
      image_source:
        description: 'Temporary source for the expressly authorized public illustration'
        required: true
        type: string
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'sbu001monterecco/por-derecho' && github.ref == 'refs/heads/worker/dp1901-image-transfer-20260921' && github.actor == 'sbu001monterecco'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Import exact public illustration as immutable blob only
        env:
          IMAGE_SOURCE: ${{ inputs.image_source }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.parse, urllib.request
          source = os.environ['IMAGE_SOURCE']
          print('::add-mask::' + source)
          p = urllib.parse.urlparse(source)
          assert p.scheme == 'https' and p.hostname and p.hostname.endswith('.oaiusercontent.com'), 'Unapproved image source host'
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  h = urllib.parse.urlparse(newurl)
                  assert h.scheme == 'https' and h.hostname and h.hostname.endswith('.oaiusercontent.com'), 'Redirect host rejected'
                  return super().redirect_request(req, fp, code, msg, headers, newurl)
          opener = urllib.request.build_opener(SafeRedirect())
          try:
              with opener.open(source, timeout=40) as response:
                  image = response.read(4000000)
          except Exception:
              raise SystemExit('IMAGE_TRANSFER_DOWNLOAD_FAILED; source URL withheld')
          expected = 'ca301b92c670abcaa691bbd5b569dfb971034595c300238369e265f861fe947d'
          assert len(image) == 2590908 and image.startswith(b'\x89PNG\r\n\x1a\n'), 'Image size/type mismatch'
          assert hashlib.sha256(image).hexdigest() == expected, 'Image hash mismatch'
          git_sha = hashlib.sha1(b'blob ' + str(len(image)).encode() + b'\0' + image).hexdigest()
          request = urllib.request.Request('https://api.github.com/repos/sbu001monterecco/por-derecho/git/blobs', data=json.dumps({'content': base64.b64encode(image).decode(), 'encoding':'base64'}).encode(), method='POST', headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json', 'X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          assert result['sha'] == git_sha, 'Remote blob mismatch'
          print(json.dumps({'status':'EXACT_IMAGE_BLOB_STORED', 'bytes':len(image), 'sha256':expected, 'git_blob_sha':git_sha, 'branches_changed':False, 'deployment_performed':False}))
          PY
