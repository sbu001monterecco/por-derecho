name: Audit master proceedings publication

on:
  pull_request:
    paths:
      - 'archive/PROCEEDINGS_MASTER_REGISTER.csv'
      - 'archive/PROCEEDINGS_MASTER_REGISTER_PROTOCOL.md'
      - 'archive/MASTER_PROCEEDINGS_PUBLICATION_GOVERNANCE_30AUG2026.md'
      - 'en/master-proceedings-register/index.html'
      - 'es/registro-maestro-procedimientos/index.html'
      - 'assets/master-proceedings-publication-20260830.js'
      - 'assets/master-proceedings-publication-20260830.css'
      - 'assets/site.js'
      - 'scripts/audit_master_proceedings_publication.py'
      - 'publication-manifests/master-proceedings-publication-20260830.json'
      - '.github/workflows/audit-master-proceedings-publication.yml'
  push:
    branches:
      - main
    paths:
      - 'archive/PROCEEDINGS_MASTER_REGISTER.csv'
      - 'archive/PROCEEDINGS_MASTER_REGISTER_PROTOCOL.md'
      - 'archive/MASTER_PROCEEDINGS_PUBLICATION_GOVERNANCE_30AUG2026.md'
      - 'en/master-proceedings-register/index.html'
      - 'es/registro-maestro-procedimientos/index.html'
      - 'assets/master-proceedings-publication-20260830.js'
      - 'assets/master-proceedings-publication-20260830.css'
      - 'assets/site.js'
      - 'scripts/audit_master_proceedings_publication.py'
      - 'publication-manifests/master-proceedings-publication-20260830.json'
      - '.github/workflows/audit-master-proceedings-publication.yml'

permissions:
  contents: read

jobs:
  master-proceedings-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Audit public procedural spine
        run: python scripts/audit_master_proceedings_publication.py
