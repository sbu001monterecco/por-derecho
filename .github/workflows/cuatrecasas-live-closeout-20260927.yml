name: Verify deployed Cuatrecasas correction
on:
  push:
    branches: [agent/cuatrecasas-live-closeout-20260927]
    paths: [.github/workflows/cuatrecasas-live-closeout-20260927.yml]
permissions:
  contents: read
concurrency:
  group: cuatrecasas-live-closeout-20260927
  cancel-in-progress: false
jobs:
  read-public-responses:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify 20 actual pages and current JSON independently of merge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, datetime, hashlib, json, urllib.request
          SHA='63ad08395d04eed885067a49faaca1a25f37a448'
          RAW='https://raw.githubusercontent.com/sbu001monterecco/por-derecho/'+SHA+'/'
          BASE='https://sbu001monterecco.github.io/por-derecho/'
          MARKER='cuatrecasas-position-status-20260927'
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'PorDerecho-LiveVerification/1','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=35) as r:
                  b=r.read(2500000)
                  return r.status,r.geturl(),b
          _,_,blob=fetch(RAW+'ops/cuatrecasas-position-status-source-receipt-20260927.json')
          source=json.loads(blob)
          pages=[x for x in source['changed'] if x['path'].endswith('.html')]
          assert len(pages)==20, 'Unexpected scope'
          def verify(row):
              p=row['path'];url=BASE+p.removesuffix('index.html')+'?review='+SHA
              result={'path':p,'url':url}
              try:
                  status,final,b=fetch(url);s=b.decode('utf-8');h=hashlib.sha256(b).hexdigest()
                  result.update(http_status=status,final_url=final,bytes=len(b),live_sha256=h,
                                source_sha256=row['after_sha256'],source_bytes_equal=h==row['after_sha256'],
                                marker_present=('id="'+MARKER+'"') in s,
                                stale_client_sentence=('formal client status varies by workstream' in s or 'condición de cliente formal varía según workstream' in s))
                  result['pass']=status==200 and result['marker_present'] and not result['stale_client_sentence']
              except Exception as e: result.update(error=str(e),pass_=False);result['pass']=False
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results=list(pool.map(verify,pages))
          for r in results: print('LIVE_PAGE '+json.dumps(r,ensure_ascii=False,sort_keys=True))
          path='assets/data/cuatrecasas-whole-claim-architecture-v1.json'
          status,final,b=fetch(BASE+path+'?review='+SHA)
          live=json.loads(b)
          check={'http_status':status,'final_url':final,'live_sha256':hashlib.sha256(b).hexdigest(),
                 'categorical_position':live.get('current_position_20260927',{}).get('status')=='ATTRIBUTED_FIRST_HAND_CLIENT_STATEMENT_NOT_JUDICIAL_FINDING',
                 'dp748_processing':live.get('current_procedural_state',{}).get('dp748',{}).get('last_verified_event')=='2026-09-16'}
          print('LIVE_JSON '+json.dumps(check,sort_keys=True))
          # The other host is inspected but never treated as updated by this job.
          gl='https://por-derecho-setup-or-gitlab-setup-c2b10f.gitlab.io/por-derecho-setup-or-gitlab-setup/'
          gl_results=[]
          for language in ('en','es'):
              url=gl+language+'/cuatrecasas-sun-park/?review='+SHA
              row={'url':url}
              try:
                  status,final,b=fetch(url)
                  row.update(http_status=status,final_url=final,bytes=len(b),marker_present=MARKER in b.decode('utf-8','replace'),live_sha256=hashlib.sha256(b).hexdigest())
              except Exception as e:row['error']=str(e)
              gl_results.append(row)
          print('GITLAB_OBSERVATION '+json.dumps(gl_results,ensure_ascii=False,sort_keys=True))
          passed=all(r['pass'] for r in results) and check['categorical_position'] and check['dp748_processing']
          print('CLOSEOUT '+json.dumps({'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'merged_source':SHA,'github_pages_passed':sum(r['pass'] for r in results),'github_pages_total':len(results),'github_current_json_passed':check['categorical_position'] and check['dp748_processing'],'github_all_passed':passed,'gitlab_not_certified':True},sort_keys=True))
          if not passed: raise SystemExit('Live verification incomplete or stale; do not report all-green publication.')
          PY
