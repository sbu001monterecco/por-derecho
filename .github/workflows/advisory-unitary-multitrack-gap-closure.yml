permissions:
  contents: read

jobs:
  advisory-validation:
    name: Advisory evidence and continuity validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Validate generated surface and controls
        run: |
          python3 scripts/reconcile_institutional_communications.py --check
          python3 scripts/validate_institutional_communications.py
          python3 scripts/build_public_proceedings_projection.py --check
          python3 scripts/build_community_acta_authority_interconnectivity.py --check
          python3 scripts/validate_community_acta_authority_interconnectivity.py
          python3 scripts/build_unitary_multitrack_gap_closure.py --check
          python3 scripts/validate_unitary_multitrack_gap_closure.py

      - name: Check browser module syntax
        run: node --check scripts/smoke_unitary_multitrack_gap_closure.mjs

      - name: Install isolated browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Render bilingual desktop and mobile controls
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pd-ucf-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          PSR_BASE_URL=http://127.0.0.1:8765 node scripts/smoke_unitary_multitrack_gap_closure.mjs
