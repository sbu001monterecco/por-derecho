name: Truth Machine recursive priority queue
permissions:
  contents: read
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    paths:
      - ".github/workflows/truth-machine-recursive-queue.yml"
      - "assets/data/truth-machine-priority-queue-v1.json"
      - "evidence/**"
      - "archive/**"
      - "assets/data/**"
      - "legaltech/unitary_review/context_integrity.py"
      - "legaltech/unitary_review/method_stack.py"
      - "legaltech/unitary_review/recursive_priority_queue.py"
      - "recovery_tests/test_method_stack.py"
      - "recovery_tests/test_recursive_priority_queue.py"
  pull_request:
    paths:
      - ".github/workflows/truth-machine-recursive-queue.yml"
      - "assets/data/truth-machine-priority-queue-v1.json"
      - "evidence/**"
      - "archive/**"
      - "assets/data/**"
      - "legaltech/unitary_review/context_integrity.py"
      - "legaltech/unitary_review/recursive_priority_queue.py"
      - "recovery_tests/test_recursive_priority_queue.py"
jobs:
  verify-recursive-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run method-stack and recursive queue regression tests
        run: |
          python -m unittest recovery_tests.test_method_stack -v
          python -m unittest recovery_tests.test_recursive_priority_queue -v
      - name: Execute source-bound queue triage
        run: python legaltech/unitary_review/recursive_priority_queue.py --host github --output /tmp/truth-machine-queue-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: truth-machine-recursive-queue-${{ github.sha }}
          path: /tmp/truth-machine-queue-report.json
          retention-days: 30
