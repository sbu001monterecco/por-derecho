name: Validate Por Derecho Transparency Phase 1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'en/por-derecho/transparency/**'
      - 'es/por-derecho/transparencia/**'
      - 'assets/data/por-derecho-transparency-phase1-v1.json'
      - 'assets/por-derecho/por-derecho.js'
      - 'archive/POR_DERECHO_TRANSPARENCY_PHASE1_25AUG2026.md'
      - 'sitemap-por-derecho-foundation.xml'
      - 'scripts/validate_por_derecho_transparency_phase1.py'
      - '.github/workflows/validate-por-derecho-transparency-phase1.yml'
  push:
    branches: [main]
    paths:
      - 'en/por-derecho/transparency/**'
      - 'es/por-derecho/transparencia/**'
      - 'assets/data/por-derecho-transparency-phase1-v1.json'
      - 'assets/por-derecho/por-derecho.js'
      - 'archive/POR_DERECHO_TRANSPARENCY_PHASE1_25AUG2026.md'
      - 'sitemap-por-derecho-foundation.xml'
      - 'scripts/validate_por_derecho_transparency_phase1.py'
      - '.github/workflows/validate-por-derecho-transparency-phase1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.1.0
        with:
          python-version: '3.11'
      - name: Validate Transparency Phase 1
        run: python scripts/validate_por_derecho_transparency_phase1.py
