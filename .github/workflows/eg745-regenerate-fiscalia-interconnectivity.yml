name: EG745 regenerate Fiscalia proceedings interconnectivity
on:
  push:
    branches:
      - eg745-imminent-filing-interconnectivity-20260918
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Regenerate Fiscalia interconnectivity projection
        run: python scripts/build_fiscalia_proceedings_interconnectivity.py --apply
      - name: Verify deterministic projection
        run: python scripts/build_fiscalia_proceedings_interconnectivity.py --check
      - name: Validate Fiscalia interconnectivity
        run: python scripts/validate_fiscalia_proceedings_interconnectivity.py
      - name: Run builder unit tests
        run: python -m unittest -v scripts/test_build_fiscalia_proceedings_interconnectivity.py
      - name: Commit deterministic generated projection
        run: |
          git config user.name "por-derecho-ci"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data/fiscalia-proceedings-interconnectivity-v1.json
          if git diff --cached --quiet; then
            echo "Fiscalia projection already normalized"
          else
            git commit -m "Rebuild Fiscalia proceedings interconnectivity for EG745"
            git push origin HEAD:eg745-imminent-filing-interconnectivity-20260918
          fi
