      - 'assets/data/proceedings-master-public-v1.json'
      - 'assets/evidence/email-used-20260822/pwc-five-actors-plus-ac-2016-knowledge-checkpoint-ES.png'
      - 'assets/evidence/email-used-20260822/san-telmo-ricpe-sun-park-stamp-v1-ES.png'
      - 'data/three-track-full-digitisation-20260904.json'
      - 'evidence/fiscalia/2026/DIP2_DP1901_FULL_DIGITISATION_STATE_18SEP2026.json'
      - 'docs/deletion-audits/2026-08-25-fiscalia-eg112-notification-cross-thread-closeout.md'
      - 'ops/continuity/FISCALIA_EG112_IMMEDIATE_RESPONSE_GITHUB_HANDOFF_20260919.md'
      - 'ops/GITLAB_PUBLIC_PAGES_DIVERGENCE_18SEP2026.md'
      - 'scripts/validate_dip2_dp1901_full_digitisation.py'
      - 'scripts/validate_fiscalia_dip2_ref24_eg112.py'
