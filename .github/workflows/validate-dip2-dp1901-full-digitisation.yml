      - 'en/fiscalia-dip-2-2026/**'
      - 'en/prosecutorial-professional-evidence-pwc-grant-thornton-rsm/**'
      - 'en/dp-1901-2026/**'
      - 'es/dp-1901-2026-auto-14-septiembre-2026/**'
      - 'en/dp-1901-2026-order-14-september-2026/**'
      - 'es/procedimientos/gc-fis-017/**'
      - 'en/proceedings/gc-fis-017/**'
      - 'es/procedimientos/gc-cri-008/**'
      - 'en/proceedings/gc-cri-008/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install EG112 validation dependencies
        run: python3 -m pip install --disable-pip-version-check PyMuPDF==1.26.6 pypdf==6.10.0
      - name: Validate source room
        run: python3 scripts/validate_dip2_dp1901_full_digitisation.py
      - name: Validate EG112 response continuity
        run: python3 scripts/validate_fiscalia_dip2_ref24_eg112.py
      - name: Validate JSON and XML syntax
        run: |
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          for p in [
            'evidence/fiscalia/2026/DIP2_DP1901_FULL_DIGITISATION_STATE_18SEP2026.json',
            'assets/data/fiscalia-response-correspondence.json',
            'assets/data/fiscalia-proceedings-link-assertions-v1.json',
            'assets/data/ministerio-fiscal-directory-v1.json',
            'assets/data/proceedings-master-public-v1.json',
          ]:
            json.loads(Path(p).read_text(encoding='utf-8'))
          ET.parse('sitemap-prosecution-evidence.xml')
          print('syntax valid')
          PY
