name: One-shot static actor chronology correction

on:
  push:
    branches:
      - fix/static-homepage-actor-chronology-20260823

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace stale static actor chronology
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('en/index.html'): [
                  (
                      '<article><span class="actor-stage">2011 → Community machinery</span><strong>Francisco Mario Matos Matas</strong><span class="actor-copy">Described in judicial evidence as administering the Community from February 2011; later secretary-administrator and a corporate link through Pamalexsha/AGM.</span></article>',
                      '<article><span class="actor-stage">By 22 Jun 2011 → Community administration</span><strong>Francisco Mario Matos Matas</strong><span class="actor-copy">The 22 June 2011 minutes identify him as Community Administrator. Later sources place him in Pamanil and Community administration; subsequent control, account and information roles must be tested act by act.</span></article>'
                  ),
                  (
                      '<article><span class="actor-stage">2018 → access &amp; security</span><strong>Antonio Cogolludo Rojas</strong><span class="actor-copy">Community president in the 2018 access-and-security period; later an economic link through Pamalexsha.</span></article>',
                      '<article><span class="actor-stage">By 10 Apr 2014 → representation / Community</span><strong>Antonio Cogolludo Rojas</strong><span class="actor-copy">The 10 April 2014 notarial record identifies him as Cristina Molina Petit’s representative. Later access, security and business-perimeter roles require date-specific proof.</span></article>'
                  ),
                  (
                      '<article><span class="actor-stage">2017–2018 → vice-presidency, administration &amp; access</span><strong>Shaila María Cogolludo Ramos</strong><span class="actor-copy">She stated that she was appointed vice-president in 2017 and worked for Pamalexsha on Community administration; she participated in the May–July 2018 voting and access structure. The exact employment start date is not established in the reviewed record.</span></article>',
                      '<article><span class="actor-stage">By 8 Apr 2014 → communications / administration</span><strong>Shaila María Cogolludo Ramos</strong><span class="actor-copy">A Pamanil communication dated 8 April 2014 appears signed by FMMM and Shaila. Later Pamanil/Community communications document continuity; this is a locked minimum date, not a claimed first day.</span></article>'
                  ),
              ],
              Path('es/index.html'): [
                  (
                      '<article><span class="actor-stage">2011 → maquinaria comunitaria</span><strong>Francisco Mario Matos Matas</strong><span class="actor-copy">Descrito en prueba judicial como administrador de la Comunidad desde febrero de 2011; después secretario-administrador y nexo societario a través de Pamalexsha/AGM.</span></article>',
                      '<article><span class="actor-stage">Antes del 22 jun 2011 → administración comunitaria</span><strong>Francisco Mario Matos Matas</strong><span class="actor-copy">El acta de 22 de junio de 2011 lo identifica como Administrador de la Comunidad. Fuentes posteriores lo sitúan en Pamanil y en la administración comunitaria; los posteriores roles de control, cuentas e información deben probarse acto por acto.</span></article>'
                  ),
                  (
                      '<article><span class="actor-stage">2018 → acceso y seguridad</span><strong>Antonio Cogolludo Rojas</strong><span class="actor-copy">Presidente de la Comunidad durante el periodo de acceso y seguridad de 2018; después nexo económico a través de Pamalexsha.</span></article>',
                      '<article><span class="actor-stage">Antes del 10 abr 2014 → representación / Comunidad</span><strong>Antonio Cogolludo Rojas</strong><span class="actor-copy">El acta notarial de 10 de abril de 2014 lo identifica como representante de Cristina Molina Petit. Los posteriores roles de acceso, seguridad y perímetro empresarial exigen prueba fechada.</span></article>'
                  ),
                  (
                      '<article><span class="actor-stage">2017–2018 → vicepresidencia, administración y acceso</span><strong>Shaila María Cogolludo Ramos</strong><span class="actor-copy">Declaró que fue nombrada vicepresidenta en 2017 y que trabajaba para Pamalexsha en la administración de la Comunidad; participó en la estructura de voto y acceso de mayo–julio de 2018. La fecha exacta de inicio laboral no consta en el registro revisado.</span></article>',
                      '<article><span class="actor-stage">Antes del 8 abr 2014 → comunicaciones / administración</span><strong>Shaila María Cogolludo Ramos</strong><span class="actor-copy">Una comunicación Pamanil de 8 de abril de 2014 aparece firmada por FMMM y Shaila. Las comunicaciones posteriores Pamanil/Comunidad documentan continuidad; es una fecha mínima bloqueada, no un primer día afirmado.</span></article>'
                  ),
              ],
          }

          changed = False
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old in text:
                      if text.count(old) != 1:
                          raise SystemExit(f'Expected one occurrence in {path}: {old[:80]}')
                      text = text.replace(old, new)
                      changed = True
                  elif new not in text:
                      raise SystemExit(f'Neither stale nor corrected text found in {path}: {old[:80]}')
              path.write_text(text, encoding='utf-8')

          if not changed:
              print('Static chronology already corrected; no content change required.')
          PY

      - name: Commit corrected source HTML
        run: |
          if git diff --quiet -- en/index.html es/index.html; then
            echo "No source change to commit."
            exit 0
          fi
          git config user.name "por-derecho publication control"
          git config user.email "sbu001@monterecco.com"
          git add en/index.html es/index.html
          git commit -m "Correct static homepage actor chronology"
          git push origin HEAD:fix/static-homepage-actor-chronology-20260823
